<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигервуд — Кадры</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --fg:#1b2333; --muted:#8a93a6; --line:#e6e9f2; --accent:#2b7de9;
    --accent-bg:#e8f0fe; --green:#137333; --green-bg:#e7f5ea; --amber:#b7791f; --amber-bg:#f7efdb; --red:#c0392b; --red-bg:#fdecea; --grid:#eef1f8;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#14161b; --card:#1c1f26; --fg:#e9eaee; --muted:#9aa0ad; --line:#2a2e37; --accent:#4f9bee;
           --accent-bg:#16283f; --green:#4bbd7e; --green-bg:#13291d; --amber:#d6a23c; --amber-bg:#2c2411; --red:#e5776b; --red-bg:#2b1714; --grid:#23262e; }
  }
  *{box-sizing:border-box;} html,body{margin:0;background:var(--bg);}
  body{ font-family:-apple-system,Roboto,Segoe UI,Arial,sans-serif; color:var(--fg); padding:14px; max-width:1000px; margin:0 auto; font-size:14px; }
  html.emb>body>.hi,html.emb>body>.sub{display:none}
  .hi{ font-size:19px; font-weight:800; } .sub{ color:var(--muted); font-size:13px; margin-top:2px; }
  .muted{ color:var(--muted); } .center{ text-align:center; padding:40px 16px; color:var(--muted); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px; box-shadow:0 1px 3px rgba(20,30,60,.05); margin-bottom:10px; }
  .sect{ font-size:12.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:18px 4px 8px; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 12px; }
  .tabs button{ border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:999px; padding:7px 13px; font-size:13px; cursor:pointer; font-weight:600; }
  .tabs button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tabs button .b{ background:var(--red); color:#fff; border-radius:999px; padding:0 6px; margin-left:5px; font-size:11px; }
  .tabs button.on .b{ background:rgba(255,255,255,.25); }
  table{ width:100%; border-collapse:collapse; } th,td{ text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top; }
  th{ color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  select.stsel{ padding:3px 6px; font-size:12.5px; border-radius:7px; width:auto; }
  td.num,th.num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  tr.click:hover td{ background:rgba(127,140,170,.07); cursor:pointer; }
  .tbwrap{ overflow-x:auto; }
  .pill{ display:inline-block; border-radius:999px; padding:2px 9px; font-size:11.5px; font-weight:700; white-space:nowrap; }
  .p-info{ background:var(--accent-bg,#e8f0fe); color:var(--accent); }
  .p-red{ background:var(--red-bg); color:var(--red); } .p-amber{ background:var(--amber-bg); color:var(--amber); }
  .p-ok{ background:var(--green-bg); color:var(--green); } .p-none{ background:var(--grid); color:var(--muted); }
  .btn{ border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:9px; padding:6px 11px; font-size:13px; cursor:pointer; font-weight:600; }
  .btn.pri{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.sm{ padding:3px 8px; font-size:12px; }
  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:9px; }
  label.f{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:3px; }
  input,select,textarea{ width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--fg); font-size:13px; font-family:inherit; }
  .steps{ margin-top:4px; }
  .tabs .b.amber{ background:var(--amber,#b45309); }
  .dlink{ cursor:pointer; border-bottom:1px dashed var(--line); }
  .dlink:hover{ border-bottom-color:currentColor; }
  .step{ display:flex; gap:9px; align-items:flex-start; padding:7px 0; border-bottom:1px dashed var(--line); }
  .step.done .t{ color:var(--muted); text-decoration:line-through; }
  .step .n{ width:22px; color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; padding-top:2px; }
  .step .t{ flex:1; min-width:120px; } .step .w{ font-size:11.5px; color:var(--muted); }
  .step .due{ font-size:11.5px; } .step .due.late{ color:var(--red); font-weight:700; }
  .chk{ width:20px; height:20px; flex:0 0 20px; border:1.5px solid var(--line); border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .step.done .chk{ background:var(--green-bg); border-color:var(--green); color:var(--green); }
  .back{ cursor:pointer; color:var(--accent); font-weight:600; font-size:13px; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:13px; }
  .kv .k{ color:var(--muted); }
  .empty{ color:var(--muted); font-size:12.5px; padding:8px 0; }
  /* обязательные для печати поля: помечены звёздочкой, красные пока пустые */
  .fld.req label.f:after{ content:' *'; color:var(--red); font-weight:700; }
  .fld.req.bad input,.fld.req.bad select{ border-color:var(--red); background:var(--red-bg); }
  .fld.req.bad label.f{ color:var(--red); }
  .reqhint{ font-size:12px; color:var(--red); margin-top:8px; }
  .misline{ color:var(--red); margin-top:2px; } .misline b{ font-weight:700; }
  tr.dim td{ opacity:.45; }                      /* скрытые (уволен / завершённый подряд) — видно, но приглушённо */
  .sw{ display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-size:13px; color:var(--muted); user-select:none; }
  .sw i{ width:34px; height:19px; border-radius:999px; background:var(--grid); border:1px solid var(--line); position:relative; transition:background .15s; }
  .sw i:after{ content:''; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:var(--muted); transition:left .15s,background .15s; }
  .sw.on i{ background:var(--accent); border-color:var(--accent); } .sw.on i:after{ left:18px; background:#fff; }
  .sw.on{ color:var(--fg); }
  a{ color:var(--accent); }

  /* ── ВИДИМАЯ РЕАКЦИЯ. На телефоне нет наведения курсором: если кнопка не «продавливается»,
     человек не понимает, нажал он или промахнулся, и жмёт ещё раз — отсюда дубли. ── */
  button{ touch-action:manipulation; -webkit-tap-highlight-color:transparent;
          transition:transform .06s ease, filter .12s ease, opacity .12s ease; }
  button:active{ transform:scale(.94); filter:brightness(.86); }
  button[disabled]{ opacity:.5; pointer-events:none; }
  a[href^="javascript"]{ -webkit-tap-highlight-color:rgba(124,58,237,.15); }
  /* тонкая полоска сверху — «идёт обмен с сервером» */
  #twload{ position:fixed; left:0; top:0; height:3px; width:100%; z-index:60; display:none; overflow:hidden; }
  #twload>i{ display:block; height:100%; width:38%; background:var(--accent); animation:twslide 1.1s ease-in-out infinite; }
  @keyframes twslide{ 0%{ margin-left:-38% } 100%{ margin-left:100% } }
  /* заслонка на время действия: и показывает, что идёт работа, и физически не даёт нажать второй раз */
  #twwait{ position:fixed; inset:0; background:rgba(246,247,252,.78); z-index:70; display:none;
           align-items:center; justify-content:center; }
  #twwait .wb{ background:#fff; border-radius:16px; padding:18px 22px; text-align:center; min-width:190px;
               box-shadow:0 12px 34px rgba(20,25,50,.18); }
  #twwait .sp{ width:28px; height:28px; border:3px solid rgba(124,58,237,.22); border-top-color:var(--accent);
               border-radius:50%; margin:0 auto 10px; animation:twspin .8s linear infinite; }
  @keyframes twspin{ to{ transform:rotate(360deg) } }
  #twwait .wt{ font-weight:700; font-size:15px; }
  #twwait .wh{ font-size:12.5px; opacity:.6; margin-top:4px; }
</style>
</head>
<body>
<div id="twload"><i></i></div>
<div id="twwait"><div class="wb"><div class="sp"></div><div class="wt" id="twwt">Отправляю…</div><div class="wh">идёт обмен с сервером — не нажимайте</div></div></div>
<div class="hi">🧾 Кадры</div>
<div class="sub">Сотрудники и подрядчики: договоры, приказы, сроки уведомлений, чек-листы оформления.</div>
<div id="app"><div class="center">Загрузка…</div></div>
<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod';
if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('emb');
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||'';
try{ if(!TGID && window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) TGID=String(Telegram.WebApp.initDataUnsafe.user.id); }catch(e){}
function api(p){ p.app=APP; if(TGID&&!p.tgid)p.tgid=TGID;
  var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&');
  return fetch(BASE+'?'+q).then(function(r){return r.json();}); }
function apiPost(p){ p.app=APP; if(TGID&&!p.tgid)p.tgid=TGID;
  var body=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&');
  return fetch(BASE,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body}).then(function(r){return r.json();}); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function money(n){ return (Number(n)||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}); }

// первый экран — люди, а не список просрочек: раздел открывают, чтобы найти сотрудника,
// а сроки видны красным счётчиком на вкладке «Сроки» с любого экрана
var TAB='emp', DATA=null, CARD=null;
// НПД (самозанятый) — такой же гражданско-правовой договор, как подряд: те же поля и та же логика
function isCivil(k){ k=String(k||'').toLowerCase(); return k==='подряд'||k==='нпд'; }
// Сроки — не вкладка, а уведомление: их читают раз в неделю, а место они занимали первым экраном.
// Приказы и больничные — типы документов, поэтому живут в общем реестре «Документы», а не своими вкладками.
var TABS=[{id:'emp',t:'👤 Сотрудники'},{id:'con',t:'📑 Договоры'},{id:'doc',t:'🗂 Документы'},
          {id:'fuel',t:'⛽ Топливо'},{id:'tpl',t:'📋 Шаблоны'}];
var DLOPEN=false, DOCF='all', DOCQ='';

// ВСЁ грузится одним запросом (вызов GAS стоит секунды) — вкладки и карточки дальше открываются мгновенно, без сети
function apply(r,keepCardId){
  if(!r||!r.ok){ alert((r&&r.error)||'ошибка'); return false; }
  DATA=r; CARD=keepCardId?buildCard(keepCardId):null; render(); return true;
}
function load(force){
  $('app').innerHTML='<div class="center">Загрузка…</div>';
  return api(force?{vapi:'hrall',force:1}:{vapi:'hrall'}).then(function(r){
    if(!r||!r.ok){ $('app').innerHTML='<div class="center">Ошибка: '+esc((r&&r.error)||'нет данных')+'</div>'; return false; }
    DATA=r; render(); return true;
  }).catch(function(e){ $('app').innerHTML='<div class="center">Сеть: '+esc(e.message)+'</div>'; return false; });
}
function go(tab){ TAB=tab; CARD=null; render(); }
// карточка собирается из уже загруженного пакета — ноль запросов
function buildCard(empId){
  var row=(DATA.list||[]).filter(function(x){return x.emp.id===empId;})[0];
  if(!row) return null;
  var cons=(DATA.contracts||[]).filter(function(c){return c.emp===empId;});
  var conIds={}; cons.forEach(function(c){conIds[c.id]=1;});
  return { ok:true, emp:row.emp, contracts:cons,
    ds:(DATA.ds||[]).filter(function(d){return conIds[d.con];}),
    orders:(DATA.orders||[]).filter(function(o){return o.emp===empId;}),
    docs:(DATA.edocs||[]).filter(function(d){return d.emp===empId||conIds[d.con];}),
    sick:(DATA.sick||[]).filter(function(x){return x.emp===empId;}),
    fuel:(DATA.fuel||[]).filter(function(x){return x.emp===empId;}),
    steps:(DATA.steps||[]).filter(function(s){return s.emp===empId;}),
    processes:DATA.processes||[] };
}
function sevPill(s){ var m={red:'🔴',amber:'🟡',ok:'🟢',none:'—'}; return '<span class="pill p-'+(s||'none')+'">'+(m[s]||'—')+'</span>'; }

function render(){
  var dl=DATA.deadlines||[], red=dl.filter(function(x){return x.sev==='red';}).length;
  var h='<div class="tabs">'+TABS.map(function(t){
    return '<button class="'+(TAB===t.id?'on':'')+'" onclick="go(\''+t.id+'\')">'+t.t+'</button>';
  }).join('')+
  '<button class="'+(DLOPEN?'on':'')+'" onclick="toggleDl()" title="сроки и напоминания">🔔'+
    (dl.length?('<span class="b'+(red?'':' amber')+'">'+dl.length+'</span>'):'')+'</button>'+
  '<button onclick="load(1)" title="перечитать с сервера">⟳</button>'+
  (DATA.cached?'<span class="muted" style="align-self:center;font-size:11.5px">данные из кеша</span>':'')+'</div>';
  if(DLOPEN) h+=dlView();
  if(CARD) h+=cardView();
  else if(TAB==='emp') h+=empView();
  else if(TAB==='con') h+=conRegView();
  else if(TAB==='doc') h+=docView();
  else if(TAB==='fuel') h+=fuelView();
  else if(TAB==='tpl') h+=tplView();
  $('app').innerHTML=h;
}
// человеческие названия групп справочника — и в чипах реестра, и в выборе типа
function hrIsEl(u){ return /docs\.google\.com\/document/.test(String(u||'')); }
var saveOrd=null, saveCon=null, CONSAVE=null;
var GRPNAME={'дс':'Доп. соглашения','приказ':'Приказы','заявление':'Заявления',
  'уведомление':'Уведомления','больничный':'Больничные','личный':'Личные',
  'договор':'К договору','прочее':'Прочее'};
// плашка поверх экрана (документ собран, результат распознавания) — одна на всё приложение
function msgBox(html){
  var m=$('msgbar');
  if(!m){ m=document.createElement('div'); m.id='msgbar'; m.className='card'; m.style.margin='8px 0';
          var app=$('app'); app.insertBefore(m, app.firstChild); }
  m.innerHTML=html;
}
function msgClose(){ var m=$('msgbar'); if(m&&m.parentNode) m.parentNode.removeChild(m); }
function toggleDl(){ DLOPEN=!DLOPEN; render(); }

/* ─── Сроки ─── */
function dlView(){
  var d=DATA.deadlines||[];
  var head='<div class="row" style="justify-content:space-between;margin-bottom:6px"><b>🔔 Сроки и напоминания</b>'+
    '<button class="btn sm" onclick="toggleDl()">скрыть</button></div>';
  if(!d.length) return '<div class="card">'+head+'<div class="muted">Нет истекающих договоров и просроченных шагов оформления.</div></div>';
  return '<div class="card tbwrap">'+head+'<table><thead><tr><th></th><th>Кто</th><th>Что</th><th>Ответственный</th><th>Комментарий</th></tr></thead><tbody>'+
    d.map(function(x){
      return '<tr class="click" onclick="openCard(\''+x.empId+'\')"><td>'+sevPill(x.sev)+'</td><td><b>'+esc(x.fio)+'</b></td>'+
        '<td>'+esc(x.title)+'</td><td class="muted">'+esc(x.who||'')+'</td><td>'+esc(x.msg)+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

/* ─── Сотрудники ─── */
var SHOWHIDDEN=false;
function toggleHidden(){ SHOWHIDDEN=!SHOWHIDDEN; render(); }
// порядок: работающие по контракту → работающие по подряду → оформляются → (скрытые) завершённый подряд → уволенные
function empRank(e){
  if(e.status==='работает') return isCivil(e.type)?2:1;
  if(e.status==='оформляется') return 3;
  return e.status==='завершён'?4:5;
}
function isHidden(e){ return e.status==='уволен'||e.status==='завершён'; }
function empView(){
  var all=(DATA.list||[]).slice().sort(function(a,b){
    var r=empRank(a.emp)-empRank(b.emp); if(r) return r;
    return String(a.emp.fio).localeCompare(String(b.emp.fio),'ru');
  });
  var hid=all.filter(function(x){ return isHidden(x.emp); });
  var l=SHOWHIDDEN?all:all.filter(function(x){ return !isHidden(x.emp); });
  var h='<div class="row" style="margin-bottom:8px"><button class="btn pri" onclick="newEmp()">+ Сотрудник</button>'+
        '<span class="muted">активных: '+(all.length-hid.length)+'</span>'+
        (hid.length?'<span class="sw'+(SHOWHIDDEN?' on':'')+'" onclick="toggleHidden()"><i></i>показать скрытых ('+hid.length+')</span>':'')+'</div>';
  h+='<div class="card tbwrap"><table><thead><tr><th></th><th>ФИО</th><th>Тип</th><th>Должность</th><th>Договор</th><th>Окончание</th><th>Оформление</th><th>Статус</th></tr></thead><tbody>';
  h+=l.map(function(x){
    var e=x.emp,c=x.contract||{},p=x.steps||{};
    return '<tr class="click'+(isHidden(e)?' dim':'')+'" onclick="openCard(\''+e.id+'\')"><td>'+sevPill(x.state.sev)+'</td>'+
      '<td><b>'+esc(e.fio)+'</b></td><td class="muted">'+esc(e.type)+'</td><td>'+esc(e.pos||'—')+'</td>'+
      '<td class="muted">'+esc(c.num?((c.kind||'')+' №'+c.num):'—')+'</td><td>'+esc(c.end||'—')+'</td>'+
      '<td class="muted">'+(p.total?(p.done+'/'+p.total):'—')+'</td><td class="muted">'+esc(e.status||'')+'</td></tr>';
  }).join('');
  if(!l.length) h+='<tr><td colspan="8" class="empty">Нет активных сотрудников.</td></tr>';
  return h+'</tbody></table></div>';
}

/* ─── Карточка ─── */
function openCard(id){ CARD=buildCard(id); if(!CARD){ alert('сотрудник не найден'); return; } render(); window.scrollTo(0,0); }
function closeCard(){ CARD=null; render(); }
function cardView(){
  var e=CARD.emp;
  var h='<div class="back" onclick="closeCard()">← к списку</div>';
  h+='<div class="card" style="margin-top:8px"><div class="row" style="justify-content:space-between">'+
     '<div><div style="font-size:17px;font-weight:800">'+esc(e.fio)+'</div>'+
     '<div class="muted">'+esc(e.type||'тип по договору не определён')+' · '+esc(e.pos||'должность не указана')+(e.posCode?' ('+esc(e.posCode)+')':'')+' · '+esc(e.status||'')+
     ' <span style="font-size:11px">(из договора)</span></div></div>'+
     '<div class="row">'+(e.folder?'<a class="btn sm" href="'+esc(e.folder)+'" target="_blank">📁 папка</a>'
        :'<button class="btn sm" onclick="mkFolder()">📁 создать папку</button>')+
     '<button class="btn sm" onclick="recogPassport()" title="распознать паспортные данные из скана в папке">🪪 распознать паспорт</button>'+
     (e.tgId?'':'<button class="btn sm" onclick="inviteEmp()" title="дать сотруднику доступ в приложение">✉ пригласить</button>')+
     '<button class="btn sm" onclick="editEmp()">✎ править</button></div></div>';
  h+='<div class="grid" style="margin-top:10px"><div class="kv"><div class="k">Идент. номер</div><div>'+esc(e.idnum||'—')+'</div>'+
     '<div class="k">Паспорт</div><div>'+esc(e.passport||'—')+'</div><div class="k">Р/с</div><div>'+esc(e.account||'—')+'</div></div>'+
     '<div class="kv"><div class="k">Принят</div><div>'+esc(e.hired||'—')+'</div><div class="k">Уволен</div><div>'+esc(e.fired||'—')+'</div>'+
     '<div class="k">Telegram</div><div>'+(e.tgId?('<span class="pill p-ok">привязан</span> <span class="muted">'+esc(e.tgId)+'</span>')
        :'<span class="muted">не привязан — доступа в приложение нет</span>')+'</div></div></div>'+
     (function(){
        var cur=(CARD.contracts||[]).filter(function(c){return c.kind==='контракт'&&c.status!=='расторгнут'&&c.status!=='продлён';})[0];
        if(!cur||!cur.effective) return '';
        var ef=cur.effective, base=cur, chg=Object.keys(ef).filter(function(k){return String(ef[k]||'')!==String(base[k]||'');});
        var row=function(l,v,ch){ return v?('<span style="margin-right:14px">'+l+': <b>'+esc(v)+'</b>'+(ch?' <span class="pill p-amber" style="font-size:10px">изменён</span>':'')+'</span>'):''; };
        return '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px">'+
          '<span class="muted">действует сейчас (с учётом доп. соглашений): </span>'+
          row('оклад',ef.salary,chg.indexOf('salary')>=0)+row('тариф',ef.tariff,chg.indexOf('tariff')>=0)+
          row('аванс',ef.advance,chg.indexOf('advance')>=0)+
          row('режим',(ef.wStart&&ef.wEnd)?(ef.wStart+'–'+ef.wEnd):'',chg.indexOf('wStart')>=0||chg.indexOf('wEnd')>=0)+'</div>';
     })()+'</div>';

  // Договор — такой же документ, как остальные: клик по виду правит данные, справа те же две
  // кнопки «загрузить» и «создать» (после сборки — «эл. документ») плюс удаление. Уведомление,
  // заявление, ДС и расторжение больше не живут в этой строке — они документы и лежат ниже.
  h+='<div class="sect">Договоры</div><div class="card tbwrap">';
  if(!CARD.contracts.length) h+='<div class="empty">Нет договоров.</div>';
  else h+='<table><thead><tr><th></th><th>Вид</th><th>№</th><th>Дата</th><th>Окончание</th><th>Статус</th><th>Файл</th><th></th></tr></thead><tbody>'+
    CARD.contracts.map(function(c){
      var acts=conActs(c);
      return '<tr><td>'+dot(c.missing)+sevPill((c.state||{}).sev)+'</td>'+
        '<td><b>'+esc(c.kind)+'</b></td>'+
        '<td><b>'+esc(c.num)+'</b></td><td>'+esc(c.date)+'</td><td>'+esc(c.end||'—')+'</td>'+
        '<td><select class="stsel" onchange="event.stopPropagation();setConStatus(\''+c.id+'\',this.value)" onclick="event.stopPropagation()">'+
          ['действует','истёк','расторгнут','продлён'].map(function(o){ return '<option'+(o===(c.statusEff||c.status)?' selected':'')+'>'+o+'</option>'; }).join('')+'</select></td>'+
        '<td>'+((c.files&&c.files.length)
            ? '<span class="pill p-ok" title="страниц: '+c.files.length+'">📎 '+c.files.length+'</span> '+
              c.files.map(function(u,i){return '<a href="'+esc(u)+'" target="_blank">'+(i+1)+'</a>';}).join(' ')
            : '<span class="muted" title="скан не приложен">📎 —</span>')+'</td>'+
        '<td style="white-space:nowrap">'+acts+'</td></tr>'+
        '<tr><td></td><td colspan="8" class="muted" style="font-size:12px;border-bottom:1px solid var(--line)">'+esc((c.state||{}).msg||'')+
        (function(){ var mk=c.missingKeys||[]; if(!mk.length) return '';
          var inCon=mk.filter(function(x){return x.src==='con';}).map(function(x){return x.t;});
          var inEmp=mk.filter(function(x){return x.src==='emp';}).map(function(x){return x.t;});
          return '<div class="misline">'+
            (inCon.length?'● в договоре: <b>'+esc(inCon.join(', '))+'</b> ':'')+
            (inEmp.length?'● в карточке сотрудника: <b>'+esc(inEmp.join(', '))+'</b>':'')+'</div>'; })()+
        '</td></tr>';
    }).join('')+'</tbody></table>';
  h+='<div class="row" style="margin-top:8px"><button class="btn" onclick="newCon(\'контракт\')">+ контракт (штат)</button>'+
     '<button class="btn" onclick="newCon(\'подряд\')">+ договор подряда</button>'+
     '<button class="btn" onclick="newCon(\'нпд\')">+ НПД (самозанятый)</button>'+
     '<button class="btn" onclick="newCon(\'обучение\')">+ производственное обучение</button>'+
     '<span class="muted" style="font-size:12px">папка сотрудника создаётся автоматически при добавлении договора</span></div></div>';

  h+=docsBlock();
  return h;
}

/* ─── Документы сотрудника ───────────────────────────────────────────────
   Один список на всё: свои документы + доп. соглашения + приказы. Список ОБЩИЙ,
   но модель раздельная: ДС по-прежнему меняет условия договора («действует сейчас»),
   а приказ получает свой номер — поэтому правятся они своими формами. */
function docTitle(d){ return d.title||d.type||'документ'; }
function filesCell(d){
  var f=(d.files||[]).filter(String);
  // заявление к приказу — не отдельная кнопка, а ссылка рядом с файлами
  var extra='';
  if(d.src==='order'){
    var oo=(DATA.orders||[]).filter(function(x){return x.id===d.id;})[0]||{};
    if(oo.basisLink) extra=' <a href="'+esc(oo.basisLink)+'" target="_blank" title="заявление-основание">заявл.</a>';
  }
  if(!f.length) return '<span class="muted" title="скан не приложен">📎 —</span>'+extra;
  if(f.length===1) return '<a class="pill p-ok" href="'+esc(f[0])+'" target="_blank" title="открыть">📎 скан</a>'+extra;
  return '<span class="pill p-ok" title="страниц: '+f.length+'">📎 '+f.length+'</span> '+
    f.map(function(u,i){ return '<a href="'+esc(u)+'" target="_blank">'+(i+1)+'</a>'; }).join(' ')+extra;
}
/* ─── Кнопки документа ───────────────────────────────────────────────────────
   Ровно четыре, как в ТЗ (п.12.5): загрузить · создать · редактировать · удалить.
   «Создать» НИЧЕГО не создаёт сразу — открывает карточку, где вводят данные и жмут
   «Создать документ» (п.12.8). Когда документ собран, кнопка называется «эл. документ»
   и ведёт в ту же карточку, где его можно пересобрать или удалить (п.12.11).
   Скан приложен → кнопка «создать» пропадает (п.12.7).                                    */
function docActs(d){
  var mk='';
  if(d.docLink) mk='<button class="btn sm" onclick="openDoc(\''+d.src+'\',\''+d.id+'\')">📄 эл. документ</button> ';
  else if(d.tpl && !(d.files||[]).length) mk='<button class="btn sm" onclick="openDoc(\''+d.src+'\',\''+d.id+'\')">📄 создать</button> ';
  var what=d.src==='ds'?'ds':(d.src==='order'?'order':'edoc');
  return '<button class="btn sm" onclick="uploadDoc(\''+d.id+'\',\''+what+'\')">⬆ загрузить</button> '+mk+
    '<button class="btn sm" onclick="openDoc(\''+d.src+'\',\''+d.id+'\')" title="редактировать — карточка документа">✎</button> '+
    '<button class="btn sm" onclick="delRec(\''+what+'\',\''+d.id+'\',\''+esc(docTitle(d))+'\')" title="удалить документ и файлы с Google Диска">🗑</button>';
}
/* Единственная точка входа в карточку любого документа — и из карточки сотрудника, и из реестра.
   Из реестра глобальная CARD пуста, а формы читают CARD.emp.id и CARD.contracts, поэтому карточку
   сотрудника поднимаем молча и запоминаем, куда вернуться. */
function openDoc(src,id){
  var d=null;
  if(src==='con'){ d=(DATA.contracts||[]).filter(function(x){return x.id===id;})[0]; }
  else { d=(DATA.edocs||[]).filter(function(x){return x.src===src&&x.id===id;})[0]; }
  if(!d){ alert('документ не найден'); return; }
  var empId=d.emp||'';
  if(!empId&&d.con){ var c=(DATA.contracts||[]).filter(function(x){return x.id===d.con;})[0]; empId=c?c.emp:''; }
  if(!empId){ alert('документ не привязан к сотруднику — откройте его через карточку сотрудника'); return; }
  if(!CARD||CARD.emp.id!==empId){ if(!FROM) FROM=TAB; CARD=buildCard(empId); if(!CARD){ alert('сотрудник не найден'); return; } }
  if(src==='con') conForm(d);
  else if(src==='ds') dsForm((DATA.ds||[]).filter(function(x){return x.id===id;})[0]||{});
  else if(src==='order') ordForm((DATA.orders||[]).filter(function(x){return x.id===id;})[0]||{});
  else edocForm(d);
  window.scrollTo(0,0);
}
/* Хвост карточки любого документа: что с электронным вариантом. Отдаёт подписи кнопок для dlg. */
function docTail(state){
  // state = {link, tpl, onCreate, onRebuild, onDrop}
  if(state.link) return {
    saveLabel:'💾 Сохранить и пересобрать документ',
    extra:'<a class="btn" href="'+esc(state.link)+'" target="_blank">📄 Открыть</a>'+
          '<button class="btn" onclick="'+state.onDrop+'">🗑 Удалить эл. документ</button>',
    foot:'«Сохранить» соберёт документ заново по новым данным: прежний файл уйдёт в корзину Google Диска. '+
         'Приложенные сканы останутся на месте.' };
  if(state.tpl) return {
    saveLabel:'💾 Сохранить',
    extra:'<button class="btn pri" onclick="'+state.onCreate+'">🖨 Создать документ</button>',
    foot:'«Создать документ» соберёт его по шаблону в Google Документах — заполните поля до нажатия.' };
  return { saveLabel:'💾 Сохранить', foot:'Для этого вида документа шаблона нет — приложите готовый скан кнопкой «⬆ загрузить».' };
}
// Строка документа: название — обычный текст, все действия в четырёх кнопках справа.
// Ссылку-на-карточку с названия убрали: два разных пути в одно место и ни одного очевидного.
function docRow(d){
  var con=(CARD.contracts||[]).filter(function(c){return c.id===d.con;})[0];
  var st=String(d.status||'нужен');
  return '<tr><td><b>'+esc(docTitle(d))+'</b>'+
    (d.note?'<div class="muted" style="font-size:12px">'+esc(d.note)+'</div>':'')+'</td>'+
    '<td>'+esc(d.num||'—')+'</td><td>'+esc(d.date||'—')+'</td>'+
    '<td class="muted">'+(con?esc(con.kind+' № '+con.num):'—')+'</td>'+
    '<td>'+statusPill(st)+'</td>'+
    '<td>'+filesCell(d)+'</td>'+
    '<td style="white-space:nowrap">'+docActs(d)+'</td></tr>';
}
// «нужен» — жёлтый, «создан» — синий (документ есть, подписи нет), «подписан» — зелёный
function statusPill(st){
  var cls=st==='подписан'?'p-ok':(st==='создан'?'p-info':'p-amber');
  return '<span class="pill '+cls+'">'+esc(st)+'</span>';
}
// Договор — такой же документ: те же четыре кнопки и та же логика «создать → эл. документ».
// ⚠ Электронный документ отличаем по адресу Google Документов: у договора в «Ссылке» может
// лежать и загруженный скан (колонка «Источник» это помнит, но раньше её тут игнорировали).
function conActs(c){
  var el=hrIsEl(c.link)?c.link:'';
  var tpl=(c.kind==='контракт'||c.kind==='подряд'||c.kind==='обучение');
  var mk='';
  if(el) mk='<button class="btn sm" onclick="openDoc(\'con\',\''+c.id+'\')">📄 эл. документ</button> ';
  else if(tpl && !((c.files||[]).length)) mk='<button class="btn sm" onclick="openDoc(\'con\',\''+c.id+'\')">📄 создать</button> ';
  return '<button class="btn sm" onclick="uploadDoc(\''+c.id+'\',\'con\')">⬆ загрузить</button> '+mk+
    '<button class="btn sm" onclick="openDoc(\'con\',\''+c.id+'\')" title="редактировать — карточка договора">✎</button> '+
    '<button class="btn sm" onclick="delRec(\'contract\',\''+c.id+'\',\''+esc(c.kind)+' № '+esc(c.num)+'\')" title="удалить договор и файлы с Google Диска">🗑</button>';
}
function docsBlock(){
  var rows=(CARD.docs||[]);
  var h='<div class="sect">Документы</div><div class="card tbwrap">';
  if(!rows.length) h+='<div class="empty">Документов нет.</div>';
  else h+='<table><thead><tr><th>Документ</th><th>№</th><th>Дата</th><th>К договору</th><th>Статус</th><th>Файл</th><th></th></tr></thead><tbody>'+
    rows.map(docRow).join('')+'</tbody></table>';
  h+='<div class="row" style="margin-top:8px">'+
     '<button class="btn pri" onclick="addDoc()">+ документ</button>'+
     '<button class="btn" onclick="newDs()">+ доп. соглашение</button>'+
     '<button class="btn" onclick="ordForm({emp:CARD.emp.id})">+ приказ</button>'+
     '<span class="muted" style="font-size:12px">сюда кладётся всё: паспорт, заявления, справки, больничные, письма органов. '+
     'Доп. соглашение и приказ заводятся своими кнопками — они меняют условия договора и получают номер.</span></div></div>';
  return h;
}
/* Добавление документа по ТЗ (п.12.1–12.4, 9): нажимаем добавить → выбираем тип →
   указываем, к какому договору относится (или ни к какому) → ОК → строка появилась.
   Номер, дата и примечание заполняются потом в карточке: на этом шаге они только мешают. */
function addDoc(){
  REQKEYS={};
  var types=(DATA.dtypes||[]).filter(function(t){ return t.group!=='дс'&&t.group!=='приказ'; });
  var grp={}; types.forEach(function(t){ (grp[t.group]=grp[t.group]||[]).push(t); });
  var opts=Object.keys(grp).map(function(g){
    return '<optgroup label="'+esc(GRPNAME[g]||g)+'">'+grp[g].map(function(t){
      return '<option value="'+esc(t.key)+'">'+esc(t.title)+'</option>'; }).join('')+'</optgroup>'; }).join('');
  var cons=(CARD.contracts||[]);
  dlg('Новый документ: '+esc(CARD.emp.fio),
    '<div class="fld"><label class="f">Тип документа</label><select id="f_type">'+opts+
      '<option value="__new__">＋ добавить свой тип…</option></select></div>'+
    '<div class="fld"><label class="f">Относится к договору</label><select id="f_con">'+
      '<option value="">— не относится, документ сотрудника —</option>'+
      cons.map(function(c){ return '<option value="'+c.id+'">'+esc(c.kind+' № '+c.num)+'</option>'; }).join('')+
      '</select></div>',
    function(){
      var type=val('type');
      if(type==='__new__'){ addDocType(); return; }
      busy(1);
      api({vapi:'hredocsave',data:JSON.stringify({emp:CARD.emp.id,con:val('con'),type:type,status:'нужен'})})
        .then(function(r){ busy(0);
          if(!r.ok){ alert(r.error||'ошибка'); return; }
          apply(r,CARD.emp.id); backFromForm();
        });
    }, '', 'Выберите вид документа. Номер, дату и файл добавите в его карточке.',
    { saveLabel:'ОК — создать документ' });
}
function edocForm(d){
  d=d||{}; REQKEYS={};
  var types=(DATA.dtypes||[]).filter(function(t){ return t.group!=='дс'&&t.group!=='приказ'; });
  if(!types.length) types=[{key:'прочее',title:'Прочее',group:'прочее'}];
  var cur=d.type||types[0].key;
  var grp={}; types.forEach(function(t){ (grp[t.group]=grp[t.group]||[]).push(t); });
  var opts=Object.keys(grp).map(function(g){
    return '<optgroup label="'+esc(GRPNAME[g]||g)+'">'+grp[g].map(function(t){
      return '<option value="'+esc(t.key)+'"'+(t.key===cur?' selected':'')+'>'+esc(t.title)+'</option>'; }).join('')+'</optgroup>'; }).join('');
  var cons=(CARD.contracts||[]);
  var t=(DATA.dtypes||[]).filter(function(x){return x.key===cur;})[0];
  var tail=docTail({ link:d.docLink||'', tpl:!!(t&&t.tpl),
    onCreate:"edocSave('"+(d.id||'')+"',1)", onDrop:"dropElDoc('edoc','"+(d.id||'')+"')" });
  EDOCDRAFT=d;
  dlg(d.id?'Карточка документа: '+docTitle(d):'Новый документ',
    '<div class="fld"><label class="f">Тип документа</label><select id="f_type">'+opts+
      '<option value="__new__">＋ добавить свой тип…</option></select></div>'+
    '<div class="fld"><label class="f">К договору (не обязательно)</label><select id="f_con">'+
      '<option value="">— к сотруднику, не к договору —</option>'+
      cons.map(function(c){ return '<option value="'+c.id+'"'+(c.id===d.con?' selected':'')+'>'+esc(c.kind+' № '+c.num)+'</option>'; }).join('')+
      '</select></div>'+
    fld('num','№ документа',d.num)+fld('date','Дата',d.date)+fld('note','Примечание',d.note),
    function(){ edocSave(d.id||'', d.docLink?1:0); },
    '', d.id?'Данные документа. Файл — кнопками ниже.':'Заводим карточку документа.', tail);
}
var EDOCDRAFT=null;
// Одна функция на три сценария: просто сохранить, сохранить и собрать, сохранить и пересобрать.
// gen=1 → после сохранения документ собирается по шаблону (прежний файл гасит сервер).
function edocSave(id,gen){
  var type=val('type');
  if(type==='__new__'){ addDocType(); return; }
  var rec={id:id||'',emp:CARD.emp.id,con:val('con'),type:type,num:val('num'),date:val('date'),
           note:val('note'),status:(EDOCDRAFT&&EDOCDRAFT.status)||'нужен'};
  busy(1);
  api({vapi:'hredocsave',data:JSON.stringify(rec)}).then(function(r){
    if(!r.ok){ busy(0); alert(r.error||'ошибка'); return; }
    var newId=id||r.savedId;
    if(!gen){ busy(0); apply(r,CARD.emp.id); backFromForm(); return; }
    return api({vapi:'hrgenedoc',doc:newId}).then(function(r2){ busy(0);
      if(!r2.ok){ alert(r2.error||'ошибка'); apply(r,CARD.emp.id); return; }
      apply(r2,CARD.emp.id); backFromForm();
      docDone(r2.url, r2.leftPlaceholders);
    });
  }).catch(function(e){ busy(0); alert('сеть: '+e.message); });
}
// Плашка «документ собран» со ссылкой. window.open часто съедает блокировщик поп-апов,
// поэтому ссылку показываем на экране, а не полагаемся только на новую вкладку.
function docDone(url,left){
  var w=(left&&left.length)?('<div style="color:var(--red);margin-top:4px">В документе остались незаполненные места: '+esc(left.join(', '))+' — заполните данные и соберите заново.</div>'):'';
  msgBox('<b>✅ Документ собран.</b> <a href="'+esc(url)+'" target="_blank">Открыть в Google Документах</a>'+w+
    '<div class="row" style="margin-top:8px"><button class="btn sm" onclick="msgClose()">Понятно</button></div>');
  try{ window.open(url,'_blank'); }catch(e){}
}
function dropElDoc(src,id){
  if(!confirm('Удалить электронный документ?\n\nФайл уйдёт в корзину Google Диска. Приложенные сканы останутся.')) return;
  busy(1);
  api({vapi:'hrdelelcdoc',doc:id,src:src}).then(function(r){ busy(0);
    if(!r.ok){ alert(r.error||'ошибка'); return; }
    apply(r,CARD?CARD.emp.id:null); backFromForm();
  });
}
function recogDoc(id){
  msgBox('<span class="muted">🔎 распознаю документ…</span>');
  api({vapi:'hrrecogdoc',doc:id}).then(function(r){
    if(!r.ok){ msgBox('<span class="muted">Скан загружен. Распознать не удалось: '+esc(r.error||'')+' — заполните тип и № вручную.</span>'); return; }
    var s=r.suggest||{};
    if(!s.type&&!s.num&&!s.date){ msgBox('<span class="muted">Скан загружен. Что это за документ — определить не получилось, укажите тип вручную.</span>'); return; }
    msgBox('<b>🔎 Похоже на:</b> '+esc(s.typeTitle||s.title||'—')+
        (s.num?(' № '+esc(s.num)):'')+(s.date?(' от '+esc(s.date)):'')+
        '<div class="row" style="margin-top:8px"><button class="btn pri" onclick="recogApply(\''+id+'\')">Применить</button>'+
        '<button class="btn" onclick="msgClose()">Оставить как есть</button></div>');
  }).catch(function(e){ msgBox('<span class="muted">Скан загружен. Сеть: '+esc(e.message)+'</span>'); });
}
function recogApply(id){
  busy(1);

var REQKEYS={};   // какие поля обязательны в текущей форме (заполняется перед показом)
function fld(k,l,v,type){
  var rq=REQKEYS[k]?' req'+(String(v||'').trim()?'':' bad'):'';
  return '<div class="fld'+rq+'" id="w_'+k+'"><label class="f">'+l+'</label><input id="f_'+k+'" value="'+esc(v||'')+'"'+(type?' type="'+type+'"':'')+' oninput="markReq(\''+k+'\')"></div>';
}
function sel(k,l,v,opts,onch){ return '<div class="fld" id="w_'+k+'"><label class="f">'+l+'</label><select id="f_'+k+'"'+(onch?' onchange="'+onch+'"':'')+'>'+
  opts.map(function(o){ return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'; }).join('')+'</select></div>'; }
function markReq(k){ var w=$('w_'+k);
  if(w&&REQKEYS[k]){ if(($('f_'+k).value||'').trim()) w.classList.remove('bad'); else w.classList.add('bad'); }
  updHint(); }
function reqSet(kind,src){ var o={}; ((DATA.req&&DATA.req[src]&&DATA.req[src][kind])||[]).forEach(function(f){ o[f[0]]=f[1]; }); return o; }
function reqLeft(){ return Object.keys(REQKEYS).filter(function(k){ var e=$('f_'+k); return e&&!(e.value||'').trim(); })
  .map(function(k){ return REQKEYS[k]; }); }
function reqHint(){ var l=reqLeft(); return l.length?('<div class="reqhint">● отмеченные поля нужны, чтобы сформировать документ по шаблону. Осталось: '+esc(l.join(', '))+'</div>'):''; }
function val(k){ var el=$('f_'+k); return el?el.value.trim():''; }

// Паспорт грузится ДО создания карточки: фото уходят во временную папку, один вызов модели
// разбирает все страницы сразу и заполняет форму. При сохранении файлы переезжают к сотруднику.
var DRAFT=null;
function passMsg(t){ var e=$('passMsg'); if(e) e.innerHTML=t; }
function passUpload(){
  var inp=document.createElement('input'); inp.type='file'; inp.multiple=true; inp.accept='image/*,application/pdf';
  inp.onchange=function(){
    var files=[].slice.call(inp.files); if(!files.length) return;
    if(files.length>8){ alert('За раз распознаём не больше 8 страниц.'); return; }
    if(!DRAFT) DRAFT='d'+Date.now()+Math.floor(Math.random()*1000);
    var i=0;
    function next(){
      if(i>=files.length){ passRecognize(files.length); return; }
      passMsg('загружаю '+(i+1)+' из '+files.length+'…');
      var f=files[i], fr=new FileReader();
      fr.onload=function(){
        apiPost({vapi:'hrdraftup',draft:DRAFT,name:f.name,mime:f.type,b64:String(fr.result).split(',')[1],idx:i+1,total:files.length})
          .then(function(r){ if(!r.ok){ passMsg('<span style="color:var(--red)">'+esc(r.error||'ошибка загрузки')+'</span>'); return; } i++; next(); })
          .catch(function(e){ passMsg('<span style="color:var(--red)">сеть: '+esc(e.message)+'</span>'); });
      };
      fr.readAsDataURL(f);
    }
    next();
  };
  inp.click();
}
function passRecognize(n){
  passMsg('распознаю '+n+' стр.… это занимает до полуминуты');
  api({vapi:'hrdraftrecog',draft:DRAFT}).then(function(r){
    if(!r.ok){ passMsg('<span style="color:var(--red)">'+esc(r.error||'не распозналось')+'</span> — фото сохранены, заполните поля руками'); return; }
    var f=r.fields||{}, put=[];
    ['fio','birth','idnum','passport','passDate','passOrg','addr','account','phone'].forEach(function(k){
      var v=String(f[k]==null?'':f[k]).trim(); if(!v) return;
      var el=$('f_'+k); if(!el || el.value.trim()) return;      // вписанное руками не перетираем
      el.value=v; put.push(k);
    });
    updHint();
    passMsg(put.length? ('✓ распознано ('+r.pages+' стр.), заполнено полей: '+put.length+' — проверьте')
                      : 'ничего нового не распозналось — заполните поля руками');
  }).catch(function(e){ passMsg('<span style="color:var(--red)">сеть: '+esc(e.message)+'</span>'); });
}

/* загрузка готового договора: фото/скан/PDF, несколько файлов; имена приводятся к понятному виду */
// Загрузка одинакова для всего: договор, ДС, приказ, документ. Имя файла собирает СЕРВЕР
// по самой записи («Контракт № 5 от 21.12.2025 — И.Р. Шамсеев»), у документов — по названию типа.
// Раньше здесь спрашивали подпись через prompt: у документов не спрашивали, у договоров спрашивали,
// и одна и та же кнопка вела себя по-разному.
function uploadDoc(recId,target){ uploadFiles(recId,target||'con',''); }
function uploadFiles(recId,target,label){
  var inp=document.createElement('input'); inp.type='file'; inp.multiple=true;
  inp.accept='image/*,application/pdf';
  inp.onchange=function(){
    var files=[].slice.call(inp.files); if(!files.length) return;
    busy(1);
    var i=0, last=null;
    function next(){
      if(i>=files.length){ busy(0);
        // «при загрузке документа нужно сделать распознавание» — но не молча: показываем,
        // что прочитала система, и применяем только по кнопке.
        // ⚠ Плашку рисуем ПОСЛЕ перерисовки: раньше load(1) и recogDoc шли наперегонки,
        // и предложение могло исчезнуть, не будучи показанным.
        if(target==='edoc'){ load(1).then(function(){ recogDoc(recId); }); return; }
        load(1); if(last) alert('Загружено файлов: '+files.length); return; }
      var f=files[i], fr=new FileReader();
      fr.onload=function(){
        var b64=String(fr.result).split(',')[1];
        apiPost({vapi:'hrupload',target:target,rec:recId,con:recId,name:f.name,mime:f.type,b64:b64,idx:i+1,total:files.length,label:label})
          .then(function(r){ if(!r.ok){ busy(0); alert(r.error||'ошибка загрузки'); return; } last=r; i++; next(); })
          .catch(function(e){ busy(0); alert('сеть: '+e.message); });
      };
      fr.readAsDataURL(f);
    }
    next();
  };
  inp.click();
}

    docTail({ link:(hrIsEl(o.link)?o.link:''), tpl:/при[её]м/i.test(o.kind||''),
      onCreate:'saveOrd(true)', onDrop:"dropElDoc('order','"+(o.id||'')+"')" }));
}
function docGroupOf(d){
  if(d.src==='order') return 'приказ';
  if(d.src==='ds') return 'дс';
  var t=(DATA.dtypes||[]).filter(function(x){return x.key===d.type;})[0];
  return (t&&t.group)||'прочее';
}
function docFioMap(){ var m={}; (DATA.list||[]).forEach(function(x){ m[x.emp.id]=x.emp.fio; }); return m; }
function docFilterList(){
  var fio=docFioMap(), q=DOCQ.toLowerCase();
  return (DATA.edocs||[]).filter(function(d){
    if(DOCF!=='all'&&docGroupOf(d)!==DOCF) return false;
    if(!q) return true;
    return ((fio[d.emp]||'')+' '+docTitle(d)+' '+(d.num||'')).toLowerCase().indexOf(q)>=0;
  });
}
// Реестр по всем сотрудникам. Чипы строятся ИЗ ГРУПП СПРАВОЧНИКА, а не из массива в коде:
// добавленный владельцем вид сразу попадает в свой чип. Показываем все категории, даже пустые —
// видно, чего в системе ещё нет.
function docView(){
  var all=(DATA.edocs||[]);
  var order=['дс','приказ','заявление','уведомление','больничный','личный','договор','прочее'];
  var cnt={}; all.forEach(function(d){ var g=docGroupOf(d); cnt[g]=(cnt[g]||0)+1; });
  var h='<div class="row" style="margin-bottom:8px;flex-wrap:wrap">'+
    '<button class="btn sm'+(DOCF==='all'?' pri':'')+'" onclick="docFilter(\'all\')">Все '+all.length+'</button>'+
    order.map(function(g){
      var n=cnt[g]||0;
      return '<button class="btn sm'+(DOCF===g?' pri':'')+'" onclick="docFilter(\''+g+'\')">'+
        esc(GRPNAME[g]||g)+' <span'+(n?'':' class="muted"')+'>'+n+'</span></button>';
    }).join('')+
    '<input id="docq" placeholder="поиск по сотруднику, документу, №" value="'+esc(DOCQ)+'" '+
      'oninput="DOCQ=this.value;docRender()" style="flex:1;min-width:180px">'+
    '</div><div id="docbody">'+docTable(docFilterList(),docFioMap())+'</div>';
  if((DATA.docs||[]).length) h+=docSheetsBlock();
  h+='<div class="row" style="margin-top:8px"><button class="btn" onclick="docForm({})">+ табель / ведомость</button>'+
     '<span class="muted" style="font-size:12px">документы сотрудника добавляются в его карточке</span></div>';
  return h;
}
function docTable(l,fio){
  if(!l.length) return '<div class="card"><div class="empty">Ничего не найдено.</div></div>';
  return '<div class="card tbwrap"><table><thead><tr><th>Сотрудник</th><th>Документ</th><th>№</th><th>Дата</th>'+
    '<th>Статус</th><th>Файл</th><th></th></tr></thead><tbody>'+
    l.map(function(d){
      return '<tr><td class="click" onclick="openCard(\''+d.emp+'\')"><b>'+esc(fio[d.emp]||'—')+'</b></td>'+
        '<td>'+esc(docTitle(d))+'</td><td>'+esc(d.num||'—')+'</td><td>'+esc(d.date||'—')+'</td>'+
        '<td>'+statusPill(String(d.status||'нужен'))+'</td>'+
        '<td>'+filesCell(d)+'</td>'+
        '<td style="white-space:nowrap">'+docActs(d)+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
// перерисовываем ТОЛЬКО таблицу — иначе поле поиска пересоздаётся и теряет фокус на каждой букве
function docRender(){ var b=$('docbody'); if(b) b.innerHTML=docTable(docFilterList(),docFioMap()); }
function docFilter(k){ DOCF=k; render(); }
function docSheetsBlock(){
  var l=DATA.docs||[];
  return '<div class="sect">Табели и ведомости</div><div class="card tbwrap"><table>'+
    '<thead><tr><th>Тип</th><th>Номер</th><th>Дата</th><th>Период</th><th>Скан</th><th></th></tr></thead><tbody>'+
    l.map(function(d){ return '<tr><td>'+esc(d.type)+'</td><td>'+esc(d.num||'—')+'</td><td>'+esc(d.date||'—')+'</td>'+
      '<td>'+esc(d.period||'—')+'</td><td>'+(d.link?'<a href="'+esc(d.link)+'" target="_blank">открыть</a>':'—')+'</td>'+
      '<td><button class="btn sm" onclick=\'docForm('+JSON.stringify(d).replace(/'/g,"&#39;")+')\'>✎</button> '+
      '<button class="btn sm" onclick="delRec(\'doc\',\''+d.id+'\',\'документ\')">🗑</button></td></tr>'; }).join('')+
    '</tbody></table></div>';
}
function docForm(d){
  dlg('Документ', sel('type','Тип',d.type||'табель',['табель','расчётная ведомость','штатное расписание','прочее'])+
    fld('num','Номер',d.num)+fld('date','Дата',d.date)+fld('period','Период',d.period)+fld('link','Ссылка/скан',d.link),
    function(){
      var x={id:d.id||'',type:val('type'),num:val('num'),date:val('date'),period:val('period'),link:val('link')};
      busy(1); api({vapi:'hrsavedoc',data:JSON.stringify(x)}).then(function(r){ busy(0); TAB='doc'; apply(r); });
    });
}
function fuelView(){
  var l=DATA.fuel||[], t=DATA.fuelTotals||{};
  var h='<div class="row" style="margin-bottom:8px"><button class="btn pri" onclick="fuelForm({})">+ Запись</button>'+
        '<span class="muted">акты: '+money(t.acts)+' · выплаты: '+money(t.pays)+'</span></div>';
  h+='<div class="card tbwrap"><table><thead><tr><th>Вид</th><th>Дата</th><th>№ акта</th><th>ФИО</th><th class="num">Сумма</th><th></th></tr></thead><tbody>';
  h+=l.map(function(f){ return '<tr><td>'+esc(f.kind)+'</td><td>'+esc(f.date||'—')+'</td><td>'+esc(f.num||'—')+'</td><td>'+esc(f.fio||'—')+'</td><td class="num">'+money(f.sum)+'</td>'+
    '<td><button class="btn sm" onclick=\'fuelForm('+JSON.stringify(f).replace(/'/g,"&#39;")+')\'>✎</button> <button class="btn sm" onclick="delRec(\'fuel\',\''+f.id+'\',\'запись топлива\')">🗑</button></td></tr>'; }).join('');
  return h+'</tbody></table>'+(l.length?'':'<div class="empty">Пусто.</div>')+'</div>';
}
function fuelForm(f){
  dlg('Топливо', sel('kind','Вид',f.kind||'акт',['акт','выплата'])+fld('date','Дата',f.date)+fld('num','№ акта',f.num)+
    fld('sum','Сумма',f.sum)+empOpts(f.emp)+fld('note','Примечание',f.note),
    function(){
      var d={id:f.id||'',kind:val('kind'),date:val('date'),num:val('num'),sum:val('sum'),emp:val('emp'),note:val('note')};
      busy(1); api({vapi:'hrsavefuel',data:JSON.stringify(d)}).then(function(r){ busy(0); TAB='fuel'; apply(r); });
    });
}
var TPLDATA=null;
function tplView(){
  if(!TPLDATA){ api({vapi:'hrtemplates'}).then(function(r){ TPLDATA=r; render(); });
    return '<div class="center">Загрузка шаблонов…</div>'; }
  if(!TPLDATA.ok) return '<div class="center">Ошибка: '+esc(TPLDATA.error||'')+'</div>';
  var hint={gen:'Эти шаблоны система заполняет сама при нажатии «собрать по шаблону» в карточке. Здесь — только для просмотра и правки самого шаблона.',
            hand:'Чистые бланки: откройте, распечатайте или заполните вручную. Например договор подряда чаще заполняется работником от руки.',
            lna:'Локальные нормативные акты и порядки — для ознакомления сотрудников.'};
  var h='';
  (TPLDATA.sections||[]).forEach(function(sec){
    h+='<div class="sect" style="display:flex;justify-content:space-between;align-items:baseline">'+esc(sec.title)+
       '<a class="back" href="'+esc(sec.folderUrl)+'" target="_blank" style="text-transform:none;font-weight:400">открыть папку ↗</a></div>';
    h+='<div class="muted" style="font-size:12px;margin:0 4px 6px">'+esc(hint[sec.key]||'')+'</div>';
    if(!sec.groups.length){ h+='<div class="card"><div class="empty">Пусто.</div></div>'; return; }
    sec.groups.forEach(function(g){
      h+='<div class="card">'+(g.sub?'<div style="font-weight:700;margin-bottom:6px">'+esc(g.sub)+'</div>':'')+
        '<div style="display:flex;flex-direction:column;gap:2px">'+
        g.items.map(function(it){
          // ✅ — шаблон подключён к генерации (система заполняет сама), ⚪ — просто лежит бланком
          var mark = it.wired
            ? '<span class="pill p-ok" style="margin-left:6px" title="подключён: система заполняет сам">✅ подключён</span>'
            : '<span class="pill p-none" style="margin-left:6px" title="лежит в папке, но к генерации не подключён — только скачать и заполнить руками">⚪ не подключён</span>';
          return '<div style="padding:4px 0;display:flex;align-items:center;gap:2px;flex-wrap:wrap">'
            +'<a href="'+esc(it.url)+'" target="_blank">📄 '+esc(it.name)+'</a>'+mark+'</div>';
        }).join('')+
        '</div></div>';
    });
  });
  return h;
}
load();

// авто-обновление: оболочка шлёт «refresh» при возврате на раздел — перечитываем данные без перезагрузки страницы
(function(){
  try{ var m=/[?&]twsec=([^&]+)/.exec(location.search); window.top.postMessage({tw:'hello',sec:m?decodeURIComponent(m[1]):''},'*'); }catch(e){}
  window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='refresh'){ try{ load(); }catch(err){} } });
})();

// ─────── ПОКАЗЫВАЕМ, ЧТО ИДЁТ РАБОТА ───────
// Каждый вызов Apps Script — это 3-6 секунд. Без видимого признака человек считает, что
// кнопка не сработала, и жмёт снова: так рождались дубли нарядов и «то одобряет, то нет».
// Полоска сверху — на любой запрос; заслонка «не нажимайте» — только на действие,
// которое человек начал сам (нажал кнопку), чтобы фоновое обновление не мешало работать.
var TWL=0, TWCLICK=0;
var TWTMR=0;
function twLoadOn(wait){
  TWL++;
  var b=document.getElementById('twload'); if(b) b.style.display='block';
  if(wait){
    var w=document.getElementById('twwait'); if(w) w.style.display='flex';
    // ПРЕДОХРАНИТЕЛЬ: если ответ не пришёл (сеть в цеху пропала), заслонка не должна
    // запереть экран навсегда — через 30 с она превращается в понятное сообщение и снимается пальцем.
    clearTimeout(TWTMR);
    TWTMR=setTimeout(function(){
      var h=document.getElementById('twwt'); if(h) h.textContent='Ответа всё нет';
      var s=document.querySelector('#twwait .wh'); if(s) s.textContent='связь медленная — нажмите, чтобы закрыть и попробовать снова';
      var ww=document.getElementById('twwait'); if(ww) ww.onclick=function(){ TWL=0; twLoadOff(); };
    },30000);
  }
}
function twLoadOff(){
  TWL=Math.max(0,TWL-1); if(TWL) return;
  clearTimeout(TWTMR);
  var b=document.getElementById('twload'); if(b) b.style.display='none';
  var w=document.getElementById('twwait');
  if(w){ w.style.display='none'; w.onclick=null; }
  var s=document.querySelector('#twwait .wh'); if(s) s.textContent='идёт обмен с сервером — не нажимайте';
}
function twSay(t){ var e=document.getElementById('twwt'); if(e&&t) e.textContent=t; }
// нажатие человека «взводит» заслонку для ближайшего запроса (20 с — на случай prompt по дороге)
document.addEventListener('click',function(e){
  var n=e.target;
  while(n&&n!==document.body){ if(n.tagName==='BUTTON'||n.tagName==='A'){ TWCLICK=Date.now(); return; } n=n.parentNode; }
},true);
(function(){
  var _api=(typeof api==='function')?api:null, _post=(typeof apiPost==='function')?apiPost:null;
  var wrap=function(fn){ return function(p){
    var mine=(TWCLICK && (Date.now()-TWCLICK)<20000); if(mine) TWCLICK=0;
    twLoadOn(mine);
    return fn(p).then(function(r){ twLoadOff(); return r; }, function(e){ twLoadOff(); throw e; });
  }; };
  if(_api) api=wrap(_api);
  if(_post) apiPost=wrap(_post);
})();
</script>
