<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигервуд — Товары</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --fg:#1b2333; --muted:#8a93a6; --line:#e6e9f2; --accent:#2b7de9;
    --green:#137333; --green-bg:#e7f5ea; --amber:#b7791f; --amber-bg:#f7efdb; --red:#c0392b; --red-bg:#fdecea; --grid:#eef1f8;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#14161b; --card:#1c1f26; --fg:#e9eaee; --muted:#9aa0ad; --line:#2a2e37; --accent:#4f9bee;
           --green:#4bbd7e; --green-bg:#13291d; --amber:#d6a23c; --amber-bg:#2c2411; --red:#e5776b; --red-bg:#2b1714; --grid:#23262e; }
  }
  *{box-sizing:border-box;} html,body{margin:0;background:var(--bg);}
  body{ font-family:-apple-system,Roboto,Segoe UI,Arial,sans-serif; color:var(--fg); padding:14px; max-width:1180px; margin:0 auto; font-size:14px; }
  html.emb>body>.hi,html.emb>body>.sub{display:none}
  .hi{ font-size:19px; font-weight:800; } .sub{ color:var(--muted); font-size:13px; margin-top:2px; }
  .muted{ color:var(--muted); } .center{ text-align:center; padding:40px 16px; color:var(--muted); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px; box-shadow:0 1px 3px rgba(20,30,60,.05); margin-bottom:10px; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 12px; }
  .tabs button{ border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:999px; padding:7px 13px; font-size:13px; cursor:pointer; font-weight:600; }
  .tabs button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  table{ width:100%; border-collapse:collapse; } th,td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top; }
  th{ color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  td.num,th.num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tbwrap{ overflow-x:auto; }
  .pill{ display:inline-block; border-radius:999px; padding:2px 9px; font-size:11.5px; font-weight:700; white-space:nowrap; }
  .p-ok{ background:var(--green-bg); color:var(--green); } .p-none{ background:var(--grid); color:var(--muted); }
  .btn{ border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:9px; padding:6px 11px; font-size:13px; cursor:pointer; font-weight:600; }
  .btn.pri{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.danger{ background:var(--red-bg); border-color:var(--red-bg); color:var(--red); }
  .btn.sm{ padding:3px 8px; font-size:12px; }
  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:9px; }
  label.f{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:3px; }
  input,select,textarea{ width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--fg); font-size:13px; font-family:inherit; }
  input[type=checkbox]{ width:16px; height:16px; }
  input[type=color]{ width:34px; height:28px; padding:1px; }
  .back{ cursor:pointer; color:var(--accent); font-weight:600; font-size:13px; }
  .empty{ color:var(--muted); font-size:12.5px; padding:8px 0; }
  a{ color:var(--accent); }
  /* сообщения вместо alert */
  #msg{ display:none; margin:8px 0; padding:8px 12px; border-radius:10px; font-size:13px; font-weight:600; }
  #msg.ok{ display:block; background:var(--green-bg); color:var(--green); }
  #msg.err{ display:block; background:var(--red-bg); color:var(--red); }
  #msg .btn{ margin-left:8px; }
  /* ── реестр ── */
  .regtbl{ border-collapse:collapse; width:100%; min-width:1100px; font-size:12.5px; }
  .regtbl th{ position:sticky; top:0; background:var(--card); z-index:2; cursor:pointer; white-space:nowrap; padding:6px 7px; border-bottom:2px solid var(--line); }
  .regtbl td{ padding:3px 7px; border-bottom:1px solid var(--grid); white-space:nowrap; line-height:18px; }
  .regtbl tr.item:hover td{ background:rgba(43,125,233,.10); }
  .regtbl col.hl{ background:rgba(43,125,233,.07); }
  .regtbl th.hl{ color:var(--accent); }
  .regtbl tr.grph td{ font-weight:700; padding:5px 7px; cursor:pointer; }
  .regtbl tr.grph td .gsub, .regtbl tr.grph2 td .gsub{ font-weight:400; font-size:11px; opacity:.75; margin-left:8px; }
  .regtbl tr.grph2 td{ font-weight:600; padding:4px 7px 4px 26px; cursor:pointer; background:var(--grid); font-size:12px; }
  .regtbl td.sku{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; font-weight:700; cursor:pointer; color:var(--accent); }
  .regtbl td.dim{ color:var(--muted); }
  .regtbl td.nm{ max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  .regtbl td.rege{ cursor:text; }
  .reghub{ background:var(--green-bg); color:var(--green); padding:0 6px; border-radius:8px; font-size:10px; font-weight:700; }
  .asmok{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%;
          background:var(--green); color:#fff; font-size:11px; font-weight:900; vertical-align:middle;
          box-shadow:0 1px 3px rgba(19,115,51,.45); }
  #massbar{ position:sticky; bottom:8px; z-index:5; background:var(--card); border:1px solid var(--accent); border-radius:12px;
            padding:9px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; box-shadow:0 6px 20px rgba(20,30,60,.18); margin-top:10px; }
  /* ── группы ── */
  .gcard{ display:flex; gap:10px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:9px 12px; margin-bottom:7px; cursor:grab; }
  .gcard.sel{ border-color:var(--accent); box-shadow:0 4px 14px rgba(43,125,233,.25); transform:translateY(-1px); }
  .gcard.target{ outline:2px dashed var(--accent); outline-offset:2px; }
  .gcard .gname{ flex:1; min-width:140px; font-weight:700; padding:3px 9px; border-radius:8px; cursor:pointer; }
  .gcard .cnt{ color:var(--muted); font-size:12px; white-space:nowrap; }
  /* ── коды ── */
  .chipx{ display:inline-flex; align-items:center; gap:6px; background:var(--grid); border:1px solid var(--line);
          border-radius:999px; padding:3px 5px 3px 10px; margin:3px 4px 3px 0; font-size:12.5px; cursor:pointer; }
  .chipx b{ font-family:ui-monospace,Menlo,monospace; }
  .chipx .x{ color:var(--red); font-weight:700; padding:0 5px; border-radius:50%; }
  .chipx .x:hover{ background:var(--red-bg); }
  .kbadd{ display:flex; gap:6px; margin-top:8px; max-width:420px; }
  .kbadd input:first-child{ width:110px; flex:none; font-family:ui-monospace,monospace; }
  /* видимая реакция кнопок (телефон) */
  button{ touch-action:manipulation; -webkit-tap-highlight-color:transparent;
          transition:transform .06s ease, filter .12s ease, opacity .12s ease; }
  button:active{ transform:scale(.94); filter:brightness(.86); }
  button[disabled]{ opacity:.5; pointer-events:none; }
  #twload{ position:fixed; left:0; top:0; height:3px; width:100%; z-index:60; display:none; overflow:hidden; }
  #twload>i{ display:block; height:100%; width:38%; background:var(--accent); animation:twslide 1.1s ease-in-out infinite; }
  @keyframes twslide{ 0%{ margin-left:-38% } 100%{ margin-left:100% } }
  #twwait{ position:fixed; inset:0; background:rgba(246,247,252,.78); z-index:70; display:none; align-items:center; justify-content:center; }
  #twwait .wb{ background:var(--card); border-radius:16px; padding:18px 22px; text-align:center; min-width:190px; box-shadow:0 12px 34px rgba(20,25,50,.18); }
  #twwait .sp{ width:28px; height:28px; border:3px solid rgba(43,125,233,.22); border-top-color:var(--accent); border-radius:50%; margin:0 auto 10px; animation:twspin .8s linear infinite; }
  @keyframes twspin{ to{ transform:rotate(360deg) } }
  #twwait .wt{ font-weight:700; font-size:15px; } #twwait .wh{ font-size:12.5px; opacity:.6; margin-top:4px; }
</style>
</head>
<body>
<div id="twload"><i></i></div>
<div id="twwait"><div class="wb"><div class="sp"></div><div class="wt" id="twwt">Отправляю…</div><div class="wh">идёт обмен с сервером — не нажимайте</div></div></div>
<div class="hi">🏷 Товары</div>
<div class="sub">Реестр, группы, коды артикула, папки — первоисточник товаров.</div>
<div id="app"><div class="center">Загрузка…</div></div>
<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod';
if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('emb');
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
try{ if(!TGID && window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) TGID=String(Telegram.WebApp.initDataUnsafe.user.id); }catch(e){}
if(TGID){ try{ localStorage.setItem('tw_tgid',TGID); }catch(e){} }
function api(p){ p.app=APP; if(TGID&&!p.tgid)p.tgid=TGID;
  var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&');
  return fetch(BASE+'?'+q).then(function(r){return r.json();}); }
function apiPost(p){ p.app=APP; if(TGID&&!p.tgid)p.tgid=TGID;
  var body=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&');
  return fetch(BASE,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body}).then(function(r){return r.json();}); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function jsq(s){ return esc(String(s==null?'':s)).replace(/'/g,'&#39;'); }

/* ══ Состояние ══ */
var P=[], GF=[], CODES=[], CATIDX={}, ORPHANS=[], COMP={}, IZDREF=null;
var TAB='reg', CARD=null;               // CARD: sku | '' (новый) | null
var SEL={}, Q='', GRPF='';
var SORT={k:'',dir:1}, HIDE={}, CLOSED={}, GSEL='', GRPBY='group';
try{ HIDE=JSON.parse(localStorage.getItem('twRegHide')||'{}'); }catch(e){ HIDE={}; }
var ARTSEL={}, BUSY=0, PENDCONF=null;

var FIELDS=['sku','brand','equip','model','size','color','kit','group','name','nameEn','hs','boxSize','boxW','warranty','palL','palW','palH','palQty','palNet','palGross'];
var REGCOLS=[
  {k:'sku',    t:'Артикул'},
  {k:'brand',  t:'Бренд', edit:1},
  {k:'equip',  t:'Оборудование'},
  {k:'model',  t:'Модель'},
  // производственные показатели держим слева, сразу за моделью: их смотрят чаще,
  // чем размеры коробок и паллет — те уехали правее
  {k:'_comp',  t:'Состав'},
  {k:'_cost',  t:'Стоим. операций, р.'},
  {k:'_share', t:'Труд %'},
  {k:'_asm',   t:'Собрано'},
  {k:'size',   t:'Размер', edit:1, cls:'dim'},
  {k:'color',  t:'Цвет', edit:1, cls:'dim'},
  {k:'kit',    t:'Компл.', edit:1, cls:'dim'},
  {k:'nameEn', t:'Для документов', edit:1, cls:'nm'},
  {k:'boxSize',t:'Коробка', edit:1, cls:'dim'},
  {k:'boxW',   t:'Вес, кг', edit:1, cls:'dim'},
  {k:'palL',   t:'Пал: Д', edit:1, cls:'dim'},
  {k:'palW',   t:'Пал: Ш', edit:1, cls:'dim'},
  {k:'palH',   t:'Пал: В', edit:1, cls:'dim'},
  {k:'palQty', t:'Пал: шт', edit:1, cls:'dim'},
  {k:'palGross',t:'Пал: брутто', edit:1, cls:'dim'},
  {k:'warranty',t:'Гар.', edit:1, cls:'dim'}
];
var ARTPARTS=[['brand','Бренд'],['equip','Оборудование'],['model','Модель'],['size','Размер'],['color','Цвет'],['pack','Комплектация']];
var ARTTYPES=[['brand','Бренды'],['equip','Оборудование'],['model','Модели'],['size','Размеры'],['color','Цвета'],['pack','Комплектации'],['unit','Единицы измерения']];

function pkey(s){ return String(s||'').trim().toLowerCase(); }
function prodBy(sku){ for(var i=0;i<P.length;i++) if(pkey(P[i].sku)===pkey(sku)) return P[i]; return null; }
function grpInfo(name){ for(var i=0;i<GF.length;i++) if(GF[i].name===name) return GF[i]; return null; }
function grpOrd(name){ for(var i=0;i<GF.length;i++) if(GF[i].name===name) return i; return 900; }
function codesOf(t){ return CODES.filter(function(c){return c.type===t;}); }

/* ══ Загрузка: мгновенный старт из кэша + тихое фоновое обновление.
   Возврат в раздел (оболочка шлёт refresh на каждый показ) НЕ должен ронять экран
   в «Загрузка…» — данные товаров меняются редко, обновляемся фоном и не чаще раза в 5 минут. ══ */
var LASTLOAD=0, CACHE_KEY='twProdsCache';
function applyData(pr,ac,cat){
  P=pr.products||[]; GF=pr.groupsFull||[];
  CODES=(ac&&ac.ok&&ac.codes)||[];
  CATIDX={}; ORPHANS=[];
  if(cat&&cat.ok) (cat.groups||[]).forEach(function(g){ (g.models||[]).forEach(function(m){ (m.variants||[]).forEach(function(v){
    if(v.orphan){ ORPHANS.push({eq:v.eq,mod:v.mod}); return; }
    CATIDX[pkey(v.art)]={hasComp:!!v.hasComp, assembled:!!v.assembled, cost:v.cost||0, hours:v.hours||0,
      price:v.price||0, laborShare:v.laborShare, detailsCount:v.detailsCount||0, opsCount:v.opsCount||0,
      stages:v.stages||[], eq:v.eq, mod:v.mod};
  });});});
  // сшиваем показатели каталога в строки товаров — сортировка и фильтр работают как с обычными полями
  P.forEach(function(p){
    var ci=CATIDX[pkey(p.sku)]||{};
    p._cost=ci.cost||0;
    p._comp=ci.hasComp?(ci.detailsCount+' дет · '+ci.opsCount+' оп'):'';
    p._asm=ci.assembled?'✔':'';
    p._share=(ci.laborShare!=null)?ci.laborShare:'';
    p._hasComp=!!ci.hasComp;
  });
}
function cacheSave(pr,ac,cat){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({pr:pr,ac:ac,cat:cat,ts:Date.now()})); }catch(e){}
}
function cacheLoad(){
  try{ var c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(c&&c.pr&&c.pr.ok){ applyData(c.pr,c.ac,c.cat); return true; } }catch(e){}
  return false;
}
function load(silent){
  if(!silent) $('app').innerHTML='<div class="center">Загрузка…</div>';
  Promise.all([ api({vapi:'productsfull'}), api({vapi:'artcodes'}), api({vapi:'catalog'}) ]).then(function(rs){
    var pr=rs[0], ac=rs[1], cat=rs[2];
    if(!pr||!pr.ok){
      if(!silent) $('app').innerHTML='<div class="center">Ошибка: '+esc((pr&&pr.error)||'нет данных')+'<br><br><button class="btn" onclick="load()">↻ Повторить</button></div>';
      return;
    }
    LASTLOAD=Date.now();
    applyData(pr,ac,cat); cacheSave(pr,ac,cat);
    if(silent){
      // мягко: не трогаем открытую карточку, правку ячейки и выделение; сохраняем прокрутку
      if(CARD!==null||BUSY||document.querySelector('[data-e]')) return;
      var sy=window.scrollY;
      fillGrpFilter(); renderBody();
      window.scrollTo(0,sy);
    } else {
      defaultCollapse();
      renderShell();
      var focus=qp('sku'); if(focus && prodBy(focus)){ openCard(focus); }
    }
  }).catch(function(e){ if(!silent) $('app').innerHTML='<div class="center">Сеть: '+esc(e.message)+'<br><br><button class="btn" onclick="load()">↻ Повторить</button></div>'; });
}
function boot(){
  if(cacheLoad()){
    defaultCollapse();
    renderShell();
    var focus=qp('sku'); if(focus && prodBy(focus)){ openCard(focus); }
    load(true);                     // свежие данные — фоном, экран не мигает
  } else load();
}

/* ══ Каркас: тулбар и вкладки рисуются один раз — поиск не теряет фокус ══ */
function renderShell(){
  var h='<div class="row" style="margin-bottom:2px">'
    +'<input id="q" placeholder="🔎 поиск: артикул, модель, наименование" style="flex:1;min-width:180px" oninput="Q=this.value;renderBody()">'
    +'<select id="grpf" style="width:auto" onchange="GRPF=this.value;renderBody()"></select>'
    +'<select id="grpby" style="width:auto" title="как группировать список" onchange="GRPBY=this.value;defaultCollapse();renderBody()">'
    +'<option value="group">по группам</option><option value="equip">по оборудованию</option></select>'
    +'<button class="btn pri" onclick="openCard(\'\')">＋ Товар</button>'
    +'<button class="btn" onclick="doExport(this)" title="выгрузить в Google-таблицу, лист «Прохаб: выгрузка»">⬆️ В Google-реестр</button>'
    +'<button class="btn" onclick="askImport()" title="импорт из Google-реестра — перезапишет правки системы">⋯</button>'
    +'</div>'
    +'<div id="msg"></div>'
    +'<div class="tabs" id="tabsrow"></div>'
    +'<div id="tabbody"></div>';
  $('app').innerHTML=h;
  fillGrpFilter(); renderTabs(); renderBody();
}
function fillGrpFilter(){
  var known={}; GF.forEach(function(g){ known[g.name]=1; });
  var extra={}; P.forEach(function(p){ if(p.group&&!known[p.group]) extra[p.group]=1; });
  var opts=GF.map(function(g){return g.name;}).concat(Object.keys(extra).sort());
  $('grpf').innerHTML='<option value="">все группы</option>'+opts.map(function(g){
    return '<option'+(g===GRPF?' selected':'')+'>'+esc(g)+'</option>'; }).join('');
}
var TABS=[{id:'reg',t:'📋 Реестр'},{id:'grp',t:'🗂 Группы'},{id:'art',t:'⚙️ Артикул'},{id:'stat',t:'📈 Сводка'}];
function renderTabs(){
  $('tabsrow').innerHTML=TABS.map(function(t){
    return '<button class="'+(TAB===t.id&&!CARD?'on':'')+'" onclick="go(\''+t.id+'\')">'+t.t+'</button>';
  }).join('')+'<button onclick="load(true);msg(\'⟳ обновляю с сервера…\',1)" title="перечитать с сервера">⟳</button>';
}
function go(tab){ TAB=tab; CARD=null; CMPV=null; PENDCONF=null; renderTabs(); renderBody(); }
function renderBody(){
  var b=$('tabbody'); if(!b) return;
  if(CMPV){ b.innerHTML=compareHtml(); return; }
  if(CARD!==null){ b.innerHTML=cardView(); compRender(); return; }
  if(TAB==='reg') b.innerHTML=regView();
  else if(TAB==='grp') b.innerHTML=grpView();
  else if(TAB==='art') b.innerHTML=artView();
  else b.innerHTML=statView();
}
function msg(t,ok){
  var m=$('msg'); if(!m) return;
  m.className=ok?'ok':'err'; m.innerHTML=t;
  if(ok){ clearTimeout(msg._t); msg._t=setTimeout(function(){ m.className=''; m.innerHTML=''; },5000); }
}
function msgOff(){ var m=$('msg'); if(m){ m.className=''; m.innerHTML=''; } }

/* ══ Общая запись с BUSY ══ */
function run(promise, done, failMsg){
  if(BUSY) return; BUSY=1;
  promise.then(function(r){
    BUSY=0;
    if(!r||!r.ok){ msg('⚠ '+esc((r&&r.error)||failMsg||'не сохранилось')); return; }
    if(done) done(r);
  }).catch(function(e){ BUSY=0; msg('⚠ связь оборвалась: '+esc(e.message||e)); });
}

/* ══ Экспорт / импорт ══ */
function doExport(btn){
  if(btn){ btn.disabled=true; }
  run(api({vapi:'exportproducts'}), function(r){
    if(btn) btn.disabled=false;
    msg('✓ выгружено '+r.rows+' товаров, '+r.groups+' групп → лист «Прохаб: выгрузка» в Google-таблице', 1);
  });
  if(btn) setTimeout(function(){ btn.disabled=false; }, 12000);
}
function askImport(){
  msg('Импорт из Google-реестра <b>перезапишет</b> правки, сделанные в системе (кроме товаров «хаб»). '
    +'<button class="btn danger sm" onclick="doImport()">Да, перезаписать из Google</button>'
    +'<button class="btn sm" onclick="msgOff()">Отмена</button>');
}
function doImport(){
  msgOff();
  run(apiPost({vapi:'syncproducts',force:1}), function(r){
    msg('✓ импортировано '+r.count+' товаров (хабовских сохранено: '+(r.keptHub||0)+')', 1);
    load();
  });
}

/* ══════ 📋 РЕЕСТР ══════ */
function visCols(){ return REGCOLS.filter(function(c){ return !HIDE[c.k]; }); }
function regFilter(){
  var q=Q.toLowerCase().trim();
  return P.filter(function(p){
    if(GRPF && p.group!==GRPF) return false;
    if(!q) return true;
    return (p.sku+' '+p.brand+' '+p.equip+' '+p.model+' '+p.name+' '+p.nameEn+' '+p.size+' '+p.color+' '+p.kit+' '+p.group).toLowerCase().indexOf(q)>=0;
  });
}
function regSortBy(k){
  if(SORT.k===k){ if(SORT.dir===1) SORT.dir=-1; else { SORT.k=''; SORT.dir=1; } }
  else { SORT.k=k; SORT.dir=1; }
  renderBody();
}
function regView(){
  var list=regFilter();
  var sorted=!!SORT.k;
  if(sorted){
    var sk=SORT.k, dir=SORT.dir;
    list.sort(function(a,b){
      var x=String(a[sk]||'').trim(), y=String(b[sk]||'').trim();
      if(x===''&&y!=='') return 1; if(y===''&&x!=='') return -1;
      var nx=parseFloat(x.replace(',','.')), ny=parseFloat(y.replace(',','.'));
      if(!isNaN(nx)&&!isNaN(ny)) return (nx-ny)*dir;
      return x.localeCompare(y,'ru')*dir;
    });
  } else {
    list.sort(function(a,b){
      if(GRPBY==='equip') return (a.equip||'я').localeCompare(b.equip||'я','ru') || a.model.localeCompare(b.model);
      return (grpOrd(a.group)-grpOrd(b.group)) || (a.group||'я').localeCompare(b.group||'я')
        || a.equip.localeCompare(b.equip) || a.model.localeCompare(b.model);
    });
  }
  var cols=visCols();
  var selN=Object.keys(SEL).length;
  var chips='';
  if(GRPF) chips+='<span class="pill" style="background:var(--accent);color:#fff;cursor:pointer" onclick="GRPF=\'\';$(\'grpf\').value=\'\';renderBody()" title="снять фильтр группы">группа: '+esc(GRPF)+' ✕</span>';
  if(SORT.k){ var sc=REGCOLS.filter(function(c){return c.k===SORT.k;})[0];
    chips+='<span class="pill" style="background:var(--amber-bg);color:var(--amber);cursor:pointer" onclick="SORT={k:\'\',dir:1};renderBody()" title="убрать сортировку — вернуть группы">сортировка: '+esc(sc?sc.t:SORT.k)+(SORT.dir===1?' ▲':' ▼')+' ✕ — вернуть группы</span>'; }
  if(Q.trim()) chips+='<span class="pill p-none" style="cursor:pointer" onclick="Q=\'\';$(\'q\').value=\'\';renderBody()">поиск: «'+esc(Q.trim())+'» ✕</span>';
  var h='<div class="row" style="margin-bottom:6px">'
    +'<span class="muted" style="font-size:12px">товаров: '+list.length+'</span>'+chips
    +'<span style="position:relative;display:inline-block">'
    +'<button class="btn sm" onclick="var m=$(\'colsMenu\');m.style.display=m.style.display===\'none\'?\'\':\'none\'">⚙ колонки</button>'
    +'<span id="colsMenu" style="display:none;position:absolute;top:30px;left:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:6px;z-index:20;min-width:170px">'
    +REGCOLS.map(function(c){ return '<label style="display:flex;gap:6px;align-items:center;padding:3px 6px;cursor:pointer;font-size:13px"><input type="checkbox" style="width:auto" '+(HIDE[c.k]?'':'checked')+' onchange="colTgl(\''+c.k+'\')">'+esc(c.t)+'</label>'; }).join('')
    +'</span></span>'
    +(!sorted?(function(){
        var any=Object.keys(CLOSED).some(function(k){return CLOSED[k];});
        return any?'<button class="btn sm" onclick="CLOSED={};renderBody()" title="раскрыть все группы и оборудование">⊞ развернуть всё</button>'
                  :'<button class="btn sm" onclick="collapseAll()" title="сжать весь каталог до заголовков">⊟ свернуть всё</button>';
      })():'')
    +'<span class="muted" style="font-size:11.5px">двойной клик по ячейке — правка · клик по артикулу — карточка · клик по заголовку — сортировка</span>'
    +'</div>';
  h+='<div class="card tbwrap" style="padding:0"><table class="regtbl"><colgroup>'
    +Array(cols.length+2).join('<col>')+'</colgroup><tr>'
    +'<th style="cursor:default"><input type="checkbox" style="width:14px;height:14px" '+(selN&&selN>=list.length?'checked':'')+' onclick="selAll(this.checked)" title="выбрать все видимые"></th>'
    +cols.map(function(c){
      var ar=(SORT.k===c.k)?(SORT.dir===1?' ▲':' ▼'):'';
      return '<th onclick="regSortBy(\''+c.k+'\')">'+esc(c.t)+ar+'</th>';
    }).join('')+'</tr>';
  // статистика для заголовков: N товаров и средняя себестоимость по срезу
  var gStat={}, eStat={};
  if(!sorted) list.forEach(function(p){
    var g0=(GRPBY==='equip')?(p.equip||'(без оборудования)'):(p.group||'(без группы)');
    var gs=gStat[g0]||(gStat[g0]={n:0,c:0,cn:0,a:0}); gs.n++; if(p._cost>0){gs.c+=p._cost;gs.cn++;} if(p._asm)gs.a++;
    if(GRPBY==='group'){
      var ek=g0+'▸'+(p.equip||'—');
      var es=eStat[ek]||(eStat[ek]={n:0,c:0,cn:0,a:0}); es.n++; if(p._cost>0){es.c+=p._cost;es.cn++;} if(p._asm)es.a++;
    }
  });
  // средняя себестоимость по группе убрана намеренно: среднее по разнородным товарам
  // ничего не говорит, стоимость операций смотрим по каждому товару в его строке
  function hdrStat(st){ if(!st) return '';
    return '<span class="gsub">'+st.n+' тов.'+(st.a?' · <span style="color:var(--green);font-weight:700">✔ собрано '+st.a+'/'+st.n+'</span>':'')+'</span>'; }
  var open=!!Q.trim();   // при поиске всё раскрыто, как в старом каталоге
  var cur=null, cur2=null;
  list.forEach(function(p){
    var g=(GRPBY==='equip')?(p.equip||'(без оборудования)'):(p.group||'(без группы)');
    if(!sorted && g!==cur){ cur=g; cur2=null;
      var gi=(GRPBY==='equip')?{}:(grpInfo(g)||{});
      var gst=(gi.bg?'background:'+gi.bg+';':'background:var(--grid);')+(gi.fg?'color:'+gi.fg+';':'');
      h+='<tr class="grph" onclick="CLOSED[\''+jsq(g)+'\']=!CLOSED[\''+jsq(g)+'\'];renderBody()"><td colspan="'+(cols.length+1)+'" style="'+gst+'">'+(!open&&CLOSED[g]?'▸':'▾')+' '+esc(g)+hdrStat(gStat[g])+'</td></tr>';
    }
    if(!open && !sorted && CLOSED[g]) return;
    // второй уровень: оборудование внутри группы (ключ свёртки составной — имена могут совпадать)
    if(!sorted && GRPBY==='group'){
      var ek=g+'▸'+(p.equip||'—');
      if(ek!==cur2){ cur2=ek;
        h+='<tr class="grph2" onclick="CLOSED[\''+jsq(ek)+'\']=!CLOSED[\''+jsq(ek)+'\'];renderBody()"><td colspan="'+(cols.length+1)+'">'+(!open&&CLOSED[ek]?'▸':'▾')+' '+esc(p.equip||'(без оборудования)')+hdrStat(eStat[ek])+'</td></tr>';
      }
      if(!open && CLOSED[ek]) return;
    }
    var sq=jsq(p.sku);
    h+='<tr class="item">'
      +'<td><input type="checkbox" style="width:14px;height:14px" '+(SEL[p.sku]?'checked':'')+' onclick="selTgl(\''+sq+'\',this.checked)"></td>'
      +cols.map(function(c){
        if(c.k==='sku') return '<td class="sku" onclick="openCard(\''+sq+'\')" title="открыть карточку">'+esc(p.sku)
          +(p._asm?' <span class="asmok" title="товар собран — подтверждено директором">✓</span>':'')
          +(p.src==='хаб'?' <span class="reghub">хаб</span>':'')
          +(p.folder?' <a href="'+esc(p.folder)+'" target="_blank" onclick="event.stopPropagation()" title="папка на Drive">📁</a>':'')+'</td>';
        if(c.k==='_comp') return '<td class="dim" onclick="openCard(\''+sq+'\')">'+(p._comp?esc(p._comp):'<span class="pill p-none">⚠ нет</span>')+'</td>';
        if(c.k==='_cost') return '<td onclick="openCard(\''+sq+'\')" style="text-align:right;font-variant-numeric:tabular-nums">'+(p._cost?p._cost.toLocaleString('ru-RU',{minimumFractionDigits:2}):'')+'</td>';
        if(c.k==='_share') return '<td class="dim" onclick="openCard(\''+sq+'\')" style="text-align:right">'+(p._share!==''?p._share+'%':'')+'</td>';
        if(c.k==='_asm') return '<td style="cursor:pointer;text-align:center" onclick="asmTgl(\''+sq+'\')" title="отметка директора: изделие полностью расписано по операциям">'
          +(p._asm?'<span class="pill p-ok">✔</span>':'<span class="pill p-none">☐</span>')+'</td>';
        var v=esc(String(p[c.k]||'').trim());
        if(c.edit) return '<td class="'+(c.cls||'')+' rege" ondblclick="cellEdit(this,\''+sq+'\',\''+c.k+'\')" title="двойной клик — править">'+v+'</td>';
        return '<td class="'+(c.cls||'')+'" onclick="openCard(\''+sq+'\')">'+v+'</td>';
      }).join('')+'</tr>';
  });
  h+='</table></div>';
  if(!list.length) h='<div class="center">Ничего не найдено</div>';
  if(!sorted && !Q.trim() && !GRPF) h+=orphanBlock();
  if(selN){
    h+='<div id="massbar">выбрано: <b>'+selN+'</b>'
      +'<span>перенести в группу</span><select id="massGrp" style="width:auto">'+GF.map(function(g){return '<option>'+esc(g.name)+'</option>';}).join('')+'</select>'
      +'<button class="btn pri sm" onclick="massMove()">Применить</button>'
      +(selN>=2?'<button class="btn sm" onclick="openCompare()">⚖ Сравнить ('+Math.min(selN,6)+')</button>':'')
      +'<button class="btn sm" onclick="SEL={};renderBody()">снять выделение</button></div>';
  }

}
// вид по умолчанию: группы раскрыты, оборудование внутри свёрнуто —
// сверху видно перечень оборудования, а товары разворачиваются по нужному
function defaultCollapse(){
  CLOSED={};
  if(GRPBY!=='group') return;
  regFilter().forEach(function(p){
    CLOSED[(p.group||'(без группы)')+'▸'+(p.equip||'—')]=true;
  });
}
function collapseAll(){
  CLOSED={};
  regFilter().forEach(function(p){
    var g=(GRPBY==='equip')?(p.equip||'(без оборудования)'):(p.group||'(без группы)');
    CLOSED[g]=true;
    if(GRPBY==='group') CLOSED[g+'▸'+(p.equip||'—')]=true;
  });
  renderBody();
}
function colTgl(k){
  if(HIDE[k]) delete HIDE[k]; else HIDE[k]=1;
  try{ localStorage.setItem('twRegHide',JSON.stringify(HIDE)); }catch(e){}
  renderBody();
}
function selTgl(sku,on){ if(on) SEL[sku]=1; else delete SEL[sku]; renderBody(); }
function selAll(on){
  SEL={};
  if(on) regFilter().forEach(function(p){ SEL[p.sku]=1; });
  renderBody();
}
function massMove(){
  var grp=$('massGrp').value, skus=Object.keys(SEL);
  if(!skus.length) return;
  run(apiPost({vapi:'prodsetgroup',skus:skus.join('|'),group:grp}), function(r){
    skus.forEach(function(s){ var p=prodBy(s); if(p) p.group=grp; });
    SEL={};
    msg('✓ перенесено в «'+esc(grp)+'»: '+r.moved,1);
    renderBody();
  });
}
// инлайн-правка ячейки: Enter/уход = сохранить, Esc = отмена
function cellEdit(td,sku,key){
  if(td.getAttribute('data-e')||BUSY) return;
  var p=prodBy(sku); if(!p) return;
  td.setAttribute('data-e','1');
  var old=String(p[key]||'');
  td.innerHTML='<input value="'+esc(old)+'" style="min-width:70px;padding:1px 5px;font-size:12px;border-color:var(--accent)">';
  var inp=td.firstChild; inp.focus(); inp.select();
  var done=false;
  function fin(saveIt){
    if(done) return; done=true;
    var val=inp.value.trim();
    td.removeAttribute('data-e');
    if(!saveIt||val===old.trim()){ td.textContent=old; return; }
    td.textContent=val; td.style.background='var(--amber-bg)';
    var d={}; FIELDS.forEach(function(k){ d[k]=String(p[k]||''); });
    d.palNet=String(p.palNet||''); d[key]=val;
    apiPost({vapi:'productsave',data:JSON.stringify(d),oldsku:p.sku}).then(function(r){
      if(!r||!r.ok){ td.textContent=old; td.style.background='var(--red-bg)'; msg('⚠ не сохранилось: '+esc((r&&r.error)||'ошибка')); return; }
      p[key]=val; td.style.background='var(--green-bg)';
      setTimeout(function(){ td.style.background=''; },900);
    }).catch(function(e){ td.textContent=old; td.style.background='var(--red-bg)'; msg('⚠ '+esc(e.message||e)); });
  }
  inp.onkeydown=function(ev){ if(ev.key==='Enter') fin(true); if(ev.key==='Escape') fin(false); };
  inp.onblur=function(){ fin(true); };
}

// отметка «Собрано» прямо из списка (тот же серверный флаг, что видят заказы)
function asmTgl(sku){
  var p=prodBy(sku); if(!p) return;
  var ci=CATIDX[pkey(sku)];
  if(!ci||!ci.hasComp){ msg('⚠ у «'+esc(sku)+'» не задан состав — сначала распишите операции в карточке'); return; }
  var on=!ci.assembled;
  ci.assembled=on; p._asm=on?'✔':''; renderBody();
  api({vapi:'setassembled',art:sku,val:on?'1':''}).then(function(r){
    if(!r||!r.ok){ ci.assembled=!on; p._asm=!on?'✔':''; renderBody(); msg('⚠ '+esc((r&&r.error)||'не сохранилось')); }
  }).catch(function(e){ ci.assembled=!on; p._asm=!on?'✔':''; renderBody(); msg('⚠ '+esc(e.message||e)); });
}

/* ══════ 🗂 ГРУППЫ ══════ */
function grpView(){
  if(!GF.length) return '<div class="center">Групп нет — добавьте первую ниже</div>'+grpAddRow();
  var cnt={}; P.forEach(function(p){ cnt[p.group]=(cnt[p.group]||0)+1; });
  var h='<div class="muted" style="font-size:12px;margin-bottom:8px">Перетащите карточку (или: тап по группе → тап по месту). Клик по имени — переименовать. Порядок используется в реестре и выгрузке.</div>';
  h+=GF.map(function(g,i){
    var st=(g.bg?'background:'+g.bg+';':'background:var(--grid);')+(g.fg?'color:'+g.fg+';':'');
    return '<div class="gcard'+(GSEL===g.name?' sel':'')+(GSEL&&GSEL!==g.name?' target':'')+'" draggable="true"'
      +' ondragstart="gDrag(event,\''+jsq(g.name)+'\')"'
      +' ondragover="event.preventDefault();this.classList.add(\'target\')" ondragleave="this.classList.remove(\'target\')"'
      +' ondrop="gDrop(event,'+i+')" onclick="gTap(\''+jsq(g.name)+'\','+i+')">'
      +'<span class="muted" style="cursor:grab">⠿</span>'
      +'<button class="btn sm" onclick="event.stopPropagation();gMove('+i+',-1)" '+(i===0?'disabled':'')+'>↑</button>'
      +'<button class="btn sm" onclick="event.stopPropagation();gMove('+i+',1)" '+(i===GF.length-1?'disabled':'')+'>↓</button>'
      +'<span class="gname" id="gn'+i+'" style="'+st+'" onclick="event.stopPropagation();gRename('+i+')" title="клик — переименовать">'+esc(g.name)+'</span>'
      +'<span class="cnt">'+(cnt[g.name]||0)+' тов.</span>'
      +'<input type="color" value="'+esc(g.fg||'#333333')+'" title="цвет текста" onclick="event.stopPropagation()" onchange="gColor('+i+',this.value,null)">'
      +'<input type="color" value="'+esc(g.bg||'#eeeeee')+'" title="цвет фона" onclick="event.stopPropagation()" onchange="gColor('+i+',null,this.value)">'
      +((cnt[g.name]||0)===0?'<button class="btn danger sm" onclick="event.stopPropagation();gDel('+i+')">🗑</button>':'')
      +'</div>';
  }).join('');
  h+=grpAddRow();
  return h;
}
function grpAddRow(){
  return '<div class="row" style="margin-top:10px;max-width:480px">'
    +'<input id="gNew" placeholder="новая группа, например TW: Новинки" style="flex:1" onkeydown="if(event.key===\'Enter\')gAdd()">'
    +'<button class="btn pri" onclick="gAdd()">＋ Добавить</button></div>';
}
function gDrag(ev,name){ GSEL=name; try{ ev.dataTransfer.setData('text/plain',name); }catch(e){} }
function gDrop(ev,toIdx){ ev.preventDefault(); var name=''; try{ name=ev.dataTransfer.getData('text/plain'); }catch(e){}
  if(!name) name=GSEL; GSEL=''; if(name) gPlace(name,toIdx); }
function gTap(name,i){
  if(!GSEL){ GSEL=name; renderBody(); return; }
  if(GSEL===name){ GSEL=''; renderBody(); return; }
  var moving=GSEL; GSEL=''; gPlace(moving,i);
}
// вставить группу на позицию toIdx и сохранить весь порядок одним вызовом
function gPlace(name,toIdx){
  var from=-1; GF.forEach(function(g,i){ if(g.name===name) from=i; });
  if(from<0||from===toIdx){ renderBody(); return; }
  var g=GF.splice(from,1)[0];
  GF.splice(toIdx,0,g);
  renderBody();
  run(apiPost({vapi:'prodgrouporder',names:GF.map(function(x){return x.name;}).join('|')}), function(){
    msg('✓ порядок сохранён',1);
  });
}
function gMove(i,dir){
  var j=i+dir; if(j<0||j>=GF.length) return;
  var t=GF[i]; GF[i]=GF[j]; GF[j]=t;
  renderBody();
  run(apiPost({vapi:'prodgrouporder',names:GF.map(function(x){return x.name;}).join('|')}), function(){ msg('✓ порядок сохранён',1); });
}
function gRename(i){
  var g=GF[i], span=$('gn'+i); if(!span||span.getAttribute('data-e')) return;
  span.setAttribute('data-e','1');
  span.innerHTML='<input value="'+esc(g.name)+'" style="min-width:160px;padding:2px 6px">';
  var inp=span.firstChild; inp.focus(); inp.select();
  var done=false;
  function fin(saveIt){
    if(done) return; done=true;
    var val=inp.value.trim();
    span.removeAttribute('data-e');
    if(!saveIt||!val||val===g.name){ renderBody(); return; }
    run(api({vapi:'prodgroupsave',name:val,old:g.name}), function(r){
      var oldName=g.name;
      g.name=val;
      P.forEach(function(p){ if(p.group===oldName) p.group=val; });
      msg('✓ группа переименована'+(r.renamedProducts?' (товаров: '+r.renamedProducts+')':''),1);
      fillGrpFilter(); renderBody();
    });
    renderBody();
  }
  inp.onkeydown=function(ev){ if(ev.key==='Enter') fin(true); if(ev.key==='Escape') fin(false); };
  inp.onblur=function(){ fin(inp.value.trim()!==g.name); };
}
function gColor(i,fg,bg){
  var g=GF[i];
  run(api({vapi:'prodgroupsave',name:g.name,old:g.name,fg:fg||g.fg||'',bg:bg||g.bg||''}), function(){
    if(fg) g.fg=fg; if(bg) g.bg=bg;
    msg('✓ цвет сохранён',1); renderBody();
  });
}
function gAdd(){
  var v=$('gNew').value.trim(); if(!v) return;
  run(api({vapi:'prodgroupsave',name:v,old:''}), function(){
    GF.push({name:v,fg:'',bg:''});
    msg('✓ группа «'+esc(v)+'» добавлена',1);
    fillGrpFilter(); renderBody();
  });
}
function gDel(i){
  var g=GF[i];
  msg('Удалить группу «'+esc(g.name)+'»? <button class="btn danger sm" onclick="gDelDo('+i+')">Удалить</button><button class="btn sm" onclick="msgOff()">Отмена</button>');
}
function gDelDo(i){
  msgOff();
  var g=GF[i];
  run(api({vapi:'prodgroupdel',name:g.name}), function(){
    GF.splice(i,1);
    msg('✓ группа удалена',1);
    fillGrpFilter(); renderBody();
  });
}

function artSelects(prefix){

      list=list.filter(function(c){ return be[ARTSEL.brand].indexOf(c.code)>=0; });
    return '<div><label class="f">'+esc(p2[1])+'</label><select onchange="ARTSEL[\''+p2[0]+'\']=this.value;artRefresh(\''+prefix+'\')">'
      +'<option value="">—</option>'
      +list.map(function(c){ return '<option value="'+esc(c.code)+'"'+(ARTSEL[p2[0]]===c.code?' selected':'')+'>'+esc(c.code)+' · '+esc(c.value)+'</option>'; }).join('')
      +'</select></div>';
  }).join('');

function artPreview(){ return ARTPARTS.map(function(p){return ARTSEL[p[0]]||'';}).filter(Boolean).join(' '); }
function artRefresh(prefix){
  if(prefix==='card'){ var box=$('cardArt'); if(box){ box.innerHTML=artSelects('card'); }
    var pv=$('cardArtPrev'); if(pv) pv.textContent=artPreview()||'—'; return; }
  renderBody();
}
function codeAdd(t){
  var c=$('nc_'+t).value.trim(), v=$('nv_'+t).value.trim();
  if(!c) return;
  run(api({vapi:'artcodesave',type:t,code:c,value:v,old:''}), function(){
    CODES.push({type:t,code:c,value:v});
    msg('✓ код '+esc(c)+' добавлен',1); renderBody();
  });
}
function codeEdit(t,code){
  var cur=CODES.filter(function(x){return x.type===t&&x.code===code;})[0]; if(!cur) return;
  var chip=$('cx_'+t+'_'+code); if(!chip||chip.getAttribute('data-e')) return;
  chip.setAttribute('data-e','1');
  chip.innerHTML='<b>'+esc(code)+'</b> <input value="'+esc(cur.value)+'" style="width:150px;padding:1px 6px;font-size:12px">';
  var inp=chip.querySelector('input'); inp.focus(); inp.select();
  var done=false;
  function fin(saveIt){
    if(done) return; done=true;
    var val=inp.value.trim();
    chip.removeAttribute('data-e');
    if(!saveIt||val===cur.value){ renderBody(); return; }
    run(api({vapi:'artcodesave',type:t,code:code,value:val,old:code}), function(){
      cur.value=val; msg('✓ сохранено',1); renderBody();
    });
  }
  inp.onkeydown=function(ev){ if(ev.key==='Enter') fin(true); if(ev.key==='Escape') fin(false); };
  inp.onblur=function(){ fin(true); };
  event.stopPropagation();
}
function codeDel(t,code){
  msg('Удалить код <b>'+esc(code)+'</b>? <button class="btn danger sm" onclick="codeDelDo(\''+t+'\',\''+jsq(code)+'\')">Удалить</button><button class="btn sm" onclick="msgOff()">Отмена</button>');
}
function codeDelDo(t,code){
  msgOff();
  run(api({vapi:'artcodedel',type:t,code:code}), function(){
    CODES=CODES.filter(function(x){return !(x.type===t&&x.code===code);});
    msg('✓ код удалён',1); renderBody();
  });
}
function beTgl(brand,equip,on){
  var cur=CODES.filter(function(x){return x.type==='brandEquip'&&x.code===brand;})[0];
  var list=cur?String(cur.value||'').split(',').filter(Boolean):[];
  if(on){ if(list.indexOf(equip)<0) list.push(equip); } else { list=list.filter(function(x){return x!==equip;}); }
  var csv=list.join(',');
  run(api({vapi:'artcodesave',type:'brandEquip',code:brand,value:csv,old:brand}), function(){
    if(cur) cur.value=csv; else CODES.push({type:'brandEquip',code:brand,value:csv});
    msg('✓ связка сохранена',1); renderBody();
  });
}

function statView(){
  var byG={};

}

  v=pkey(v); if(!v) return '';
  var m=codesOf(t), i;
  for(i=0;i<m.length;i++) if(pkey(m[i].value)===v) return m[i].code;

var CMPV=null;
function openCompare(){
  var skus=Object.keys(SEL).slice(0,6);

  CMPV=skus; CARD=null; renderTabs();

function compareHtml(){
  var items=CMPV.map(function(sku){ var p=prodBy(sku), ci=CATIDX[pkey(sku)]||{}; return p?{p:p,ci:ci}:null; }).filter(Boolean);
  var allStages={}, order=[];
  items.forEach(function(it){ (it.ci.stages||[]).forEach(function(st){ if(!allStages[st.op]){ allStages[st.op]=1; order.push(st.op); } }); });
  function row(label,fn){ return '<tr><td class="dim" style="color:var(--muted)">'+label+'</td>'+items.map(function(it){ return '<td class="num">'+fn(it)+'</td>'; }).join('')+'</tr>'; }
  var h='<div class="row" style="margin-bottom:8px"><span class="back" onclick="CMPV=null;renderBody()">← к реестру</span><b style="font-size:16px">⚖ Сравнение</b></div>';
  h+='<div class="card tbwrap"><table><tr><th>Показатель</th>'+items.map(function(it){ return '<th>'+esc(it.p.equip)+'<br><span class="muted" style="font-weight:400">'+esc(it.p.model)+'</span></th>'; }).join('')+'</tr>'
    +row('Себестоимость труда',function(it){ return it.ci.cost?it.ci.cost.toLocaleString('ru-RU',{minimumFractionDigits:2})+' р.':'—'; })
    +row('Нормо-часы',function(it){ return it.ci.hours?hrs(it.ci.hours*60):'—'; })
    +row('Цена продажи',function(it){ return it.ci.price?it.ci.price.toLocaleString('ru-RU')+' р.':'—'; })
    +row('Труд в цене',function(it){ return it.ci.laborShare!=null?it.ci.laborShare+'%':'—'; })
    +row('Деталей',function(it){ return it.ci.detailsCount||'—'; })
    +row('Операций',function(it){ return it.ci.opsCount||'—'; })
    +'<tr><td colspan="'+(items.length+1)+'" class="muted" style="padding-top:10px;font-size:12px">Труд по этапам, руб:</td></tr>'
    +order.map(function(op){ return row(esc(op),function(it){
      var st=(it.ci.stages||[]).filter(function(x){return x.op===op;})[0];
      return st?st.cost.toLocaleString('ru-RU',{minimumFractionDigits:2}):'—'; }); }).join('')
    +'</table></div>';
  return h;
}

/* ══════ 🧩 СОСТАВ И ОПЕРАЦИИ (слито из «Каталога изделий») ══════ */
var EMODE=false, EM=[], EDART='', EDEQ='', EDMOD='', EDWARNS=[], IZDREF_AT=0, EDC={};
function hrs(min){ var h=Math.floor(min/60), m=Math.round(min%60); return (h?h+' ч ':'')+m+' мин'; }
function compRender(){
  var box=$('compSec'); if(!box) return;
  var p=prodBy(CARD); if(!p){ box.innerHTML=''; return; }
  if(EMODE){ box.innerHTML=editHtml(); return; }
  // заранее, пока человек смотрит карточку: состав для редактора и справочник деталей —
  // тогда «✎ Редактировать» открывается мгновенно, а не двумя запросами по 4 секунды
  if(!EDC[pkey(p.sku)] && p.equip && p.model){
    EDC[pkey(p.sku)]='loading';
    api({vapi:'izdcomp',eq:p.equip,mod:p.model,artikul:p.sku}).then(function(r){
      EDC[pkey(p.sku)]=(r&&r.ok)?r:null;
    }).catch(function(){ EDC[pkey(p.sku)]=null; });
  }
  if(!IZDREF) izdRefEnsure(function(){});
  var c=COMP[pkey(p.sku)];
  if(!c){
    box.innerHTML='<div class="card"><b>🧩 Состав и операции</b><div class="empty">⏳ загружаю состав…</div></div>';
    api({vapi:'varcomp',art:p.sku}).then(function(r){
      COMP[pkey(p.sku)]=r&&r.ok?r:{ok:false,error:(r&&r.error)||'не загрузился'};
      compRender();
    }).catch(function(e){ COMP[pkey(p.sku)]={ok:false,error:String(e.message||e)}; compRender(); });
    return;
  }
  var ci=CATIDX[pkey(p.sku)]||{};
  var h='<div class="card"><div class="row" style="justify-content:space-between">'
    +'<b>🧩 Состав и операции</b>'
    +'<span class="row">'
    +'<span class="pill '+(ci.assembled?'p-ok':'p-none')+'" style="cursor:pointer" onclick="asmTgl(\''+jsq(p.sku)+'\');compRender()" title="отметка директора — видна и в заказах">'+(ci.assembled?'✔ собрано':'☐ отметить собранным')+'</span>'
    +'<button class="btn sm pri" onclick="editOpen()">✎ Редактировать состав</button>'
    +(ci.hasComp?'<button class="btn sm danger" onclick="compDelAsk()">🗑</button>':'')
    +'</span></div>';
  if(!c.ok || !(c.details&&c.details.length)){
    h+='<div class="empty" style="margin-top:8px">Состав не задан — операции этого товара не попадут в заказы.'
      +(cloneSibs(p).length?' Можно скопировать с другого варианта:':'')+'</div>'+cloneBtns(p);
    return box.innerHTML=h+'</div>';
  }
  h+='<div class="row muted" style="margin-top:6px;font-size:12.5px">себестоимость труда <b style="color:var(--green)">'
    +(c.cost||0).toLocaleString('ru-RU',{minimumFractionDigits:2})+' р.</b> · ⏱ '+hrs((c.hours||0)*60)
    +(ci.price?' · цена <b style="color:var(--accent)">'+ci.price.toLocaleString('ru-RU')+' р.</b>':' · цена —')
    +(ci.laborShare!=null?' · труд <b style="color:var(--amber)">'+ci.laborShare+'%</b> цены':'')
    +' · '+(ci.detailsCount||c.details.length)+' дет. · '+(ci.opsCount||'')+' оп.</div>';
  var mx=1; (c.stages||[]).forEach(function(st){ if(st.cost>mx) mx=st.cost; });
  h+='<div style="margin-top:8px">'+(c.stages||[]).map(function(st){
    return '<div class="row" style="gap:8px;font-size:12px;margin:2px 0"><span class="dim" style="width:150px;color:var(--muted)">'+esc(st.op)+'</span>'
      +'<span style="height:8px;border-radius:4px;background:var(--amber);width:'+Math.max(6,Math.round(st.cost/mx*180))+'px"></span> '
      +(st.cost||0).toLocaleString('ru-RU',{minimumFractionDigits:2})+' р.</div>';
  }).join('')+'</div>';
  h+='<div style="margin-top:8px">'+(c.details||[]).map(function(dd){
    return '<div style="border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin:6px 0;background:var(--bg)">'
      +'<b style="font-size:13px">'+esc(dd.name)+'</b> <span style="float:right;color:var(--green);font-weight:700">'+(dd.cost||0).toLocaleString('ru-RU',{minimumFractionDigits:2})+' р.</span>'
      +'<table style="margin-top:4px"><tr><th>Операция</th><th class="num">Кол-во</th><th class="num">Расц.</th><th class="num">Стоим.</th></tr>'
      +(dd.ops||[]).map(function(o){ return '<tr><td>'+esc(o.op)+'</td><td class="num">'+o.qty+'</td><td class="num">'+o.rate+'</td><td class="num">'+(o.cost||0).toLocaleString('ru-RU',{minimumFractionDigits:2})+'</td></tr>'; }).join('')
      +'</table></div>';
  }).join('')+'</div>';
  box.innerHTML=h+'</div>';
}
function cloneSibs(p){
  return P.filter(function(x){ return x.equip===p.equip && x.sku!==p.sku && x._hasComp; });
}
function cloneBtns(p){
  var sibs=cloneSibs(p);
  if(!sibs.length) return '';
  return '<div class="row" style="margin-top:6px">'+sibs.slice(0,8).map(function(x){
    return '<button class="btn sm" onclick="cloneFrom(\''+jsq(x.sku)+'\')">⎘ как '+esc(x.model)+'</button>';
  }).join('')+'</div>';
}
function cloneFrom(fromSku){
  var p=prodBy(CARD); if(!p) return;
  twSay('Копирую состав…');
  run(api({vapi:'clonevariant',from:fromSku,eq:p.equip,mod:p.model,to:p.sku}), function(){
    delete COMP[pkey(p.sku)]; delete EDC[pkey(p.sku)];
    msg('✓ состав скопирован с '+esc(fromSku),1);
    load(true); compRender();
  });
}
function compDelAsk(){
  var p=prodBy(CARD); if(!p) return;
  msg('Удалить состав «'+esc(p.sku)+'» целиком? Операции пропадут из будущих заказов. '
    +'<button class="btn danger sm" onclick="compDelDo()">Удалить состав</button><button class="btn sm" onclick="msgOff()">Отмена</button>');
}
function compDelDo(){
  msgOff();
  var p=prodBy(CARD); if(!p) return;
  run(api({vapi:'delvariant',artikul:p.sku,eq:p.equip,mod:p.model}), function(){
    delete COMP[pkey(p.sku)]; delete EDC[pkey(p.sku)];
    msg('✓ состав удалён',1);
    load(true); compRender();
  });
}
/* ── редактор: детали блоками, галочки операций, порядок стрелками ── */
function izdRefEnsure(cb){
  if(IZDREF){ cb(); return; }   // свежесть операций состава даёт серверный refOps; справочник — только для добавления деталей
  api({vapi:'izddata'}).then(function(r){
    if(!r||!r.ok){ msg('⚠ справочник не загрузился: '+esc((r&&r.error)||'')); return; }
    IZDREF=r; IZDREF_AT=Date.now(); cb();
  }).catch(function(e){ msg('⚠ '+esc(e.message||e)); });
}
function editOpen(){
  var p=prodBy(CARD); if(!p) return;
  if(!p.equip||!p.model){ msg('⚠ у товара нет оборудования/модели'); return; }
  EDART=p.sku; EDEQ=p.equip; EDMOD=p.model; EDWARNS=[];
  var cached=EDC[pkey(p.sku)];
  if(cached && cached!=='loading'){          // префетч успел — открываем мгновенно
    EM=emBuild(cached); EDWARNS=cached.warns||[];
    EMODE=true; compRender();
    if(!IZDREF) izdRefEnsure(function(){ if(EMODE) compRender(); });   // datalist деталей дольёт себя
    return;
  }
  var box=$('compSec'); if(box) box.innerHTML='<div class="card"><b>✎ Редактор</b><div class="empty">⏳ загружаю состав и справочник…</div></div>';
  Promise.all([
    api({vapi:'izdcomp',eq:EDEQ,mod:EDMOD,artikul:EDART}),
    IZDREF?Promise.resolve({ok:true}):api({vapi:'izddata'})
  ]).then(function(rs){
    var r=rs[0], ref=rs[1];
    if(ref&&ref.ok&&ref.details){ IZDREF=ref; IZDREF_AT=Date.now(); }
    if(!r||!r.ok){ msg('⚠ состав не загрузился: '+esc((r&&r.error)||'')); compRender(); return; }
    EDC[pkey(p.sku)]=r;
    EM=emBuild(r);
    EDWARNS=r.warns||[];
    EMODE=true; compRender();
  }).catch(function(e){ msg('⚠ '+esc(e.message||e)); compRender(); });
}
function emBuild(r){
  var order=[], by={};
  (r.rows||[]).forEach(function(row){
    var d=row.detail;
    if(!by[d]){ by[d]={qty:(Number(row.qty)||1), level:row.level||'деталь', seq:[]}; order.push(d); }
    if(String(row.level||'')==='изделие') by[d].level='изделие';
    by[d].seq.push({op:row.op, rate:Number(row.rate)||0, on:true});
  });
  var refOps=r.refOps||{};
  return order.map(function(d){
    var b=by[d], have={};
    b.seq.forEach(function(o){ have[pkey(o.op)]=1; });
    var extra=(refOps[d]||((IZDREF&&IZDREF.ratesByDetail&&IZDREF.ratesByDetail[d])||[])).filter(function(o){ return !have[pkey(o.op)]; })
      .map(function(o){ return {op:o.op, rate:Number(o.rate)||0, on:false, fresh:true}; });
    return {detail:d, qty:b.qty, level:b.level, ops:b.seq.concat(extra)};
  });
}
function emTotal(){
  var t=0; EM.forEach(function(d){ var q=Number(d.qty)||0; d.ops.forEach(function(o){ if(o.on) t+=q*(Number(o.rate)||0); }); });
  return Math.round(t*100)/100;
}
function emDetSum(d){
  var q=Number(d.qty)||0, t=0; d.ops.forEach(function(o){ if(o.on) t+=q*(Number(o.rate)||0); });
  return Math.round(t*100)/100;
}
// живой пересчёт итогов без перерисовки — фокус в полях не теряется
function emRecalc(){
  var e=$('edTot'); if(e) e.textContent=emTotal().toLocaleString('ru-RU',{minimumFractionDigits:2})+' р.';
  EM.forEach(function(d,di){ var s2=$('edSum_'+di); if(s2) s2.textContent=emDetSum(d).toLocaleString('ru-RU',{minimumFractionDigits:2})+' р.'; });
}
/* блок «Сборка и упаковка изделия»: строки уровня «изделие» живут здесь, не в общем списке */
function packBlockHtml(){
  var pi=-1; EM.forEach(function(d,i){ if(d.level==='изделие') pi=i; });
  var inner;
  if(pi>=0){
    var d=EM[pi];
    inner=d.ops.map(function(o,oi){
      return '<label style="display:inline-flex;gap:5px;align-items:center;margin:2px 12px 2px 0;font-size:12.5px;cursor:pointer">'
        +'<input type="checkbox" style="width:14px;height:14px" '+(o.on?'checked':'')+' onchange="EM['+pi+'].ops['+oi+'].on=this.checked;emRecalc()">'
        +esc(o.op)+' <span class="muted">'+(o.rate>0?o.rate+' р.':'⚠')+'</span></label>';
    }).join('')
    +'<div class="muted" style="font-size:11px">строка изделия: <b>'+esc(d.detail)+'</b> · 1 шт на товар</div>';
  } else {
    inner='<div style="color:var(--amber);font-size:12.5px">У модели нет операции упаковки изделия. Без неё не работают отгрузка партии, склад деталей и переучёт по упакованным товарам.</div>';
  }
  return '<div style="background:var(--grid);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:7px 0">'
    +'<b style="font-size:13px">📦 Сборка и упаковка изделия</b><div style="margin-top:4px">'+inner+'</div>'
    +'<div class="row" style="margin-top:6px">'
    +(pi>=0?'':'<button class="btn sm" onclick="packAdd(\'product\')">＋ упаковка изделия</button>')
    +'<button class="btn sm" onclick="packAdd(\'furn\')">＋ фурнитура</button>'
    +'<button class="btn sm" onclick="packAdd(\'box\')">＋ коробка</button>'
    +'</div></div>';
}
function packAdd(kind){
  msg('⏳ подбираю по образцу других моделей…',1);
  api({vapi:'packtemplate',eq:EDEQ,mod:EDMOD,art:EDART}).then(function(t){
    if(!t||!t.ok){ msg('⚠ '+esc((t&&t.error)||'нет ответа')); return; }
    var spec=(kind==='product')?t.product:(kind==='furn'?t.furn:t.box);
    if(!spec){ msg('⚠ нечего добавить'); return; }
    if(EM.some(function(d){ return pkey(d.detail)===pkey(spec.detail); })){ msg('⚠ «'+esc(spec.detail)+'» уже есть в составе — смотрите в списке'); return; }
    if(spec.rate>0){ packAddDo(kind,spec,spec.rate,t); return; }
    // расценки в справочнике нет — спрашиваем прямо в строке сообщений
    window.__packCtx={kind:kind,spec:spec,t:t};
    msg('Расценка за «'+esc(spec.detail)+' · '+esc(spec.op)+'», ₽/шт: '
      +'<input id="packRate" value="0.15" style="width:80px;display:inline-block;margin:0 6px">'
      +'<button class="btn pri sm" onclick="packRateGo()">Добавить</button><button class="btn sm" onclick="msgOff()">Отмена</button>');
    var e=$('packRate'); if(e){ e.focus(); e.select(); }
  }).catch(function(e){ msg('⚠ '+esc(e.message||e)); });
}
function packRateGo(){
  var c=window.__packCtx; if(!c) return;
  var rate=Number(String($('packRate').value).replace(',','.'))||0;
  if(!(rate>0)){ msg('⚠ расценка должна быть больше нуля'); return; }
  msgOff(); packAddDo(c.kind,c.spec,rate,c.t);
}
function packAddDo(kind,spec,rate,t){
  api({vapi:'packrate',detail:spec.detail,op:spec.op,rate:rate,pdet:(t.product&&t.product.detail)||'',eqname:EDEQ}).then(function(rr){
    if(!rr||!rr.ok){ msg('⚠ '+esc((rr&&rr.error)||'ошибка')); return; }
    EM.push({detail:spec.detail, qty:1, level:(kind==='product'?'изделие':'деталь'), ops:[{op:spec.op, rate:rate, on:true}]});
    compRender();
    msg('✓ добавлено: '+esc(spec.detail)+' · '+esc(spec.op)+' · '+rate+' р.'+(rr.existed?'':' (расценка заведена в справочнике)')+'. Не забудьте «💾 Сохранить состав».',1);
  }).catch(function(e){ msg('⚠ '+esc(e.message||e)); });
}
function editHtml(){
  var h='<div class="card"><div class="row" style="justify-content:space-between">'
    +'<b>✎ Состав: '+esc(EDMOD)+'</b>'
    +'<span class="row"><b class="muted" style="font-size:12.5px">труд: <span id="edTot" style="color:var(--green)">'+emTotal().toLocaleString('ru-RU',{minimumFractionDigits:2})+' р.</span></b>'
    +'<button class="btn sm pri" onclick="editSave()">💾 Сохранить состав</button>'
    +'<button class="btn sm" onclick="EMODE=false;compRender()">отмена</button></span></div>'
    +'<div id="edWarn">'+warnHtml(EDWARNS)+'</div>'
    +'<div class="muted" style="font-size:11.5px;margin:4px 0">Деталь приносит все свои операции — галочка включает в состав, стрелки ↑↓ задают техпорядок этой модели. «новая» — операция появилась в справочнике позже: поставьте галочку, если она нужна этой модели.</div>'
    +packBlockHtml();
  EM.forEach(function(d,di){
    if(d.level==='изделие') return;   // строки изделия — в блоке упаковки выше
    h+='<div style="border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin:7px 0;background:var(--bg)">'
      +'<div class="row"><b style="flex:1;font-size:13px">'+esc(d.detail)+'</b>'
      +'<b class="muted" style="font-size:11.5px"><span id="edSum_'+di+'">'+emDetSum(d).toLocaleString('ru-RU',{minimumFractionDigits:2})+' р.</span></b>'
      +'<span class="muted" style="font-size:11.5px">шт в изделии</span>'
      +'<input type="number" value="'+esc(d.qty)+'" style="width:64px;padding:3px 6px" oninput="EM['+di+'].qty=this.value;emRecalc()">'
      +'<button class="btn sm danger" onclick="EM.splice('+di+',1);compRender()" title="убрать деталь из состава">✕</button></div>';
    d.ops.forEach(function(o,oi){
      h+='<div class="row" style="gap:6px;margin:3px 0;font-size:12.5px">'
        +'<span class="muted" style="width:16px;text-align:right">'+(oi+1)+'</span>'
        +'<button class="btn sm" style="padding:0 6px" '+(oi===0?'disabled':'')+' onclick="emMove('+di+','+oi+',-1)">↑</button>'
        +'<button class="btn sm" style="padding:0 6px" '+(oi===d.ops.length-1?'disabled':'')+' onclick="emMove('+di+','+oi+',1)">↓</button>'
        +'<input type="checkbox" style="width:15px;height:15px" '+(o.on?'checked':'')+' onchange="EM['+di+'].ops['+oi+'].on=this.checked;emRecalc()">'
        +'<span style="flex:1">'+esc(o.op)+(o.fresh?' <span class="pill p-none" style="font-size:10px">новая</span>':'')+'</span>'
        +'<span class="'+(o.rate>0?'muted':'')+'" style="'+(o.rate>0?'':'color:var(--red);font-weight:700')+'">'+(o.rate>0?o.rate+' р.':'⚠ нет расценки')+'</span></div>';
    });
    h+='</div>';
  });
  var dl='<datalist id="dlDet">'+((IZDREF&&IZDREF.details)||[]).map(function(x){return '<option value="'+esc(x)+'">';}).join('')+'</datalist>';
  h+=dl+'<div class="row" style="margin-top:8px"><input id="edAdd" list="dlDet" placeholder="＋ добавить деталь (начните вводить)" style="flex:1;min-width:200px" onkeydown="if(event.key===\'Enter\')emAddDet()">'
    +'<button class="btn sm" onclick="emAddDet()">Добавить</button>'
    +'<button class="btn sm" onclick="refreshRefs()" title="перечитать реестры деталей и расценок">↻ справочник</button></div>'
    +'</div>';
  return h;
}
function warnHtml(w){
  if(!w||!w.length) return '<div class="pill p-ok" style="margin-top:4px">✓ порядок операций выглядит логично</div>';
  return '<div style="background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:7px 10px;margin-top:4px;font-size:12.5px">'
    +w.map(function(x){ return '⚠ '+esc(x.detail||'')+': '+esc(x.msg||x.op||''); }).join('<br>')
    +'<br><span style="opacity:.8">поправьте порядок стрелками ↑↓ и сохраните ещё раз</span></div>';
}
function emMove(di,oi,dir){
  var ops=EM[di].ops, j=oi+dir; if(j<0||j>=ops.length) return;
  var t=ops[oi]; ops[oi]=ops[j]; ops[j]=t;
  compRender();
}
function refreshRefs(){
  IZDREF=null;
  izdRefEnsure(function(){
    msg('✓ справочник перечитан. Перечитать и открытый состав? Несохранённые правки пропадут. '
      +'<button class="btn sm pri" onclick="msgOff();editOpen()">Перечитать состав</button>'
      +'<button class="btn sm" onclick="msgOff()">Оставить как есть</button>',1);
  });
}
function emAddDet(){
  var e=$('edAdd'), det=e?e.value.trim():''; if(!det) return;
  for(var i=0;i<EM.length;i++) if(pkey(EM[i].detail)===pkey(det)){ msg('⚠ деталь уже в составе'); return; }
  var ops=((IZDREF&&IZDREF.ratesByDetail&&IZDREF.ratesByDetail[det])||[]).map(function(o){ return {op:o.op, rate:Number(o.rate)||0, on:true}; });
  if(!ops.length) msg('⚠ у «'+esc(det)+'» нет операций в справочнике — добавьте их в «Операциях и расценках»');
  EM.push({detail:det, qty:1, level:'деталь', ops:ops});
  compRender();
  var e2=$('edAdd'); if(e2){ e2.value=''; e2.focus(); }
}
function editSave(){
  var rows=[];
  EM.forEach(function(d){
    d.ops.forEach(function(o){
      if(!o.on) return;
      rows.push({detail:d.detail, op:o.op, qty:Number(d.qty)||0, rate:o.rate, level:d.level||'деталь'});
    });
  });
  if(!rows.length){ msg('⚠ в составе не осталось ни одной операции — если нужно удалить состав, есть кнопка 🗑'); return; }
  twSay('Сохраняю состав — заказы пересоберутся…');
  run(apiPost({vapi:'savemodel',eq:EDEQ,mod:EDMOD,rows:JSON.stringify(rows),art:EDART}), function(r){
    EDWARNS=r.warns||[];
    delete COMP[pkey(EDART)]; delete EDC[pkey(EDART)];
    if(EDWARNS.length){
      var w=$('edWarn'); if(w) w.innerHTML=warnHtml(EDWARNS);
      msg('Сохранено, но есть замечания к порядку операций — смотрите жёлтую плашку',1);
    } else {
      EMODE=false;
      msg('✓ состав сохранён',1);
      compRender();
    }
    load(true);
  });
}
/* ── составы-сироты (без товара в реестре) ── */
function orphanBlock(){
  if(!ORPHANS.length) return '';
  var h='<div class="card" style="margin-top:10px"><b>⚠ Составы, не привязанные к товару ('+ORPHANS.length+')</b>'
    +'<div class="muted" style="font-size:12px;margin:3px 0">Состав есть, а товара с таким артикулом нет — привяжите к товару или удалите.</div>';
  ORPHANS.forEach(function(o,i){
    h+='<div class="row" style="border-top:1px solid var(--line);padding:6px 0;font-size:13px">'

/* ══ индикаторы (полоска + заслонка) — паттерн planning.html ══ */
var TWL=0, TWCLICK=0, TWTMR=0;
function twLoadOn(wait){
  TWL++;
  var b=$('twload'); if(b) b.style.display='block';
  if(wait){ var w=$('twwait'); if(w) w.style.display='flex';
    clearTimeout(TWTMR);
    TWTMR=setTimeout(function(){
      var h=$('twwt'); if(h) h.textContent='Ответа всё нет';
      var s=document.querySelector('#twwait .wh'); if(s) s.textContent='связь медленная — нажмите, чтобы закрыть';
      var ww=$('twwait'); if(ww) ww.onclick=function(){ TWL=0; twLoadOff(); };
    },30000);
  }
}
function twLoadOff(){
  TWL=Math.max(0,TWL-1); if(TWL) return;
  clearTimeout(TWTMR);
  var b=$('twload'); if(b) b.style.display='none';
  var w=$('twwait'); if(w){ w.style.display='none'; w.onclick=null; }
  var h=$('twwt'); if(h) h.textContent='Отправляю…';
  var s=document.querySelector('#twwait .wh'); if(s) s.textContent='идёт обмен с сервером — не нажимайте';
}
function twSay(t){ var e=$('twwt'); if(e&&t) e.textContent=t; }
document.addEventListener('click',function(e){
  var n=e.target;
  while(n&&n!==document.body){ if(n.tagName==='BUTTON'){ TWCLICK=Date.now(); return; } n=n.parentNode; }
},true);
(function(){
  var _api=api, _post=apiPost;
  var wrap=function(fn){ return function(p){
    var mine=(TWCLICK&&(Date.now()-TWCLICK)<20000); if(mine) TWCLICK=0;
    twLoadOn(mine);
    return fn(p).then(function(r){ twLoadOff(); return r; }, function(e){ twLoadOff(); throw e; });
  }; };
  api=wrap(_api); apiPost=wrap(_post);
})();

// «перекрестье»: при наведении подсвечивается и строка (CSS), и весь столбец (col + заголовок)
document.addEventListener('mouseover', function(e){
  var cell=e.target.closest?e.target.closest('td,th'):null;
  if(!cell) return;
  var tbl=cell.closest('table'); if(!tbl||String(tbl.className).indexOf('regtbl')<0) return;
  if(cell.parentNode && /grph/.test(cell.parentNode.className)) return;   // подзаголовки — не колонки
  var i=cell.cellIndex;
  tbl.querySelectorAll('colgroup col').forEach(function(c,j){ c.className=(j===i)?'hl':''; });
  tbl.querySelectorAll('th').forEach(function(t){ t.classList.toggle('hl', t.cellIndex===i); });
});
document.addEventListener('mouseout', function(e){
  var tbl=e.target.closest?e.target.closest('table.regtbl'):null;
  if(!tbl) return;
  if(e.relatedTarget && tbl.contains(e.relatedTarget)) return;
  tbl.querySelectorAll('colgroup col').forEach(function(c){ c.className=''; });
  tbl.querySelectorAll('th.hl').forEach(function(t){ t.classList.remove('hl'); });
});
