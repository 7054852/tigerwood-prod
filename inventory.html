<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тигервуд — ведомость переучёта</title>
<style>
  :root{ --ink:#1b2333; --muted:#8a93a6; --line:#dfe3ec; --accent:#2b6ef6; }
  *{ box-sizing:border-box; }
  body{ margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); background:#f5f6fa; }
  .wrap{ max-width:1180px; margin:0 auto; padding:14px; }
  .bar{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:14px;
        display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  select,button{ font:inherit; }
  select{ padding:6px 9px; border:1px solid var(--line); border-radius:9px; background:#fff; min-width:180px; }
  button{ padding:7px 13px; border:1px solid var(--line); border-radius:9px; background:#fff; cursor:pointer; font-weight:600; }
  button.pri{ background:var(--accent); border-color:var(--accent); color:#fff; }
  label.chk{ display:inline-flex; align-items:center; gap:6px; font-size:13px; color:#4a5468; cursor:pointer; }
  .muted{ color:var(--muted); }
  .msg{ font-size:13px; }
  .err{ color:#c0392b; }

  /* ── сам лист ── */
  .sheet{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  .shead{ display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; border-bottom:2px solid var(--ink); padding-bottom:8px; margin-bottom:10px; }
  .stitle{ font-size:19px; font-weight:800; }
  .sline{ font-size:12.5px; color:#4a5468; }
  .fill{ display:inline-block; min-width:150px; border-bottom:1px solid #9aa3b5; }
  .legend{ font-size:11.5px; color:#4a5468; margin-bottom:10px; }
  .legend b{ color:var(--ink); }
  .grp{ margin-bottom:12px; page-break-inside:avoid; }
  .grp.big{ page-break-inside:auto; }      /* длинный свод рвать можно — иначе браузер оставит пустую страницу */
  thead{ display:table-header-group; }      /* шапка колонок повторяется на каждой странице */
  tr{ page-break-inside:avoid; }
  .gt{ font-size:14.5px; font-weight:800; padding:5px 0 4px; border-bottom:1px solid var(--ink); }
  .gt .qty{ font-weight:600; color:#4a5468; }
  table{ width:100%; border-collapse:collapse; }
  th,td{ border:1px solid #b9c0cf; padding:0 5px; font-size:12.5px; }
  th{ background:#eef1f7; font-size:11.5px; font-weight:700; text-align:center; padding:5px 3px; line-height:1.2; }
  th.det{ text-align:left; width:38%; }
  td.det{ height:26px; font-weight:600; }
  td.n{ text-align:center; width:52px; color:#4a5468; }
  td.cell{ width:9.2%; height:26px; }
  td.no{ background:repeating-linear-gradient(135deg,#f2f4f8,#f2f4f8 4px,#e6eaf2 4px,#e6eaf2 8px); }
  td.acc{ text-align:center; color:#8a93a6; font-size:11px; }
  tr:nth-child(even) td.det, tr:nth-child(even) td.n{ background:#fafbfd; }
  .sh{ font-size:10px; color:#8a5a00; font-weight:700; }
  .refs{ font-size:11.5px; color:#4a5468; padding:5px 4px 0; }
  .hide{ display:none !important; }
  .tb{ font-size:13px; }
  .tb.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .rowline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:7px 0; border-top:1px solid #eef1f7; font-size:13px; }
  .rowline:first-child{ border-top:0; }
  .flag{ font-size:11px; font-weight:700; padding:1px 6px; border-radius:6px; background:#fdf1dc; color:#8a5a00; }
  .flag.bad{ background:#fdecea; color:#c0392b; }
  .flag.ok{ background:#e6f4ea; color:#137333; }
  .qin{ width:70px; padding:4px 6px; border:1px solid var(--line); border-radius:7px; font:inherit; text-align:center; }
  .mini{ font-size:11.5px; color:var(--muted); }
  .stat{ display:flex; gap:14px; flex-wrap:wrap; font-size:13px; font-weight:600; margin-bottom:8px; }
  .pb{ font-size:10px; color:#2b6ef6; font-weight:700; }
  td.vd{ padding-left:16px; font-weight:600; color:#4a5468; font-size:11.5px; }
  tr.hasv td.det{ border-bottom:0; }
  td.down,td.up{ background:#f2f4f8; text-align:center; color:#aeb6c6; font-size:10px; }
  tr.vrow td{ background:#fcfdff; }
  .foot{ margin-top:10px; font-size:12px; color:#4a5468; display:flex; gap:24px; flex-wrap:wrap; }

  @media print{
    body{ background:#fff; }
    .wrap{ max-width:none; padding:0; }
    .noprint{ display:none !important; }
    .sheet{ border:0; border-radius:0; padding:0; }
    th,td{ font-size:11px; }
    td.det,td.cell{ height:24px; }
    /* книжная: колонок столько же, поэтому ужимаем шрифт и высоту строки */
    body.port th,body.port td{ font-size:9.5px; padding:0 3px; }
    body.port td.det,body.port td.cell{ height:21px; }
    body.port th{ font-size:9px; padding:3px 2px; }
    body.port .stitle{ font-size:16px; }
    body.port .legend,body.port .sline{ font-size:10px; }
    body.port .gt{ font-size:12.5px; }
    body.port td.n{ width:34px; }
    body.port th.det{ width:32%; }
    body.port td.cell{ width:8.6%; }
    body.port .foot{ font-size:10.5px; }
  }
</style>

<style id="pagecss">@page{ size:A4 portrait; margin:9mm; }</style>
<div class="wrap">
  <div class="bar noprint">
    <b>📋 Переучёт</b>
    <button class="tb on" id="tb_print" onclick="tab('print')">🖨 Печать листа</button>
    <button class="tb" id="tb_load" onclick="tab('load')">📷 Загрузка и сверка</button>
    <button class="tb" id="tb_hist" onclick="tab('hist')">🕘 История</button>
  </div>
  <div class="bar noprint" id="bar_print">
    <select id="ord" onchange="load()"></select>
    <select id="mode" onchange="load()">
      <option value="prod">по изделиям</option>
      <option value="detail">свод по деталям</option>
    </select>
    <select id="orient" onchange="setOrient(this.value)" title="ориентация листа при печати">
      <option value="portrait">книжная</option>
      <option value="landscape">альбомная</option>
    </select>
    <label class="chk"><input type="checkbox" id="showAcc" onchange="draw()"> показать цифры программы</label>
    <button class="pri" onclick="window.print()">🖨 Печать</button>
    <span class="msg" id="msg"></span>
  </div>
  <div id="out"></div>
  <div id="pane_load" class="hide noprint"></div>
  <div id="pane_hist" class="hide noprint"></div>
</div>

<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod', R=null, TGID='';
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search); return m?decodeURIComponent(m[1].replace(/\+/g,' ')):''; }
TGID=qp('tgid')||'';
try{ if(window.Telegram&&Telegram.WebApp){ var u=Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user; if(u) TGID=String(u.id); } }catch(e){}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function msg(t,err){ var m=document.getElementById('msg'); m.className='msg'+(err?' err':''); m.textContent=t||''; }
function api(p){
  p.app=APP; if(TGID) p.tgid=TGID;
  var q=Object.keys(p).map(function(k){ return k+'='+encodeURIComponent(p[k]); }).join('&');
  return fetch(BASE+'?'+q).then(function(r){ return r.json(); });
}
// ориентацию печати меняем подменой правила @page — иначе браузер печатает как задано в CSS.
// В книжной те же 8 колонок, поэтому вместе с @page включаем более плотную вёрстку (body.port).
function setOrient(v){
  v=(v==='landscape')?'landscape':'portrait';
  document.getElementById('pagecss').textContent='@page{ size:A4 '+v+'; margin:'+(v==='portrait'?'9mm':'10mm')+'; }';
  document.body.className=(v==='portrait')?'port':'land';
  try{ localStorage.setItem('tw_inv_orient',v); }catch(e){}
}
function initOrient(){
  var v='portrait';
  try{ v=localStorage.getItem('tw_inv_orient')||'portrait'; }catch(e){}
  document.getElementById('orient').value=v; setOrient(v);
}
function today(){ var d=new Date(), p=function(n){ return (n<10?'0':'')+n; }; return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear(); }

function boot(){
  msg('загрузка заказов…');
  api({vapi:'batches'}).then(function(r){
    var list=((r&&r.batches)||[]).filter(function(b){ return b.status==='новая'||b.status==='в работе'; });
    if(!list.length){ msg('нет активных заказов', true); return; }
    var pre=qp('batch');
    document.getElementById('ord').innerHTML=list.map(function(b){
      return '<option value="'+esc(b.id)+'"'+(b.id===pre?' selected':'')+'>'+esc(b.num)+(b.name?(' · '+esc(b.name)):'')+'</option>'; }).join('');
    load();
  }).catch(function(){ msg('сеть недоступна', true); });
}
function load(){
  var id=document.getElementById('ord').value; if(!id) return;
  msg('строю ведомость…'); document.getElementById('out').innerHTML='';
  api({vapi:'inventsheet',batch:id,mode:document.getElementById('mode').value}).then(function(r){
    if(!r||!r.ok){ msg((r&&r.error)||'ошибка', true); return; }
    R=r; msg(''); draw();
  }).catch(function(){ msg('сеть недоступна', true); });
}

function draw(){
  if(!R) return;
  var acc=document.getElementById('showAcc').checked;
  var ST=R.stages, SPLIT=ST.indexOf('Покрашено');   // с этой стадии деталь расходится по цветам
  var legend='<div class="legend">'+ST.map(function(s){ return '<b>'+esc(s)+'</b> — '+esc(R.hints[s]||''); }).join(' · ')
    +'<br>Пишите, сколько деталей <b>сейчас физически лежит</b> в этом состоянии — каждую деталь считаем один раз, в самой поздней пройденной стадии. '
    +'Заштрихованная клетка — такой операции у детали нет, писать в неё не нужно. '
    +'<b>Пустая клетка — не считали</b>: в программе останется как есть. Если реально ноль — так и напишите цифру 0.'
    +' Строка с пометкой <b>изделие</b> — само собранное изделие: его не пилят и не красят, физически считают только упакованные коробки.'
    +(R.mode==='detail'?('<br>До покраски деталь одна на все цвета — её считаем в строке детали. '
      +'С покраски она расходится по вариантам, поэтому ниже идут строки по каждому цвету: '
      +'<b>↓</b> — считать в строках ниже, <b>↑</b> — уже посчитано в строке детали.'):'')
    +'</div>';
  var head='<tr><th class="det">Деталь</th><th>Нужно<br>по заказу</th>'
    +ST.map(function(s){ return '<th>'+esc(s)+'</th>'; }).join('')+'<th>Заметка</th></tr>';

  var groups=R.products.map(function(p){
    var title=(R.mode==='detail') ? esc(p.title||p.eq||'Детали заказа')
      : (esc(p.eq)+' · '+esc(p.model)+' <span class="qty">×'+p.ordered+'</span>');
    var rows=p.details.map(function(d){
      var vars=d.variants||[];
      var cells=ST.map(function(s){
        var st=d.stages[s];
        if(!st||!st.has) return '<td class="cell no"></td>';
        // клетка отдана цветам: писать в неё нельзя, считаем в строках ниже
        if(st.split) return '<td class="cell down">↓</td>';
        return '<td class="cell'+(acc?' acc':'')+'">'+(acc?st.ready:'')+'</td>';
      }).join('');
      var head='<tr'+(vars.length?' class="hasv"':'')+'><td class="det">'+esc(d.detail)
        +(d.isProduct?' <span class="pb">изделие</span>':'')
        +(d.shared?' <span class="sh">общая</span>':'')+'</td>'
        +'<td class="n">'+d.need+'</td>'+cells+'<td class="cell"></td></tr>';
      if(!vars.length) return head;
      return head+vars.map(function(v){
        var vc=ST.map(function(s,si){
          var st=v.stages[s];
          // до покраски деталь общая → «↑»; после покраски пусто = такой операции у детали нет → штриховка
          if(!st||!st.has) return (si<SPLIT) ? '<td class="cell up">↑</td>' : '<td class="cell no"></td>';
          return '<td class="cell'+(acc?' acc':'')+'">'+(acc?st.ready:'')+'</td>';
        }).join('');
        return '<tr class="vrow"><td class="det vd">└ '+esc(v.model)+'</td>'
          +'<td class="n">'+v.need+'</td>'+vc+'<td class="cell"></td></tr>';
      }).join('');
    }).join('');
    // общие детали изделия физически считаются в блоке «Общие детали» — здесь только отсылка,
    // иначе кажется, что у изделия деталей нет вовсе
    var refs=(p.refs||[]).length
      ? ('<div class="refs">🧩 общие детали этого изделия — считать в блоке «Общие детали» в конце: '
         +p.refs.map(function(x){ return '<b>'+esc(x.detail)+'</b> ('+x.need+' шт)'; }).join(', ')+'</div>')
      : '';
    return '<div class="grp'+(p.details.length>22?' big':'')+'"><div class="gt">'+title+'</div>'
      +(rows?('<table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table>'):'')+refs+'</div>';
  }).join('');

  document.getElementById('out').innerHTML='<div class="sheet">'
    +'<div class="shead"><div><div class="stitle">Ведомость переучёта деталей</div>'
      +'<div class="sline">заказ <b>'+esc(R.order.num)+'</b>'+(R.order.name?(' · '+esc(R.order.name)):'')
      +(R.order.plan?(' · срок '+esc(R.order.plan)):'')+' · изделий '+R.count.products+', строк '+R.count.details+'</div></div>'
      +'<div class="sline" style="margin-left:auto">дата пересчёта <span class="fill">&nbsp;'+today()+'</span><br>'
      +'считал <span class="fill">&nbsp;</span> · подпись <span class="fill">&nbsp;</span></div></div>'
    +legend+groups
    +'<div class="foot"><span>Пересчёт провёл: ______________________ / ______________</span>'
    +'<span>Проверил (мастер): ______________________ / ______________</span></div>'
    +'</div>';
}

/* ═══ ВКЛАДКИ ═══ */
var TAB='print', INV='', DRAFT=null, UPQ=[], ALLROWS=false;
function tab(t){
  TAB=t;
  ['print','load','hist'].forEach(function(x){ var b=document.getElementById('tb_'+x); if(b) b.className='tb'+(x===t?' on':''); });
  document.getElementById('bar_print').className='bar noprint'+(t==='print'?'':' hide');
  document.getElementById('out').className=(t==='print'?'':'hide');
  document.getElementById('pane_load').className='noprint'+(t==='load'?'':' hide');
  document.getElementById('pane_hist').className='noprint'+(t==='hist'?'':' hide');
  if(t==='load') startInv();
  if(t==='hist') loadHist();
}

/* ═══ ЗАГРУЗКА И СВЕРКА ═══ */
function curOrder(){ return document.getElementById('ord').value; }
function startInv(){
  var box=document.getElementById('pane_load');
  box.innerHTML='<div class="card"><div class="center muted">Готовлю переучёт…</div></div>';
  api({vapi:'invstart',batch:curOrder(),date:today()}).then(function(r){
    if(!r||!r.ok){ box.innerHTML='<div class="card err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    INV=r.invId; loadDraft();
  }).catch(function(){ box.innerHTML='<div class="card err">сеть недоступна</div>'; });
}
function loadDraft(){
  api({vapi:'invdraft',inv:INV}).then(function(r){
    if(!r||!r.ok){ document.getElementById('pane_load').innerHTML='<div class="card err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    DRAFT=r; drawLoad();
  }).catch(function(){});
}
function drawLoad(){
  var box=document.getElementById('pane_load'), d=DRAFT;
  var st=d.stat||{};
  var upl='<div class="card"><div class="row" style="margin-bottom:6px"><b>📷 Страницы переучёта</b>'
    +'<span class="muted">заказ '+esc(d.head.num?('№'+d.head.num):'')+' · загружено файлов: '+(d.head.files||0)+'</span></div>'
    +'<input type="file" id="pages" accept="image/*,application/pdf" multiple onchange="pickPages(this.files)">'
    +'<div class="mini" style="margin-top:5px">Фотографируйте страницы целиком, можно по одной и в любом порядке. '
    +'Незаполненные строки программа пропускает сама.</div>'
    +'<div id="uplbox"></div></div>';
  var rows=(d.rows||[]);
  var body='';
  if(!rows.length) body='<div class="card muted">Пока ничего не распознано — загрузите страницы.</div>';
  else{
    var bad=rows.filter(function(x){ return x.status==='требует решения'; });
    var skip=rows.filter(function(x){ return x.status==='пропущена'; });
    var note=rows.filter(function(x){ return x.status!=='требует решения'&&x.status!=='пропущена'&&(x.flags||[]).length; });
    body='<div class="card"><div class="stat">'
      +'<span class="flag ok">применится: '+(st.apply||0)+'</span>'
      +(bad.length?('<span class="flag bad">разобраться: '+bad.length+'</span>'):'')
      +(skip.length?('<span class="flag">не применится: '+skip.length+'</span>'):'')
      +'<span class="muted">изменит остатки: '+(st.diffs||0)+' из '+(st.total||0)
      +' · прочитано как «'+esc(d.mode==='факт'?'лежит сейчас':'всего прошло')+'»</span></div>'
      +'<button class="pri" onclick="applyInv()">✅ Применить переучёт</button> '
      +'<button class="tb" onclick="ALLROWS=!ALLROWS;drawLoad()">'+(ALLROWS?'скрыть все строки':'показать все '+rows.length+' строк')+'</button> '
      +'<span class="msg" id="apmsg"></span></div>';
    // показываем ТОЛЬКО то, где программа сама решить не может; остальное применяется молча
    if(bad.length) body+='<div class="card"><div style="font-weight:800;color:#c0392b;margin-bottom:4px">⚠ Разобраться</div>'
      +bad.map(rowHtml).join('')+'</div>';
    if(skip.length) body+='<div class="card"><div style="font-weight:800;margin-bottom:4px">Не применится — такой операции у детали нет</div>'
      +'<div class="mini" style="margin-bottom:4px">Скорее всего цифра относится к изделию, а не к детали. Программа её не трогает.</div>'
      +skip.map(function(x){ return '<div class="rowline"><span style="min-width:230px"><b>'+esc(x.detail)+'</b>'
        +(x.model?(' <span class="mini">'+esc(x.model)+'</span>'):'')+'</span>'
        +'<span class="mini" style="min-width:96px">'+esc(x.stage)+'</span><b>'+x.qty+'</b></div>'; }).join('')+'</div>';
    if(note.length) body+='<div class="card"><div style="font-weight:800;margin-bottom:4px">На заметку — применится, но стоит глянуть ('+note.length+')</div>'
      +'<div class="mini">'+note.slice(0,40).map(function(x){ return esc(x.detail)+(x.model?(' · '+esc(x.model)):'')+' · '+esc(x.stage)+' '+x.qty+' <span class="flag">'+esc((x.flags||[]).join(', '))+'</span>'; }).join('<br>')
      +(note.length>40?('<br>…и ещё '+(note.length-40)):'')+'</div></div>';
    if(ALLROWS){
      var byBlock={}, order=[];
      rows.forEach(function(x){ var k=x.eq||'—'; if(!byBlock[k]){ byBlock[k]=[]; order.push(k); } byBlock[k].push(x); });
      body+=order.map(function(k){
        return '<div class="card"><div style="font-weight:800;margin-bottom:4px">'+esc(k)+'</div>'
          +byBlock[k].map(rowHtml).join('')+'</div>';
      }).join('');
    }
  }
  box.innerHTML=upl+body;
}
function rowHtml(x){
  var flags=(x.flags||[]).map(function(f){ return '<span class="flag'+(/недостача|меньше|порядок/.test(f)?' bad':'')+'">'+esc(f)+'</span>'; }).join(' ');
  var was=(x.items||[]).map(function(i){ return i.stockWas; }).join('/');
  var now=(x.items||[]).map(function(i){ return i.stockNew; }).join('/');
  var mode='<select class="qin" style="width:120px" onchange="setRow(\''+esc(x.key)+'\',null,this.value,null)">'
    +'<option value="накопительно"'+(x.mode==='накопительно'?' selected':'')+'>всего прошло</option>'
    +'<option value="факт"'+(x.mode==='факт'?' selected':'')+'>лежит сейчас</option></select>';
  var skip=(x.status==='пропущена');
  return '<div class="rowline">'
    +'<span style="min-width:210px"><b>'+esc(x.detail)+'</b>'+(x.model?(' <span class="mini">'+esc(x.model)+'</span>'):'')+'</span>'
    +'<span style="min-width:96px" class="mini">'+esc(x.stage)+'</span>'
    +'<input class="qin" value="'+(x.qty)+'" onchange="setRow(\''+esc(x.key)+'\',this.value,null,null)">'
    +'<span class="mini">из '+(x.need||0)+' нужно</span>'
    +mode
    +'<span class="mini">остаток '+was+' → <b>'+now+'</b></span>'
    +flags
    +'<button class="tb" onclick="setRow(\''+esc(x.key)+'\',null,null,'+(skip?'0':'1')+')">'+(skip?'вернуть':'пропустить')+'</button>'
    +'</div>';
}
function setRow(key,qty,mode,skip){
  var p={vapi:'invsetrow',inv:INV,key:key};
  if(qty!=null) p.qty=qty;
  if(mode!=null) p.mode=mode;
  if(skip!=null) p.skip=skip;
  api(p).then(function(r){ if(r&&r.ok){ DRAFT=r; drawLoad(); } });
}
function pickPages(files){
  if(!files||!files.length) return;
  for(var i=0;i<files.length;i++) UPQ.push({name:files[i].name, file:files[i], state:'ждёт'});
  drawUpl(); sendNext(0);
  document.getElementById('pages').value='';
}
function drawUpl(){
  var b=document.getElementById('uplbox'); if(!b) return;
  b.innerHTML=UPQ.map(function(u){
    return '<div class="rowline"><span style="min-width:200px">'+esc(u.name)+'</span>'
      +'<span class="mini">'+esc(u.state)+(u.note?(' — '+esc(u.note)):'')+'</span></div>';
  }).join('');
}
// страницы шлём строго по одной: распознавание занимает ~20-40 с, пачкой упрёмся в лимит Apps Script
function sendNext(i){
  if(i>=UPQ.length){ loadDraft(); return; }
  var u=UPQ[i];
  if(u.state==='готово'||u.state==='ошибка'){ sendNext(i+1); return; }
  u.state='отправляю'; drawUpl();
  var fr=new FileReader();
  fr.onload=function(){
    var b64=String(fr.result).split(',')[1]||'';
    apiPost({vapi:'invupload',inv:INV,b64:b64,name:u.name,mime:u.file.type||'image/jpeg'}).then(function(r){
      if(!r||!r.ok){ u.state='ошибка'; u.note=(r&&r.error)||'не сохранился'; drawUpl(); sendNext(i+1); return; }
      u.state='распознаётся'; drawUpl();
      api({vapi:'invrecognize',inv:INV,file:r.fileId}).then(function(q){
        if(q&&q.ok){ u.state='готово'; u.note='клеток '+(q.saved||0)+(q.unknown?(', не найдено строк '+q.unknown):''); }
        else { u.state='ошибка'; u.note=(q&&q.error)||'не распозналось'; }
        drawUpl(); sendNext(i+1);
      }).catch(function(){ u.state='ошибка'; u.note='связь оборвалась'; drawUpl(); sendNext(i+1); });
    }).catch(function(){ u.state='ошибка'; u.note='связь оборвалась'; drawUpl(); sendNext(i+1); });
  };
  fr.onerror=function(){ u.state='ошибка'; u.note='файл не прочитался'; drawUpl(); sendNext(i+1); };
  fr.readAsDataURL(u.file);
}
function applyInv(){
  if(!confirm('Применить переучёт?\n\nИзменятся только начальные остатки заказа. Принятые наряды и ЗП не трогаются.')) return;
  var m=document.getElementById('apmsg'); if(m) m.textContent='применяю…';
  api({vapi:'invapply',inv:INV}).then(function(r){
    if(!r||!r.ok){ if(m) m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    var b=r.before||{}, a=r.after||{};
    if(m) m.innerHTML='<span style="color:#137333">✓ применено строк '+r.applied+'</span>';
    alert('Переучёт применён.\n\n% труда: '+(b.pct||0)+' → '+(a.pct||0)
      +'\nосталось: '+(b.leftRub||0)+' → '+(a.leftRub||0)+' р.'
      +(r.ask?('\n\nОсталось без решения строк: '+r.ask):''));
    INV=''; UPQ=[]; DRAFT=null; startInv();
  }).catch(function(){ if(m) m.innerHTML='<span class="err">сеть</span>'; });
}

/* ═══ ИСТОРИЯ ═══ */
function loadHist(){
  var box=document.getElementById('pane_hist');
  box.innerHTML='<div class="card"><div class="center muted">Загрузка…</div></div>';
  api({vapi:'invhistory',batch:curOrder()}).then(function(r){
    if(!r||!r.ok){ box.innerHTML='<div class="card err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    var l=r.list||[];
    if(!l.length){ box.innerHTML='<div class="card muted">По этому заказу переучётов ещё не было.</div>'; return; }
    box.innerHTML='<div class="card"><div style="font-weight:800;margin-bottom:6px">🕘 Переучёты заказа</div>'
      +l.map(function(x){
        return '<div class="rowline"><span style="min-width:130px"><b>№'+x.num+'</b> '+esc(x.date||x.created)+'</span>'
          +'<span style="min-width:150px" class="mini">считал '+esc(x.counter||'—')+'</span>'
          +'<span class="flag'+(x.status==='применён'?' ok':(x.status==='отменён'?' bad':''))+'">'+esc(x.status)+'</span>'
          +'<span class="mini">строк '+x.rows+' · применено '+x.applied+' · изменило остатки '+x.diffs+'</span>'
          +(x.applier?('<span class="mini">применил '+esc(x.applier)+'</span>'):'')
          +(x.status==='применён'?('<button class="tb" onclick="undoInv(\''+esc(x.id)+'\')">↩ откатить</button>'):'')
          +'</div>';
      }).join('')+'</div>';
  }).catch(function(){ box.innerHTML='<div class="card err">сеть недоступна</div>'; });
}
function undoInv(id){
  if(!confirm('Откатить этот переучёт?\n\nНачальные остатки вернутся к тому, что было до него.')) return;
  api({vapi:'invundo',inv:id}).then(function(r){
    if(!r||!r.ok){ alert((r&&r.error)||'ошибка'); return; }
    alert('Откачено. Возвращено операций: '+r.restored); loadHist();
  });
}
function apiPost(p){
  p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID;
  var b=Object.keys(p).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(p[k]==null?'':p[k]); }).join('&');
  return fetch(BASE,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:b}).then(function(r){ return r.json(); });
}
initOrient(); boot();
</script>
