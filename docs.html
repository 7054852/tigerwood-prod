<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="tw-theme.js"></script>
<script src="tw-config.js"></script>
<title>Тигервуд — входящие документы</title>
<style>
  #cnt{ margin:0 0 var(--s-2); }
  #filters{ margin:0 0 var(--s-4); }
  /* документ — карточкой: в таблице поставщик и номер уезжали за край */
  .doc{ border:1px solid var(--line); border-radius:var(--r-card); background:var(--card); box-shadow:var(--shadow-card); padding:var(--s-3) var(--s-4); margin-bottom:var(--s-2); cursor:pointer; transition:border-color .15s var(--ease); }
  .doc:hover{ border-color:var(--muted); }
  .doc .top{ display:flex; gap:var(--s-2); align-items:center; flex-wrap:wrap; }
  .doc .dt{ font-variant-numeric:tabular-nums; font-weight:600; color:var(--fg2); min-width:88px; }
  .uprow{ display:flex; gap:var(--s-2); align-items:center; padding:var(--s-1) 0; border-bottom:1px solid var(--line); font:var(--t-small); }
  .uprow:last-child{ border-bottom:0 }
  .doc .sup{ font-weight:600; }
  .doc .sub{ color:var(--muted); font:var(--t-small); margin:var(--s-1) 0 0; display:flex; gap:var(--s-3); flex-wrap:wrap; }
  .sum{ margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums; }
  /* модалка позиций: .scrim/.modal темы; .ov.on — открыта */
  .scrim.ov{ display:none; }
  .scrim.ov.on{ display:flex; }
  .lbl{ font:var(--t-label); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:var(--s-4) 0 var(--s-2); }
  .pcard{ border:1px solid var(--line); border-radius:var(--r-ctl); padding:var(--s-3); margin-bottom:var(--s-2); }
  .pcard.done{ background:var(--green-bg); border-color:transparent; }
  .prow{ display:flex; gap:var(--s-2); align-items:center; flex-wrap:wrap; margin-bottom:var(--s-2); }
  .plbl{ font:var(--t-label); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .pcard input,.pcard select{ min-height:var(--h-sm); padding:0 var(--s-2); font:var(--t-small); }
  .pcard input.xs{ width:82px; } .pcard input.s{ width:120px; }
  .pres{ font:var(--t-small); padding-top:var(--s-1); border-top:1px dashed var(--line); }
  /* карточка: файл слева, строки справа; на узком экране — файл сверху */
  #modal.split{ width:min(1560px,97vw); max-width:none; height:94vh; max-height:94vh; display:grid; grid-template-columns:minmax(300px,42%) minmax(0,1fr); gap:var(--s-4); overflow:hidden; }
  #modal.split.one{ grid-template-columns:minmax(0,1fr); width:min(980px,97vw); }
  #modal.split.one .fview{ display:none; }
  #modal.split .fview{ min-height:0; border:1px solid var(--line); border-radius:var(--r-ctl); overflow:auto; background:var(--bg2); }
  #modal.split .fview iframe{ width:100%; height:100%; border:0; display:block; }
  .imgwrap{ cursor:zoom-in; } .imgwrap img{ width:100%; display:block; }
  .imgwrap.zoom{ cursor:zoom-out; } .imgwrap.zoom img{ width:220%; max-width:none; }
  #modal.split .fbody{ min-height:0; overflow:auto; padding-right:var(--s-2); }
  @media (max-width:900px){ #modal.split{ grid-template-columns:minmax(0,1fr); grid-template-rows:34vh minmax(0,1fr); height:96vh; max-height:96vh; } #modal.split.one{ grid-template-rows:minmax(0,1fr); } .dfoot{ position:static; } }
  .dfoot{ position:sticky; bottom:0; background:var(--card); padding:var(--s-3) 0 0; margin-top:var(--s-3); border-top:1px solid var(--line); display:flex; gap:var(--s-2); flex-wrap:wrap; align-items:center; }
  .pnote{ font:var(--t-small); color:var(--muted); margin:calc(-1 * var(--s-1)) 0 var(--s-2); }
  .pnote.warn{ color:var(--amber); font-weight:600; }
  .pcard input.need{ border-color:var(--amber); background:var(--amber-bg); }
  .cand{ text-align:left; white-space:normal; }
  .mres{ border:1px solid var(--line); border-radius:var(--r-ctl); margin:calc(-1 * var(--s-1)) 0 var(--s-2); max-height:260px; overflow:auto; }
  .mres:empty{ display:none; }
  .mrow{ padding:var(--s-2) var(--s-3); cursor:pointer; border-bottom:1px solid var(--line); font:var(--t-small); }
  .mrow:last-child{ border-bottom:0; } .mrow:hover{ background:var(--bg2); }
  .newmat{ background:var(--bg2); border-radius:var(--r-ctl); padding:var(--s-2); margin-bottom:var(--s-2); }
  body.drop::after{ content:'Отпустите файлы — загружу и распознаю'; position:fixed; inset:var(--s-3); border:2px dashed var(--accent); border-radius:var(--r-card); background:var(--card); opacity:.94; display:flex; align-items:center; justify-content:center; font:var(--t-heading); z-index:60; pointer-events:none; }
</style>
</head>
<body>
<div id="twload"><i></i></div>
<div id="twwait"><div class="wb"><div class="sp"></div><div class="wt" id="twwt">Отправляю…</div><div class="wh">идёт обмен с сервером — не нажимайте</div></div></div>
<div class="hi">📑 Входящие документы</div>
<div class="toolbar">
  <span class="muted">с</span><input type="date" id="from" onchange="load()">
  <span class="muted">по</span><input type="date" id="to" onchange="load()">
  <input type="search" class="search" id="q" placeholder="поставщик или № документа…" oninput="draw()">
  <span class="msg" id="smsg"></span>
  <div class="end">
    <button class="sec" onclick="load()">Обновить</button>
    <button class="sec" onclick="scanNow()" title="распознать ближайшие документы прямо сейчас, не дожидаясь фонового прогона">⚡ Распознать сейчас</button>
    <button class="sec" onclick="exportDocs()" title="файл со всеми реквизитами — бухгалтеру останется загрузить его в 1С">⬇️ Выгрузить для 1С</button>
    <button class="sec" onclick="showFixes()" title="что бухгалтер чаще всего исправляет за распознаванием — по этому списку уточняется промпт">📊 Что чаще правят</button>
    <button onclick="document.getElementById('upl').click()" title="накладные, акты, УПД, чеки — сразу несколько файлов">⬆️ Загрузить документы</button>
    <input type="file" id="upl" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.doc,.docx,.xls,.xlsx" style="display:none" onchange="uploadPicked(this.files)">
  </div>
</div>
<div id="uplbox" class="box" style="display:none;margin-bottom:var(--s-3)"></div>
<div class="meta" id="cnt">загрузка…</div>
<div class="chips" id="filters"></div>
<div id="list"><div class="center muted">Загрузка…</div></div>

<div class="scrim ov" id="ov"><div class="modal dlg lg" id="modal"></div></div>

<script>
var BASE=(window.TW_CFG&&TW_CFG.hub)||'https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';   // адрес задаёт tw-config.js; запасной — живой GAS
var APP='tw7prod';
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
try{ if(window.Telegram&&Telegram.WebApp){ var u0=Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user; if(u0) TGID=String(u0.id); } }catch(e){}
if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }
// ⚠ ЛИЧНОСТЬ — ТОКЕНОМ, А НЕ АДРЕСОМ: ?tgid= в ссылке ничего не доказывает (Telegram ID виден
// в списке сотрудников). Токен выдаётся после входа в сервис и лежит в localStorage этого браузера.
function twTok(){ try{ return twQp('tok')||localStorage.getItem('tw_tok')||''; }catch(e){ return twQp('tok')||''; } }
function twQp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
(function(){ var t=twQp('tok'); if(t){ try{ localStorage.setItem('tw_tok',t); }catch(e){} } })();
function twAuthWall(r){
  if(r&&r.needAuth){ document.body.innerHTML='<div style="padding:var(--s-6);font:var(--t-body);color:var(--fg)">'
    +'<div style="font:var(--t-title);margin-bottom:var(--s-3)">🔒 Нужен вход</div>'
    +'<div>'+String(r.error||'Откройте сервис из бота @TWOtchbot или войдите по личному коду.')+'</div></div>'; }
  return r;
}
function api(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}).then(twAuthWall); }
function apiPost(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID; var b=Object.keys(p).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:b}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function $(id){ return document.getElementById(id); }
function money(n){ n=Number(n)||0; return n.toFixed(2).replace('.',','); }
function num(x){ return Number(String(x==null?'':x).replace(',','.'))||0; }

var ROWS=[], STAT={}, CLASSES=[], CLASSMAP={}, SERVICES=[], TYPES=[], FILT='';

function load(quiet){
  if(!quiet) $('list').innerHTML='<div class="center muted">Загрузка…</div>';
  var p={vapi:'docsregistry'};
  var f=$('from').value, t=$('to').value;
  if(f) p.from=f.split('-').reverse().join('.');     // экран даёт ISO, сервер ждёт дд.мм.гггг
  if(t) p.to=t.split('-').reverse().join('.');
  api(p).then(function(r){
    if(!r||!r.ok){ $('list').innerHTML='<div class="center err">'+esc((r&&r.error)||'нет прав')+'</div>'; return; }
    ROWS=r.rows||[]; STAT=r.stat||{}; CLASSES=r.classes||[]; CLASSMAP=r.classMap||{};
    SERVICES=r.services||SERVICES; TYPES=r.types||TYPES; ALERT=r.alertPct||ALERT;
    clearTimeout(window._poll); if(ROWS.some(function(x){ return x.recognizing; })) window._poll=setTimeout(function(){ if(!$('dbody')&&!UPQ.length) load(1); },6000);   // пока идёт распознавание — обновляем сами
    $('filters').innerHTML=[['','все'],['check','🔔 на проверке — '+(STAT.check||0)],['todo','разнести — '+(STAT.todo||0)],['done','разнесённые — '+(STAT.done||0)],['wait','ждут распознавания — '+(STAT.noscan||0)]]
      .map(function(f){ return '<span class="chip'+(FILT===f[0]?' on':'')+'" onclick="setFilt(\''+f[0]+'\')">'+esc(f[1])+'</span>'; }).join('');
    draw();
  }).catch(function(e){ $('list').innerHTML='<div class="center err">Связь оборвалась: '+esc(e.message||e)+'</div>'; });
}
function setFilt(f){ FILT=f; load(); }

function statePill(r){
  if(r.state==='разнесено') return '<span class="pill ok">✓ разнесено</span>';
  if(r.state==='разнести') return '<span class="pill warn">⚠ разнести '+(r.positions-r.placed)+' из '+r.positions+'</span>';
  if(r.state==='не распозналось') return '<span class="pill bad">✗ не распозналось</span>';
  if(r.state==='нет позиций') return '<span class="pill bad">✕ нет позиций</span>';
  return '<span class="pill mute">⏳ ждёт распознавания</span>';
}
function draw(){
  var q=$('q').value.trim().toLowerCase();
  var list=ROWS.filter(function(r){
    if(FILT==='check'&&!r.needCheck) return false;
    if(FILT==='todo'&&r.state!=='разнести') return false;
    if(FILT==='done'&&r.state!=='разнесено') return false;
    if(FILT==='wait'&&r.state!=='ждёт распознавания'&&r.state!=='не распозналось') return false;
    if(q&&(r.sup+' '+r.docNo).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  $('cnt').textContent=list.length+' из '+ROWS.length+' документов · на проверке: '+(STAT.check||0)+' · разнести: '+(STAT.todo||0)+' · ждут распознавания: '+(STAT.noscan||0);
  var need=list.filter(function(r){ return r.needCheck; }), rest=list.filter(function(r){ return !r.needCheck; });
  $('list').innerHTML=
    (need.length? '<div class="note warn"><div><b>🔔 На проверке — '+need.length+'</b>'
        +' проверьте реквизиты и нажмите «Подтвердить», после этого документ уйдёт в общий список</div></div>'
      +need.map(docCard).join('')
      +(rest.length?'<div class="sect">Все документы — '+rest.length+'</div>':'') : '')
    +rest.map(docCard).join('')
    || '<div class="center muted">ничего не найдено</div>';
}
function docCard(r){
  return (function(r){
    var diff=r.diff? ' <span class="pill bad" title="сумма позиций не сходится с суммой документа">Δ '+money(r.diff)+'</span>' : '';
    return '<div class="doc" onclick="openDoc(\''+r.fileId+'\')">'
      +'<div class="top"><span class="dt">'+esc(r.date||'—')+'</span>'
        +'<span class="sup">'+esc(r.sup||'без поставщика')+'</span>'
        +statePill(r)+diff
        +(r.priceUp>=ALERT?'<span class="pill bad" title="цена за нашу единицу выросла против прошлой закупки">⚠ цена +'+qf(r.priceUp)+' %</span>':'')
        +(r.recognizing?'<span class="pill mute">🔍 распознаётся…</span>':'')
        +(r.dup?'<span class="pill bad" title="такой контрагент и номер уже есть">✕ возможно дубль</span>':'')
        +(r.exported?'<span class="pill ok" title="выгружен в 1С '+esc(r.exported)+'">1С ✓</span>':'')
        +'<span class="sum">'+money(r.sum)+' '+esc(r.cur)+'</span></div>'
      +'<div class="sub"><span>'+esc(r.type)+' '+esc(r.docNo)+'</span>'
        +(r.unp?'<span>УНП '+esc(r.unp)+'</span>':'')
        +(r.positions?'<span>позиций: '+r.positions+'</span>':'')
        +'<span style="margin-left:auto">'
          +(r.needCheck?'<a href="javascript:void(0)" onclick="event.stopPropagation();confirmDoc(\''+r.fileId+'\')" title="реквизиты верны — убрать из проверки" style="font-weight:600;color:var(--green)">✓ подтвердить</a> · ':'')
          +'<a href="javascript:void(0)" onclick="event.stopPropagation();delDoc(\''+r.fileId+'\',\''+esc(r.sup||'').replace(/\x27/g,'')+'\')" title="удалить документ">🗑</a></span></div>'
    +'</div>';
  })(r);
}
function confirmDoc(fileId){
  api({vapi:'docconfirm', file:fileId}).then(function(r){
    if(r&&r.ok) load(); else { $('smsg').className='msg err'; $('smsg').textContent=(r&&r.error)||'не вышло'; }
  }).catch(function(){ $('smsg').className='msg err'; $('smsg').textContent='связь оборвалась'; });
}

// ─────────── ЗАГРУЗКА ПАЧКОЙ ───────────
// Сохраняем файлы по одному (быстро), потом по одному распознаём (~30 с каждый).
// Одним запросом всю пачку слать нельзя — не уложится в лимит времени Apps Script.
var UPQ=[];
function uploadPicked(files){
  if(!files||!files.length) return;
  var box=$('uplbox'); box.style.display='';
  UPQ=[];
  for(var i=0;i<files.length;i++) UPQ.push({name:files[i].name, file:files[i], state:'ждёт'});
  drawUpl();
  saveNext(0);
  document.getElementById('upl').value='';   // чтобы можно было выбрать те же файлы снова
}
function drawUpl(){
  var done=UPQ.filter(function(u){return u.state==='готово'||u.state==='ошибка';}).length;
  var rec=UPQ.filter(function(u){return u.state==='распознаётся';}).length;
  $('uplbox').innerHTML='<div style="font-weight:600;padding:var(--s-2) 0">Загрузка: '+done+' из '+UPQ.length
    +(rec?' · распознаётся…':'')+(done===UPQ.length?' <a href="javascript:void(0)" onclick="closeUpl()">скрыть</a>':'')+'</div>'
    +UPQ.map(function(u){
      var ic = u.state==='готово'?'✓' : u.state==='ошибка'?'✗' : u.state==='распознаётся'?'⏳' : u.state==='добавлен'?'✓' : '·';
      var col = u.state==='ошибка'?'var(--red)' : u.state==='готово'?'var(--green)':'var(--muted)';
      return '<div class="uprow"><span style="color:'+col+';font-weight:600">'+ic+'</span>'
        +'<span style="flex:1;min-width:120px">'+esc(u.name)+'</span>'
        +'<span class="muted">'+esc(u.note||u.state)+'</span></div>';
    }).join('');
}
function closeUpl(){ $('uplbox').style.display='none'; UPQ=[]; }
function saveNext(i){
  if(i>=UPQ.length){ recNext(0); return; }
  var u=UPQ[i]; u.state='загружается'; drawUpl();
  var fr=new FileReader();
  fr.onload=function(){
    var b64=String(fr.result).split(',')[1]||'';
    apiPost({vapi:'docuploadfile', b64:b64, name:u.name, mime:u.file.type||''}).then(function(r){
      if(r&&r.ok){ u.state='добавлен'; u.fileId=r.fileId; } else { u.state='ошибка'; u.note=(r&&r.error)||'не сохранился'; }
      drawUpl(); saveNext(i+1);
    }).catch(function(){ u.state='ошибка'; u.note='связь оборвалась'; drawUpl(); saveNext(i+1); });
  };
  fr.onerror=function(){ u.state='ошибка'; u.note='не прочитать файл'; drawUpl(); saveNext(i+1); };
  fr.readAsDataURL(u.file);
}
function recNext(i){
  if(i>=UPQ.length){ load(); return; }
  var u=UPQ[i];
  if(!u.fileId){ recNext(i+1); return; }
  u.state='распознаётся'; drawUpl();
  api({vapi:'docrecognize', file:u.fileId}).then(function(r){
    if(r&&r.ok){ u.state='готово'; u.note='позиций: '+(r.positions||0)+(r.dup?' · ⚠ возможно дубль ('+((r.dupOf||{}).docNo||'')+')':''); }
    else { u.state='ошибка'; u.note=(r&&r.error)||'не распозналось'; }
    drawUpl(); recNext(i+1);
  }).catch(function(){ u.state='ошибка'; u.note='распознавание не ответило — добьёт фоном'; drawUpl(); recNext(i+1); });
}
// удаление — вторым нажатием по той же корзине (confirm в Telegram не работает)
var DEL_ARMED='';
function delDoc(fileId, sup, force){
  var m=$('smsg');
  if(!force&&DEL_ARMED!==fileId){ DEL_ARMED=fileId; m.className='msg err'; m.textContent='Удалить документ «'+sup+'»? Уйдут позиции и закупки по нему, файл — в корзину Диска. Нажмите 🗑 ещё раз.';
    setTimeout(function(){ if(DEL_ARMED===fileId){ DEL_ARMED=''; m.textContent=''; } },7000); return; }
  if(force&&DEL_ARMED!==fileId+'!'){ DEL_ARMED=fileId+'!'; return; }
  DEL_ARMED=''; m.className='msg'; m.textContent='Удаляю…';
  api({vapi:'docdelete', file:fileId, force:force?1:''}).then(function(r){
    if(r&&r.needConfirm){ DEL_ARMED=fileId+'!'; m.className='msg err'; m.innerHTML=esc(r.error)+' <a href="javascript:void(0)" onclick="delDoc(\''+fileId+'\',\'\',1)">Да, удалить</a>'; return; }
    if(r&&r.ok){ m.className='msg ok'; m.textContent='✓ удалён'; load(); } else { m.className='msg err'; m.textContent=(r&&r.error)||'не удалилось'; }
  }).catch(function(){ m.className='msg err'; m.textContent='связь оборвалась'; });
}

function scanNow(){
  var m=$('smsg'); m.className='msg'; m.textContent='Распознаю…'; twSay('Распознаю документ — это до минуты…');
  api({vapi:'docscan', limit:2}).then(function(r){
    if(r&&r.ok){ m.className='msg ok'; m.textContent='✓ разобрано '+r.scanned+', осталось '+r.left; load(); }
    else { m.className='msg err'; m.textContent=(r&&r.error)||'ошибка'; }
  }).catch(function(){ m.className='msg err'; m.textContent='Долгий ответ — распознавание идёт фоном, обновите через минуту'; });
}

// выгрузка для 1С: выбор «только новые / все» — ссылками, без confirm()
function exportDocs(all){
  var m=$('smsg'); m.className='msg';
  if(all===undefined){ m.innerHTML='Выгрузить для 1С разнесённые документы за период: <a href="javascript:void(0)" onclick="exportDocs(0)"><b>только новые</b></a> · <a href="javascript:void(0)" onclick="exportDocs(1)">включая уже выгруженные</a>'; return; }
  m.textContent='Готовлю файл…';

// ─────────── карточка документа (11.11.2026: файл слева, строки справа; материал, листы и цену считает сервер) ───────────

function matByName(name){ var k=String(name||'').trim().toLowerCase();

function findMat(i){

    h+='<input class="xs'+(val===''?' need':'')+'" id="pw'+i+'" type="number" step="1" min="1" inputmode="numeric" value="'+val+'" onchange="saveSheets('+i+')"><b>'+(val===1?'лист':'листов')+'</b>'
      +'<span class="muted">'+(s.size?esc(s.size.replace(/x/i,'×'))+(s.thick?'×'+qf(s.thick):'')+' мм':'размер листа у материала не задан')+'</span></div>';
    if(!s.coef) h+='<div class="pnote warn">Листы не посчитать: у материала не заданы размер листа или толщина. Впишите, сколько листов приехало.</div>';
    else if(val!==''&&!(s.snapped&&val===s.whole)) h+='<div class="pnote">вписано вручную; по расчёту из документа — '+qf(s.exact)+'</div>';
    else if(s.snapped) h+='<div class="pnote">'+(s.exact===s.whole?'по расчёту из документа — ровно '+qf(s.exact):'по расчёту '+qf(s.exact)+' — округлено до целого листа')+'</div>';
    else h+='<div class="pnote warn">⚠ По расчёту '+qf(s.exact)+' листа — не целое. Впишите, сколько листов приехало; если неясно — уточните у директора.</div>';
    return h;
  }
  h+='<span class="plbl">×</span><input class="xs'+(p.coef?'':' need')+'" id="pk'+i+'" value="'+(p.coef?qf(p.coef):'')+'" placeholder="коэф" inputmode="decimal" onchange="savePos('+i+',{coef:num(this.value)})" title="сколько наших единиц в одной единице документа">'
    +'<span>= <b>'+(p.qtyW?qf(p.qtyW):'?')+' '+u+'</b></span></div>';
  if(!p.coef) h+='<div class="pnote warn">В документе «'+esc(p.unit||'?')+'», а учитываем в «'+u+'» — впишите коэффициент: сколько '+u+' в 1 '+esc(p.unit||'ед. документа')+'.</div>';
  return h;
}
function saveSheets(i){
  var v=num($('pw'+i).value);
  if(!isInt(v)){ rowMsg(i,'листы — только целые',1); return; }
  savePos(i,{qtyW:v});
}
// цена за нашу единицу против прошлой закупки (с НДС, в BYN — как в журнале закупок)
function priceBlock(p,m){
  if(!(p.qtyW>0)||!(p.sumGross>0)) return '';
  var u=esc(m?m.unit:'ед'), now=p.sumGross*(Number(DOC.rate)||1)/p.qtyW, c=p.price;
  var h='<div class="prow"><span class="plbl">Цена</span><span><b>'+pf(now)+'</b> за 1 '+u+' <span class="muted">с НДС'+(DOC.cur&&DOC.cur!=='BYN'?', в BYN по курсу документа':'')+'</span></span>';
  if(c&&c.prev>0) h+='<span class="pill '+(c.pct>=ALERT?'bad':c.pct>0?'warn':'mute')+'">'+(c.pct>0?'▲ +':c.pct<0?'▼ ':'= ')+qf(c.pct)+' %</span>'
    +'<span class="muted">прошлая закупка — '+pf(c.prev)+', '+esc(c.prevDate)+(c.sameSup?', тот же поставщик':(', '+esc(c.prevSup||'другой поставщик')))+'</span>';
  else h+='<span class="muted">первая закупка этого материала — сравнить не с чем</span>';
  return h+'</div>';
}
// ЦИФРЫ ТОЖЕ РАСПОЗНАЮТСЯ С ОШИБКАМИ. Они идут в цену прихода и в 1С, поэтому правятся
// здесь и сохраняются сразу — не «потом в журнале закупок», когда уже поздно.
function numEditHtml(p,i){
  var fld=function(id,lbl,val,w){ return '<span class="plbl">'+lbl+'</span>'
    +'<input class="xs" id="'+id+i+'" value="'+esc(val==null?'':String(val))+'" style="width:'+(w||82)+'px">'; };
  return '<div class="prow" style="background:var(--bg2);border-radius:var(--r-ctl);padding:var(--s-2)">'
    +'<span class="plbl">Наименование</span><input id="pn'+i+'" value="'+esc(p.name||'')+'" style="flex:1;min-width:200px">'
    +fld('part','Артикул',p.art,110)
    +'</div><div class="prow" style="background:var(--bg2);border-radius:var(--r-ctl);padding:var(--s-2)">'
    +fld('pq','Кол-во',p.qty)+fld('pu','Ед',p.unit,70)
    +fld('ppn','Цена без НДС',p.priceNet,100)
    +fld('pvp','НДС %',p.vatPct,60)
    +fld('pvs','Сумма НДС',p.vatSum,100)
    +fld('psg','Сумма с НДС',p.sumGross,110)
    +'<button class="sm" onclick="saveNums('+i+')">Сохранить</button>'
    +'<button class="sec sm" onclick="cancelNums('+i+')">Отмена</button></div>';
}
function editNums(i){ EDIT[i]=1; renderDoc(); }
function cancelNums(i){ delete EDIT[i]; renderDoc(); }
function saveNums(i){
  var art=$('part'+i).value;
  savePos(i,{ name:$('pn'+i).value, art:art, qty:$('pq'+i).value, unit:$('pu'+i).value,
    priceNet:$('ppn'+i).value, vatPct:$('pvp'+i).value, vatSum:$('pvs'+i).value, sumGross:$('psg'+i).value },function(){ POS[i].art=art; delete EDIT[i]; });
}
// убрать лишнюю строку: без вопроса — её можно вернуть кнопкой «↩ вернуть»
function skipPos(i){
  var p=POS[i], back=(p.status==='пропущена');
  api({vapi:'docskippos', id:p.id, back:back?1:''}).then(function(r){
    if(r&&r.ok){ POS[i].status=r.status; renderDoc(); } else rowMsg(i,(r&&r.error)||'не вышло',1);
  }).catch(function(){ rowMsg(i,'связь оборвалась',1); });
}
// отмена проведения строки — вторым нажатием: закупка сторнируется
var UNP_ARMED=-1;
function unpostPos(i){
  var b=$('unp'+i);
  if(UNP_ARMED!==i){ UNP_ARMED=i; if(b){ b.textContent='точно отменить? нажмите ещё раз'; b.className='sm danger'; } setTimeout(function(){ if(UNP_ARMED===i){ UNP_ARMED=-1; renderDoc(); } },6000); return; }
  UNP_ARMED=-1; if(b) b.disabled=true;
  api({vapi:'docunpost', id:POS[i].id}).then(function(r){
    if(r&&r.ok){ load(); openDoc(DOC.fileId,true); } else { DMSG={cls:'err',html:esc((r&&r.error)||'не отменилось')}; renderDoc(); }
  }).catch(function(){ DMSG={cls:'err',html:'связь оборвалась'}; renderDoc(); });
}
function setCls(i){ savePos(i,{cls:$('pc_cls'+i).value}); }
// вид услуги сам проставляет статью и счёт: бухгалтеру не надо держать классификатор в голове
function setSvc(i){ var nm=$('pv'+i).value; if(nm) savePos(i,{svc:nm}); }
// акт мобильной связи — это десять строк про одну услугу: проставлять вид каждой отдельно бессмысленно
function svcToAll(i){
  var nm=$('pv'+i).value; if(!nm){ rowMsg(i,'сначала выберите вид услуги',1); return; }
  var todo=[]; for(var k=0;k<POS.length;k++) if(POS[k].status==='новая') todo.push(k);
  (function next(){ if(!todo.length){ renderDoc(); return; } var k=todo.shift();
    apiPost({vapi:'docsetpos', id:POS[k].id, patch:JSON.stringify({cls:'услуга', svc:nm})}).then(function(r){ if(r&&r.ok) mergePos(k,r); next(); }).catch(next); })();
}
// правка шапки — ФОРМОЙ, а не цепочкой prompt'ов: реквизиты идут в 1С,
// и бухгалтер должен видеть их все сразу, а не вспоминать по одному
function editHead(){
  var h=DOC||{};
  var topts=(TYPES.length?TYPES:['ТН','ТТН','Акт','УПД','Инвойс','Счёт','Чек','Прочее']).map(function(t){
    return '<option value="'+esc(t)+'"'+(h.type===t?' selected':'')+'>'+esc(t)+'</option>'; }).join('');
  var f=function(id,lbl,val,w){ return '<div class="prow"><span class="plbl" style="min-width:120px">'+lbl+'</span>'
    +'<input id="'+id+'" value="'+esc(val==null?'':val)+'" style="min-width:'+(w||220)+'px;flex:1"></div>'; };
  $('dbody').innerHTML='<button class="x ic" title="назад к строкам" onclick="renderDoc()">✕</button><h3>Реквизиты документа</h3>'
    +'<div class="muted">Сверяйте с файлом слева. Что поправите — уйдёт в расчёты с поставщиком и в выгрузку для 1С. '
    +'Правка запоминается: повторное распознавание её не затрёт, а сама поправка попадёт в «Что чаще правят».</div>'
    +'<div style="margin-top:var(--s-3)">'
    +f('eh_sup','Поставщик',h.sup)
    +f('eh_unp','УНП',h.unp,140)
    +'<div class="prow"><span class="plbl" style="min-width:120px">Тип документа</span><select id="eh_type">'+topts+'</select></div>'
    +f('eh_no','№ документа',h.docNo,180)
    +f('eh_date','Дата (дд.мм.гггг)',fmtD(h.date||''),140)
    +f('eh_dog','Договор/основание',h.dogovor)
    +f('eh_cur','Валюта',h.cur||'BYN',90)
    +f('eh_sum','Сумма с НДС',h.sumGross,140)
    +'</div>'
    +'<div style="margin-top:12px"><button onclick="saveHead()">Сохранить</button> '
    +'<button class="sec" onclick="renderDoc()">Отмена</button> <span class="msg" id="ehmsg"></span></div>';
}
function saveHead(){
  var h=DOC||{}, m=$('ehmsg'); m.className='msg'; m.textContent='Сохраняю…'; twSay('Сохраняю реквизиты…');
  var patch={ sup:$('eh_sup').value, unp:$('eh_unp').value, type:$('eh_type').value, docNo:$('eh_no').value,
              date:$('eh_date').value, dogovor:$('eh_dog').value, cur:$('eh_cur').value, sumGross:$('eh_sum').value };
  apiPost({vapi:'docsethead', file:h.fileId, patch:JSON.stringify(patch)}).then(function(r){
    if(r&&r.ok){ openDoc(h.fileId,true); load(); } else { m.className='msg err'; m.textContent=(r&&r.error)||'не сохранилось'; }
  }).catch(function(){ m.className='msg err'; m.textContent='связь оборвалась'; });
}
// что чаще всего правят за распознаванием — это и есть список того, что надо уточнить в промпте
function showFixes(){
  $('ov').className='scrim ov on'; $('modal').className='modal dlg lg'; $('modal').innerHTML='<div class="center muted">Считаю правки…</div>';
  api({vapi:'docfixes', limit:40}).then(function(r){
    if(!r||!r.ok){ $('modal').innerHTML='<button class="x ic" onclick="closeOv()">✕</button><div class="err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    var top=(r.byField||[]).map(function(x){ return '<div class="uprow"><span style="flex:1">'+esc(x.field)+'</span><b>'+x.n+'</b></div>'; }).join('')
      || '<div class="muted" style="padding:8px 0">правок пока нет — распознавание никто не исправлял</div>';
    var last=(r.last||[]).map(function(x){
      return '<div class="uprow"><span class="muted" style="min-width:88px">'+esc(x.when)+'</span>'
        +'<span style="flex:1;min-width:150px"><b>'+esc(x.field)+'</b> <span class="muted">'+esc(x.scope)+'</span></span>'
        +'<span style="flex:1;min-width:150px"><span class="muted">было:</span> '+esc(x.was||'—')+' → <b>'+esc(x.became||'—')+'</b></span></div>'; }).join('');
    $('modal').innerHTML='<button class="x ic" onclick="closeOv()">✕</button><h3>📊 Что чаще правят</h3>'
      +'<div class="muted">Всего правок: '+r.total+'. Каждая — это место, где распознавание ошибается. '
      +'По этому списку уточняется промпт, чтобы вручную править приходилось всё реже.</div>'
      +'<div class="lbl">По полям</div><div class="box">'+top+'</div>'
      +(last?('<div class="lbl">Последние правки</div><div class="box">'+last+'</div>'):'');
  }).catch(function(){ $('modal').innerHTML='<button class="x ic" onclick="closeOv()">✕</button><div class="err">связь оборвалась</div>'; });
}
function confirmFromCard(){
  api({vapi:'docconfirm', file:DOC.fileId}).then(function(r){
    if(r&&r.ok){ DOC.status=r.status; renderDoc(); load(); } else { DMSG={cls:'err',html:esc((r&&r.error)||'не вышло')}; renderDoc(); }
  }).catch(function(){ DMSG={cls:'err',html:'связь оборвалась'}; renderDoc(); });
}
// провести: строки уже сохранены на сервере (материал, количество, статья) — отправляем то, что на экране
function commitDoc(){
  var m=$('dmsg'), b=$('commitBtn'); m.className='msg';
  var lines=[]; POS.forEach(function(p){ if(p.status==='новая') lines.push({ id:p.id, cls:p.cls||'', mat:p.mat||'', coef:p.coef||0, qty:p.qty, statya:p.statya||'', acct:p.acct||'' }); });
  if(!lines.length){ m.textContent='все строки уже разнесены'; return; }
  var noCls=lines.filter(function(l){ return !l.cls; }).length;
  if(noCls){ m.className='msg err'; m.textContent='Не выбрано «что это» у строк: '+noCls; return; }
  if(b) b.disabled=true; m.textContent='Провожу…'; twSay('Провожу документ…');
  apiPost({vapi:'doccommit', file:DOC.fileId, lines:JSON.stringify(lines)}).then(function(r){
    if(b) b.disabled=false;
    if(!r||!r.ok){ m.className='msg err'; m.textContent='Ошибка: '+((r&&r.error)||'?'); return; }
    var bad=r.failed||[];
    DMSG={ cls:bad.length?'err':'ok', html:'✓ проведено строк: '+r.placed+(bad.length?(' · не прошло '+bad.length+':<br>'+bad.map(function(f){ return '• '+esc(f.name)+' — '+esc(f.error); }).join('<br>')):'') };
    load(); openDoc(DOC.fileId,true);
  }).catch(function(){ if(b) b.disabled=false; m.className='msg err'; m.textContent='Связь оборвалась — откройте документ заново и проверьте, что провелось'; });
}

// период по умолчанию — последние 90 дней
(function(){
  var t=new Date(), f=new Date(t.getTime()-90*86400000);
  var iso=function(d){ return d.toISOString().slice(0,10); };
  $('from').value=iso(f); $('to').value=iso(t);
})();

// ─────── ПОКАЗЫВАЕМ, ЧТО ИДЁТ РАБОТА ───────
// Каждый вызов Apps Script — это 3-6 секунд. Без видимого признака человек считает, что
// кнопка не сработала, и жмёт снова: так рождались дубли нарядов и «то одобряет, то нет».
// Полоска сверху — на любой запрос; заслонка «не нажимайте» — только на действие,
// которое человек начал сам (нажал кнопку), чтобы фоновое обновление не мешало работать.
var TWL=0, TWCLICK=0;
var TWTMR=0;
function twLoadOn(wait){
  TWL++;
  var b=document.getElementById('twload'); if(b) b.style.display='block';
  if(wait){
    var w=document.getElementById('twwait'); if(w) w.style.display='flex';
    // ПРЕДОХРАНИТЕЛЬ: если ответ не пришёл (сеть в цеху пропала), заслонка не должна
    // запереть экран навсегда — через 30 с она превращается в понятное сообщение и снимается пальцем.
    clearTimeout(TWTMR);
    TWTMR=setTimeout(function(){
      var h=document.getElementById('twwt'); if(h) h.textContent='Ответа всё нет';
      var s=document.querySelector('#twwait .wh'); if(s) s.textContent='связь медленная — нажмите, чтобы закрыть и попробовать снова';
      var ww=document.getElementById('twwait'); if(ww) ww.onclick=function(){ TWL=0; twLoadOff(); };
    },30000);
  }
}
function twLoadOff(){
  TWL=Math.max(0,TWL-1); if(TWL) return;
  clearTimeout(TWTMR);
  var b=document.getElementById('twload'); if(b) b.style.display='none';
  var w=document.getElementById('twwait');
  if(w){ w.style.display='none'; w.onclick=null; }
  var s=document.querySelector('#twwait .wh'); if(s) s.textContent='идёт обмен с сервером — не нажимайте';
}
function twSay(t){ var e=document.getElementById('twwt'); if(e&&t) e.textContent=t; }
// нажатие человека «взводит» заслонку для ближайшего запроса (20 с — на случай prompt по дороге)
document.addEventListener('click',function(e){
  var n=e.target;
  while(n&&n!==document.body){ if(n.tagName==='BUTTON'||n.tagName==='A'){ TWCLICK=Date.now(); return; } n=n.parentNode; }
},true);
(function(){
  var _api=(typeof api==='function')?api:null, _post=(typeof apiPost==='function')?apiPost:null;
  var wrap=function(fn){ return function(p){
    var mine=(TWCLICK && (Date.now()-TWCLICK)<20000); if(mine) TWCLICK=0;
    twLoadOn(mine);
    return fn(p).then(function(r){ twLoadOff(); return r; }, function(e){ twLoadOff(); throw e; });
  }; };
  if(_api) api=wrap(_api);
  if(_post) apiPost=wrap(_post);
})();

// файлы можно бросить прямо на страницу
document.addEventListener('dragover',function(e){ if(e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')>=0){ e.preventDefault(); document.body.classList.add('drop'); } });
document.addEventListener('dragleave',function(e){ if(!e.relatedTarget) document.body.classList.remove('drop'); });
document.addEventListener('drop',function(e){ document.body.classList.remove('drop'); if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){ e.preventDefault(); if(!$('dbody')) uploadPicked(e.dataTransfer.files); } });

load();
window.addEventListener('message',function(e){ if(e&&e.data&&e.data.tw==='refresh') 
load(); });
</script>
