<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигервуд — начальник производства</title>
<script src="tw-theme.js"></script>
<style>
  /* месяц — крупные плитки на утопленном лотке */
  .month{ background:var(--bg2); border:1px solid var(--line); border-radius:var(--r-card); padding:var(--s-4); }
  .mrow{ display:flex; gap:var(--s-3); flex-wrap:wrap; align-items:stretch; }
  .mrow .tile{ flex:1 1 130px; }
  .tile .v.big{ color:var(--green); }
  /* карточка заказа */
  .ocard{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); margin-bottom:var(--s-3); box-shadow:var(--shadow-card); overflow:hidden; }
  .ohead{ display:flex; align-items:center; gap:var(--s-3); padding:var(--s-3) var(--s-4); cursor:pointer; flex-wrap:wrap; }
  .ohead:hover{ background:var(--card2); }
  .onum{ font-weight:600; } .oname{ font-weight:500; flex:1; min-width:100px; }
  .money{ font-weight:600; }
  .car{ color:var(--muted); font:var(--t-small); width:12px; transition:transform .15s var(--ease); }
  .ocard.open .car{ transform:rotate(90deg); }
  .obody{ display:none; padding:0 var(--s-4) var(--s-3); } .ocard.open .obody{ display:block; }
  .ohead .bar{ min-width:70px; flex:1; max-width:160px; }
  .kpis{ display:flex; gap:var(--s-2); flex-wrap:wrap; align-items:center; margin:var(--s-2) 0 var(--s-1); }
  .kpis .kpi{ display:inline-flex; align-items:center; gap:var(--s-1); min-height:22px; padding:0 var(--s-2); font:var(--t-small); color:var(--fg2);
              background:var(--grey-bg); border-radius:var(--r-pill); font-variant-numeric:tabular-nums; }
  .kpis .kpi b{ color:var(--fg); }
  .obody table{ margin-top:var(--s-2); }
  .obody td{ white-space:nowrap; }
  .rin{ width:64px; text-align:right; font-variant-numeric:tabular-nums; }
  .rreset{ margin-left:var(--s-1); }
</style>
</head>
<body class="w-narrow">
<div id="twload"><i></i></div>
<div id="twwait"><div class="wb"><div class="sp"></div><div class="wt" id="twwt">Отправляю…</div><div class="wh">идёт обмен с сервером — не нажимайте</div></div></div>
<div class="hi">🏭 Начальник производства</div>
<div class="muted sub0">Оклад + мотивация за упакованные изделия. Ставки задаёт директор.</div>
<div id="app"><div class="center">Загрузка…</div></div>
<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod';
// ⚠ ЛИЧНОСТЬ — ТОКЕНОМ, А НЕ АДРЕСОМ: ?tgid= в ссылке ничего не доказывает (Telegram ID виден
// в списке сотрудников). Токен выдаётся после входа в сервис и лежит в localStorage этого браузера.
function twTok(){ try{ return twQp('tok')||localStorage.getItem('tw_tok')||''; }catch(e){ return twQp('tok')||''; } }
function twQp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
(function(){ var t=twQp('tok'); if(t){ try{ localStorage.setItem('tw_tok',t); }catch(e){} } })();
function twAuthWall(r){
  if(r&&r.needAuth){ document.body.innerHTML='<div style="padding:var(--s-6);font:var(--t-body);color:var(--fg)">'
    +'<div style="font:var(--t-title);margin-bottom:var(--s-3)">🔒 Нужен вход</div>'
    +'<div>'+String(r.error||'Откройте сервис из бота @TWOtchbot или войдите по личному коду.')+'</div></div>'; }
  return r;
}
function api(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; if(typeof TGID!=='undefined'&&TGID&&!p.tgid) p.tgid=TGID; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}).then(twAuthWall); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function money(n){ return (Number(n)||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }
var ORDERS=[], MO={}, DIR=false, OPEN={};   // DIR=директор/админ (может менять ставки); OPEN — какие заказы раскрыты

function load(){
  Promise.all([ api({vapi:'bossmonth'}), api({vapi:'bossorders'}), TGID?api({vapi:'me',tgid:TGID}):Promise.resolve(null) ]).then(function(r){
    MO=r[0]||{}; ORDERS=(r[1]||{}).orders||[];
    var me=r[2]; DIR=!!(me&&me.ok&&(me.role==='директор'||me.role==='админ'));
    render();
  }).catch(function(e){ $('app').innerHTML='<div class="center">Сеть недоступна</div>'; });
}
function render(){
  var app=$('app'), mo=MO;
  var month='<div class="sect">Этот месяц ('+esc(mo.month||'')+')'+(DIR?' — начальник производства':'')+'</div>'
    +'<div class="month"><div class="mrow">'
    +'<div class="tile"><div class="t">Оклад</div><div class="v">'+money(mo.salary)+' <small>р</small></div></div>'
    +'<div class="tile"><div class="t">Мотивация за упаковку</div><div class="v big">'+money(mo.motivation)+' <small>р</small></div></div>'
    +'<div class="tile"><div class="t">Итого за месяц</div><div class="v">'+money(mo.total)+' <small>р</small></div></div>'
    +'<div class="tile"><div class="t">Упаковано изделий</div><div class="v">'+(mo.packed||0)+'</div></div>'
    +'</div>'
    +(mo.packedNoVariant? '<div class="muted" style="margin-top:var(--s-2)">⚠ '+mo.packedNoVariant+' шт упаковки без указанного варианта — мастер не проставил изделие, мотивация по ним не начислена.</div>':'')
    +'</div>';
  var pot=ORDERS.reduce(function(s,o){return s+(o.potential||0);},0);
  var earn=ORDERS.reduce(function(s,o){return s+(o.earned||0);},0);
  var hint=DIR? 'ставки ₽/шт можно менять — базовая берётся из справочника' : 'потенциал '+money(pot)+' · заработано '+money(earn)+' р';
  var orders='<div class="sect">'+(DIR?'Заказы — ставки и деньги начальника':'Заказы в работе — деньги для меня')+' <span class="n muted">'+hint+'</span></div>'
    +(DIR? '<div style="margin:0 0 var(--s-3)"><button class="sec" onclick="recalcRates()" title="пересчитать базовые ставки от текущего труда изделий">↻ Пересчитать ставки от труда</button> <span class="msg" id="rrMsg"></span></div>' : '')
    +(ORDERS.length? ORDERS.map(orderCard).join('') : '<div class="box muted">активных заказов нет</div>');
  app.innerHTML=month+orders;
  Object.keys(OPEN).forEach(function(id){ if(OPEN[id]){ var c=$('oc_'+id); if(c) c.classList.add('open'); } });
}
function riskPill(k){
  if(!k.deadline) return '<span class="pill mute">срок не задан</span>';
  if(k.risk==='late') return '<span class="pill bad">🔴 не успеваем</span>';
  if(k.risk==='tight') return '<span class="pill warn">🟡 впритык</span>';
  if(k.risk==='done') return '<span class="pill ok">✔ готов</span>';
  return '<span class="pill ok">🟢 в срок ('+esc(k.deadline)+')</span>';
}
function rateCell(o,p){
  if(DIR){
    var reset = p.overridden ? ' <button class="rreset ic" title="вернуть к расчётной ('+p.base+' ₽/шт)" onclick="resetRate(\''+esc(o.id)+'\',\''+esc(p.sku)+'\',this)">↩</button>' : '';
    return '<td class="num" style="white-space:nowrap"><input class="rin" value="'+p.rate+'" inputmode="decimal" title="ставка ₽/шт (расчётная '+p.base+')" onchange="saveRate(\''+esc(o.id)+'\',\''+esc(p.sku)+'\',this.value,this)">'+reset+'</td>';
  }
  return '<td class="num">'+p.rate+'</td>';   // начальник: только число, без индикатора правки
}
function orderCard(o,i){
  var k=o.kpi||{}, pct=Math.min(100,k.pct||0);
  var rows=(o.products||[]).map(function(p){
    return '<tr><td>'+esc(p.model||p.eq)+'</td>'
      +rateCell(o,p)
      +'<td class="num">'+p.packed+'/'+p.ordered+'</td>'
      +'<td class="num">'+money(p.earned)+'</td>'
      +'<td class="num">'+money(p.potential)+'</td></tr>';
  }).join('');
  return '<div class="ocard" id="oc_'+esc(o.id)+'">'
    +'<div class="ohead" onclick="tog(\''+esc(o.id)+'\')">'
      +'<span class="car">▸</span>'
      +'<span class="onum">'+esc(o.num)+'</span><span class="oname">'+esc(o.name)+'</span>'
      +'<span class="bar"><i style="width:'+pct+'%'+(pct>=100?';background:var(--green)':'')+'"></i></span>'
      +'<span class="money">'+money(o.earned)+' / '+money(o.potential)+' р</span>'
    +'</div>'
    +'<div class="obody">'
      +'<div class="kpis">'
        +'<span class="kpi">Готовность <b>'+(k.pct||0)+'%</b></span>'
        +'<span class="kpi">Упаковано <b>'+k.packedUnits+'/'+k.totalUnits+'</b></span>'
        +'<span class="kpi">'+(DIR?'Начислено':'Заработано')+' <b>'+money(o.earned)+' р</b> из '+money(o.potential)+'</span>'
        +riskPill(k)
        +(k.checksTotal? '<span class="pill bad">✕ нестыковок: '+k.checksTotal+'</span>':'<span class="pill ok">✓ данные чисты</span>')
      +'</div>'
      +'<div class="kpis"><span class="muted">Бонусы:</span>'
        +'<span class="pill '+(k.bonusSrok==='ок'?'ok':(k.bonusSrok==='риск'?'bad':'mute'))+'">'+(k.bonusSrok==='ок'?'✓ ':(k.bonusSrok==='риск'?'✕ ':''))+'срок: '+esc(k.bonusSrok)+'</span>'
        +'<span class="pill '+(k.bonusEcon==='ок'?'ok':'bad')+'">'+(k.bonusEcon==='ок'?'✓ ':'✕ ')+'экономия: '+esc(k.bonusEcon)+'</span>'
      +'</div>'
      +'<div class="tbwrap"><table><thead><tr><th>Изделие</th><th class="num">Ставка ₽/шт</th><th class="num">Упаковано</th><th class="num">'+(DIR?'Начислено':'Заработано')+'</th><th class="num">Потенциал</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'</div></div>';
}
function tog(id){ var c=$('oc_'+id); if(c){ var open=c.classList.toggle('open'); OPEN[id]=open; } }
function recalcRates(){
  var m=$('rrMsg'); if(m) m.textContent='пересчитываю…';
  api({vapi:'recalcbossrates'}).then(function(r){
    if(r&&r.ok){ if(m) m.innerHTML='<span class="ok">обновлено ставок: '+(r.changedCount||0)+'</span>'; load(); }
    else if(m) m.innerHTML='<span class="err">'+((r&&r.error)||'ошибка')+'</span>';
  }).catch(function(){ if(m) m.innerHTML='<span class="err">сеть</span>'; });
}
function saveRate(orderId,sku,val,el){
  var v=String(val).trim().replace(',','.'); if(el) el.disabled=true;
  OPEN[orderId]=true;
  api({vapi:'setbossorderrate',batch:orderId,sku:sku,rate:v}).then(function(r){
    if(r&&r.ok){ load(); } else { if(el) el.disabled=false; alert((r&&r.error)||'не сохранилось'); }
  }).catch(function(){ if(el) el.disabled=false; alert('сеть недоступна'); });
}
// вернуть расценку к расчётной (пустая ставка → бэкенд ставит базовую 10% труда)
function resetRate(orderId,sku,el){
  if(el) el.disabled=true; OPEN[orderId]=true;
  api({vapi:'setbossorderrate',batch:orderId,sku:sku,rate:''}).then(function(r){
    if(r&&r.ok){ load(); } else { if(el) el.disabled=false; alert((r&&r.error)||'не сбросилось'); }
  }).catch(function(){ if(el) el.disabled=false; alert('сеть недоступна'); });
}
load();

// авто-обновление: оболочка шлёт «refresh» при возврате на раздел — перечитываем данные без перезагрузки страницы
(function(){
  try{ var m=/[?&]twsec=([^&]+)/.exec(location.search); window.top.postMessage({tw:'hello',sec:m?decodeURIComponent(m[1]):''},'*'); }catch(e){}
  window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='refresh'){ try{ load(); }catch(err){} } });
})();

// ─────── ПОКАЗЫВАЕМ, ЧТО ИДЁТ РАБОТА ───────
// Каждый вызов Apps Script — это 3-6 секунд. Без видимого признака человек считает, что
// кнопка не сработала, и жмёт снова: так рождались дубли нарядов и «то одобряет, то нет».
// Полоска сверху — на любой запрос; заслонка «не нажимайте» — только на действие,
// которое человек начал сам (нажал кнопку), чтобы фоновое обновление не мешало работать.
var TWL=0, TWCLICK=0;
var TWTMR=0;
function twLoadOn(wait){
  TWL++;
  var b=document.getElementById('twload'); if(b) b.style.display='block';
  if(wait){
    var w=document.getElementById('twwait'); if(w) w.style.display='flex';
    // ПРЕДОХРАНИТЕЛЬ: если ответ не пришёл (сеть в цеху пропала), заслонка не должна
    // запереть экран навсегда — через 30 с она превращается в понятное сообщение и снимается пальцем.
    clearTimeout(TWTMR);
    TWTMR=setTimeout(function(){
      var h=document.getElementById('twwt'); if(h) h.textContent='Ответа всё нет';
      var s=document.querySelector('#twwait .wh'); if(s) s.textContent='связь медленная — нажмите, чтобы закрыть и попробовать снова';
      var ww=document.getElementById('twwait'); if(ww) ww.onclick=function(){ TWL=0; twLoadOff(); };
    },30000);
  }
}
function twLoadOff(){
  TWL=Math.max(0,TWL-1); if(TWL) return;
  clearTimeout(TWTMR);
  var b=document.getElementById('twload'); if(b) b.style.display='none';
  var w=document.getElementById('twwait');
  if(w){ w.style.display='none'; w.onclick=null; }
  var s=document.querySelector('#twwait .wh'); if(s) s.textContent='идёт обмен с сервером — не нажимайте';
}
function twSay(t){ var e=document.getElementById('twwt'); if(e&&t) e.textContent=t; }
// нажатие человека «взводит» заслонку для ближайшего запроса (20 с — на случай prompt по дороге)
document.addEventListener('click',function(e){
  var n=e.target;
  while(n&&n!==document.body){ if(n.tagName==='BUTTON'||n.tagName==='A'){ TWCLICK=Date.now(); return; } n=n.parentNode; }
},true);
(function(){
  var _api=(typeof api==='function')?api:null, _post=(typeof apiPost==='function')?apiPost:null;
  var wrap=function(fn){ return function(p){
    var mine=(TWCLICK && (Date.now()-TWCLICK)<20000); if(mine) TWCLICK=0;
    twLoadOn(mine);
    return fn(p).then(function(r){ twLoadOff(); return r; }, function(e){ twLoadOff(); throw e; });
  }; };
  if(_api) api=wrap(_api);
  if(_post) apiPost=wrap(_post);
})();
</script>
</body>
</html>
