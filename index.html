<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигервуд — сервис</title>
<script>
// единый сервис переехал в app.html — сохраняем параметры входа (tgid) и хеш-маршрут
// ⚠ Telegram на Android кеширует страницу надолго: без метки человек открывает вчерашнюю
// версию и не видит исправлений. Метка меняется раз в час — кеш живёт, но не залипает.
var d=new Date(), st=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+('0'+d.getHours()).slice(-2);
var q=location.search ? location.search+'&_='+st : '?_='+st;
location.replace('app.html' + q + location.hash);
</script>
</head>
<body>
<p style="font-family:-apple-system,Arial,sans-serif;padding:24px">Открываю сервис… <a href="app.html">Продолжить</a></p>
</body>
</html>
