function spPick(i){
  var x=SP.rows[i]; if(!x) return; SP.cur=i; if(!MODELS.length) loadModels();
  spDlg().innerHTML='<h3>Какой это товар из каталога?</h3>'
    +'<div style="margin-bottom:var(--s-2)">Сделка '+esc(x.num||'')+': '+(x.empty?'<b>в продаже не указано изделие</b>':'«'+esc(x.text)+'»')+'</div>'
    +'<div class="muted" style="margin-bottom:var(--s-3)">'+(x.empty?'Выбор относится только к этой продаже.':'Выбор запомнится: продажи с той же формулировкой сопоставятся сами.')+'</div>'
    +'<input id="spQ" type="search" placeholder="Поиск: оборудование, модель, артикул…" style="width:100%" oninput="spList()" autocomplete="off">'
    +'<div id="spL" style="margin-top:var(--s-3)"></div>'
    +'<div class="row" style="margin-top:var(--s-4);gap:var(--s-2);justify-content:space-between"><button class="sec" onclick="spRender()">← Назад</button>'
    +'<button class="sec" onclick="spNew()">＋ Завести карточку</button></div>';
  spList();
}
function spItemHtml(m){ return '<div class="row" style="justify-content:space-between;gap:var(--s-2);padding:var(--s-2) 0;border-bottom:1px solid var(--line)"><div>'+spProd(m)
  +([m.size,m.color].filter(Boolean).length?' <span class="muted">'+esc([m.size,m.color].filter(Boolean).join(' '))+'</span>':'')+'</div>'
  +'<button class="sm" data-sku="'+esc(m.sku)+'" onclick="spLink(this.getAttribute(\'data-sku\'))">Выбрать</button></div>'; }
function spList(){
  var x=SP.rows[SP.cur], el=$('spL'); if(!x||!el) return;
  var q=String(($('spQ')||{}).value||'').toLowerCase().replace(/ё/g,'е').split(/\s+/).filter(Boolean);
  var sugg=q.length?[]:(x.candidates||[]);
  var hit=q.length?MODELS.filter(function(m){ if(!m.sku) return false; var s=[m.sku,m.equip,m.model,m.kit,m.name,m.size,m.color].join(' ').toLowerCase().replace(/ё/g,'е');
    return q.every(function(w){ return s.indexOf(w)>=0; }); }).slice(0,40):[];
  el.innerHTML=(sugg.length?'<div class="muted">Похожие</div>'+sugg.map(spItemHtml).join(''):'')
    +(q.length?(hit.length?hit.map(spItemHtml).join(''):'<div class="muted">Ничего не нашлось. Если такого товара нет — «Завести карточку».</div>')
      :(!sugg.length?'<div class="muted">Начните вводить название или артикул.</div>':''));
}
function spLink(sku){
  var x=SP.rows[SP.cur]; if(!x||SP.busy) return; SP.busy=true;
  api({vapi:'salelink', item:x.item, sku:sku}).then(function(r){
    SP.busy=false;
    if(!r||!r.ok){ alert((r&&r.error)||'не удалось привязать'); return; }
    planPreview();
  }).catch(function(e){ SP.busy=false; alert('Ошибка: '+(e.message||e)); });
}
function spNew(){
  var x=SP.rows[SP.cur]; if(!x) return;
  var parts=x.empty?[]:String(x.text||'').split(' · ').filter(function(p){ return p.replace(/[-\s]/g,''); }), eq=parts[0]||'', mo=parts.slice(1).join(' · ');
  var f=function(id,label,v){ return '<label style="display:block;margin-bottom:var(--s-2)"><span class="muted">'+label+'</span><input id="'+id+'" value="'+esc(v)+'" style="width:100%" autocomplete="off"></label>'; };
  spDlg().innerHTML='<h3>Новая карточка товара</h3>'
    +'<div class="note warn" style="margin-bottom:var(--s-3)">У нового товара нет состава — операции и готовность появятся, когда заполните состав в «Каталоге изделий».</div>'
    +f('spSku','Артикул (обязательно)','')+f('spEq','Оборудование',eq)+f('spMo','Модель',mo)+f('spKit','Комплектация','')
    +'<div id="spErr" class="err"></div>'
    +'<div class="row" style="margin-top:var(--s-4);gap:var(--s-2);justify-content:space-between"><button class="sec" onclick="spPick(SP.cur)">← Назад</button>'
    +'<button id="spSave" onclick="spCreate()">Завести и выбрать</button></div>';
  var s=$('spSku'); if(s) s.focus();
}
function spCreate(){
  if(SP.busy) return;
  var v=function(id){ return String(($(id)||{}).value||'').trim(); }, sku=v('spSku');
  if(!sku||!v('spEq')||!v('spMo')){ $('spErr').textContent='Нужны артикул, оборудование и модель'; return; }
  SP.busy=true; $('spSave').disabled=true;
  api({vapi:'productsave', data:JSON.stringify({sku:sku, equip:v('spEq'), model:v('spMo'), kit:v('spKit')})}).then(function(r){
    SP.busy=false;
    if(!r||!r.ok){ $('spErr').textContent=(r&&r.error)||'не удалось завести карточку'; $('spSave').disabled=false; return; }
    MODELS=[]; loadModels(); spLink(r.sku||sku);
  }).catch(function(e){ SP.busy=false; $('spErr').textContent='Ошибка: '+(e.message||e); $('spSave').disabled=false; });
}
function saveTarget(i){
  var n=NEEDS[i], v=$('tg'+i).value;
  api({vapi:'settarget', sku:n.sku||'', target:v, min:'', eq:n.equip||'', mod:n.model||''}).then(function(){ load(); });
}
function setStatus(id,st){ api({vapi:'setbstatus', batch:id, status:st}).then(function(){ if(VIEW==='detail') reloadDetail(); else load(); }); }
function togglePrio(id,on){ api({vapi:'setprio', batch:id, prio:on?'срочно':'обычный'}).then(function(){ if(VIEW==='detail') reloadDetail(); else load(); }); }
function saveDone(id,sku,mod,v){
  var m=$('bm_'+id); if(m) m.textContent='…';
  api({vapi:'batchdone', batch:id, sku:sku, mod:mod, done:v}).then(function(r){
    if(m) m.innerHTML=(r&&r.ok)?'<span class="ok">✓ на склад</span>':'<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; setTimeout(reloadDetail,700);
  });
}
// заказ по счёту на оплату (11.10.2026): позиции сделки счёта → новый заказ, сделка «в производстве»
function newBatchFromInvoice(){ var no=prompt('Номер счёта на оплату (например 20261001, R20261001, P20261001):',''); if(no===null||!no.trim()) return; api({vapi:'orderfrominvoice', invoice:no.trim()}).then(function(r){ if(r&&r.ok){ if(r.skipped&&r.skipped.length) alert('Без товара каталога, в заказ не вошли: '+r.skipped.join(', ')); openOrder(r.batchId); } else alert('Ошибка: '+((r&&r.error)||'')); }); }
function newBatch(){ var nm=prompt('Название заказа (или пусто — авто):',''); if(nm===null) return; api({vapi:'createbatch', name:nm}).then(function(r){ if(r&&r.ok){ openOrder(r.batchId); } else alert('Ошибка'); }); }
function renameBatch(id,cur){ var nm=prompt('Название партии:',cur||''); if(nm===null||!nm.trim()) return; api({vapi:'renamebatch', batch:id, name:nm.trim()}).then(function(){ if(VIEW==='detail') reloadDetail(); else load(); }); }
function delBatch(id){ if(!confirm('Удалить заказ со всеми позициями?')) return; api({vapi:'delbatch', batch:id}).then(function(){ backToList(); }); }
// строка позиции (общий шаблон для рендера и оптимистичного добавления)
function itemRowHtml(it,batchId){
  // ⚠ в компактной строке у собранного изделия оставляем только значок: подпись «собрано»
  // повторялась 17 раз и съедала ширину, из-за которой пряталась колонка «Увезено».
  // У НЕсобранного текст оставляем — это требует действия, значок легко пропустить.
  var asmBadge = it.assembled
    ? '<span class="asm pill ok" title="состав собран">✓</span>'
    : '<a href="'+catUrl(it.sku||it.model)+'" target="_blank" class="asm pill warn" title="не собрано — открыть в каталоге, проверить состав и отметить">⚠<span class="t">не собрано</span></a>';
  return '<tr data-item="'+esc(it.id)+'" draggable="true" ondragstart="dragItem(event,\''+batchId+'\',\''+it.id+'\')" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropItem(event,\''+batchId+'\',\''+it.id+'\')" ondragend="dragEnd()">'
    +'<td class="c-nm" title="'+esc([it.equip,it.sku,(it.unitCost?(it.unitCost.toFixed(2).replace('.',',')+' р/шт'):'')].filter(Boolean).join(' · '))+'">'
      // оборудование + модель (22.10.2026: «Hill» есть у колец, упоров и стойки — по одной модели строки не различить)
      +'<div class="inm">'+asmBadge+'<b>'+esc(it.equip||it.model||it.sku||'—')+'</b>'+(it.equip&&it.model&&it.model!==it.equip?(' <span>'+esc(it.model)+'</span>'):'')
      +(it.sku?('<span class="sku">'+esc(it.sku)+'</span>'):'')+'</div>'+(it.optionsText?('<div class="iopt">'+esc(it.optionsText)+'</div>'):'')+'</td>'
    +'<td class="num"><input class="q" value="'+it.qty+'" onchange="updItem(\''+it.id+'\',this.value)"></td>'
    +'<td class="num">'+packedCellHtml(it)+'</td>'
    +'<td class="num"><input class="q" value="'+(it.done||0)+'" onchange="saveDone(\''+batchId+'\',\''+esc(it.sku)+'\',\''+esc(it.model)+'\',this.value)"></td>'
    +'<td class="num">'+shipCellHtml(it)+'</td>'
    +'<td class="c-x"><span class="grip" title="перетащите строку, чтобы поменять порядок">☰</span><span class="imv"><button class="ic" title="выше" onclick="moveItem(\''+batchId+'\',\''+it.id+'\',-1)">▲</button><button class="ic" title="ниже" onclick="moveItem(\''+batchId+'\',\''+it.id+'\',1)">▼</button></span>'
      +'<button class="ic" title="убрать" onclick="rmItem(\''+it.id+'\')">🗑</button></td></tr>';
}
/* порядок позиций (владелец 27.10.2026): ▲▼ — в этом порядке идут товары во всех вкладках и в ведомости; от него же зависит,
   какому изделию достаётся выработка без варианта (FIFO) */
function moveItem(batchId,itemId,dir){
  var ids=((DETAIL&&DETAIL.items)||[]).map(function(x){ return x.id; }), i=ids.indexOf(itemId), j=i+dir;
  if(i<0||j<0||j>=ids.length) return;
  ids.splice(i,1); ids.splice(j,0,itemId);
  saveItemOrder(batchId,ids);
}
/* перетаскивание строк мышью (стрелки остаются для телефона): бросили выше середины строки — встанет перед ней, ниже — после */
var DRAG=null;
function dragItem(ev,batchId,itemId){ DRAG=itemId; ev.dataTransfer.effectAllowed='move'; try{ ev.dataTransfer.setData('text/plain',itemId); }catch(e){} ev.target.closest('tr').classList.add('dragging'); }
function dragOver(ev){ if(!DRAG) return; ev.preventDefault(); ev.dataTransfer.dropEffect='move'; var tr=ev.target.closest('tr'); if(!tr) return;
  var r=tr.getBoundingClientRect(), below=ev.clientY>r.top+r.height/2; tr.classList.toggle('drop-after',below); tr.classList.toggle('drop-before',!below); }
function dragLeave(ev){ var tr=ev.target.closest('tr'); if(tr){ tr.classList.remove('drop-after'); tr.classList.remove('drop-before'); } }
function dragEnd(){ DRAG=null; Array.prototype.forEach.call(document.querySelectorAll('tr.dragging,tr.drop-after,tr.drop-before'),function(tr){ tr.classList.remove('dragging'); tr.classList.remove('drop-after'); tr.classList.remove('drop-before'); }); }
function dropItem(ev,batchId,targetId){
  ev.preventDefault(); var src=DRAG; var tr=ev.target.closest('tr'), after=tr&&tr.classList.contains('drop-after'); dragEnd();
  if(!src||src===targetId) return;
  var ids=((DETAIL&&DETAIL.items)||[]).map(function(x){ return x.id; }); ids.splice(ids.indexOf(src),1);
  var j=ids.indexOf(targetId)+(after?1:0); ids.splice(j,0,src);
  saveItemOrder(batchId,ids);
}
function saveItemOrder(batchId,ids){
  var tb=$('items_'+batchId); if(tb) ids.forEach(function(id){ var tr=tb.querySelector('tr[data-item="'+id+'"]'); if(tr) tb.appendChild(tr); });   // сразу показать новый порядок
  var m=$('bm_'+batchId); if(m) m.textContent='переставляю…';
  api({vapi:'itemorder',batch:batchId,items:ids.join(',')}).then(function(r){
    if(!r||!r.ok){ if(m) m.textContent=(r&&r.error)||'не удалось'; return; }
    if(m) m.textContent=''; loadDetail(batchId);
  });
}
/** «Упаковано» (12.10.2026): по одобренным нарядам операции изделия; null — у товара нет состава, считать не по чему; сервер ещё старый — поле не пришло */
function packedCellHtml(it){
  if(it.packed===undefined) return '';
  if(it.packed===null) return '<span class="muted" title="у товара нет состава — упаковка по нарядам не считается">—</span>';
  var p=Number(it.packed)||0, q=Number(it.qty)||0;
  return p>0 ? ('<b'+(q&&p>=q?' class="ok" title="упаковано всё"':'')+'>'+p+'</b>') : '<span class="muted">0</span>';
}
function curBatch(id){ if(DETAIL&&DETAIL.id===id) return DETAIL; for(var i=0;i<BATCHES.length;i++) if(BATCHES[i].id===id) return BATCHES[i]; return null; }
function renderItems(id){ var b=curBatch(id), tb=$('items_'+id); if(b&&tb) tb.innerHTML=(b.items||[]).map(function(it){ return itemRowHtml(it,id); }).join(''); }
// операции — редкое обновление: пересобираем один раз через паузу после последнего изменения позиций (expand дорогой)
var _opsTimer=null;
function scheduleOpsRefresh(id){
  var box=$('ops_'+id);
  if(box && !$('opsref_'+id)){   // старое содержимое остаётся — только пометка, что цифры обновляются
    var tag=document.createElement('div'); tag.id='opsref_'+id; tag.className='muted'; tag.textContent='⏳ операции пересчитываются…';
    box.insertBefore(tag, box.firstChild);
  }
  if(_opsTimer) clearTimeout(_opsTimer); _opsTimer=setTimeout(function(){ loadOps(id); },2500);
}

function addItem(id){
  var el=$('am_'+id), lbl=el.value.trim(), qEl=$('aq_'+id), qty=Number(qEl.value), m=$('bm_'+id);
  var mod=MODMAP[lbl];
  if(!mod){ if(m) m.innerHTML='<span class="err">выберите модель из списка</span>'; return; }
  if(!(qty>0)){ if(m) m.innerHTML='<span class="err">укажите количество</span>'; return; }
  var b=curBatch(id); if(!b) return;
  var it={ id:'tmp'+Date.now(), sku:mod.sku, equip:mod.equip, model:mod.model, qty:qty, done:0, costing:mod.costing, unitCost:mod.cost, assembled:!!mod.assembled };
  b.items=b.items||[]; b.items.push(it);
  renderItems(id);                       // мгновенно показать позицию
  el.value=''; qEl.value=''; el.focus();  // готово вводить следующую
  if(m) m.innerHTML='<span class="ok">＋ '+esc(itemName(it))+'</span>';
  api({vapi:'additem', batch:id, sku:mod.sku, eq:mod.equip, mod:mod.model, qty:qty}).then(function(r){
    if(r&&r.ok&&r.item){ it.id=r.item.id; renderItems(id); scheduleOpsRefresh(id); }
    else { b.items=b.items.filter(function(x){ return x!==it; }); renderItems(id); if(m) m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; }
  }).catch(function(e){ b.items=b.items.filter(function(x){ return x!==it; }); renderItems(id); if(m) m.innerHTML='<span class="err">'+esc(e.message||e)+'</span>'; });
}
function updItem(itemId,v){
  var b=DETAIL; if(!b||!b.items) return;
  for(var j=0;j<b.items.length;j++) if(b.items[j].id===itemId){ b.items[j].qty=Number(v)||0; api({vapi:'upditem', item:itemId, qty:v}).then(function(){ scheduleOpsRefresh(b.id); }); return; }
}
function rmItem(itemId,force){
  var b=DETAIL; if(!b||!b.items) return;
  var bid=b.id;
  // ⚠ строку из списка убираем ТОЛЬКО после ответа сервера: по позиции может быть сдана выработка,
  // и тогда сервер откажет — оптимистичное удаление показало бы то, чего не произошло
  api({vapi:'rmitem', item:itemId, force:(force?1:'')}).then(function(r){
    if(r&&r.warn){ if(confirm(r.msg)) rmItem(itemId,1); return; }
    if(r&&r.ok===false){ alert(r.error||'не удалось удалить позицию'); return; }
    for(var j=0;j<b.items.length;j++) if(b.items[j].id===itemId){ b.items.splice(j,1); break; }
    renderItems(bid); scheduleOpsRefresh(bid);
  });
}
// ─── ОТГРУЗКА ЧАСТЯМИ ───
// Партию возят в несколько заходов: сколько готово — столько и увозим, заказ живёт дальше.
// Количество по каждой позиции правится вручную, больше упакованного ввести нельзя.
// ⚠ Упакованное, но не увезённое НЕ теряется: приход на склад готовой продукции делается на
// всё упакованное, расход — только на увезённое, разница лежит в «Наличии» и видна следующему
// заказу. Незавершённые детали уходят на склад деталей только при ЗАКРЫТИИ заказа.
var SHIP={};
function ship(id){ showPTab(id,'ship');
  var m=$('bm_'+id); m.textContent='считаю…';
  api({vapi:'shippreview',batch:id}).then(function(r){
    m.textContent='';
    if(!r||!r.ok){ m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    SHIP[id]=r; renderShip(id);
  });
}
function shipQty(id,i){ var el=$('sq_'+id+'_'+i); return Math.max(0,Math.min(Number(el&&el.value)||0,SHIP[id].lines[i].canShip)); }
function shipRecalc(id){
  var d=SHIP[id],t=0,rest=0;
  d.lines.forEach(function(l,i){ var q=shipQty(id,i); t+=q; rest+=Math.max(0,l.packed-l.shippedBefore-q); });
  var el=$('stot_'+id); if(el) el.innerHTML='Везём <b>'+t+'</b> шт'+(rest?(' · останется упакованными <b>'+rest+'</b>'):'');
  var bt=$('sbtn_'+id); if(bt) bt.disabled=!(t>0);
}
function shipAll(id,on){
  SHIP[id].lines.forEach(function(l,i){ var el=$('sq_'+id+'_'+i); if(el) el.value=on?l.canShip:0; });
  shipRecalc(id);
}
function renderShip(id){
  var d=SHIP[id];
  var rows=d.lines.map(function(l,i){
    var made=l.ordered-l.packed;
    return '<tr'+(l.canShip?'':' style="opacity:.5"')+'>'
      +'<td>'+esc(l.model)+'<div class="muted" style="font:var(--t-tiny)">'+esc(l.equip)+'</div></td>'
      +'<td class="num">'+l.ordered+'</td><td class="num">'+l.packed+'</td>'
      +'<td class="num">'+(l.shippedBefore||'—')+'</td>'
      +'<td class="num"><input id="sq_'+id+'_'+i+'" type="number" min="0" max="'+l.canShip+'" value="'+l.canShip+'" '
      +(l.canShip?'':'disabled ')+'oninput="shipRecalc(\''+id+'\')" style="width:72px;text-align:right"></td>'
      +'<td class="muted" style="font:var(--t-tiny)">'+(made>0?('не собрано '+made):'')+'</td></tr>';
  }).join('');
  $('ship_'+id).innerHTML='<div class="tray"><div class="trayhd">'
    +'<span class="tt">📦 Отгрузка</span><span class="th">впишите, сколько увозите по каждой позиции</span></div>'
    +'<div class="tbwrap"><table class="tbl" style="min-width:520px;margin-top:var(--s-2)"><thead><tr>'
    +'<th>Изделие</th><th class="num">заказ</th><th class="num">упаковано</th><th class="num">увезли</th><th class="num">везём</th><th></th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="row" style="margin-top:var(--s-2)">'
    +'<button class="sm sec" onclick="shipAll(\''+id+'\',1)">всё упакованное</button>'
    +'<button class="sm sec" onclick="shipAll(\''+id+'\',0)">обнулить</button>'
    +'<span id="stot_'+id+'" style="margin-left:auto"></span></div>'
    +'<div class="row" style="margin-top:var(--s-3)">'
    +'<button id="sbtn_'+id+'" onclick="shipGo(\''+id+'\',0)">🚚 Отгрузить, заказ оставить открытым</button>'
    +'<button class="sec" onclick="shipGo(\''+id+'\',1)">🔒 Отгрузить и закрыть заказ</button>'
    +'<button class="sec" onclick="toStockGo(\''+id+'\',0)">🏬 Сдать на склад</button>'
    +'<button class="sec" onclick="toStockGo(\''+id+'\',1)">🏬🔒 Сдать на склад и закрыть заказ</button>'
    +'<button class="sec" onclick="restOrder(\''+id+'\')">📄 Закрыть и создать заказ на остаток</button>'
    +'<button class="sec" onclick="$(\'ship_'+id+'\').innerHTML=\'\'">отмена</button></div>'
    +'<div class="muted small" style="margin-top:var(--s-2)">Закрытие заказа переводит недоделанные детали на склад деталей — оттуда их можно взять в следующую партию. Пока заказ открыт, детали остаются в нём.</div>'
    +'</div>';
  shipRecalc(id);
}
function shipGo(id,close){
  var d=SHIP[id], items=[], tot=0, rest=0;
  d.lines.forEach(function(l,i){ var q=shipQty(id,i); tot+=q; rest+=Math.max(0,l.packed-l.shippedBefore-q);
    if(q>0) items.push({sku:l.sku,model:l.model,qty:q}); });
  if(!tot){ alert('Не указано ни одной позиции к отгрузке.'); return; }
  var txt='Отгружаем '+tot+' изделий.';
  if(rest) txt+='\nОстанется упакованными в наличии: '+rest+' шт.';
  txt+=close ? '\n\nЗАКАЗ БУДЕТ ЗАКРЫТ: недоделанные детали уйдут на склад деталей, недостающие изделия перестанут числиться в заказе. Продолжить?'
             : '\n\nЗаказ останется открытым — остаток можно довезти позже. Продолжить?';
  if(!confirm(txt)) return;
  var m=$('bm_'+id); m.textContent='отгружаю…'; $('ship_'+id).innerHTML='';
  api({vapi:'shipbatch',batch:id,lines:JSON.stringify(items),close:close?1:0}).catch(function(e){ return {ok:false,error:'связь оборвалась — проверьте журнал, прежде чем повторять'}; }).then(function(r){
    if(!r||!r.ok){ m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    var w=(r.wip&&r.wip.ok&&r.wip.stat)?(' · на склад деталей '+r.wip.stat.qty+' шт'):'';
    m.innerHTML='<span class="ok">отгружено '+r.shipped+(r.closed?' · заказ закрыт':' · заказ открыт')+w+'</span>';
    setTimeout(reloadDetail,700);
  });
}

// ─── ВЗЯТЬ ОСТАТКИ СО СКЛАДА ДЕТАЛЕЙ В ЭТОТ ЗАКАЗ ───
// Деталь, пролежавшая на складе, закрывает не только «свою» стадию, но и все предыдущие:
// отшлифованная боковина заведомо распилена. Поэтому взятие поднимает начальные остатки
// по всей цепочке до этой стадии — и только вверх, ничего не понижая.
var WIPO={};
function wipOffer(id){ showPTab(id,'ship');
  var m=$('bm_'+id); m.textContent='смотрю склад…';
  api({vapi:'wipoffer',batch:id}).then(function(r){
    m.textContent='';
    if(!r||!r.ok){ m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    WIPO[id]=r; renderWip(id);
  });
}
function wipQty(id,i){ var el=$('wq_'+id+'_'+i); return Math.max(0,Math.min(Number(el&&el.value)||0,WIPO[id].items[i].canTake)); }
function wipRecalc(id){
  var t=0; (WIPO[id].items||[]).forEach(function(x,i){ t+=wipQty(id,i); });
  var el=$('wtot_'+id); if(el) el.innerHTML='Берём <b>'+t+'</b> деталей';
  var b=$('wbtn_'+id); if(b) b.disabled=!(t>0);
}
function wipAll(id,on){
  (WIPO[id].items||[]).forEach(function(x,i){ var el=$('wq_'+id+'_'+i); if(el) el.value=on?x.canTake:0; });
  wipRecalc(id);
}
function renderWip(id){
  var d=WIPO[id], box=$('wip_'+id);
  if(!d.items.length){
    box.innerHTML='<div class="tray"><div class="trayhd"><span class="tt">🧩 Склад деталей</span>'
      +'<span class="th">подходящих остатков нет</span></div>'
      +'<div class="muted" style="padding:var(--s-2) 0">На складе нет деталей, которые нужны этому заказу. '
      +'Детали попадают на склад при закрытии заказа — недоделанное остаётся за цехом.</div>'
      +'<div class="row" style="margin-top:var(--s-2)"><button class="sm sec" onclick="$(\'wip_'+id+'\').innerHTML=\'\'">закрыть</button></div></div>';
    return;
  }
  var rows=d.items.map(function(x,i){
    return '<tr><td>'+esc(x.detail)+'</td><td class="muted">'+esc(x.model||'—')+'</td>'
      +'<td>'+esc(x.stage)+'</td><td class="num">'+x.onWip+'</td><td class="num">'+x.room+'</td>'
      +'<td class="num"><input id="wq_'+id+'_'+i+'" type="number" min="0" max="'+x.canTake+'" value="'+x.canTake+'" '
      +'oninput="wipRecalc(\''+id+'\')" style="width:70px;text-align:right"></td></tr>';
  }).join('');
  box.innerHTML='<div class="tray"><div class="trayhd">'
    +'<span class="tt">🧩 Склад деталей</span><span class="th">остатки прошлых партий, которые нужны этому заказу</span></div>'
    +'<div class="tbwrap"><table class="tbl" style="min-width:560px;margin-top:var(--s-2)"><thead><tr>'
    +'<th>Деталь</th><th>Вариант</th><th>Стадия</th><th class="num">на складе</th><th class="num">нужно</th><th class="num">берём</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="row" style="margin-top:var(--s-2)">'
    +'<button class="sm sec" onclick="wipAll(\''+id+'\',1)">взять всё</button>'
    +'<button class="sm sec" onclick="wipAll(\''+id+'\',0)">обнулить</button>'
    +'<span id="wtot_'+id+'" style="margin-left:auto"></span></div>'
    +'<div class="row" style="margin-top:var(--s-3)">'
    +'<button id="wbtn_'+id+'" onclick="wipGo(\''+id+'\')">✅ Взять в заказ</button>'
    +'<button class="sec" onclick="$(\'wip_'+id+'\').innerHTML=\'\'">отмена</button></div>'
    +'<div class="muted small" style="margin-top:var(--s-2)">Взятое спишется со склада и встанет в «Начальные остатки» — на эту стадию и на все предыдущие.</div>'
    +'</div>';
  wipRecalc(id);
}
function wipGo(id){
  var d=WIPO[id], items=[], t=0;
  d.items.forEach(function(x,i){ var q=wipQty(id,i); if(q>0){ items.push({key:x.key,qty:q}); t+=q; } });
  if(!t) return;
  if(!confirm('Взять со склада '+t+' деталей в этот заказ?\nОни спишутся со склада и попадут в начальные остатки.')) return;
  var m=$('bm_'+id); m.textContent='беру…'; $('wip_'+id).innerHTML='';
  api({vapi:'wipissue',batch:id,items:JSON.stringify(items)}).catch(function(e){ return {ok:false,error:'связь оборвалась — проверьте журнал, прежде чем повторять'}; }).then(function(r){
    if(!r||!r.ok){ m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    m.innerHTML='<span class="ok">взято со склада: '+t+' деталей</span>';
    setTimeout(reloadDetail,700);
  });
}
// ─── ОТГРУЗКА ВИДНА В КАРТОЧКЕ ───
// Без этого после отгрузки карточка выглядит один в один как до: % труда и «осталось ₽»
// не меняются (и не должны — это метрики труда), а увезённое нигде не показывалось.
function shipBadgeHtml(b){
  var sh=Number(b.shipped)||0; if(!(sh>0)) return '';
  var ord=Number(b.ordered)||0;
  var packed=0, rest=0;
  (b.items||[]).forEach(function(it){
    var p=Number(it.done)||0, s=Number(it.shipped)||0;   // «Готово» = оприходовано на склад
    packed+=p; rest+=Math.max(0,p-s);
  });
  return '<div class="row" style="margin-top:var(--s-2);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-ctl);padding:var(--s-2) var(--s-3)">'
    +'<span>🚚 Отгружено <b>'+sh+'</b>'+(ord?(' из '+ord):'')+'</span>'
    +(rest>0?('<span class="muted">· упаковано, но не увезено: <b>'+rest+'</b></span>'):'')
    +(ord>sh?('<span class="muted">· не выполнено по заказу: <b>'+(ord-sh)+'</b></span>'):'')
    +'</div>';
}
function shipCellHtml(it){
  var s=Number(it.shipped)||0, d=Number(it.done)||0;
  if(!s&&!d) return '<span class="muted">—</span>';
  var rest=Math.max(0,d-s);
  return s+(rest>0?(' <span class="muted" title="упаковано, но не увезено — лежит на складе готовой продукции">⏳'+rest+'</span>'):'');
}
function shipLog(id){ showPTab(id,'ship');
  var box=$('slog_'+id);
  if(box.innerHTML){ box.innerHTML=''; return; }
  box.innerHTML='<div class="muted">загрузка…</div>';
  api({vapi:'shiplog',batch:id}).then(function(r){
    if(!r||!r.ok){ box.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    if(!r.rows.length){ box.innerHTML='<div class="muted">движений по этому заказу нет</div>'; return; }
    var rows=r.rows.map(function(x){
      var out=x.type==='расход';
      return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.model)+'</td>'
        +'<td>'+(out?'<span style="color:var(--accent-text)">увезено</span>':'<span class="muted">на склад</span>')+'</td>'
        +'<td class="num">'+x.qty+'</td><td class="muted">'+esc(x.note||'')+'</td></tr>';
    }).join('');
    box.innerHTML='<div class="tray"><div class="trayhd"><span class="tt">🚚 История отгрузок</span>'
      +'<span class="th">увезено всего '+r.stat.shipped+'</span></div>'
      +'<div class="tbwrap"><table class="tbl" style="min-width:480px;margin-top:var(--s-2)"><thead><tr>'
      +'<th>Дата</th><th>Изделие</th><th>Движение</th><th class="num">Кол-во</th><th>Комментарий</th>'
      +'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  });
}
// ─── ВТОРОЙ ПУТЬ ТОВАРА: СДАТЬ НА СКЛАД ───
// Отгрузка увозит клиенту напрямую и склад лишь проскакивает. Здесь товар на складе ОСТАЁТСЯ,
// а увозят его потом со склада — уже не от имени заказа.
function toStockGo(id,close){
  var d=SHIP[id], items=[], t=0;
  d.lines.forEach(function(l,i){ var q=shipQty(id,i); if(q>0){ items.push({sku:l.sku,model:l.model,qty:q}); t+=q; } });
  if(!t && !close){ alert('Не указано ни одной позиции.'); return; }
  var txt='Сдать на склад готовой продукции '+t+' изделий?\n\nТовар останется на складе, клиенту не уедет. '
    +'Отгрузить его можно позже в разделе «🏬 Склады».';
  if(close) txt+='\n\nЗАКАЗ БУДЕТ ЗАКРЫТ: недоделанные детали уйдут на склад деталей, '
    +'а невыполненное по заказу перестанет числиться. Это единственный правильный способ закрыть заказ — '
    +'смена статуса в списке детали на склад НЕ переведёт.';
  if(!confirm(txt)) return;
  var m=$('bm_'+id); m.textContent='сдаю на склад…'; $('ship_'+id).innerHTML='';
  api({vapi:'batchtostock',batch:id,lines:JSON.stringify(items),close:close?1:0}).catch(function(e){ return {ok:false,error:'связь оборвалась — проверьте журнал, прежде чем повторять'}; }).then(function(r){
    if(!r||!r.ok){ m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    var w=(r.wip&&r.wip.ok&&r.wip.stat)?(' · на склад деталей '+r.wip.stat.qty+' шт'):'';
    m.innerHTML='<span class="ok">сдано на склад: '+r.toStock+(r.closed?' · заказ закрыт':'')+w+'</span>';
    setTimeout(reloadDetail,700);
  });
}
// ─── ЗАКАЗ НА ОСТАТОК ───
// Остаток = заказано − отгружено − сдано на склад. Готовое, что ещё лежит за заказом, входит
// в новый заказ УЖЕ СДЕЛАННЫМ: операции закрыты начальными остатками, ЗП за него не начисляется.
function restOrder(id){
  var m=$('bm_'+id); m.textContent='считаю остаток…';
  api({vapi:'batchfromrest',batch:id,dry:1}).then(function(r){
    m.textContent='';
    if(!r||!r.ok){ alert((r&&r.error)||'ошибка'); return; }
    var t='Создать «'+r.name+'» на '+r.stat.rest+' изделий ('+r.stat.positions+' позиций)?\n\n'
      +r.rows.map(function(x){ return '• '+x.model+' — '+x.qty+(x.carry?(' (из них '+x.carry+' уже готовы)'):''); }).join('\n')
      +'\n\nТекущий заказ будет ЗАКРЫТ: недоделанные детали уйдут на склад деталей.'
      +(r.stat.carry?('\nГотовые '+r.stat.carry+' шт войдут в новый заказ как уже сделанные — работать по ним не нужно.'):'');
    if(!confirm(t)) return;
    m.textContent='создаю…';
    api({vapi:'batchfromrest',batch:id,close:1}).catch(function(e){ return {ok:false,error:'связь оборвалась — проверьте журнал, прежде чем повторять'}; }).then(function(x){
      if(!x||!x.ok){ m.innerHTML='<span class="err">'+esc((x&&x.error)||'ошибка')+'</span>'; return; }
      var w=(x.wip&&x.wip.ok&&x.wip.stat)?(' · на склад деталей '+x.wip.stat.qty+' шт'):'';
      var o=(x.offer&&x.offer.ok&&x.offer.stat&&x.offer.stat.qty)?(' · со склада можно взять '+x.offer.stat.qty+' деталей'):'';
      m.innerHTML='<span class="ok">создан '+esc(x.num)+' на '+x.rest+' изделий'+w+o+'</span>';
      setTimeout(function(){ backToList(); },1400);
    });
  });
}
load();

// авто-обновление: оболочка шлёт «refresh» при возврате на раздел — перечитываем данные без перезагрузки страницы
(function(){
  try{ var m=/[?&]twsec=([^&]+)/.exec(location.search); window.top.postMessage({tw:'hello',sec:m?decodeURIComponent(m[1]):''},'*'); }catch(e){}
  window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='refresh'){ try{
    if(Date.now()-LASTLOAD<300000) return;                       // данные свежее 5 минут — не дёргаем экран
    if(typeof VIEW!=="undefined"&&VIEW==="detail"&&CUR){loadDetail(CUR,true);}else{load(true);}
  }catch(err){} } });
})();

// ─────── ПОКАЗЫВАЕМ, ЧТО ИДЁТ РАБОТА ───────
// Каждый вызов Apps Script — это 3-6 секунд. Без видимого признака человек считает, что
// кнопка не сработала, и жмёт снова: так рождались дубли нарядов и «то одобряет, то нет».
// Полоска сверху — на любой запрос; заслонка «не нажимайте» — только на действие,
// которое человек начал сам (нажал кнопку), чтобы фоновое обновление не мешало работать.
var TWL=0, TWCLICK=0;
var TWTMR=0;
function twLoadOn(wait){
  TWL++;
  var b=document.getElementById('twload'); if(b) b.style.display='block';
  if(wait){
    var w=document.getElementById('twwait'); if(w) w.style.display='flex';
    // ПРЕДОХРАНИТЕЛЬ: если ответ не пришёл (сеть в цеху пропала), заслонка не должна
    // запереть экран навсегда — через 30 с она превращается в понятное сообщение и снимается пальцем.
    clearTimeout(TWTMR);
    TWTMR=setTimeout(function(){
      var h=document.getElementById('twwt'); if(h) h.textContent='Ответа всё нет';
      var s=document.querySelector('#twwait .wh'); if(s) s.textContent='связь медленная — нажмите, чтобы закрыть и попробовать снова';
      var ww=document.getElementById('twwait'); if(ww) ww.onclick=function(){ TWL=0; twLoadOff(); };
    },30000);
  }
}
function twLoadOff(){
  TWL=Math.max(0,TWL-1); if(TWL) return;
  clearTimeout(TWTMR);
  var b=document.getElementById('twload'); if(b) b.style.display='none';
  var w=document.getElementById('twwait');
  if(w){ w.style.display='none'; w.onclick=null; }
  var s=document.querySelector('#twwait .wh'); if(s) s.textContent='идёт обмен с сервером — не нажимайте';
}
function twSay(t){ var e=document.getElementById('twwt'); if(e&&t) e.textContent=t; }
// нажатие человека «взводит» заслонку для ближайшего запроса (20 с — на случай prompt по дороге)
document.addEventListener('click',function(e){
  var n=e.target;
  while(n&&n!==document.body){ if(n.tagName==='BUTTON'||n.tagName==='A'){ TWCLICK=Date.now(); return; } n=n.parentNode; }
},true);
(function(){
  var _api=(typeof api==='function')?api:null, _post=(typeof apiPost==='function')?apiPost:null;
  var wrap=function(fn){ return function(p){
    var mine=(TWCLICK && (Date.now()-TWCLICK)<20000); if(mine) TWCLICK=0;
    twLoadOn(mine);
    return fn(p).then(function(r){ twLoadOff(); return r; }, function(e){ twLoadOff(); throw e; });
  }; };
  if(_api) api=wrap(_api);
  if(_post) apiPost=wrap(_post);
})();
</script>
