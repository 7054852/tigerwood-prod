<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигервуд — производство</title>
<script src="tw-theme.js"></script>
<script src="tw-config.js"></script>
<style>
  .sect{ align-items:center; }
  th,td{ white-space:nowrap; }
  input.q{ width:64px; text-align:right; font-variant-numeric:tabular-nums; }
  /* СТРОКА ПОЗИЦИИ ЗАКАЗА. Раньше «оборудование · модель · артикул» шли одной строкой с nowrap —
     таблица уезжала за экран, и колонка «Отгружено» пряталась под горизонтальной прокруткой.
     Теперь имя в две строки, цифры узкие, ширина держится на table-layout:fixed. */
  table.items{ table-layout:fixed; width:100%; }
  table.items td,table.items th{ padding:var(--s-1) var(--s-2); }
  table.items .c-nm{ width:auto; white-space:normal; }
  table.items .c-n{ width:74px; }
  table.items .c-x{ width:108px; white-space:nowrap; }
  .imv button{ padding:0 4px; }
  .grip{ cursor:grab; color:var(--muted); margin-right:var(--s-1); user-select:none; }
  table.items tr[draggable]{ cursor:grab; }
  table.items tr.dragging{ opacity:.4; }
  table.items tr.drop-before td{ box-shadow:inset 0 2px 0 var(--accent); }
  table.items tr.drop-after td{ box-shadow:inset 0 -2px 0 var(--accent); }
  /* ОДНА строка на позицию: 17 изделий должны читаться одним взглядом, без прокрутки
     ни вбок, ни вниз. Различает варианты модель — она и стоит первой; оборудование,
     себестоимость и статус состава уезжают в подсказку при наведении. */
  .inm{ display:flex; align-items:center; gap:var(--s-2); min-width:0; }
  .inm b{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .inm .sku{ color:var(--muted); font:var(--t-tiny); white-space:nowrap; }
  .iopt{ color:var(--muted); font:var(--t-tiny); }   /* опции позиции для цеха: канат, зацепы горки, доп. перемычки */
  table.items input.q{ width:100%; max-width:66px; }
  @media (max-width:640px){
    table.items .c-n{ width:56px; }
    table.items input.q{ max-width:50px; }
    .inm .sku{ display:none; }                   /* на телефоне артикул не нужен — он в подсказке */
  }
  /* компактная отметка «собрано» — пилюля темы (.pill.ok / .pill.warn) */
  /* ⚠ это отметка «состав изделия подтверждён в каталоге», а НЕ «работа завершена».
     Голая зелёная галочка рядом с процентом читалась как «готово» — поэтому подпись видна всегда. */
  .asm{ text-decoration:none; }
  a.asm{ cursor:pointer; }
  .asm .t{ font-weight:500; }
  .prio{ cursor:pointer; }
  /* карточка заказа: статус — точкой в заголовке, без цветной полосы сбоку */
  .bcard{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:var(--s-4); margin-bottom:var(--s-4); box-shadow:var(--shadow-card); }
  .bcard.click{ cursor:pointer; transition:border-color .15s var(--ease), background-color .15s var(--ease), transform .08s var(--ease); }
  .bcard.click:hover{ border-color:var(--line2); background:var(--card2); }
  .bcard.click:active{ transform:translateY(1px); }
  /* факты заказа в списке: 4 клетки «подпись · значение · пояснение», на телефоне две колонки */
  .bfacts{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:var(--s-3); margin-top:var(--s-3); padding-top:var(--s-2); border-top:1px solid var(--line); }
  .bf{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .bf .t{ font:var(--t-tiny); color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .bf .v{ font:var(--t-strong); font-weight:600; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:var(--s-2); white-space:nowrap; }
  .bf .v .bar{ flex:0 0 64px; min-width:64px; }
  .bf .v a{ text-decoration:none; font-weight:400; }
  .bf .s{ font:var(--t-tiny); color:var(--muted); }   /* переносится, а не режется: прогноз и запас терять нельзя */
  .bf.ok .v{ color:var(--green); } .bf.warn .v{ color:var(--amber); } .bf.bad .v{ color:var(--red); }
  .bf.bad .s{ color:var(--red); } .bf.warn .s{ color:var(--amber); }
  @media (max-width:820px){ .bfacts{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:400px){ .bfacts{ grid-template-columns:1fr; } }
  .bhead{ display:flex; align-items:center; gap:var(--s-3); flex-wrap:wrap; }
  .bnum{ font:var(--t-heading); } .bpct{ font-variant-numeric:tabular-nums; }
  .bar{ flex:1; min-width:80px; }
  .msg{ margin-left:var(--s-2); }
  .toolbar .msg{ margin-left:0; }
  .tiles.pulse{ margin-bottom:var(--s-4); }
  .note.click{ cursor:pointer; }
  /* ── лоток блока: утопленный фон отделяет группы друг от друга ── */
  .tray{ margin-top:var(--s-4); }
  /* ── вкладки карточки заказа (владелец 27.10.2026): длинная лента блоков → пять вкладок ── */
  /* вкладки липнут к верху, пока листаешь карточку: с любого места видно, где ты, и можно перейти (владелец 28.10.2026) */
  .ptabw{ position:sticky; top:0; z-index:20; background:var(--card); margin:var(--s-3) calc(-1*var(--s-4)) var(--s-3); padding:var(--s-2) var(--s-4); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; }
  /* вид таблиц — в липкой полосе вкладок, справа: переключать, не возвращаясь наверх (владелец 29.10.2026); один на «Детали» и «Сводно» */
  .ptabv{ margin-left:auto; display:none; }
  .ptabw.vw .ptabv{ display:inline-flex; }
  .ptabv .mxsw{ padding:2px; }
  .ptabv .mxsw span{ font:var(--t-small); font-weight:500; padding:2px var(--s-2); }
  .ptabv .mxsw span.on{ font-weight:600; }
  @media (max-width:640px){ .ptabv{ margin-left:0; width:100%; } .ptabv .mxsw{ width:100%; } .ptabv .mxsw span{ flex:1; text-align:center; } }
  .ptabs{ display:inline-flex; gap:2px; padding:3px; background:var(--card2); border:1px solid var(--line); border-radius:var(--r-ctl); max-width:100%; overflow-x:auto; scrollbar-width:none; }
  .ptabs::-webkit-scrollbar{ display:none; }
  /* партии */
  .ptop{ display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; margin:var(--s-3) 0 var(--s-2); }
  .prow{ display:grid; grid-template-columns:18px 22px 1fr 220px auto; gap:var(--s-2); align-items:center; padding:var(--s-2); border:1px solid var(--line); border-radius:var(--r-ctl); margin-bottom:6px; background:var(--card); }
  .prow.on{ border-color:var(--accent,#3b82f6); box-shadow:0 0 0 1px var(--accent,#3b82f6) inset; }
  .prow.out{ background:var(--card2); }
  .prow .hnd{ cursor:grab; color:var(--muted); user-select:none; }
  .pchip{ cursor:grab; border-radius:4px; padding:0 2px; } .pchip:hover{ background:var(--card2); outline:1px dashed var(--line2); }
  .prow .pq{ color:var(--muted); font-variant-numeric:tabular-nums; }
  .prow .pac{ display:flex; gap:4px; }
  .pbarx{ display:inline-block; width:120px; height:8px; border-radius:4px; background:var(--card2); border:1px solid var(--line); vertical-align:middle; overflow:hidden; }
  .pbarx i{ display:block; height:100%; background:var(--ok,#22c55e); }
  .pbn{ margin-left:6px; font-variant-numeric:tabular-nums; }
  .pedit{ border:1px dashed var(--line2); border-radius:var(--r-ctl); padding:var(--s-2); margin:0 0 var(--s-2) 40px; }
  .pedit .row{ margin:6px 0; display:flex; gap:var(--s-2); flex-wrap:wrap; }
  .ped-h{ display:flex; gap:var(--s-2); align-items:center; flex-wrap:wrap; margin-bottom:6px; }
  .ped-h input{ min-width:0; flex:1 1 140px; }
  .pits{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr)); gap:2px 16px; max-width:1500px; }
  .pit{ display:grid; grid-template-columns:1fr auto 64px 30px; gap:6px; align-items:center; padding:4px; border-bottom:1px solid var(--line); font-size:13px; }
  .pit .pin-nm{ min-width:0; white-space:normal; overflow-wrap:anywhere; line-height:1.25; }
  .pit .pin-nm b{ font-weight:600; }
  .pit .pin-sub{ display:block; color:var(--muted); font-size:11.5px; }
  .pit .pin-fr{ color:var(--muted); font-size:12px; white-space:nowrap; }
  .pit input.pin{ width:64px; height:26px; padding:2px 6px; text-align:right; }
  .pits.hidefull .pit.full{ display:none; }
  @media (max-width:700px){ .pit{ grid-template-columns:1fr 64px 34px; } .pit .pin-nm{ grid-column:1/-1; } }
  .pflash{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ok,#16a34a); color:#fff; padding:8px 14px; border-radius:8px; z-index:9999; font-weight:600; }
  .jpl{ margin-top:var(--s-2); } .jhd{ display:flex; justify-content:space-between; gap:var(--s-2); align-items:baseline; }
  .jtb{ border-collapse:collapse; width:100%; font-size:12.5px; font-variant-numeric:tabular-nums; } .jtb th,.jtb td{ padding:3px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  .jtb td.num,.jtb th.num{ text-align:right; white-space:nowrap; } .jtb tr.jx td{ text-decoration:line-through; color:var(--muted); } .jtb tr.js td{ color:var(--muted); font-style:italic; }
  .jtb tr.dlate td{ background:var(--red-bg,#fde8e8); } .dh{ margin:var(--s-4) 0 var(--s-2); font-size:15px; } .dcnt{ margin:4px 0; } .dcnt summary{ cursor:pointer; }
  .tw{ overflow-x:auto; }
  /* «Куда идут силы»: палитра заказов (день / ночь) */
  :root{ --fl1:#2458C9; --fl2:#C8660F; --fl3:#0F8A7E; --fl4:#6E56CF; --fl5:#D0457A; --fl6:#4F8A2E; --fl7:#9A5B06; --fl8:#3E8FB0; --fl-free:#8A94A6; }
  :root[data-theme="night"]{ --fl1:#7FA6F2; --fl2:#F0A15C; --fl3:#4CC4B5; --fl4:#A994F0; --fl5:#F07FA8; --fl6:#8CC46A; --fl7:#D9A04A; --fl8:#7CC3E0; --fl-free:#7C8699; }
  .fdpick{ display:flex; gap:6px; align-items:stretch; overflow-x:auto; padding-bottom:2px; }
  .fdc{ display:grid; justify-items:center; gap:0; min-width:64px; padding:6px 8px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); cursor:pointer; font:var(--t-small); }
  .fdc span{ color:var(--muted); font-size:11px; } .fdc b{ font:var(--t-strong); } .fdc small{ color:var(--fg2); font-size:11px; }
  .fdc.z small{ color:var(--muted); } .fdc.on{ border-color:var(--accent); background:var(--accent-bg); } .fdc.on b{ color:var(--accent-text); }
  .fcal{ display:flex; align-items:center; gap:4px; padding:0 8px; border:1px solid var(--line); border-radius:10px; cursor:pointer; margin-left:auto; }
  .fcal input{ border:0; background:transparent; color:var(--fg); font:var(--t-small); padding:6px 0; }
  .fday{ width:100%; max-width:none; box-sizing:border-box; padding:var(--s-4); margin-bottom:var(--s-3); display:grid; gap:var(--s-3); }
  .fdh{ display:flex; align-items:center; gap:var(--s-3); } .fdt{ flex:1; min-width:0; }
  .fdl{ font:var(--t-label); text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .fdv{ font:var(--t-display); } .fdv small{ font:var(--t-small); color:var(--muted); }
  .fds{ font:var(--t-small); color:var(--fg2); }
  .fbars{ display:grid; gap:6px; }
  .fbar{ display:grid; grid-template-columns:minmax(120px,240px) 1fr 150px; gap:10px; align-items:center; padding:6px 8px; border-radius:8px; cursor:pointer; }
  .fbar:hover{ background:var(--card2); } .fbar.on{ background:var(--accent-bg); }
  .fbl{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fbt{ height:14px; background:var(--bg2); border-radius:7px; overflow:hidden; } .fbt i{ display:block; height:100%; border-radius:7px; }
  .fbt i.ffreeb{ background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,255,255,.45) 3px 5px)!important; }
  .fbv{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .fbdet{ background:var(--bg2); border-radius:8px; padding:var(--s-3); margin:0 0 6px; }
  .fch{ display:flex; gap:var(--s-2); align-items:baseline; flex-wrap:wrap; }
  .fchart .ftot{ fill:var(--fg2); font:600 11px var(--font); } .fchart .ftot.on{ fill:var(--accent-text); }
  .fchart .favg{ stroke:var(--amber); stroke-width:1.2; stroke-dasharray:5 4; } .fchart .favgt{ fill:var(--amber); }
  @media (max-width:700px){ .fbar{ grid-template-columns:1fr auto; } .fbar .fbt{ grid-column:1/-1; grid-row:2; } .fdv{ font:var(--t-title); } }
  .fstrip{ display:flex; gap:var(--s-4); align-items:center; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:var(--r-card,10px); padding:var(--s-3) var(--s-4); margin-bottom:var(--s-3); box-shadow:var(--shadow-card); }
  .fstrip .fst{ font:var(--t-label); text-transform:uppercase; letter-spacing:.05em; color:var(--fg2); margin-bottom:4px; }
  .fsr{ flex:1 1 300px; min-width:0; display:grid; gap:4px; }
  .fchips,.flegend{ display:flex; flex-wrap:wrap; gap:6px 12px; }
  .fchip{ display:inline-flex; align-items:center; gap:6px; font:var(--t-small); white-space:nowrap; }
  .fchip i{ width:10px; height:10px; border-radius:3px; display:inline-block; }
  .fchip i.fwait{ background:var(--fl1); opacity:.38; }
  .fwarn{ color:var(--red); background:var(--red-bg); border-radius:6px; padding:4px 8px; font:var(--t-small); }
  .fcard{ padding:var(--s-3) var(--s-4); display:grid; gap:var(--s-2); width:100%; max-width:none; box-sizing:border-box; margin-bottom:var(--s-3); }
  .fwrap{ overflow-x:auto; }
  .fchart{ display:block; }
  .fchart .fgrid{ stroke:var(--grid); stroke-width:1; }
  .fchart .fax{ fill:var(--muted); font:400 11px var(--font); }
  .fchart .ftd{ fill:var(--fg); font-weight:600; }
  .fchart .fdw{ font-size:10px; }
  .fchart .fsel{ fill:var(--accent-bg); }
  .fchart rect.ffree{ fill:url(#fhatch); }
  .ftbl{ width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  .ftbl th{ font:var(--t-label); text-transform:uppercase; letter-spacing:.04em; color:var(--muted); text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  .ftbl td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .ftbl .num{ text-align:right; white-space:nowrap; }
  .ftbl tr.frow{ cursor:pointer; } .ftbl tr.frow:hover td{ background:var(--card2); } .ftbl tr.frow.on td{ background:var(--accent-bg); }
  .ftbl tr.ftop td:first-child{ box-shadow:inset 3px 0 0 var(--amber); }
  .fdot{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:8px; vertical-align:middle; }
  .fspark{ display:inline-flex; align-items:flex-end; gap:2px; height:24px; } .fspark i{ width:6px; border-radius:1px; display:block; }
  .fchev{ color:var(--muted); width:18px; }
  .fdet td{ background:var(--bg2); padding:var(--s-3); }
  .fsw{ display:inline-flex; margin-bottom:var(--s-2); }
  .fsite{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; margin-top:8px; }
  .fsh{ display:flex; justify-content:space-between; font:var(--t-strong); margin-bottom:4px; }
  .fop{ display:grid; grid-template-columns:minmax(0,1fr) 70px 140px; gap:4px 12px; padding:3px 0; border-top:1px solid var(--line); font:var(--t-small); align-items:baseline; }
  .fop .fwho{ grid-column:1/-1; color:var(--muted); font-size:12px; }
  .fop .fon{ min-width:0; overflow-wrap:anywhere; }
  @media (max-width:700px){ .fop{ grid-template-columns:minmax(0,1fr) auto; } .fop .num:last-of-type{ grid-column:2; } .ftbl th:nth-child(5),.ftbl td:nth-child(5){ display:none; } }
  .pill.pu{ font-variant-numeric:tabular-nums; }
  .pscope{ margin:var(--s-2) 0; padding:6px 10px; border-radius:var(--r-ctl); background:var(--card2); border:1px solid var(--accent,#3b82f6); }
  .plog{ margin-top:var(--s-3); }
  @media (max-width:700px){ .prow{ grid-template-columns:18px 1fr; } .prow .pq{ display:none; } .prow .pst,.prow .pac{ grid-column:2; } .pedit{ margin-left:0; } }
  .ptab{ padding:var(--s-1) var(--s-3); cursor:pointer; color:var(--muted); border-radius:calc(var(--r-ctl) - 3px); white-space:nowrap; font:var(--t-strong); border:1px solid transparent; display:inline-flex; align-items:center; gap:var(--s-1); }
  .ptab:hover{ color:var(--fg); }
  .ptab.on{ color:var(--fg); background:var(--card); border-color:var(--line); box-shadow:var(--shadow-card); font-weight:600; }
  .ptab .cnt{ font:var(--t-label); color:var(--muted); background:var(--grey-bg); border-radius:var(--r-pill); padding:0 6px; min-width:18px; text-align:center; }
  .ptab .cnt:empty{ display:none; }
  .ptab .s{ display:none; }
  @media (max-width:640px){ .ptab .l{ display:none; } .ptab .s{ display:inline; } .ptab{ padding:var(--s-1) var(--s-2); } .ptabw{ margin-left:calc(-1*var(--s-3)); margin-right:calc(-1*var(--s-3)); padding-left:var(--s-3); padding-right:var(--s-3); } }
  .ppan{ display:none; } .ppan.on{ display:block; }
  /* ── компактная шапка заказа: одна строка «номер · имя · статус · срок · итоги», под ней действия ── */
  .ohead{ display:flex; flex-direction:column; gap:var(--s-2); padding-bottom:var(--s-2); border-bottom:1px solid var(--line); }
  .ohrow{ display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; min-width:0; }
  .ohrow .grow{ flex:1 1 auto; }
  .ohrow .oname{ font:var(--t-strong); cursor:pointer; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:40vw; }
  .ohrow .oname:hover{ color:var(--accent-text); }
  .ohrow select{ min-height:var(--h-sm); padding:0 var(--s-2); font:var(--t-small); }
  .ohrow .meta a{ text-decoration:none; }
  .ohrow.acts button{ min-height:var(--h-sm); padding:0 var(--s-2); font:var(--t-small); }
  .bcard.odet{ padding:var(--s-3) var(--s-4); }
  @media (max-width:640px){
    .bcard.odet{ padding:var(--s-2) var(--s-3); }
    .ohrow .oname{ max-width:100%; flex:1 1 100%; }
    /* телефон: кнопки действий одной лентой с прокруткой вбок, а не в четыре ряда */
    .ohrow.acts{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 calc(-1*var(--s-3)); padding:0 var(--s-3); }
    .ohrow.acts::-webkit-scrollbar{ display:none; }
    .ohrow.acts button{ flex:none; }
  }
  /* ── матрицы «деталь × операции»: узкие колонки с вертикальными заголовками, лента участков сверху ── */
  .mxcap{ font:var(--t-label); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:var(--s-2) 0 var(--s-1); display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; }
  .mxcap .th{ text-transform:none; letter-spacing:0; font:var(--t-tiny); }
  /* переключатель вида таблиц — заметный, как вкладки (владелец 29.10.2026: «не видно, что можно переключить») */
  .mxswrow{ display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; margin:var(--s-2) 0 var(--s-2); }
  .mxswl{ font:var(--t-small); color:var(--muted); }
  .mxsw{ display:inline-flex; gap:2px; padding:3px; background:var(--card2); border:1px solid var(--line); border-radius:var(--r-ctl); }

  .fllift{ color:var(--blue); font:var(--t-label); cursor:help; }
  .flover{ display:block; font:var(--t-label); color:var(--amber); font-variant-numeric:tabular-nums; }
  .flhist{ font:var(--t-tiny); color:var(--muted); cursor:pointer; }
  .flpen{ font:var(--t-small); color:var(--muted); cursor:pointer; opacity:0; transition:opacity .12s var(--ease); padding:0 2px; }
  table.floor td:hover .flpen{ opacity:1; }
  /* на телефоне наведения нет — карандаш виден всегда, иначе правку не открыть */
  @media (hover:none){ .flpen{ opacity:.75; font:var(--t-body); } }
  @media (max-width:820px){
    table.floor .dn{ max-width:104px; font:var(--t-small); line-height:15px; padding:var(--s-1); }
    table.floor th,table.floor td{ padding:var(--s-1) 4px; }
    table.floor thead th{ font:var(--t-tiny); max-width:70px; }
    .flf{ font:var(--t-heading); } .fll{ font:var(--t-tiny); }
    table.floor{ --flh1:24px; }
    .fll.fl2{ display:block; }                 /* «сд.» и «ост.» в два ряда — колонка вдвое уже */
    .fll.fl2::before{ content:''; }
    .gcard.flg .gbody{ padding:0 var(--s-1) var(--s-2); }   /* на телефоне каждый пиксель ширины на счету */
    .tray{ padding-left:var(--s-2); padding-right:var(--s-2); }
    .gcard .flhint{ display:block; }
  }
  .flhint{ display:none; font:var(--t-label); color:var(--muted); margin:0 0 var(--s-1); }
  /* Телефон: таблицы внутри карточек (участки, заказ по операциям) вписываются в ширину —
     иначе видны только названия деталей, а цифры уезжают за край. Таблица участка (.floor)
     этого правила не знает: она живёт горизонтальной прокруткой. */
  @media (max-width:820px){
    .gbody table:not(.floor){ table-layout:fixed; width:100%; font:var(--t-small); }
    .gbody table:not(.floor) th,.gbody table:not(.floor) td{ white-space:normal; padding:var(--s-1) 4px; }
    .gbody table:not(.floor) td{ overflow-wrap:anywhere; }   /* рвём длинные названия деталей, но не шапку */
    .gbody table:not(.floor) th{ font:var(--t-tiny); }
    .gbody table:not(.floor) td.num{ white-space:nowrap; }      /* 1280 не должно ломаться на «128 0» */
    .gbody table:not(.floor) th:first-child,.gbody table:not(.floor) td:first-child{ width:40%; }
    .gbody .c-hide{ display:none; }
  }
  /* шапка участка в табличном виде: строка-кнопка, на телефоне переносится */
  .flg .grow{ gap:var(--s-2); }
  .flg .gbody{ padding:0 var(--s-2) var(--s-2); }
  /* ── проверки логики ── */
  .chkok{ margin-top:var(--s-4); font:var(--t-small); color:var(--green); background:var(--green-bg); border-radius:var(--r-ctl); padding:var(--s-2) var(--s-3); }
  .chktray{ background:var(--amber-bg); }
  .chklist{ max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:var(--s-1); }
  .cissue{ display:flex; gap:var(--s-2); align-items:flex-start; font:var(--t-small); background:var(--card); border:1px solid var(--line); border-radius:var(--r-ctl); padding:var(--s-2) var(--s-3); }
  .cissue .cdot{ width:8px; height:8px; border-radius:50%; margin-top:var(--s-1); flex:none; background:var(--muted); }
  .cissue.red .cdot{ background:var(--red); }
  .cissue.amber .cdot{ background:var(--amber); }
  .cissue.info .cdot{ background:var(--blue); }
  .cissue[data-jump]:hover{ background:var(--card2); }
  .cgo{ color:var(--accent-text); font-weight:600; white-space:nowrap; cursor:pointer; }
  .cx{ color:var(--muted); font-weight:600; white-space:nowrap; cursor:pointer; margin-left:var(--s-2); }
  .cx:hover{ color:var(--red); }
  .chk{ font:var(--t-tiny); cursor:pointer; } .chk.red{ color:var(--red); } .chk.amber{ color:var(--amber); } .chk.info{ color:var(--blue); }
  tbody tr.hl td, table.floor.mx td.hl{ background:var(--amber-bg); transition:background-color .3s var(--ease); }
  /* ── перенос перевыполнения на другое изделие ── */
  .mvbtn{ font:var(--t-label); color:var(--accent-text); cursor:pointer; white-space:nowrap; margin-left:var(--s-2); }
  .mvbtn:hover{ text-decoration:underline; }
  /* окно .mvov/.mvbox — подложка и окно темы (.dlg-bg/.dlg) */
  .mvbox h3{ margin:0 0 var(--s-1); }
  .mvtgt{ font:var(--t-small); background:var(--bg); border:1px solid var(--line); border-radius:var(--r-ctl); padding:var(--s-2) var(--s-3); margin:var(--s-2) 0; }
  .mvtgt b{ color:var(--green); } .mvtgt .o{ color:var(--red); }
  .mvn{ display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; border-top:1px solid var(--line); padding:var(--s-2) 0; font:var(--t-small); }
  .mvn select{ max-width:100%; }
  /* ── изделие: сворачиваемая карточка ── */
  /* ⚠ без overflow:hidden — иначе карточка становится «окном прокрутки» для липкой шапки таблицы, и та не цепляется к экрану */
  .pcard{ border:1px solid var(--line); border-radius:var(--r-ctl); margin-bottom:var(--s-2); background:var(--card); }
  .phead{ display:flex; align-items:center; gap:var(--s-3); padding:var(--s-2) var(--s-3); cursor:pointer; user-select:none; flex-wrap:wrap; border-radius:var(--r-ctl); }
  .pcard.open .phead{ border-radius:var(--r-ctl) var(--r-ctl) 0 0; }
  .phead:hover{ background:var(--card2); }
  .pname{ font-weight:600; flex:1; min-width:160px; }
  .ppct{ font-variant-numeric:tabular-nums; font-weight:600; min-width:44px; text-align:right; }
  .pcar{ color:var(--muted); font:var(--t-small); width:12px; transition:transform .15s var(--ease); }
  .pcard.open .pcar{ transform:rotate(90deg); }
  .pbody{ display:none; padding:0 var(--s-3) var(--s-3); } .pcard.open .pbody{ display:block; }
  /* ⚠ у всех ячеек стоит white-space:nowrap — из-за длинных названий деталей таблица уезжала
     за край карточки и её приходилось скроллить вбок. Здесь фиксируем колонки и разрешаем перенос. */
  .pbody table{ table-layout:fixed; }
  .pbody th,.pbody td{ white-space:normal; overflow-wrap:anywhere; }
  .pbody col.c-det{ width:21%; } .pbody col.c-op{ width:19%; }
  .pbody col.c-need{ width:8%; } .pbody col.c-stock{ width:12%; }
  .pbody col.c-done{ width:9%; } .pbody col.c-factc{ width:11%; } .pbody col.c-rest{ width:20%; }
  /* компактная шапка операций (владелец 28.10.2026): листаешь заказ вниз — названия операций закреплены под вкладками,
     мелко в 2–3 строки вместо высоких вертикальных; едет вбок вместе с таблицей. Своя липкая шапка матрицы больше не нужна:
     в широкой таблице она цеплялась к рамке прокрутки и уезжала вверх вместе с таблицей */
  table.floor.mx thead th{ position:static; }
  #mxfh{ position:fixed; z-index:19; display:none; overflow:hidden; height:42px; background:var(--card); border-bottom:1px solid var(--line2); box-shadow:0 2px 6px rgba(0,0,0,.08); }
  #mxfh .fs{ position:absolute; top:0; left:0; height:100%; }
  #mxfh i{ position:absolute; top:0; height:3px; }
  #mxfh b{ position:absolute; top:3px; bottom:0; display:flex; align-items:center; justify-content:center; text-align:center; box-sizing:border-box; padding:0 2px;
    font-size:10px; line-height:11px; font-weight:500; color:var(--fg2,var(--fg)); overflow:hidden; overflow-wrap:break-word; hyphens:auto; border-right:1px solid var(--line); }
  #mxfh b[data-pin]{ background:var(--card); z-index:1; justify-content:flex-start; text-align:left; font-weight:600; padding-left:var(--s-2); }
  #mxfh b.fin{ color:var(--green); background:var(--green-bg); } #mxfh b.rw{ color:var(--amber); }
  /* «План на завтра» для бригадира (02.11.2026) */
  .dphead{ display:flex; gap:var(--s-4); flex-wrap:wrap; align-items:flex-end; }
  .dphead .big{ font-size:28px; font-weight:700; line-height:1.1; }
  .dpgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:var(--s-3); }
  .dpsite h3{ margin:0; font-size:16px; display:flex; gap:var(--s-2); align-items:baseline; flex-wrap:wrap; }
  .dpload{ height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:6px 0 4px; } .dpload i{ display:block; height:100%; background:var(--acc,#2f7d5b); }
  .dpt{ display:grid; grid-template-columns:22px 1fr auto; gap:2px 8px; padding:5px 0; border-top:1px solid var(--line); align-items:baseline; }
  .dpt .n{ color:var(--muted); font-size:12px; text-align:right; } .dpt .q{ text-align:right; white-space:nowrap; }
  .dpwhen{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-top:8px; }
  .dpsrc{ font-size:11px; padding:0 5px; border-radius:6px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .dpjam{ display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:4px 0; border-top:1px solid var(--line); }
  .dptbl td,.dptbl th{ padding:4px 8px; text-align:left; vertical-align:top; } .dptbl td.num{ text-align:right; white-space:nowrap; }
  @media print{ .noprint,.toolbar{ display:none!important } .dpsite,.dpcard{ break-inside:avoid } .card{ box-shadow:none!important } .dpgrid{ grid-template-columns:1fr 1fr } }
</style>

<body>
<div id="twload"><i></i></div>
<div id="twwait"><div class="wb"><div class="sp"></div><div class="wt" id="twwt">Отправляю…</div><div class="wh">идёт обмен с сервером — не нажимайте</div></div></div>
<div class="hi">🏭 Производство · план и наличие</div>
<div id="app"><div class="center muted">Загрузка…</div></div>
<script>
var BASE=(window.TW_CFG&&TW_CFG.hub)||'https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';   // адрес задаёт tw-config.js; запасной — живой GAS
var APP='tw7prod';
// ⚠ ЛИЧНОСТЬ — ТОКЕНОМ, А НЕ АДРЕСОМ: ?tgid= в ссылке ничего не доказывает (Telegram ID виден
// в списке сотрудников). Токен выдаётся после входа в сервис и лежит в localStorage этого браузера.
function twTok(){ try{ return twQp('tok')||localStorage.getItem('tw_tok')||''; }catch(e){ return twQp('tok')||''; } }
function twQp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
(function(){ var t=twQp('tok'); if(t){ try{ localStorage.setItem('tw_tok',t); }catch(e){} } })();
function twAuthWall(r){
  if(r&&r.needAuth){ document.body.innerHTML='<div style="padding:var(--s-6);font:var(--t-body);color:var(--fg)">'
    +'<div style="font:var(--t-title);margin-bottom:var(--s-3)">🔒 Нужен вход</div>'
    +'<div>'+String(r.error||'Откройте сервис из бота @TWOtchbot или войдите по личному коду.')+'</div></div>'; }
  return r;
}
function api(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; if(typeof TGID!=='undefined'&&TGID&&!p.tgid) p.tgid=TGID; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}).then(twAuthWall); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function $(id){ return document.getElementById(id); }
function money(n){ n=Number(n)||0; return n.toFixed(2).replace('.',','); }
var app=$('app'), NEEDS=[], BATCHES=[], MODELS=[], MODMAP={}, DETAIL=null, PULSE=null;
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }

var LASTLOAD=0;
function load(silent){
  if(!silent) app.innerHTML='<div class="center muted">Загрузка…</div>';
  Promise.all([api({vapi:'prodneeds'}), api({vapi:'batches'})]).then(function(res){
    NEEDS=(res[0]&&res[0].rows)||[]; BATCHES=(res[1]&&res[1].batches)||[]; PULSE=(res[1]&&res[1].pulse)||null;
    if(!FLOW||FLOW.days.length<7) loadFlow(Math.max(7,FLOWN),function(){ if(VIEW==='list') renderList(); });
    LASTLOAD=Date.now();
    // тихое обновление не выдёргивает почву из-под ввода: если человек что-то печатает — не перерисовываем
    if(silent && document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    render();
    if(!MODELS.length) loadModels();
    var b0=qp('batch'); if(b0 && !LINK_DONE){ LINK_DONE=1; openOrder(b0); }   // переход из сделки: ?batch=ПАРТ-N
  }).catch(function(e){ if(!silent) app.innerHTML='<div class="center err">Ошибка загрузки: '+esc(e.message||e)+'</div>'; });
}
function loadModels(){
  api({vapi:'catmodels'}).then(function(r){
    MODELS=(r&&r.rows)||[]; MODMAP={}; MODELS.forEach(function(m){ MODMAP[modLabel(m)]=m; });
    var dl=$('modlist'); if(dl) dl.innerHTML=MODELS.map(function(m){ return '<option value="'+esc(modLabel(m))+'">'; }).join('');
  }).catch(function(){});
}
function modLabel(m){ var v=[m.size,m.color,m.kit].filter(Boolean).join(' '); return [m.equip,m.model].filter(Boolean).join(' · ')+(v?(' ('+v+')'):'')+(m.sku?(' — '+m.sku):''); }
function costBadge(s){ if(s==='полностью') return '<span class="pill ok">✓ посчитано</span>'; if(s==='частично') return '<span class="pill warn">~ частично</span>'; return '<span class="pill bad">✗ не посчитано</span>'; }

function nm(x){ return [x.equip,x.model].filter(Boolean).join(' · ')||x.sku||'—'; }

var VIEW='list', CUR=null;
function statusPill(st){ var m={'новая':'|','в работе':' info|ⓘ ','готово':' ok|✓ ','отгружено':' mute|'}; var p=(m[st]||'|').split('|'); return '<span class="pill'+p[0]+'">'+p[1]+esc(st)+'</span>'; }
function statusColor(st){ var m={'новая':'var(--line2)','в работе':'var(--accent)','готово':'var(--green)','отгружено':'var(--muted)'}; return m[st]||'var(--line2)'; }
function itemName(it){ return [it.equip,it.model].filter(Boolean).join(' · ')||it.sku||'—'; }
function catUrl(x){ var f='find='+encodeURIComponent(x||'')+'&tok='+encodeURIComponent(twTok()||''); return (window.TW_CFG&&TW_CFG.srv!=='gas') ? 'catalog.html?'+f : BASE+'?page=catalog&'+f; }   // каталог с фокусом на изделие: через Прохаб — новый экран, иначе панель хаба

function render(){ if(VIEW==='flow'){ renderFlow(); return; } if(VIEW==='dayplan'){ renderDayPlan(); return; } if(VIEW==='detail'&&CUR){ if(DETAIL&&DETAIL.id===CUR) renderDetail(); else loadDetail(CUR); } else { renderList(); } }
/* ── у одной работы два имени (владелец 14.10.2026): ПАРТ-N в цехе, №N у продаж. Заказ показывает свои сделки; отгрузка и документы — в сделке ── */
function pageUrl(page, k, v){ var sp=new URLSearchParams(location.search); ['batch','deal'].forEach(function(x){ sp.delete(x); }); sp.set(k, v); return page+'?'+sp.toString(); }
function dealsChips(b){ return (b.deals||[]).map(function(d){ return '<span class="pill info" title="сделка продаж">'+esc(d.num)+(d.client?' · '+esc(d.client):'')+'</span>'; }).join(''); }
function dealsLine(b){
  var ds=b.deals; if(!ds) return '';   // старый сервер — без связи
  if(!ds.length) return '<div class="muted" style="margin-top:var(--s-2)">Продажа: сделка не привязана — отгрузочные документы выписываются из сделки (раздел «Сделки» → заказ на производство по счёту).</div>';
  return '<div class="row" style="margin-top:var(--s-2);gap:var(--s-2);flex-wrap:wrap"><span class="muted">Продажа:</span>'+ds.map(function(d){
    var u=pageUrl('sales.html','deal',d.id);
    return '<a href="'+esc(u)+'" style="font-weight:600">'+esc(d.num)+'</a>'+(d.client?' <span>'+esc(d.client)+'</span>':'')+(d.invoice?' <span class="muted">· счёт '+esc(d.invoice)+'</span>':'')
      +' <a class="btn sm sec" href="'+esc(u)+'" title="накладные, инвойсы, упаковочные листы, CMR — в карточке сделки">📄 Отгрузка и документы</a>'; }).join('<span class="muted">·</span>')+'</div>';
}
var LINK_DONE=0;
function openOrder(id){ VIEW='detail'; CUR=id; DETAIL=null; app.innerHTML='<div class="center muted">Загрузка заказа…</div>'; window.scrollTo(0,0); if(!MODELS.length) loadModels(); loadDetail(id); }
var DETAIL_STATUSES=[];
function backToList(){ VIEW='list'; CUR=null; DETAIL=null; load(); }
// загрузить полный разворот ОДНОГО заказа по требованию (себестоимость/собрано считаются только для него)
function loadDetail(id, silent){
  api({vapi:'batch', batch:id}).then(function(r){
    if(r&&r.ok&&r.batch){
      DETAIL=r.batch; DETAIL_STATUSES=r.statuses||[]; LASTLOAD=Date.now();
      if(VIEW!=='detail'||CUR!==id) return;
      if(silent && document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
      renderDetail();
    }
    else if(!silent){ alert((r&&r.error)||'заказ не найден'); backToList(); }
  }).catch(function(e){ if(!silent) app.innerHTML='<div class="center err">Ошибка: '+esc(e.message||e)+'</div>'; });
}
function reloadDetail(){ if(CUR) loadDetail(CUR); }
// пересобрать операции заказа из актуального состава/расценок (остатки и выработка сохраняются)
function recalcOps(id){ var m=$('bm_'+id); if(m) m.textContent='пересчитываю…';
  api({vapi:'recalcorderops', batch:id}).then(function(r){
    if(r&&r.ok){ if(m) m.innerHTML='<span class="ok">пересчитано ✓</span>'; reloadDetail(); }
    else if(m) m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>';
  }).catch(function(){ if(m) m.innerHTML='<span class="err">сеть недоступна</span>'; });
}

function needSection(){
  var needRows=NEEDS.map(function(n,i){
    var badge=n.toProduce>0?'<span class="pill warn">⏳ '+n.toProduce+'</span>':'<span class="pill ok">✓ 0</span>';
    return '<tr><td>'+esc(nm(n))+(n.sku?' <span class="muted">'+esc(n.sku)+'</span>':'')+'</td>'
      +'<td class="num">'+n.sold+'</td><td class="num">'+n.available+'</td><td class="num">'+n.inProduction+'</td>'
      +'<td class="num"><input class="q" id="tg'+i+'" value="'+(n.target||0)+'"> <button class="sec sm" onclick="saveTarget('+i+')">✓</button></td>'
      +'<td class="num">'+badge+'</td></tr>';
  }).join('');
  return '<div class="sect">Потребность к производству <button class="sm" onclick="planNow()">⚙️ Собрать из продаж</button></div>'
    +'<div class="box tbl-wrap"><table class="tbl"><thead><tr><th>Товар</th><th class="num">Продано-ждёт</th><th class="num">Доступно</th><th class="num">В произв.</th><th class="num">Целевой запас</th><th class="num">К произв.</th></tr></thead><tbody>'
    +(needRows||'<tr><td colspan=6 class="muted">потребности нет</td></tr>')+'</tbody></table>'
    +'<div class="muted" style="margin-top:var(--s-2)">«Собрать из продаж» соберёт партию по непроведённым продажам (наличие в резерв, нехватку — в производство).</div></div>';
}

// ── ПУЛЬС / ПРИОРИТЕТ / РИСК (управленческий обзор) ──
// панель действий списка: слева счётчик (в работе · очередь · срок разгребания), справа «Новый заказ»
function listToolbar(){
  var p=PULSE, meta='';
  if(p){
    var cap = p.capacityDays!=null ? ('~'+p.capacityDays+' дн') : '—';
    meta=plural(p.activeCount||0,'заказ','заказа','заказов')+' в работе · очередь '+money(p.totalLeft)+' ₽ · разгребём за '+cap;

/* ── партии внутри заказа (01.11.2026): только план — очередь; факт раздаётся по очереди, общие детали — первой партии ── */
var PART={}, PARTS={}, PARTED={};
function partScopeHtml(id,r){ var p=r&&r.order&&r.order.part; if(!p) return '';
  return '<div class="pscope"><b>'+esc(p.name==='вне партий'?'Вне партий':'Партия '+p.name)+'</b> — карточка в объёме партии: общие детали раздаются по очереди партий. Правки «лежит» и переучёт — в заказе целиком. <a href="javascript:void(0)" onclick="partScope(\''+id+'\',\'\')">← весь заказ</a></div>'; }
function partScope(id,pid){ PART[id]=pid||''; renderParts(id); if(pid) showPTab(id,'det'); loadOps(id); }
function loadParts(id){
  var box=$('pan_part_'+id); if(!box) return;
  api({vapi:'pbatches',batch:id}).then(function(r){ PARTS[id]=r; renderParts(id); }).catch(function(e){ box.innerHTML='<div class="err">'+esc(String(e))+'</div>'; });
}
function partBar(p){ var v=Math.max(0,Math.min(100,Number(p)||0)); return '<span class="pbarx" title="готовность по труду: '+v+'%"><i style="width:'+v+'%"></i></span><b class="pbn">'+v+'%</b>'; }
function partItemsShort(items,from){ return (items||[]).map(function(x){ return '<span class="pchip" draggable="true" title="перетащите в другую партию" data-item="'+esc(x.item)+'" data-from="'+esc(from||'')+'" data-qty="'+x.qty+'" data-model="'+esc(x.model)+'" ondragstart="partItemDrag(event)">'
    +esc(x.model)+' <b>'+r1(x.qty)+'</b>'+(x.packed>0?' <span class="muted">(уп. '+r1(x.packed)+(x.shipped>0?', увезено '+r1(x.shipped):'')+')</span>':'')+'</span>'; }).join(' · ')||'<span class="muted">пусто</span>'; }
function partFc(f){ if(!f) return ''; if(!f.date) return '<span class="err small" title="по табелю и средней численности участок не закончит за полгода — проверьте людей участка в табеле">не успевает за полгода: мало людей на участке «'+esc(f.bottleneck||'')+'»</span>';
  var d=String(f.date).split('-'); return '<span class="small" title="по табелю и средней численности участков, если цех работает на этот заказ">готова ≈ <b>'+d[2]+'.'+d[1]+'</b>'+(f.bottleneck?' · узкое: '+esc(f.bottleneck):'')+'</span>'; }
function renderParts(id){
  var box=$('pan_part_'+id), r=PARTS[id]; if(!box) return;
  if(!r||!r.ok){ box.innerHTML='<div class="muted" style="margin-top:var(--s-3)">'+esc((r&&r.error)||'')+'</div>'; ptabCount(id,'part',''); return; }
  var cur=PART[id]||'', SC={'в очереди':'mute','в работе':'info','готова':'ok','отгружена':'ok'};
  var row=function(b,i){ var on=cur===b.id;
    return '<div class="prow'+(on?' on':'')+'" draggable="true" data-id="'+b.id+'" ondragstart="partDrag(event)" ondragover="partOver(event)" ondrop="partDrop(event,\''+id+'\')">'
      +'<span class="hnd" title="перетащить — поменять очередь">⠿</span><span class="pq">'+(i+1)+'</span>'
      +'<span class="pnm"><b>'+esc(b.name)+'</b> <span class="pill '+(SC[b.status]||'mute')+'">'+esc(b.status)+'</span>'+(b.note?' <span class="muted small">'+esc(b.note)+'</span>':'')+'<br><span class="small">'+partItemsShort(b.items,b.id)+'</span></span>'
      +'<span class="pst">'+partBar(b.pct)+'<br><span class="small muted">сделано '+money(b.doneRub)+' · осталось '+money(b.leftRub)+' ₽</span>'+(b.status!=='отгружена'?'<br>'+partFc(b.forecast):'')+'</span>'
      +'<span class="pac">'+(b.canShip>0&&b.status!=='отгружена'?'<button class="green sm" onclick="partShip(\''+id+'\',\''+b.id+'\')" title="увезти упакованное этой партии: '+r1(b.canShip)+' шт">🚚 '+r1(b.canShip)+'</button>':'')
      +(b.status!=='отгружена'?'<button class="sec sm" onclick="openDayPlan(\''+id+'\',\''+b.id+'\')" title="план на завтра по участкам: эта партия первой">📋 План</button>':'')
      +'<button class="sec sm" onclick="partScope(\''+id+'\',\''+b.id+'\')" title="карточка заказа в объёме этой партии">'+(on?'✓ показана':'Показать')+'</button>'
      +'<button class="sec sm" onclick="partEdit(\''+id+'\',\''+b.id+'\')" title="товары и количества, имя, заметка">✎</button>'
      +'<button class="sec sm" onclick="partDel(\''+id+'\',\''+b.id+'\')" title="удалить партию: товары вернутся во «вне партий»">🗑</button></span></div>'
      +(PARTED[id]===b.id?partEditor(id,b):''); };
  var out=r.outside||{items:[]};
  var outRow='<div class="prow out'+(cur==='out'?' on':'')+'" data-id="" ondragover="partOver(event)" ondrop="partDrop(event,\''+id+'\')"><span class="hnd"></span><span class="pq"></span><span class="pnm"><b>Вне партий</b><br><span class="small">'+partItemsShort(out.items,'')+'</span></span>'
    +'<span class="pst">'+(out.items.length?partBar(out.pct)+'<br><span class="small muted">сделано '+money(out.doneRub)+' · осталось '+money(out.leftRub)+' ₽</span><br>'+partFc(out.forecast):'<span class="muted small">всё распределено по партиям</span>')+'</span>'
    +'<span class="pac">'+(out.items.length?'<button class="sec sm" onclick="partScope(\''+id+'\',\'out\')">'+(cur==='out'?'✓ показана':'Показать')+'</button>':'')+'</span></div>';
  var log=(r.log||[]).map(function(l){ var d=l.data||{}, t=l.action;
    var txt=t==='количество'?(partItemName(r,d.item)+': '+r1(d.was)+' → '+r1(d.now)):t==='перенос'?(partItemName(r,d.item)+' '+r1(d.qty)+': '+esc(d.from)+' → '+esc(d.to)):t==='порядок'?((d.now||[]).map(esc).join(' → ')):esc(d.name||'');
    return '<tr><td class="small">'+esc(fmtDT(l.at))+'</td><td class="small">'+esc(l.who)+'</td><td class="small"><b>'+esc(t)+'</b> '+txt+'</td></tr>'; }).join('');
  box.innerHTML='<div class="ptop"><b>Очередь партий</b> <span class="muted small">факт заказа раздаётся по очереди: общие детали — сначала первой партии. Перестановка ничего не меняет на участках.</span><span class="grow"></span>'
    +'<button class="green sm" onclick="partNew(\''+id+'\')">＋ Партия</button></div>'
    +((r.batches||[]).length?(r.batches||[]).map(row).join(''):'<div class="muted" style="margin:var(--s-2) 0">партий пока нет — весь заказ «вне партий»</div>')
    +(PARTED[id]==='new'?partEditor(id,null):'')+outRow
    +(log?'<details class="plog"><summary>История изменений</summary><table class="tbl">'+log+'</table></details>':'');
  ptabCount(id,'part',(r.batches||[]).length?String(r.batches.length):'');
}
function partItemName(r,item){ var x=(r.items||[]).filter(function(i){ return i.item===item; })[0]; return x?esc(x.model):'товар'; }
function fmtDT(s){ var d=new Date(s); if(isNaN(d)) return ''; var p=function(n){ return (n<10?'0':'')+n; }; return p(d.getDate())+'.'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function partEditor(id,b){
  var r=PARTS[id], other={};   // в других партиях — по позиции
  (r.batches||[]).forEach(function(x){ if(b&&x.id===b.id) return; (x.items||[]).forEach(function(i){ other[i.item]=(other[i.item]||0)+i.qty; }); });
  var mine={}; ((b&&b.items)||[]).forEach(function(i){ mine[i.item]=i.qty; });
  var hid=0, rows=(r.items||[]).map(function(it){ var free=Math.max(0,r1(it.qty-(other[it.item]||0))), has=!!mine[it.item];
    if(!free&&!has) hid++;   // всё уже в других партиях — прячем под «показать все»
    return '<div class="pit'+(!free&&!has?' full':'')+'"><span class="pin-nm"><b>'+esc(it.model)+'</b><span class="pin-sub">'+esc([it.eq,it.sku].filter(Boolean).join(' · '))+'</span></span>'
      +'<span class="pin-fr">свободно <b>'+free+'</b> из '+r1(it.qty)+'</span>'
      +'<input class="q pin" data-item="'+it.item+'" data-max="'+free+'" value="'+(has?r1(mine[it.item]):'')+'" placeholder="0" inputmode="decimal">'
      +(free>0?'<a href="javascript:void(0)" onclick="partAll(this,'+free+')" title="взять всё свободное">все</a>':'<span></span>')+'</div>'; }).join('');
  return '<div class="pedit" id="pedit_'+id+'"><div class="ped-h"><b>'+(b?'Партия '+esc(b.name):'Новая партия')+'</b>'
    +'<input id="pename_'+id+'" placeholder="имя (пусто — '+esc((r.order&&r.order.num||'').replace('ПАРТ-',''))+'/N)" value="'+esc(b?b.name:'')+'">'
    +'<input id="penote_'+id+'" placeholder="заметка" value="'+esc(b?b.note:'')+'">'
    +'<a href="javascript:void(0)" onclick="partAllFree(\''+id+'\')">взять всё свободное</a></div>'
    +'<div class="pits'+(hid?' hidefull':'')+'" id="pits_'+id+'">'+rows+'</div>'
    +(hid?'<a href="javascript:void(0)" class="small" onclick="this.previousElementSibling.classList.remove(\'hidefull\');this.remove()">показать все товары ('+hid+' уже распределены)</a>':'')
    +'<div class="row"><button class="green sm" id="pesave_'+id+'" onclick="partSave(\''+id+'\',\''+(b?b.id:'')+'\')">'+(b?'Сохранить':'Создать партию')+'</button><button class="sec sm" onclick="PARTED[\''+id+'\']=\'\';renderParts(\''+id+'\')">Отмена</button><span class="msg" id="pemsg_'+id+'"></span></div></div>';
}
function partAll(a,free){ var inp=a.parentNode.querySelector('input'); inp.value=free; }
function partAllFree(id){ Array.prototype.forEach.call(document.querySelectorAll('#pedit_'+id+' input.pin'), function(x){ var f=Number(x.getAttribute('data-max'))||0; if(f>0) x.value=f; }); }
function partNew(id){ PARTED[id]='new'; renderParts(id); }
function partEdit(id,pid){ PARTED[id]=PARTED[id]===pid?'':pid; renderParts(id); }
function partSave(id,pid){
  var items=[]; Array.prototype.forEach.call(document.querySelectorAll('#pedit_'+id+' input.pin'), function(x){ var v=Number(String(x.value).replace(',','.'))||0; items.push({item:x.getAttribute('data-item'), qty:v}); });
  if(!pid) items=items.filter(function(x){ return x.qty>0; });
  var m=$('pemsg_'+id), btn=$('pesave_'+id);
  var fail=function(t){ if(btn) btn.disabled=false; if(m){ m.className='msg err'; m.textContent='✕ '+t; } alert('Партия не сохранена: '+t); };
  if(!pid&&!items.length){ fail('впишите количество хотя бы одного товара'); return; }
  if(btn) btn.disabled=true; if(m){ m.className='msg'; m.textContent='сохраняю…'; }
  api({vapi:'pbatchsave',batch:id,id:pid,name:$('pename_'+id).value,note:$('penote_'+id).value,items:JSON.stringify(items)}).then(function(r){
    if(!r||!r.ok){ fail((r&&r.error)||'сервер не ответил'); return; }
    PARTED[id]=''; loadParts(id); if(PART[id]) loadOps(id); flashMsg('✓ партия '+(r.name||'')+' сохранена');

  for(var k=0;k<opts.length;k++) txt+=(k+1)+' — '+opts[k].num+' · '+(opts[k].name||'')+'\n';

// ── ПРАВКА «ЛЕЖИТ СЕЙЧАС» ДИСПЕТЧЕРОМ ──

var FLOORROWS={};   // id заказа → { opId: строка операции с изделием }

}

/* ── журнал клетки (новое ядро, 01.11.2026): каждая запись места — наряд, приёмка, переучёт, отгрузка, правка, отмена — с остатком после неё ── */

function saveFact(id){
  var ov=$('fcov'); if(!ov) return;
  var note=(($('fcnote')||{}).value||'').trim();
  if(note.length<3){ alert('Напишите коротко, почему правите — через неделю никто не вспомнит.'); return; }
  var M=FLOORROWS[id]||{}, list=[];
  Array.prototype.forEach.call(ov.querySelectorAll('.fcq'), function(inp){
    var oid=inp.getAttribute('data-op'), o=M[oid];
    var val=Number(String(inp.value).replace(',','.'));
    if(!isFinite(val)||val<0) return;
    if(o && Math.abs(val-(Number(o.fact)||0))<0.001) return;    // не трогали — не пишем
    list.push({op:oid,qty:val});
  });
  if(!list.length){ closeFact(); return; }
  var i=0;
  var step=function(force){
    if(i>=list.length){ closeFact(); loadOps(id); return; }
    var x=list[i];
    api({vapi:'setopfact',op:x.op,qty:x.qty,note:note,force:force?1:''}).then(function(r){
      if(r&&r.warn){ if(confirm(r.msg)) step(true); else { i++; step(false); } return; }
      if(!r||!r.ok){ alert((r&&r.error)||'не удалось сохранить'); return; }
      i++; step(false);
    });
  };
  step(false);
}
// ── РАБОТА ПОДРЯДЧИКА ──

// Умолчание — как в прошлый раз у этого подрядчика по этой операции (subconrefs.prelim: supKey → { операция: true }).
function subNk(s){ return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim(); }
function subSupKey(n){ var s=String(n||'').toLowerCase().replace(/[«»"'`’‘]/g,' ').replace(/\s+/g,' ').trim();
  ['ооо','ип','зао','оао','уп','чуп','одо','руп','сооо','чп','чтуп','чтпуп','птчуп','упп','туп','иооо'].forEach(function(fm){ s=s.replace(new RegExp('(^|\\s)'+fm+'(\\s|$)','g'),' '); });   // без \b: на кириллице граница слова не работает
