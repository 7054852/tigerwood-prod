<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигервуд — производство</title>
<script src="tw-theme.js"></script>
<style>
  .sect{ align-items:center; }
  .box{ overflow-x:auto; }
  th,td{ white-space:nowrap; }
  input.q{ width:64px; text-align:right; font-variant-numeric:tabular-nums; }
  /* СТРОКА ПОЗИЦИИ ЗАКАЗА. Раньше «оборудование · модель · артикул» шли одной строкой с nowrap —
     таблица уезжала за экран, и колонка «Отгружено» пряталась под горизонтальной прокруткой.
     Теперь имя в две строки, цифры узкие, ширина держится на table-layout:fixed. */
  table.items{ table-layout:fixed; width:100%; }
  table.items td,table.items th{ padding:var(--s-1) var(--s-2); }
  table.items .c-nm{ width:auto; white-space:normal; }
  table.items .c-n{ width:74px; }
  table.items .c-x{ width:48px; }
  /* ОДНА строка на позицию: 17 изделий должны читаться одним взглядом, без прокрутки
     ни вбок, ни вниз. Различает варианты модель — она и стоит первой; оборудование,
     себестоимость и статус состава уезжают в подсказку при наведении. */
  .inm{ display:flex; align-items:center; gap:var(--s-2); min-width:0; }
  .inm b{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .inm .sku{ color:var(--muted); font-size:11px; white-space:nowrap; }
  table.items input.q{ width:100%; max-width:66px; }
  @media (max-width:640px){
    table.items .c-n{ width:56px; }
    table.items input.q{ max-width:50px; }
    .inm .sku{ display:none; }                   /* на телефоне артикул не нужен — он в подсказке */
  }
  /* компактная отметка «собрано» — пилюля темы (.pill.ok / .pill.warn) */
  /* ⚠ это отметка «состав изделия подтверждён в каталоге», а НЕ «работа завершена».
     Голая зелёная галочка рядом с процентом читалась как «готово» — поэтому подпись видна всегда. */
  .asm{ text-decoration:none; }
  a.asm{ cursor:pointer; }
  .asm .t{ font-weight:500; }
  .prio{ cursor:pointer; }
  /* карточка заказа: статус — точкой в заголовке, без цветной полосы сбоку */
  .bcard{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:var(--s-4); margin-bottom:var(--s-4); box-shadow:var(--shadow-card); }
  .bcard.click{ cursor:pointer; transition:border-color .15s var(--ease), background-color .15s var(--ease), transform .08s var(--ease); }
  .bcard.click:hover{ border-color:var(--line2); background:var(--card2); }
  .bcard.click:active{ transform:translateY(1px); }
  .bcard .mrow{ display:flex; justify-content:space-between; gap:var(--s-2); align-items:baseline; padding:var(--s-2) 0; border-top:1px solid var(--line); }
  .bcard .mrow:first-of-type{ border-top:0; }
  .bhead{ display:flex; align-items:center; gap:var(--s-3); flex-wrap:wrap; }
  .bnum{ font:var(--t-heading); } .bpct{ font-variant-numeric:tabular-nums; }
  .bar{ flex:1; min-width:80px; }
  .msg{ margin-left:var(--s-2); }
  /* ── лоток блока: утопленный фон отделяет группы друг от друга ── */
  .tray{ margin-top:var(--s-4); }
  .trayhd{ display:flex; align-items:baseline; gap:var(--s-2); margin-bottom:var(--s-3); flex-wrap:wrap; }
  .trayhd .tt{ font:var(--t-label); text-transform:uppercase; letter-spacing:.06em; color:var(--fg); }
  .trayhd .cnt{ font:var(--t-label); background:var(--card); border:1px solid var(--line); border-radius:var(--r-pill);
    padding:0 var(--s-2); color:var(--muted); font-variant-numeric:tabular-nums; }
  .trayhd .th{ font:var(--t-small); color:var(--muted); margin-left:auto; }
  @media (max-width:640px){ .trayhd .th{ margin-left:0; flex-basis:100%; } }
  .tray .gcard:last-child, .tray .pcard:last-child{ margin-bottom:0; }
  /* ── участки работ: цвет участка (из данных) — точкой перед названием ── */
  .gcard{ border:1px solid var(--line); border-radius:var(--r-ctl); margin-bottom:var(--s-2); background:var(--card); overflow:hidden; }
  .grow{ display:flex; align-items:center; gap:var(--s-3); padding:var(--s-2) var(--s-3); cursor:pointer; user-select:none; }
  .grow:hover{ background:var(--card2); }
  .gname{ font-weight:600; min-width:96px; }
  .gpct{ font-variant-numeric:tabular-nums; font-weight:600; min-width:48px; text-align:right; }
  .gsum{ color:var(--muted); font:var(--t-small); min-width:160px; text-align:right; font-variant-numeric:tabular-nums; }
  /* узкий экран: строка переносится, итог уходит на свою строку — иначе цифры обрезаются */
  @media (max-width:640px){
    .grow{ flex-wrap:wrap; row-gap:var(--s-2); }
    .gname{ min-width:0; flex:1 1 auto; }
    .bar{ min-width:56px; } .gpct{ min-width:40px; }
    /* строка 1: название + шкала + %, строка 2: участок + итог — иначе % отрывается посреди */
    .gcar{ order:0; } .grow .dot{ order:0; } .gname{ order:1; } .bar{ order:2; } .gpct{ order:3; }
    .grow .pill.zn{ order:4; }
    .gsum{ min-width:0; flex:1 1 auto; text-align:right; order:5; }
  }
  .gcar{ color:var(--muted); font:var(--t-small); width:12px; transition:transform .15s var(--ease); }
  .gcard.open .gcar{ transform:rotate(90deg); }
  .gbody{ display:none; padding:0 var(--s-3) var(--s-3); overflow-x:auto; } .gcard.open .gbody{ display:block; }
  .pill.sh{ cursor:help; }   /* деталь идёт в нескольких изделиях */
  /* ── проверки логики ── */
  .chkok{ margin-top:var(--s-4); font:var(--t-small); color:var(--green); background:var(--green-bg); border-radius:var(--r-ctl); padding:var(--s-2) var(--s-3); }
  .chktray{ background:var(--amber-bg); }
  .chklist{ max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:var(--s-1); }
  .cissue{ display:flex; gap:var(--s-2); align-items:flex-start; font:var(--t-small); background:var(--card); border:1px solid var(--line); border-radius:var(--r-ctl); padding:var(--s-2) var(--s-3); }
  .cissue .cdot{ width:8px; height:8px; border-radius:50%; margin-top:var(--s-1); flex:none; background:var(--muted); }
  .cissue.red .cdot{ background:var(--red); }
  .cissue.amber .cdot{ background:var(--amber); }
  .cissue.info .cdot{ background:var(--blue); }
  .cissue[data-jump]:hover{ background:var(--card2); }
  .cgo{ color:var(--accent-text); font-weight:600; white-space:nowrap; cursor:pointer; }
  .cx{ color:var(--muted); font-weight:600; white-space:nowrap; cursor:pointer; margin-left:var(--s-2); }
  .cx:hover{ color:var(--red); }
  .chk{ font-size:11px; cursor:pointer; } .chk.red{ color:var(--red); } .chk.amber{ color:var(--amber); } .chk.info{ color:var(--blue); }
  tbody tr.hl td{ background:var(--amber-bg); transition:background-color .3s var(--ease); }
  /* ── перенос перевыполнения на другое изделие ── */
  .mvbtn{ font:var(--t-label); color:var(--accent-text); cursor:pointer; white-space:nowrap; margin-left:var(--s-2); }
  .mvbtn:hover{ text-decoration:underline; }
  .mvov{ position:fixed; inset:0; background:var(--scrim); display:flex; align-items:center; justify-content:center; z-index:50; padding:var(--s-4); }
  .mvbox{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); max-width:520px; width:100%; max-height:86vh; overflow:auto; padding:var(--s-5); box-shadow:var(--shadow-pop); }
  .mvbox h3{ margin:0 0 var(--s-1); font:var(--t-heading); }
  .mvtgt{ font:var(--t-small); background:var(--bg); border:1px solid var(--line); border-radius:var(--r-ctl); padding:var(--s-2) var(--s-3); margin:var(--s-2) 0; }
  .mvtgt b{ color:var(--green); } .mvtgt .o{ color:var(--red); }
  .mvn{ display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; border-top:1px solid var(--line); padding:var(--s-2) 0; font:var(--t-small); }
  .mvn select{ max-width:100%; }
  .mvclose{ float:right; color:var(--muted); cursor:pointer; font:var(--t-heading); line-height:1; }
  /* ── изделие: сворачиваемая карточка ── */
  .pcard{ border:1px solid var(--line); border-radius:var(--r-ctl); margin-bottom:var(--s-2); background:var(--card); overflow:hidden; }
  .phead{ display:flex; align-items:center; gap:var(--s-3); padding:var(--s-3); cursor:pointer; user-select:none; flex-wrap:wrap; }
  .phead:hover{ background:var(--card2); }
  .pname{ font-weight:600; flex:1; min-width:160px; }
  .ppct{ font-variant-numeric:tabular-nums; font-weight:600; min-width:44px; text-align:right; }
  .pcar{ color:var(--muted); font:var(--t-small); width:12px; transition:transform .15s var(--ease); }
  .pcard.open .pcar{ transform:rotate(90deg); }
  .pbody{ display:none; padding:0 var(--s-3) var(--s-3); } .pcard.open .pbody{ display:block; }
  /* ⚠ у всех ячеек стоит white-space:nowrap — из-за длинных названий деталей таблица уезжала
     за край карточки и её приходилось скроллить вбок. Здесь фиксируем колонки и разрешаем перенос. */
  .pbody table{ table-layout:fixed; }
  .pbody th,.pbody td{ white-space:normal; overflow-wrap:anywhere; }
  .pbody col.c-det{ width:23%; } .pbody col.c-op{ width:21%; }
  .pbody col.c-need{ width:8%; } .pbody col.c-stock{ width:13%; }
  .pbody col.c-done{ width:9%; } .pbody col.c-rest{ width:26%; }
</style>
</head>
<body>
<div id="twload"><i></i></div>
<div id="twwait"><div class="wb"><div class="sp"></div><div class="wt" id="twwt">Отправляю…</div><div class="wh">идёт обмен с сервером — не нажимайте</div></div></div>
<div class="hi">🏭 Производство · план и наличие</div>
<div id="app"><div class="center muted">Загрузка…</div></div>
<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod';
// ⚠ ЛИЧНОСТЬ — ТОКЕНОМ, А НЕ АДРЕСОМ: ?tgid= в ссылке ничего не доказывает (Telegram ID виден
// в списке сотрудников). Токен выдаётся после входа в сервис и лежит в localStorage этого браузера.
function twTok(){ try{ return twQp('tok')||localStorage.getItem('tw_tok')||''; }catch(e){ return twQp('tok')||''; } }
function twQp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
(function(){ var t=twQp('tok'); if(t){ try{ localStorage.setItem('tw_tok',t); }catch(e){} } })();
function twAuthWall(r){
  if(r&&r.needAuth){ document.body.innerHTML='<div style="padding:var(--s-6);font:var(--t-body);color:var(--fg)">'
    +'<div style="font:var(--t-title);margin-bottom:var(--s-3)">🔒 Нужен вход</div>'
    +'<div>'+String(r.error||'Откройте сервис из бота @TWOtchbot или войдите по личному коду.')+'</div></div>'; }
  return r;
}
function api(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; if(typeof TGID!=='undefined'&&TGID&&!p.tgid) p.tgid=TGID; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}).then(twAuthWall); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function $(id){ return document.getElementById(id); }
function money(n){ n=Number(n)||0; return n.toFixed(2).replace('.',','); }
var app=$('app'), NEEDS=[], BATCHES=[], MODELS=[], MODMAP={}, DETAIL=null, PULSE=null;
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }

var LASTLOAD=0;
function load(silent){
  if(!silent) app.innerHTML='<div class="center muted">Загрузка…</div>';
  Promise.all([api({vapi:'prodneeds'}), api({vapi:'batches'})]).then(function(res){
    NEEDS=(res[0]&&res[0].rows)||[]; BATCHES=(res[1]&&res[1].batches)||[]; PULSE=(res[1]&&res[1].pulse)||null;
    LASTLOAD=Date.now();
    // тихое обновление не выдёргивает почву из-под ввода: если человек что-то печатает — не перерисовываем
    if(silent && document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    render();
    if(!MODELS.length) loadModels();
  }).catch(function(e){ if(!silent) app.innerHTML='<div class="center err">Ошибка загрузки: '+esc(e.message||e)+'</div>'; });
}
function loadModels(){
  api({vapi:'catmodels'}).then(function(r){
    MODELS=(r&&r.rows)||[]; MODMAP={}; MODELS.forEach(function(m){ MODMAP[modLabel(m)]=m; });
    var dl=$('modlist'); if(dl) dl.innerHTML=MODELS.map(function(m){ return '<option value="'+esc(modLabel(m))+'">'; }).join('');
  }).catch(function(){});
}
function modLabel(m){ var v=[m.size,m.color,m.kit].filter(Boolean).join(' '); return [m.equip,m.model].filter(Boolean).join(' · ')+(v?(' ('+v+')'):'')+(m.sku?(' — '+m.sku):''); }
function costBadge(s){ if(s==='полностью') return '<span class="pill ok">✓ посчитано</span>'; if(s==='частично') return '<span class="pill warn">~ частично</span>'; return '<span class="pill bad">✗ не посчитано</span>'; }

function nm(x){ return [x.equip,x.model].filter(Boolean).join(' · ')||x.sku||'—'; }

var VIEW='list', CUR=null;
function statusPill(st){ var m={'новая':'|','в работе':' info|ⓘ ','готово':' ok|✓ ','отгружено':' mute|'}; var p=(m[st]||'|').split('|'); return '<span class="pill'+p[0]+'">'+p[1]+esc(st)+'</span>'; }
function statusColor(st){ var m={'новая':'var(--line2)','в работе':'var(--accent)','готово':'var(--green)','отгружено':'var(--muted)'}; return m[st]||'var(--line2)'; }
function itemName(it){ return [it.equip,it.model].filter(Boolean).join(' · ')||it.sku||'—'; }
function catUrl(x){ return BASE+'?page=catalog&find='+encodeURIComponent(x||''); }   // каталог хаба с фокусом на изделие

function render(){ if(VIEW==='detail'&&CUR){ if(DETAIL&&DETAIL.id===CUR) renderDetail(); else loadDetail(CUR); } else { renderList(); } }
function openOrder(id){ VIEW='detail'; CUR=id; DETAIL=null; app.innerHTML='<div class="center muted">Загрузка заказа…</div>'; window.scrollTo(0,0); if(!MODELS.length) loadModels(); loadDetail(id); }
var DETAIL_STATUSES=[];
function backToList(){ VIEW='list'; CUR=null; DETAIL=null; load(); }
// загрузить полный разворот ОДНОГО заказа по требованию (себестоимость/собрано считаются только для него)
function loadDetail(id, silent){
  api({vapi:'batch', batch:id}).then(function(r){
    if(r&&r.ok&&r.batch){
      DETAIL=r.batch; DETAIL_STATUSES=r.statuses||[]; LASTLOAD=Date.now();
      if(VIEW!=='detail'||CUR!==id) return;
      if(silent && document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
      renderDetail();
    }
    else if(!silent){ alert((r&&r.error)||'заказ не найден'); backToList(); }
  }).catch(function(e){ if(!silent) app.innerHTML='<div class="center err">Ошибка: '+esc(e.message||e)+'</div>'; });
}
function reloadDetail(){ if(CUR) loadDetail(CUR); }
// пересобрать операции заказа из актуального состава/расценок (остатки и выработка сохраняются)
function recalcOps(id){ var m=$('bm_'+id); if(m) m.textContent='пересчитываю…';
  api({vapi:'recalcorderops', batch:id}).then(function(r){
    if(r&&r.ok){ if(m) m.innerHTML='<span class="ok">пересчитано ✓</span>'; reloadDetail(); }
    else if(m) m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>';
  }).catch(function(){ if(m) m.innerHTML='<span class="err">сеть недоступна</span>'; });
}

function needSection(){
  var needRows=NEEDS.map(function(n,i){
    var badge=n.toProduce>0?'<span class="pill warn">⏳ '+n.toProduce+'</span>':'<span class="pill ok">✓ 0</span>';
    return '<tr><td>'+esc(nm(n))+(n.sku?' <span class="muted">'+esc(n.sku)+'</span>':'')+'</td>'
      +'<td class="num">'+n.sold+'</td><td class="num">'+n.available+'</td><td class="num">'+n.inProduction+'</td>'
      +'<td class="num"><input class="q" id="tg'+i+'" value="'+(n.target||0)+'"> <button class="sec sm" onclick="saveTarget('+i+')">✓</button></td>'
      +'<td class="num">'+badge+'</td></tr>';
  }).join('');
  return '<div class="sect">Потребность к производству <button class="sm" onclick="planNow()">⚙️ Собрать из продаж</button></div>'
    +'<div class="box"><table><thead><tr><th>Товар</th><th class="num">Продано-ждёт</th><th class="num">Доступно</th><th class="num">В произв.</th><th class="num">Целевой запас</th><th class="num">К произв.</th></tr></thead><tbody>'
    +(needRows||'<tr><td colspan=6 class="muted">потребности нет</td></tr>')+'</tbody></table>'
    +'<div class="muted" style="margin-top:var(--s-2)">«Собрать из продаж» соберёт партию по непроведённым продажам (наличие в резерв, нехватку — в производство).</div></div>';
}

// ── ПУЛЬС / ПРИОРИТЕТ / РИСК (управленческий обзор) ──
function pulseStrip(){
  var p=PULSE; if(!p) return '';
  var tr = p.trend==='up'?'<span class="up" title="темп растёт">↑</span>':(p.trend==='down'?'<span class="down" title="темп падает">↓</span>':'<span class="muted">→</span>');
  var cap = p.capacityDays!=null ? ('~'+p.capacityDays+' дн') : '—';
  var riskTxt = p.atRisk>0 ? '<b class="err">🔴 в риске: '+p.atRisk+'</b>' : '<span class="ok">✓ все в срок</span>';
  return '<div class="box" style="display:flex;flex-wrap:wrap;gap:var(--s-4);align-items:center;font:var(--t-small);margin-bottom:var(--s-3)">'
    +'<span>⚡ <b>Пульс фабрики</b></span>'
    +'<span>сегодня: <b>'+money(p.today)+' ₽</b> труда</span>'
    +'<span>ср/день: <b>'+money(p.avgDay)+' ₽</b> '+tr+'</span>'
    +'<span>'+riskTxt+'</span>'
    +'<span>в работе: <b>'+(p.activeCount||0)+'</b> заказ.</span>'
    +'<span>очередь труда: <b>'+money(p.totalLeft)+' ₽</b> · разгребём за <b>'+cap+'</b></span>'
    +'</div>';
}
function recoLine(){
  var top=null; for(var i=0;i<BATCHES.length;i++){ if(BATCHES[i].top){ top=BATCHES[i]; break; } }
  if(!top) return '';
  var why = top.risk==='late'?('⚠ не успеваем'+(top.slack!=null?(' на '+Math.abs(top.slack)+' дн'):''))
          : top.risk==='tight'?'дедлайн впритык'
          : top.deadline?('дедлайн '+esc(top.deadline)):'наибольший объём';
  return '<div class="box" style="margin-bottom:var(--s-3);background:var(--amber-bg);cursor:pointer" onclick="openOrder(\''+top.id+'\')">'
    +'🎯 <b>Сейчас в приоритете: '+esc(top.num)+' '+esc(top.name)+'</b> — '+why+', осталось <b>'+money(top.leftRub||0)+' ₽</b> труда'+(top.velocity?(' · темп '+money(top.velocity)+' ₽/дн'):'')+' →</div>';
}
function riskBadge(b){
  var r=b.risk;
  if(r==='late') return '<span class="pill bad" title="прогноз позже дедлайна">🔴 не успеваем'+(b.slack!=null?(' на '+Math.abs(b.slack)+' дн'):'')+'</span>';
  if(r==='tight') return '<span class="pill warn" title="мало запаса до дедлайна">🟡 впритык'+(b.slack!=null?(' · запас '+b.slack+' дн'):'')+'</span>';
  if(r==='ok') return '<span class="pill ok">🟢 успеваем'+(b.forecast?(' к '+esc(b.forecast)):'')+'</span>';
  if(r==='nodeadline') return '<span class="pill mute" title="прогноз есть, дедлайн не задан">📅 срок не задан · прогноз '+esc(b.forecast)+'</span>';
  if(r==='unknown') return '<span class="pill mute" title="нет подтверждённой выработки — темп неизвестен">⏳ нет темпа</span>';
  if(r==='noops') return '<span class="pill mute" title="операции не собраны — прогноз невозможен">⚙️ нет операций</span>';
  if(r==='done') return '<span class="pill ok">✓ готово</span>';
  return '';
}
function setDeadline(id,cur){
  var d=prompt('Срок отгрузки заказа, дд.мм.гггг:\n(пусто — снять срок)', cur||''); if(d===null) return; d=d.trim();
  var why='';
  if(cur && d!==cur){ why=prompt('Почему сдвигаем срок?\n(попадёт в историю; можно оставить пустым)',''); if(why===null) return; }
  api({vapi:'setdeadline', batch:id, plan:d, reason:why||''}).then(function(r){
    if(r&&r.ok){ if(VIEW==='detail') reloadDetail(); else load(); }
    else alert((r&&r.error)||'не сохранилось');
  }).catch(function(e){ alert('Связь оборвалась: '+(e.message||e)); });
}
// история сроков: видно, сколько раз двигали и по какой причине
function deadlineLog(id){
  api({vapi:'deadlinelog', batch:id}).then(function(r){
    var lg=(r&&r.log)||[];
    if(!lg.length){ alert('Срок ещё не меняли.'); return; }
    var txt=lg.map(function(x){
      return x.when+' — '+(x.was||'—')+' → '+(x.now||'—')+(x.who?('  ('+x.who+')'):'')+(x.reason?('\n    причина: '+x.reason):'');
    }).join('\n');
    alert('История сроков заказа (сверху — свежее):\n\n'+txt);
  });
}

// ПЕРЕНОС ВЫРАБОТКИ В ДРУГОЙ ЗАКАЗ.

// Сначала dry — сервер показывает, сколько строк и на какую сумму поедет, и только потом запись.
function moveOut(id,eq){
  var opts=[];
  for(var i=0;i<BATCHES.length;i++){ var b=BATCHES[i]; if(b.id!==id) opts.push(b); }
  if(!opts.length){ alert('Других заказов нет — переносить некуда.'); return; }
  var txt='Куда перенести выработку по изделию «'+eq+'»?\n\n';
  for(var k=0;k<opts.length;k++) txt+=(k+1)+' — '+opts[k].num+' · '+(opts[k].name||'')+'\n';
  var pick=prompt(txt+'\nНомер строки:','1');
  if(pick===null) return;
  var n=parseInt(pick,10);
  if(!(n>=1&&n<=opts.length)){ alert('Нет такого номера.'); return; }
  var to=opts[n-1];
  api({vapi:'moveoutbatch',from:id,to:to.id,eq:eq,dry:1}).then(function(r){
    if(!r||!r.ok){ alert((r&&r.error)||'не удалось посчитать перенос'); return; }
    if(!confirm(r.msg)) return;
    api({vapi:'moveoutbatch',from:id,to:to.id,eq:eq}).then(function(r2){
      if(!r2||!r2.ok){ alert((r2&&r2.error)||'не удалось перенести'); return; }
      alert('Перенесено строк: '+r2.moved+' на '+r2.sum+' р. в заказ '+r2.toNum
        +(r2.dropModel?('\nВариант снят у '+r2.dropModel+' строк — работа разложится по заказу автоматически.'):''));
      loadOps(id);

  });
}

// ⚠ процент считается по ТРУДУ в рублях. Дешёвые операции могут висеть незакрытыми при 99 %,
// и это выглядело как противоречие. Поэтому рядом — сколько операций и штук реально осталось.
// «обеспечено» — сколько деталей реально прошло предыдущую стадию. Если наряды её опередили,
// показываем обе цифры: процент заказа при этом не меняется (решение владельца).
function chainHtml(o){
  // У СТРОКИ ИЗДЕЛИЯ причина другая: держит не предыдущая операция, а самая отстающая деталь.
  // Пишем её прямо в строке — иначе «обеспечено 9» ничего не объясняет и человек идёт искать.
  var b=o.blockedBy;
  if(o.level==='изделие' && b && Number(o.blocked)>0.01){
    return ' <span class="pill warn" title="'
      +esc('упаковать больше нельзя: «'+b.detail+'» готова на '+r1(b.ready)+' из '+r1(b.need)
          +', на изделие идёт '+b.perunit+' шт → хватает на '+r1(b.can)+' изделий')
      +'">⏳ обеспечено '+r1(o.chainCap)+' · держит «'+esc(b.detail)+'»</span>';
  }
  if(!(Number(o.ahead)>0.01)) return '';
  if(o.level==='изделие'){
    return ' <span class="pill warn" title="'
      +esc('упаковано '+r1(o.ready)+', а деталями обеспечено только '+r1(o.chainCap)
          +(b?('. Отстаёт «'+b.detail+'»: '+r1(b.ready)+' из '+r1(b.need)+', по '+b.perunit+' шт на изделие'):''))
      +'">⚠ упаковано сверх обеспеченного'+(b?(' · «'+esc(b.detail)+'»'):'')+'</span>';
  }
  return ' <span class="pill warn" title="'
    +esc('принято по нарядам '+r1(o.ready)+', а предыдущая стадия закрыта только на '+r1(o.chainCap)
        +'. Обработать больше, чем прошло предыдущий этап, нельзя — либо наряд по нему ещё не одобрен, либо приёмка завышена.')
    +'">⏳ обеспечено '+r1(o.chainCap)+'</span>';
}

  });

    (p.ops||[]).forEach(function(o){
      var tr=box.querySelector('tr[data-op="'+String(o.id).replace(/"/g,'\\"')+'"]'); if(!tr) return;
      var d=tr.querySelector('.c-done'); if(d) d.textContent=o.done;

function renameBatch(id,cur){ var nm=prompt('Название партии:',cur||''); if(nm===null||!nm.trim()) return; api({vapi:'renamebatch', batch:id, name:nm.trim()}).then(function(){ if(VIEW==='detail') reloadDetail(); else load(); }); }
function delBatch(id){ if(!confirm('Удалить заказ со всеми позициями?')) return; api({vapi:'delbatch', batch:id}).then(function(){ backToList(); }); }
// строка позиции (общий шаблон для рендера и оптимистичного добавления)
function itemRowHtml(it,batchId){
  // ⚠ в компактной строке у собранного изделия оставляем только значок: подпись «собрано»
  // повторялась 17 раз и съедала ширину, из-за которой пряталась колонка «Увезено».
  // У НЕсобранного текст оставляем — это требует действия, значок легко пропустить.
  var asmBadge = it.assembled
    ? '<span class="asm pill ok" title="состав собран">✓</span>'
    : '<a href="'+catUrl(it.sku||it.model)+'" target="_blank" class="asm pill warn" title="не собрано — открыть в каталоге, проверить состав и отметить">⚠<span class="t">не собрано</span></a>';
  return '<tr data-item="'+esc(it.id)+'">'
    +'<td class="c-nm" title="'+esc([it.equip,it.sku,(it.unitCost?(it.unitCost.toFixed(2).replace('.',',')+' р/шт'):'')].filter(Boolean).join(' · '))+'">'
      +'<div class="inm">'+asmBadge+'<b>'+esc(it.model||it.equip||it.sku||'—')+'</b>'
      +(it.sku?('<span class="sku">'+esc(it.sku)+'</span>'):'')+'</div></td>'
    +'<td class="num"><input class="q" value="'+it.qty+'" onchange="updItem(\''+it.id+'\',this.value)"></td>'
    +'<td class="num"><input class="q" value="'+(it.done||0)+'" onchange="saveDone(\''+batchId+'\',\''+esc(it.sku)+'\',\''+esc(it.model)+'\',this.value)"></td>'
    +'<td class="num">'+shipCellHtml(it)+'</td>'
    +'<td class="c-x"><button class="ic" title="убрать" onclick="rmItem(\''+it.id+'\')">🗑</button></td></tr>';
}
function curBatch(id){ if(DETAIL&&DETAIL.id===id) return DETAIL; for(var i=0;i<BATCHES.length;i++) if(BATCHES[i].id===id) return BATCHES[i]; return null; }
function renderItems(id){ var b=curBatch(id), tb=$('items_'+id); if(b&&tb) tb.innerHTML=(b.items||[]).map(function(it){ return itemRowHtml(it,id); }).join(''); }
// операции — редкое обновление: пересобираем один раз через паузу после последнего изменения позиций (expand дорогой)
var _opsTimer=null;
function scheduleOpsRefresh(id){
  var box=$('ops_'+id);
  if(box && !$('opsref_'+id)){   // старое содержимое остаётся — только пометка, что цифры обновляются
    var tag=document.createElement('div'); tag.id='opsref_'+id; tag.className='muted'; tag.textContent='⏳ операции пересчитываются…';
    box.insertBefore(tag, box.firstChild);
  }
  if(_opsTimer) clearTimeout(_opsTimer); _opsTimer=setTimeout(function(){ loadOps(id); },2500);
}

function addItem(id){
  var el=$('am_'+id), lbl=el.value.trim(), qEl=$('aq_'+id), qty=Number(qEl.value), m=$('bm_'+id);
  var mod=MODMAP[lbl];
  if(!mod){ if(m) m.innerHTML='<span class="err">выберите модель из списка</span>'; return; }
  if(!(qty>0)){ if(m) m.innerHTML='<span class="err">укажите количество</span>'; return; }
  var b=curBatch(id); if(!b) return;
  var it={ id:'tmp'+Date.now(), sku:mod.sku, equip:mod.equip, model:mod.model, qty:qty, done:0, costing:mod.costing, unitCost:mod.cost, assembled:!!mod.assembled };
  b.items=b.items||[]; b.items.push(it);
  renderItems(id);                       // мгновенно показать позицию
  el.value=''; qEl.value=''; el.focus();  // готово вводить следующую
  if(m) m.innerHTML='<span class="ok">＋ '+esc(itemName(it))+'</span>';
  api({vapi:'additem', batch:id, sku:mod.sku, eq:mod.equip, mod:mod.model, qty:qty}).then(function(r){
    if(r&&r.ok&&r.item){ it.id=r.item.id; renderItems(id); scheduleOpsRefresh(id); }
    else { b.items=b.items.filter(function(x){ return x!==it; }); renderItems(id); if(m) m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; }
  }).catch(function(e){ b.items=b.items.filter(function(x){ return x!==it; }); renderItems(id); if(m) m.innerHTML='<span class="err">'+esc(e.message||e)+'</span>'; });
}
function updItem(itemId,v){
  var b=DETAIL; if(!b||!b.items) return;
  for(var j=0;j<b.items.length;j++) if(b.items[j].id===itemId){ b.items[j].qty=Number(v)||0; api({vapi:'upditem', item:itemId, qty:v}).then(function(){ scheduleOpsRefresh(b.id); }); return; }
}
function rmItem(itemId,force){
  var b=DETAIL; if(!b||!b.items) return;
  var bid=b.id;
  // ⚠ строку из списка убираем ТОЛЬКО после ответа сервера: по позиции может быть сдана выработка,
  // и тогда сервер откажет — оптимистичное удаление показало бы то, чего не произошло
  api({vapi:'rmitem', item:itemId, force:(force?1:'')}).then(function(r){
    if(r&&r.warn){ if(confirm(r.msg)) rmItem(itemId,1); return; }
    if(r&&r.ok===false){ alert(r.error||'не удалось удалить позицию'); return; }
    for(var j=0;j<b.items.length;j++) if(b.items[j].id===itemId){ b.items.splice(j,1); break; }
    renderItems(bid); scheduleOpsRefresh(bid);
  });
}
// ─── ОТГРУЗКА ЧАСТЯМИ ───
// Партию возят в несколько заходов: сколько готово — столько и увозим, заказ живёт дальше.
// Количество по каждой позиции правится вручную, больше упакованного ввести нельзя.
// ⚠ Упакованное, но не увезённое НЕ теряется: приход на склад готовой продукции делается на
// всё упакованное, расход — только на увезённое, разница лежит в «Наличии» и видна следующему
// заказу. Незавершённые детали уходят на склад деталей только при ЗАКРЫТИИ заказа.
var SHIP={};
function ship(id){
  var m=$('bm_'+id); m.textContent='считаю…';
  api({vapi:'shippreview',batch:id}).then(function(r){
    m.textContent='';
    if(!r||!r.ok){ m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    SHIP[id]=r; renderShip(id);
  });
}
function shipQty(id,i){ var el=$('sq_'+id+'_'+i); return Math.max(0,Math.min(Number(el&&el.value)||0,SHIP[id].lines[i].canShip)); }
function shipRecalc(id){
  var d=SHIP[id],t=0,rest=0;
  d.lines.forEach(function(l,i){ var q=shipQty(id,i); t+=q; rest+=Math.max(0,l.packed-l.shippedBefore-q); });
  var el=$('stot_'+id); if(el) el.innerHTML='Везём <b>'+t+'</b> шт'+(rest?(' · останется упакованными <b>'+rest+'</b>'):'');
  var bt=$('sbtn_'+id); if(bt) bt.disabled=!(t>0);
}
function shipAll(id,on){
  SHIP[id].lines.forEach(function(l,i){ var el=$('sq_'+id+'_'+i); if(el) el.value=on?l.canShip:0; });
  shipRecalc(id);
}
function renderShip(id){
  var d=SHIP[id];
  var rows=d.lines.map(function(l,i){
    var made=l.ordered-l.packed;
    return '<tr'+(l.canShip?'':' style="opacity:.5"')+'>'
      +'<td>'+esc(l.model)+'<div class="muted" style="font-size:11px">'+esc(l.equip)+'</div></td>'
      +'<td class="num">'+l.ordered+'</td><td class="num">'+l.packed+'</td>'
      +'<td class="num">'+(l.shippedBefore||'—')+'</td>'
      +'<td class="num"><input id="sq_'+id+'_'+i+'" type="number" min="0" max="'+l.canShip+'" value="'+l.canShip+'" '
      +(l.canShip?'':'disabled ')+'oninput="shipRecalc(\''+id+'\')" style="width:72px;text-align:right"></td>'
      +'<td class="muted" style="font-size:11px">'+(made>0?('не собрано '+made):'')+'</td></tr>';
  }).join('');
  $('ship_'+id).innerHTML='<div class="tray"><div class="trayhd">'
    +'<span class="tt">📦 Отгрузка</span><span class="th">впишите, сколько увозите по каждой позиции</span></div>'
    +'<div class="tbwrap"><table style="min-width:520px;margin-top:var(--s-2)"><thead><tr>'
    +'<th>Изделие</th><th class="num">заказ</th><th class="num">упаковано</th><th class="num">увезли</th><th class="num">везём</th><th></th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="row" style="margin-top:var(--s-2)">'
    +'<button class="sm sec" onclick="shipAll(\''+id+'\',1)">всё упакованное</button>'
    +'<button class="sm sec" onclick="shipAll(\''+id+'\',0)">обнулить</button>'
    +'<span id="stot_'+id+'" style="margin-left:auto"></span></div>'
    +'<div class="row" style="margin-top:var(--s-3)">'
    +'<button id="sbtn_'+id+'" onclick="shipGo(\''+id+'\',0)">🚚 Отгрузить, заказ оставить открытым</button>'
    +'<button class="sec" onclick="shipGo(\''+id+'\',1)">🔒 Отгрузить и закрыть заказ</button>'
    +'<button class="sec" onclick="toStockGo(\''+id+'\',0)">🏬 Сдать на склад</button>'
    +'<button class="sec" onclick="toStockGo(\''+id+'\',1)">🏬🔒 Сдать на склад и закрыть заказ</button>'
    +'<button class="sec" onclick="restOrder(\''+id+'\')">📄 Закрыть и создать заказ на остаток</button>'
    +'<button class="sec" onclick="$(\'ship_'+id+'\').innerHTML=\'\'">отмена</button></div>'
    +'<div class="muted small" style="margin-top:var(--s-2)">Закрытие заказа переводит недоделанные детали на склад деталей — оттуда их можно взять в следующую партию. Пока заказ открыт, детали остаются в нём.</div>'
    +'</div>';
  shipRecalc(id);
}
function shipGo(id,close){
  var d=SHIP[id], items=[], tot=0, rest=0;
  d.lines.forEach(function(l,i){ var q=shipQty(id,i); tot+=q; rest+=Math.max(0,l.packed-l.shippedBefore-q);
    if(q>0) items.push({sku:l.sku,model:l.model,qty:q}); });
  if(!tot){ alert('Не указано ни одной позиции к отгрузке.'); return; }
  var txt='Отгружаем '+tot+' изделий.';
  if(rest) txt+='\nОстанется упакованными в наличии: '+rest+' шт.';
  txt+=close ? '\n\nЗАКАЗ БУДЕТ ЗАКРЫТ: недоделанные детали уйдут на склад деталей, недостающие изделия перестанут числиться в заказе. Продолжить?'
             : '\n\nЗаказ останется открытым — остаток можно довезти позже. Продолжить?';
  if(!confirm(txt)) return;
  var m=$('bm_'+id); m.textContent='отгружаю…'; $('ship_'+id).innerHTML='';
  api({vapi:'shipbatch',batch:id,lines:JSON.stringify(items),close:close?1:0}).then(function(r){
    if(!r||!r.ok){ m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    var w=(r.wip&&r.wip.ok&&r.wip.stat)?(' · на склад деталей '+r.wip.stat.qty+' шт'):'';
    m.innerHTML='<span class="ok">отгружено '+r.shipped+(r.closed?' · заказ закрыт':' · заказ открыт')+w+'</span>';
    setTimeout(reloadDetail,700);
  });
}

// ─── ВЗЯТЬ ОСТАТКИ СО СКЛАДА ДЕТАЛЕЙ В ЭТОТ ЗАКАЗ ───
// Деталь, пролежавшая на складе, закрывает не только «свою» стадию, но и все предыдущие:
// отшлифованная боковина заведомо распилена. Поэтому взятие поднимает начальные остатки
// по всей цепочке до этой стадии — и только вверх, ничего не понижая.
var WIPO={};
function wipOffer(id){
  var m=$('bm_'+id); m.textContent='смотрю склад…';
  api({vapi:'wipoffer',batch:id}).then(function(r){
    m.textContent='';
    if(!r||!r.ok){ m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    WIPO[id]=r; renderWip(id);
  });
}
function wipQty(id,i){ var el=$('wq_'+id+'_'+i); return Math.max(0,Math.min(Number(el&&el.value)||0,WIPO[id].items[i].canTake)); }
function wipRecalc(id){
  var t=0; (WIPO[id].items||[]).forEach(function(x,i){ t+=wipQty(id,i); });
  var el=$('wtot_'+id); if(el) el.innerHTML='Берём <b>'+t+'</b> деталей';
  var b=$('wbtn_'+id); if(b) b.disabled=!(t>0);
}
function wipAll(id,on){
  (WIPO[id].items||[]).forEach(function(x,i){ var el=$('wq_'+id+'_'+i); if(el) el.value=on?x.canTake:0; });
  wipRecalc(id);
}
function renderWip(id){
  var d=WIPO[id], box=$('wip_'+id);
  if(!d.items.length){
    box.innerHTML='<div class="tray"><div class="trayhd"><span class="tt">🧩 Склад деталей</span>'
      +'<span class="th">подходящих остатков нет</span></div>'
      +'<div class="muted" style="padding:var(--s-2) 0">На складе нет деталей, которые нужны этому заказу. '
      +'Детали попадают на склад при закрытии заказа — недоделанное остаётся за цехом.</div>'
      +'<div class="row" style="margin-top:var(--s-2)"><button class="sm sec" onclick="$(\'wip_'+id+'\').innerHTML=\'\'">закрыть</button></div></div>';
    return;
  }
  var rows=d.items.map(function(x,i){
    return '<tr><td>'+esc(x.detail)+'</td><td class="muted">'+esc(x.model||'—')+'</td>'
      +'<td>'+esc(x.stage)+'</td><td class="num">'+x.onWip+'</td><td class="num">'+x.room+'</td>'
      +'<td class="num"><input id="wq_'+id+'_'+i+'" type="number" min="0" max="'+x.canTake+'" value="'+x.canTake+'" '
      +'oninput="wipRecalc(\''+id+'\')" style="width:70px;text-align:right"></td></tr>';
  }).join('');
  box.innerHTML='<div class="tray"><div class="trayhd">'
    +'<span class="tt">🧩 Склад деталей</span><span class="th">остатки прошлых партий, которые нужны этому заказу</span></div>'
    +'<div class="tbwrap"><table style="min-width:560px;margin-top:var(--s-2)"><thead><tr>'
    +'<th>Деталь</th><th>Вариант</th><th>Стадия</th><th class="num">на складе</th><th class="num">нужно</th><th class="num">берём</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="row" style="margin-top:var(--s-2)">'
    +'<button class="sm sec" onclick="wipAll(\''+id+'\',1)">взять всё</button>'
    +'<button class="sm sec" onclick="wipAll(\''+id+'\',0)">обнулить</button>'
    +'<span id="wtot_'+id+'" style="margin-left:auto"></span></div>'
    +'<div class="row" style="margin-top:var(--s-3)">'
    +'<button id="wbtn_'+id+'" onclick="wipGo(\''+id+'\')">✅ Взять в заказ</button>'
    +'<button class="sec" onclick="$(\'wip_'+id+'\').innerHTML=\'\'">отмена</button></div>'
    +'<div class="muted small" style="margin-top:var(--s-2)">Взятое спишется со склада и встанет в «Начальные остатки» — на эту стадию и на все предыдущие.</div>'
    +'</div>';
  wipRecalc(id);
}
function wipGo(id){
  var d=WIPO[id], items=[], t=0;
  d.items.forEach(function(x,i){ var q=wipQty(id,i); if(q>0){ items.push({key:x.key,qty:q}); t+=q; } });
  if(!t) return;
  if(!confirm('Взять со склада '+t+' деталей в этот заказ?\nОни спишутся со склада и попадут в начальные остатки.')) return;
  var m=$('bm_'+id); m.textContent='беру…'; $('wip_'+id).innerHTML='';
  api({vapi:'wipissue',batch:id,items:JSON.stringify(items)}).then(function(r){
    if(!r||!r.ok){ m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    m.innerHTML='<span class="ok">взято со склада: '+t+' деталей</span>';
    setTimeout(reloadDetail,700);
  });
}
// ─── ОТГРУЗКА ВИДНА В КАРТОЧКЕ ───
// Без этого после отгрузки карточка выглядит один в один как до: % труда и «осталось ₽»
// не меняются (и не должны — это метрики труда), а увезённое нигде не показывалось.
function shipBadgeHtml(b){
  var sh=Number(b.shipped)||0; if(!(sh>0)) return '';
  var ord=Number(b.ordered)||0;
  var packed=0, rest=0;
  (b.items||[]).forEach(function(it){
    var p=Number(it.done)||0, s=Number(it.shipped)||0;   // «Готово» = оприходовано на склад
    packed+=p; rest+=Math.max(0,p-s);
  });
  return '<div class="row" style="margin-top:var(--s-2);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-ctl);padding:var(--s-2) var(--s-3)">'
    +'<span>🚚 Отгружено <b>'+sh+'</b>'+(ord?(' из '+ord):'')+'</span>'
    +(rest>0?('<span class="muted">· упаковано, но не увезено: <b>'+rest+'</b></span>'):'')
    +(ord>sh?('<span class="muted">· не выполнено по заказу: <b>'+(ord-sh)+'</b></span>'):'')
    +'</div>';
}
function shipCellHtml(it){
  var s=Number(it.shipped)||0, d=Number(it.done)||0;
  if(!s&&!d) return '<span class="muted">—</span>';
  var rest=Math.max(0,d-s);
  return s+(rest>0?(' <span class="muted" title="упаковано, но не увезено — лежит на складе готовой продукции">⏳'+rest+'</span>'):'');
}
function shipLog(id){
  var box=$('slog_'+id);
  if(box.innerHTML){ box.innerHTML=''; return; }
  box.innerHTML='<div class="muted">загрузка…</div>';
  api({vapi:'shiplog',batch:id}).then(function(r){
    if(!r||!r.ok){ box.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    if(!r.rows.length){ box.innerHTML='<div class="muted">движений по этому заказу нет</div>'; return; }
    var rows=r.rows.map(function(x){
      var out=x.type==='расход';
      return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.model)+'</td>'

        +'<td class="num">'+x.qty+'</td><td class="muted">'+esc(x.note||'')+'</td></tr>';
    }).join('');
    box.innerHTML='<div class="tray"><div class="trayhd"><span class="tt">🚚 История отгрузок</span>'
      +'<span class="th">увезено всего '+r.stat.shipped+'</span></div>'
      +'<div class="tbwrap"><table style="min-width:480px;margin-top:var(--s-2)"><thead><tr>'
      +'<th>Дата</th><th>Изделие</th><th>Движение</th><th class="num">Кол-во</th><th>Комментарий</th>'
      +'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  });
}
// ─── ВТОРОЙ ПУТЬ ТОВАРА: СДАТЬ НА СКЛАД ───
// Отгрузка увозит клиенту напрямую и склад лишь проскакивает. Здесь товар на складе ОСТАЁТСЯ,
// а увозят его потом со склада — уже не от имени заказа.
function toStockGo(id,close){
  var d=SHIP[id], items=[], t=0;
  d.lines.forEach(function(l,i){ var q=shipQty(id,i); if(q>0){ items.push({sku:l.sku,model:l.model,qty:q}); t+=q; } });
  if(!t && !close){ alert('Не указано ни одной позиции.'); return; }
  var txt='Сдать на склад готовой продукции '+t+' изделий?\n\nТовар останется на складе, клиенту не уедет. '
    +'Отгрузить его можно позже в разделе «🏬 Склады».';
  if(close) txt+='\n\nЗАКАЗ БУДЕТ ЗАКРЫТ: недоделанные детали уйдут на склад деталей, '
    +'а невыполненное по заказу перестанет числиться. Это единственный правильный способ закрыть заказ — '
    +'смена статуса в списке детали на склад НЕ переведёт.';
  if(!confirm(txt)) return;
  var m=$('bm_'+id); m.textContent='сдаю на склад…'; $('ship_'+id).innerHTML='';
  api({vapi:'batchtostock',batch:id,lines:JSON.stringify(items),close:close?1:0}).then(function(r){
    if(!r||!r.ok){ m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    var w=(r.wip&&r.wip.ok&&r.wip.stat)?(' · на склад деталей '+r.wip.stat.qty+' шт'):'';
    m.innerHTML='<span class="ok">сдано на склад: '+r.toStock+(r.closed?' · заказ закрыт':'')+w+'</span>';
    setTimeout(reloadDetail,700);
  });
}
// ─── ЗАКАЗ НА ОСТАТОК ───
// Остаток = заказано − отгружено − сдано на склад. Готовое, что ещё лежит за заказом, входит
// в новый заказ УЖЕ СДЕЛАННЫМ: операции закрыты начальными остатками, ЗП за него не начисляется.
function restOrder(id){
  var m=$('bm_'+id); m.textContent='считаю остаток…';
  api({vapi:'batchfromrest',batch:id,dry:1}).then(function(r){
    m.textContent='';
    if(!r||!r.ok){ alert((r&&r.error)||'ошибка'); return; }
    var t='Создать «'+r.name+'» на '+r.stat.rest+' изделий ('+r.stat.positions+' позиций)?\n\n'
      +r.rows.map(function(x){ return '• '+x.model+' — '+x.qty+(x.carry?(' (из них '+x.carry+' уже готовы)'):''); }).join('\n')
      +'\n\nТекущий заказ будет ЗАКРЫТ: недоделанные детали уйдут на склад деталей.'
      +(r.stat.carry?('\nГотовые '+r.stat.carry+' шт войдут в новый заказ как уже сделанные — работать по ним не нужно.'):'');
    if(!confirm(t)) return;
    m.textContent='создаю…';
    api({vapi:'batchfromrest',batch:id,close:1}).then(function(x){
      if(!x||!x.ok){ m.innerHTML='<span class="err">'+esc((x&&x.error)||'ошибка')+'</span>'; return; }
      var w=(x.wip&&x.wip.ok&&x.wip.stat)?(' · на склад деталей '+x.wip.stat.qty+' шт'):'';
      var o=(x.offer&&x.offer.ok&&x.offer.stat&&x.offer.stat.qty)?(' · со склада можно взять '+x.offer.stat.qty+' деталей'):'';
      m.innerHTML='<span class="ok">создан '+esc(x.num)+' на '+x.rest+' изделий'+w+o+'</span>';
      setTimeout(function(){ backToList(); },1400);
    });
  });
}
load();

// авто-обновление: оболочка шлёт «refresh» при возврате на раздел — перечитываем данные без перезагрузки страницы
(function(){
  try{ var m=/[?&]twsec=([^&]+)/.exec(location.search); window.top.postMessage({tw:'hello',sec:m?decodeURIComponent(m[1]):''},'*'); }catch(e){}
  window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='refresh'){ try{
    if(Date.now()-LASTLOAD<300000) return;                       // данные свежее 5 минут — не дёргаем экран
    if(typeof VIEW!=="undefined"&&VIEW==="detail"&&CUR){loadDetail(CUR,true);}else{load(true);}
  }catch(err){} } });
})();

// ─────── ПОКАЗЫВАЕМ, ЧТО ИДЁТ РАБОТА ───────
// Каждый вызов Apps Script — это 3-6 секунд. Без видимого признака человек считает, что
// кнопка не сработала, и жмёт снова: так рождались дубли нарядов и «то одобряет, то нет».
// Полоска сверху — на любой запрос; заслонка «не нажимайте» — только на действие,
// которое человек начал сам (нажал кнопку), чтобы фоновое обновление не мешало работать.
var TWL=0, TWCLICK=0;
var TWTMR=0;
function twLoadOn(wait){
  TWL++;
  var b=document.getElementById('twload'); if(b) b.style.display='block';
  if(wait){
    var w=document.getElementById('twwait'); if(w) w.style.display='flex';
    // ПРЕДОХРАНИТЕЛЬ: если ответ не пришёл (сеть в цеху пропала), заслонка не должна
    // запереть экран навсегда — через 30 с она превращается в понятное сообщение и снимается пальцем.
    clearTimeout(TWTMR);
    TWTMR=setTimeout(function(){
      var h=document.getElementById('twwt'); if(h) h.textContent='Ответа всё нет';
      var s=document.querySelector('#twwait .wh'); if(s) s.textContent='связь медленная — нажмите, чтобы закрыть и попробовать снова';
      var ww=document.getElementById('twwait'); if(ww) ww.onclick=function(){ TWL=0; twLoadOff(); };
    },30000);
  }
}
function twLoadOff(){
  TWL=Math.max(0,TWL-1); if(TWL) return;
  clearTimeout(TWTMR);
  var b=document.getElementById('twload'); if(b) b.style.display='none';
  var w=document.getElementById('twwait');
  if(w){ w.style.display='none'; w.onclick=null; }
  var s=document.querySelector('#twwait .wh'); if(s) s.textContent='идёт обмен с сервером — не нажимайте';
}
function twSay(t){ var e=document.getElementById('twwt'); if(e&&t) e.textContent=t; }
// нажатие человека «взводит» заслонку для ближайшего запроса (20 с — на случай prompt по дороге)
document.addEventListener('click',function(e){
  var n=e.target;
  while(n&&n!==document.body){ if(n.tagName==='BUTTON'||n.tagName==='A'){ TWCLICK=Date.now(); return; } n=n.parentNode; }
},true);
(function(){
  var _api=(typeof api==='function')?api:null, _post=(typeof apiPost==='function')?apiPost:null;
  var wrap=function(fn){ return function(p){
    var mine=(TWCLICK && (Date.now()-TWCLICK)<20000); if(mine) TWCLICK=0;
    twLoadOn(mine);
    return fn(p).then(function(r){ twLoadOff(); return r; }, function(e){ twLoadOff(); throw e; });
  }; };
  if(_api) api=wrap(_api);
  if(_post) apiPost=wrap(_post);
})();
</script>
