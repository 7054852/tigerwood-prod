<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>window.__TWTHEME__='day';</script>
<script src="tw-theme.js"></script>
<script src="tw-config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигервуд — наличие и срок</title>
<style>
  /* виджет живёт в карточке amoCRM (узкий светлый iframe): токены и элементы темы, отступ поменьше */
  body{ padding:var(--s-3); }
  .hd{ font:var(--t-heading); }
  .sub{ margin:var(--s-1) 0 0; }
  .err{ border:1px solid var(--line); border-radius:var(--r-card); padding:var(--s-3); margin-top:var(--s-3); }
  .card{ margin-top:var(--s-3); padding:var(--s-3); }
  .card .nm{ font:var(--t-strong); font-weight:600; }
  .card .art{ font:var(--t-tiny); color:var(--muted); }
  .stats{ display:flex; gap:var(--s-4); flex-wrap:wrap; margin-top:var(--s-2); }
  .st{ font:var(--t-small); } .st b{ display:block; font:var(--t-heading); font-variant-numeric:tabular-nums; }
  .st .lbl{ color:var(--muted); }
  .card .pill{ margin-top:var(--s-2); }
  .hide{ display:none; }
</style>
</head>
<body>
<div id="hd" class="hd">Наличие и срок…</div>
<div id="sub" class="sub">загрузка…</div>
<div id="err" class="err hide"></div>
<div id="list"></div>

<script>
var BASE=(window.TW_CFG&&TW_CFG.hub)||'https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';   // адрес задаёт tw-config.js; запасной — живой GAS
var APP='tw7prod';
function api(p){ p.app=APP; p.wk=qp('wk'); var q=Object.keys(p).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(p[k]==null?'':p[k]); }).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}); }
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function $(id){ return document.getElementById(id); }
var LEAD=qp('lead');

function srokBadge(it){
  var s=String(it.srok||'');
  if(it.available>0) return '<span class="pill ok">✓ '+esc(s)+'</span>';
  if(it.inProduction>0) return '<span class="pill warn">⏳ '+esc(s)+'</span>';
  return '<span class="pill muted">🗓 '+esc(s)+'</span>';
}
function render(items){
  $('hd').textContent='Наличие и срок';
  $('sub').textContent=items.length+' поз. в сделке';
  if(!items.length){ $('list').innerHTML='<div class="card sub">По этой сделке пока нет позиций в программе. Передайте сделку в SCRM.</div>'; return; }
  $('list').innerHTML=items.map(function(it){
    var name=[it.equip,it.model].filter(Boolean).join(' · ')||it.sku||'позиция';
    return '<div class="card"><div class="nm">'+esc(name)+'</div>'
      +(it.sku?'<div class="art">'+esc(it.sku)+'</div>':'')
      +'<div class="stats">'
      +'<div class="st"><span class="lbl">Заказано</span><b>'+(Number(it.qty)||0)+'</b></div>'
      +'<div class="st"><span class="lbl">Доступно</span><b>'+(Number(it.available)||0)+'</b></div>'
      +'<div class="st"><span class="lbl">В производстве</span><b>'+(Number(it.inProduction)||0)+'</b></div>'
      +'</div>'+srokBadge(it)+'</div>';
  }).join('');
}
function showErr(m){ $('err').className='err'; $('err').innerHTML='⚠️ '+esc(m); $('sub').textContent=''; }

function boot(){
  if(!LEAD){ showErr('Не передан ID сделки'); return; }
  api({vapi:'dealavail', deal:LEAD}).then(function(r){
    if(!r||!r.ok){ showErr((r&&r.error)||'не удалось получить наличие'); return; }
    render(r.items||[]);
  }).catch(function(e){ showErr(e.message||String(e)); });
}
boot();
</script>
</body>
</html>
