<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="tw-theme.js"></script>
<title>Тигервуд — ведомость передачи</title>
<style>
  .muted{ font-size:13px; }
  /* ⚠ имя .bar занято темой (полоса прогресса, height:6px) — панель действий зовётся .toolbar */
  /* чипы операций — как ветки в цехе: видно, где лежат деньги */
  /* операций в заказе бывает 25 — без ограничения фильтр съедал четверть экрана */
  .ops{ display:flex; flex-wrap:wrap; gap:var(--s-1); margin-bottom:var(--s-3); max-height:96px; overflow:auto; }
  .opc{ border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:13px; cursor:pointer; background:var(--card);
        white-space:nowrap; transition:border-color .12s var(--ease), background .12s var(--ease); }
  .opc:hover{ border-color:var(--accent); }
  .opc.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .opc .q{ color:var(--muted); }
  .opc.on .q{ color:rgba(255,255,255,.8); }

  .sheet{ border:1px solid var(--line); border-radius:var(--r-card); background:var(--card); padding:var(--s-4); }
  .shead{ display:flex; flex-wrap:wrap; gap:var(--s-3); align-items:flex-end; margin-bottom:var(--s-3); }
  .stitle{ font:var(--t-title); }
  .sline{ font-size:13px; color:var(--muted); }
  .fill{ display:inline-block; min-width:140px; border-bottom:1px solid var(--muted); }

  /* итоги: шесть чисел с РАЗНЫМИ смыслами — каждое со своей подписью, иначе их путают */
  .sums{ display:flex; flex-wrap:wrap; gap:var(--s-3); margin-bottom:var(--s-3); }
  .sum{ border:1px solid var(--line); border-radius:var(--r-ctl); padding:var(--s-2) var(--s-3); background:var(--card2); min-width:120px; }
  .sum .v{ font:var(--t-heading); font-variant-numeric:tabular-nums; }
  .sum .n{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .sum.our .v{ color:var(--green); }
  .sum.sub .v{ color:var(--amber); }
  .sum.qc .v{ color:var(--accent-text); }

  /* ⚠ прокрутка ВНУТРИ обёртки — иначе sticky цепляется за страницу и шапка уезжает */
  .twrap{ overflow:auto; max-height:72vh; overscroll-behavior:contain; }
  table.trf{ border-collapse:separate; border-spacing:0; width:100%; font-size:13px; }
  table.trf th,table.trf td{ border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:middle; }
  table.trf thead th{ position:sticky; top:0; z-index:3; background:var(--card2); font:var(--t-label); white-space:nowrap; }
  table.trf .dn{ position:sticky; left:0; z-index:1; background:var(--card); min-width:190px; }
  table.trf thead .dn{ z-index:4; background:var(--card2); }
  table.trf td.num,table.trf th.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.trf tr.drow:hover td{ background:var(--card2); }
  table.trf tr.drow.sel td{ background:var(--accent-bg); }
  table.trf tr.drow.norate td.dn{ color:var(--muted); }

  tr.bh td{ background:var(--card2); font-weight:600; border-top:2px solid var(--line); cursor:pointer; }
  tbody.blk.closed tr.drow{ display:none; }
  tr.bh .car{ display:inline-block; width:12px; color:var(--muted); transition:transform .12s var(--ease); }
  tbody.blk.closed tr.bh .car{ transform:rotate(-90deg); }
  tr.bh.target td{ background:var(--accent-bg); box-shadow:inset 0 0 0 2px var(--accent); }
  tr.bh .bt{ cursor:pointer; }
  tr.bh .bx{ color:var(--muted); cursor:pointer; margin-left:var(--s-2); font-weight:400; }
  tr.bh .bs{ color:var(--muted); font-weight:400; font-size:12px; margin-left:var(--s-2); }
  .grab{ cursor:grab; user-select:none; -webkit-user-select:none; }

  td.cell{ text-align:center; min-width:62px; }
  td.cell input{ width:56px; text-align:center; border:1px solid var(--line); border-radius:var(--r-xs); background:transparent; font:inherit; color:inherit; padding:2px 0; }
  td.cell input:focus{ outline:2px solid var(--accent); }
  td.cell .v{ font-weight:600; font-variant-numeric:tabular-nums; cursor:pointer; }
  td.cell .s{ display:block; font-size:11px; color:var(--muted); }
  .s2{ display:block; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .wqc{ color:var(--accent-text); }
  .give{ cursor:pointer; white-space:nowrap; }
  .give .g{ font-weight:600; font-variant-numeric:tabular-nums; }
  .give .o{ display:block; font-size:11px; color:var(--amber); }
  select.who{ max-width:170px; font-size:13px; padding:2px 6px; min-height:0; }
  .pr{ display:none; }

  .mvov{ position:fixed; inset:0; background:var(--scrim); display:flex; align-items:center; justify-content:center; z-index:50; padding:var(--s-4); }
  .mvbox{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); max-width:520px; width:100%; max-height:86vh; overflow:auto; padding:var(--s-5); box-shadow:var(--shadow-pop); }
  .mvbox label{ display:block; font:var(--t-label); color:var(--muted); margin-top:var(--s-2); }
  .mvbox input,.mvbox select{ width:100%; max-width:100%; }
  .mvn{ display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; border-top:1px solid var(--line); padding:var(--s-2) 0; font-size:13px; }
  .mvclose{ float:right; color:var(--muted); cursor:pointer; }
  .hint{ font-size:13px; color:var(--muted); margin:var(--s-2) 0; }
  .warn{ color:var(--amber); }

  /* на телефоне шесть плиток в столбик съедали экран до таблицы — кладём их в две колонки */
  @media (max-width:640px){
    .sums{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s-2); }
    .sum{ min-width:0; padding:var(--s-1) var(--s-2); }
    .sum .v{ font:var(--t-body-strong); }
    .sum .n{ font-size:10px; }
    .twrap{ max-height:60vh; }
  }

  /* «печатать пустую»: цифры прячем, место под ручку оставляем */
  body.blank td.cell .v, body.blank td.cell .s{ visibility:hidden; }
  body.blank .give .g, body.blank .give .o{ visibility:hidden; }

  @media print{
    .noprint{ display:none !important; }
    .sheet{ border:0; border-radius:0; padding:0; }
    .twrap{ overflow:visible; max-height:none; }
    table.trf{ font-size:10px; }
    table.trf th,table.trf td{ padding:2px 4px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    table.trf thead{ display:table-header-group; }
    table.trf tr{ page-break-inside:avoid; }
    table.trf td.cell{ height:22px; border-left:1px solid var(--line2); }
    table.trf td.cell input{ border:0; box-shadow:none; }
    table.trf th.cell{ border-left:1px solid var(--line2); }
    select.who{ display:none; }
    .pr{ display:inline; }
    .sum{ padding:2px 6px; }
  }
</style>
<style id="pagecss">@page{ size:A4 landscape; margin:10mm; }</style>
</head>
<body class="w-full">
<div id="twload"><i></i></div>
<div id="twwait"><div class="wb"><div class="sp"></div><div class="wt" id="twwt">Сохраняю…</div><div class="wh">идёт обмен с сервером — не нажимайте</div></div></div>
<div class="hi noprint">📋 Ведомость передачи работы</div>
<div class="toolbar noprint">
  <select id="ord" onchange="pickOrder(this.value)"><option>загрузка…</option></select>
  <div class="seg" id="orient" title="ориентация листа при печати">
    <button id="or_portrait" onclick="setOrient('portrait')">книжная</button>
    <button id="or_landscape" onclick="setOrient('landscape')">альбомная</button>
  </div>
  <label class="chk"><input type="checkbox" id="blank" onchange="setBlank(this.checked)"> печатать пустую</label>
  <span class="msg" id="msg"></span>
  <div class="end">
    <button class="sec" onclick="addBlock()">＋ блок</button>
    <button class="sec" onclick="load()">⟳</button>
    <button onclick="doPrint()">🖨 Печать</button>
  </div>
</div>
<div class="ops noprint" id="ops"></div>
<div id="pane"><div class="center muted">Загрузка…</div></div>

<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod';
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
try{ if(window.Telegram&&Telegram.WebApp){ var u0=Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user; if(u0) TGID=String(u0.id); } }catch(e){}
if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }
// ⚠ личность — токеном, а не адресом: ?tgid= в ссылке ничего не доказывает
function twQp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
function twTok(){ try{ return twQp('tok')||localStorage.getItem('tw_tok')||''; }catch(e){ return twQp('tok')||''; } }
(function(){ var t=twQp('tok'); if(t){ try{ localStorage.setItem('tw_tok',t); }catch(e){} } })();
function twAuthWall(r){
  if(r&&r.needAuth){ document.body.innerHTML='<div style="padding:var(--s-6);font:var(--t-body);color:var(--fg)">'
    +'<div style="font:var(--t-title);margin-bottom:var(--s-3)">🔒 Нужен вход</div>'
    +'<div>'+String(r.error||'Откройте сервис из бота @TWOtchbot или войдите по личному коду.')+'</div></div>'; }
  return r;
}
function api(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}).then(twAuthWall); }
function apiPost(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID; var b=Object.keys(p).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:b}).then(function(r){return r.json();}).then(twAuthWall); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function attr(s){ return esc(s).replace(/'/g,'&#39;'); }
function $(id){ return document.getElementById(id); }
function money(n){ n=Number(n)||0; return n.toFixed(2).replace('.',','); }
function m0(n){ return Math.round(Number(n)||0); }
function num(x){ return Number(String(x==null?'':x).replace(',','.'))||0; }
function pad2(v){ return (v<10?'0':'')+v; }
function todayRu(){ var d=new Date(); return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear(); }
function msg(h){ var e=$('msg'); if(e) e.innerHTML=h||''; }

var SELF='__self__';
var B=qp('batch')||'', OP=qp('op')||'', D=null, BATCHES=[], SEL='', OPEN={}, REFS=null, EXTRA=[], SAVET=null, BLANK=0;

/* ═══ загрузка ═══ */
function boot(){
  initOrient();
  api({vapi:'batches'}).then(function(r){
    BATCHES=(r&&r.batches)||[];
    var s=$('ord'); if(!s) return;
    s.innerHTML=BATCHES.map(function(b){ return '<option value="'+attr(b.id)+'">'+esc(b.num+(b.name?(' · '+b.name):''))+'</option>'; }).join('')
      ||'<option value="">нет заказов</option>';
    if(!B && BATCHES.length) B=BATCHES[0].id;
    s.value=B;
    load();
  }).catch(function(e){ $('pane').innerHTML='<div class="err">сеть: '+esc(e.message)+'</div>'; });
}
function pickOrder(id){ B=id; OP=''; SEL=''; load(); }
function pickOp(op){ OP=op; SEL=''; load(); }
function load(){
  if(!B){ $('pane').innerHTML='<div class="muted">Выберите заказ.</div>'; return; }
  api({vapi:'transfer',batch:B,op:OP}).then(function(r){
    if(!r||!r.ok){ $('pane').innerHTML='<div class="err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    D=r; EXTRA=EXTRA.filter(function(d){ return (D.dates||[]).indexOf(d)<0; });
    render();
  }).catch(function(e){ $('pane').innerHTML='<div class="err">сеть: '+esc(e.message)+'</div>'; });
}

/* ═══ отрисовка ═══ */
function render(){
  var o=$('ops');
  // закрытые операции (остаток 0) в фильтре не нужны — отдавать там нечего
  o.innerHTML=(D.ops||[]).filter(function(t){ return t.leftQty>0 || t.op===D.op; }).map(function(t){
    return '<span class="opc'+(t.op===D.op?' on':'')+'" onclick="pickOp(\''+attr(t.op)+'\')">'+esc(t.op)
      +' <span class="q">'+m0(t.leftQty)+' шт · '+money(t.leftRub)+' ₽</span></span>';
  }).join('');
  if(!D.op){ $('pane').innerHTML='<div class="sheet"><div class="muted">Выберите операцию — покажу детали, остаток и стоимость работы.</div></div>'; return; }

  var T=D.totals||{}, dates=(D.dates||[]).concat(EXTRA);
  var qcNote=D.qcOp?'<div class="hint warn">⚠ «'+esc(D.op)+'» — точка контроля ОТК: привезённое от подрядчика зачтётся в заказ только после приёмки контролёром.</div>':'';
  var head='<div class="shead"><div><div class="stitle">'+esc(D.order.num)+' · '+esc(D.op)+'</div>'
    +'<div class="sline">'+esc(D.order.name||'')+(D.order.plan?(' · срок '+esc(D.order.plan)):'')+' · деталей '+(D.rows||[]).length+'</div></div>'
    +'<div class="sline" style="margin-left:auto">ведомость от <span class="fill">&nbsp;'+todayRu()+'</span><br>'
    +'передал <span class="fill">&nbsp;</span> · принял <span class="fill">&nbsp;</span></div></div>';

  var sums='<div class="sums">'
    +sumBox('осталось сделать', m0(T.leftQty)+' шт', money(T.leftRub)+' ₽','')
    +sumBox('планируем сами', money(T.planOurRub)+' ₽','по назначению исполнителя','our')
    +sumBox('отдаём подрядчикам', money(T.planSubRub)+' ₽','по назначению исполнителя','sub')
    +sumBox('сейчас у подрядчиков', m0(T.outQty)+' шт','отдано минус привезено','sub')
    +(T.qc?sumBox('ждёт приёмки ОТК', m0(T.qc)+' шт','привезли, контролёр не принял','qc'):'')
    +sumBox('нам делать', m0(T.ourQty)+' шт', money(T.ourRub)+' ₽','our')
    +'</div>';

  var cols=dates.map(function(d){ return '<th class="num cell">'+esc(d.slice(0,5))+'</th>'; }).join('');
  var thead='<thead><tr><th class="dn">Деталь</th><th class="num">Осталось, шт</th><th class="num">Работы, ₽<br><span class="muted">наша расценка</span></th>'
    +'<th>Кому отдаём</th><th class="num">Отдано, шт</th>'+cols
    +'<th class="num noprint"><span class="opc" onclick="addDateCol()">＋ дата</span></th>'
    +'<th class="num">Нам делать</th></tr></thead>';

  var byKey={}; (D.rows||[]).forEach(function(r){ byKey[r.key]=r; });
  var body=(D.blocks||[]).map(function(b,bi){ return blockHtml(b,bi,byKey,dates); }).join('');
  $('pane').innerHTML='<div class="sheet">'+head+qcNote+sums
    +'<div class="twrap"><table class="trf">'+thead+body+'</table></div>'
    +'<div class="hint noprint">Перетащите деталь на заголовок блока — или нажмите на деталь, потом на блок. Клик по пустой клетке даты — записать, что привёз подрядчик.</div>'
    +'<div class="foot sline" style="margin-top:var(--s-4)">Передал: ______________________ / ______________ &nbsp;&nbsp; Принял: ______________________ / ______________</div>'
    +'</div>';
}
function sumBox(name,v,sub,cls){
  return '<div class="sum '+(cls||'')+'"><div class="n">'+esc(name)+'</div><div class="v">'+v+'</div>'
    +(sub?('<div class="n" style="text-transform:none;letter-spacing:0">'+esc(sub)+'</div>'):'')+'</div>';
}
function blockHtml(b,bi,byKey,dates){
  var rows=(b.d||[]).map(function(k){ return byKey[k]; }).filter(function(x){ return !!x; });
  var lq=0,lr=0,our=0;
  rows.forEach(function(r){ lq+=r.left; lr+=r.leftRub; our+=r.ourRub; });
  var span=5+dates.length+2;
  var h='<tbody class="blk'+(OPEN[b.t]===0?' closed':'')+'" id="blk'+bi+'">'
    +'<tr class="bh" id="bh'+bi+'" ondragover="event.preventDefault();this.classList.add(\'target\')" ondragleave="this.classList.remove(\'target\')"'
    +' ondrop="blockDrop(event,'+bi+')" onclick="blockTap('+bi+')">'
    +'<td class="dn" colspan="'+span+'"><span class="car">▾</span><span class="grab">⠿</span> <span class="bt" onclick="event.stopPropagation();renameBlock('+bi+')">'+esc(b.t)+'</span>'
    +'<span class="bs">'+rows.length+' дет · осталось '+m0(lq)+' шт · '+money(lr)+' ₽ · нам '+money(our)+' ₽</span>'
    +'<span class="bx noprint" onclick="event.stopPropagation();delBlock('+bi+')">🗑</span></td></tr>';
  h+=rows.map(function(r){ return rowHtml(r,dates); }).join('');
  return h+'</tbody>';
}
function rowHtml(r,dates){
  var cells=dates.map(function(d){
    var c=(r.cells||{})[d];
    if(!c) return '<td class="cell"><input inputmode="numeric" data-k="'+attr(r.key)+'" data-d="'+attr(d)+'"'
      +(r.noRate?' disabled title="нет расценки — записать работу нельзя"':'')+' onchange="cellIn(this)"></td>';
    return '<td class="cell"><span class="v'+(c.qc?' wqc':'')+'" onclick="openCell(\''+attr(r.key)+'\',\''+attr(d)+'\')">'+m0(c.qty)+(c.qc?' ⏳':'')+'</span>'
      +'<span class="s">'+money(c.sub)+' ₽</span></td>';
  }).join('');
  var who=r.who||'';
  var opts='<option value="">— наши силы —</option>'+(D.contractors||[]).map(function(n){
    return '<option value="'+attr(n)+'"'+(n===who?' selected':'')+'>'+esc(n)+'</option>'; }).join('')
    +((who&&(D.contractors||[]).indexOf(who)<0)?('<option value="'+attr(who)+'" selected>'+esc(who)+'</option>'):'');
  return '<tr class="drow'+(SEL===r.key?' sel':'')+(r.noRate?' norate':'')+'" draggable="true" ondragstart="rowDrag(event,\''+attr(r.key)+'\')">'
    +'<td class="dn grab" onclick="rowTap(\''+attr(r.key)+'\')">'+esc(r.detail)
      +(r.shared?' <span class="muted" title="деталь идёт в нескольких изделиях">·общая</span>':'')
      +(r.noRate?' <span class="warn" title="нет расценки: заведите её в «Операциях и расценках»">нет расценки</span>':'')+'</td>'
    +'<td class="num">'+m0(r.left)+'</td>'
    +'<td class="num">'+money(r.leftRub)+'</td>'
    +'<td><select class="who noprint" onchange="setWho(\''+attr(r.key)+'\',this.value)">'+opts+'</select>'
      +'<span class="pr">'+(who?esc(who):'<span class="fill">&nbsp;</span>')+'</span></td>'
    +'<td class="num give" onclick="openGive(\''+attr(r.key)+'\')"><span class="g">'+(r.given?m0(r.given):'—')+'</span>'
      +(r.outQty?('<span class="o">у него '+m0(r.outQty)+'</span>'):'')+'</td>'
    +cells
    +'<td class="num noprint"></td>'
    +'<td class="num">'+m0(r.ourQty)+' шт<span class="s2">'+money(r.ourRub)+' ₽</span></td>'
    +'</tr>';
}
function rowOf(k){ var f=null; (D.rows||[]).forEach(function(r){ if(r.key===k) f=r; }); return f; }

/* ═══ блоки: перетаскивание и тап (телефон) ═══ */
function rowDrag(ev,k){ SEL=k; try{ ev.dataTransfer.setData('text/plain',k); }catch(e){} }
function blockDrop(ev,bi){ ev.preventDefault(); var k=''; try{ k=ev.dataTransfer.getData('text/plain'); }catch(e){} moveTo(k||SEL,bi); }
function rowTap(k){ SEL=(SEL===k)?'':k; render(); }
function blockTap(bi){
  if(SEL){ moveTo(SEL,bi); return; }
  var b=D.blocks[bi]; if(!b) return;
  OPEN[b.t]=(OPEN[b.t]===0)?1:0;
  var el=document.getElementById('blk'+bi); if(el) el.classList.toggle('closed',OPEN[b.t]===0);
}
function moveTo(k,bi){
  if(!k||!D||!D.blocks[bi]) return;
  D.blocks.forEach(function(b){ b.d=(b.d||[]).filter(function(x){ return x!==k; }); });
  D.blocks[bi].d.push(k);
  D.blocks=D.blocks.filter(function(b){ return b.d.length; });
  SEL=''; render(); saveLayout();
}
function addBlock(){
  askBox('Название нового блока','Новый блок',function(v){
    v=String(v||'').trim(); if(!v) return;
    D.blocks.push({t:v,d:[]}); render(); saveLayout();
  });
}
function renameBlock(bi){
  var b=D.blocks[bi]; if(!b) return;
  askBox('Название блока',b.t,function(v){
    v=String(v||'').trim(); if(!v) return;
    b.t=v; render(); saveLayout();
  });
}
function delBlock(bi){
  var b=D.blocks[bi]; if(!b) return;
  if(b.d.length && !confirm('Удалить блок «'+b.t+'»?\n\nЕго '+b.d.length+' деталей переедут в «Прочее» — ничего не потеряется.')) return;
  var keys=b.d||[]; D.blocks.splice(bi,1);
  if(keys.length){
    var rest=null; D.blocks.forEach(function(x){ if(x.t==='Прочее') rest=x; });
    if(!rest){ rest={t:'Прочее',d:[]}; D.blocks.push(rest); }
    rest.d=rest.d.concat(keys);
  }
  render(); saveLayout();
}
function setWho(k,v){
  var r=rowOf(k); if(r) r.who=v;
  var T=D.totals||{};                       // плановые итоги пересчитываем на месте, без запроса
  T.planOurRub=0; T.planSubRub=0;
  (D.rows||[]).forEach(function(x){ if(x.who) T.planSubRub+=x.leftRub; else T.planOurRub+=x.leftRub; });
  T.planOurRub=Math.round(T.planOurRub*100)/100; T.planSubRub=Math.round(T.planSubRub*100)/100;
  render(); saveLayout();
}
// раскладка сохраняется ОДНИМ запросом с задержкой: каждый вызов сервера стоит 3-9 с,
// а человек раскладывает детали очередями по десятку
function saveLayout(){
  if(SAVET) clearTimeout(SAVET);
  msg('<span class="muted">сохраняю…</span>');
  SAVET=setTimeout(function(){
    var assign={};
    (D.rows||[]).forEach(function(r){ assign[r.key]=r.who||''; });
    apiPost({vapi:'transfersave',batch:B,op:D.op,data:JSON.stringify({blocks:D.blocks,assign:assign})}).then(function(r){
      if(!r||!r.ok){ msg('<span class="err">'+esc((r&&r.error)||'не сохранено')+'</span>'); return; }
      msg('<span class="ok">сохранено</span>'); setTimeout(function(){ msg(''); },1500);
    }).catch(function(e){ msg('<span class="err">сеть: '+esc(e.message)+'</span>'); });
  },800);
}

/* ═══ отдано подрядчику ═══ */
function openGive(k){
  var r=rowOf(k); if(!r) return;
  var rows=(r.give||[]).map(function(g,i){
    return '<div class="mvn"><span>'+esc(g.d)+' · <b>'+m0(g.q)+' шт</b>'+(g.c?(' · '+esc(g.c)):'')+(g.n?(' · '+esc(g.n)):'')+'</span>'
      +'<button class="sm sec" style="margin-left:auto" onclick="giveDel(\''+attr(k)+'\','+i+')">🗑</button></div>';
  }).join('')||'<div class="mvn muted">Передач пока не было.</div>';
  ovOpen('<b>📤 Отдали подрядчику</b> <span class="mvclose" onclick="ovClose()">✕</span>'
    +'<div class="hint">'+esc(r.detail)+' · '+esc(D.op)+'. Передача не двигает заказ — она объясняет, почему деталей нет в цеху, и считает, сколько работы осталось нам.</div>'
    +rows
    +'<label>Отдали, шт<input id="gq" type="number" min="0" inputmode="numeric"></label>'
    +'<label>Дата<input id="gd" type="date" value="'+isoToday()+'"></label>'
    +'<label>Подрядчик<input id="gc" list="gcl" value="'+attr(r.who||'')+'" placeholder="кому отдали"><datalist id="gcl">'
      +(D.contractors||[]).map(function(n){ return '<option value="'+attr(n)+'">'; }).join('')+'</datalist></label>'
    +'<label>Примечание<input id="gn" placeholder="по какой накладной, кто увёз"></label>'
    +'<div class="row" style="margin-top:var(--s-3)"><button id="ggo" onclick="giveAdd(\''+attr(k)+'\')">Записать передачу</button>'
    +'<button class="sec" onclick="ovClose()">Закрыть</button><span class="msg" id="gmsg"></span></div>');
}
function giveAdd(k){
  var q=num(($('gq')||{}).value); if(!(q>0)){ omsg('gmsg','<span class="err">укажите количество</span>'); return; }
  var b=$('ggo'); if(b){ b.disabled=true; b.textContent='…'; }
  apiPost({vapi:'transfergive',batch:B,op:D.op,detail:rowOf(k).detail,
    data:JSON.stringify({act:'add',qty:q,date:ruOfIso(($('gd')||{}).value||''),contractor:($('gc')||{}).value||'',note:($('gn')||{}).value||''})})
  .then(function(r){
    if(b){ b.disabled=false; b.textContent='Записать передачу'; }
    if(!r||!r.ok){ omsg('gmsg','<span class="err">'+esc((r&&r.error)||'не записано')+'</span>'); return; }
    ovClose(); load();
  }).catch(function(e){ if(b){ b.disabled=false; b.textContent='Записать передачу'; } omsg('gmsg','<span class="err">сеть: '+esc(e.message)+'</span>'); });
}
function giveDel(k,i){
  if(!confirm('Удалить запись о передаче?')) return;
  apiPost({vapi:'transfergive',batch:B,op:D.op,detail:rowOf(k).detail,data:JSON.stringify({act:'del',idx:i})}).then(function(r){
    if(!r||!r.ok){ alert((r&&r.error)||'не удалено'); return; }
    ovClose(); load();
  });
}

/* ═══ привезли: запись подряда (двигает заказ и создаёт долг) ═══ */
function addDateCol(){
  askBox('Какая дата? (дд.мм.гггг)',todayRu(),function(v){
    v=String(v||'').trim(); if(!/^\d{2}\.\d{2}\.\d{4}$/.test(v)){ alert('Дата в формате дд.мм.гггг'); return; }
    if((D.dates||[]).indexOf(v)<0 && EXTRA.indexOf(v)<0) EXTRA.push(v);
    render();
  });
}
function cellIn(el){
  var q=num(el.value); if(!(q>0)){ el.value=''; return; }
  openShip(el.getAttribute('data-k'), el.getAttribute('data-d'), q);
  el.value='';
}
function openShip(k,date,qty){
  var r=rowOf(k); if(!r) return;
  if(r.noRate){ alert('У этой детали нет расценки на «'+D.op+'» — заведите её в «Операциях и расценках», иначе работу записать нельзя.'); return; }
  refs(function(){
    var wl=(REFS.wallets||[]), cash=(REFS.cash||[]);
    var eqSel=(r.eqs&&r.eqs.length>1)
      ? '<label>Изделие<select id="sb_e">'+r.eqs.map(function(e){ return '<option'+(e===r.eq?' selected':'')+'>'+esc(e)+'</option>'; }).join('')+'</select></label>' : '';
    ovOpen('<b>📥 Привёз подрядчик</b> <span class="mvclose" onclick="ovClose()">✕</span>'
      +'<div class="hint">'+esc(r.detail)+' · '+esc(D.op)+' · <b>'+m0(qty)+' шт</b> · '+esc(date)
      +(D.qcOp?'<br><span class="warn">операция — точка ОТК: зачтётся в заказ после приёмки контролёром</span>':'')+'</div>'
      +eqSel
      +'<label>Подрядчик<input id="sb_c" list="scl" value="'+attr(r.who||'')+'"><datalist id="scl">'
        +(D.contractors||[]).map(function(n){ return '<option value="'+attr(n)+'">'; }).join('')+'</datalist></label>'
      +'<label>Платим подрядчику, ₽<input id="sb_s" type="number" min="0" step="0.01" inputmode="decimal" oninput="shipCalc('+qty+','+r.rate+')"></label>'
      +'<label>Кошелёк<select id="sb_w">'+wl.map(function(w){ return '<option>'+esc(w)+(cash.indexOf(w)>=0?' ':'')+'</option>'; }).join('')+'</select>'
        +'<span class="hint">наличные: '+esc(cash.join(', ')||'—')+'</span></label>'
      +'<label>Статья<select id="sb_st">'+(REFS.statyi||[]).map(function(s){ return '<option>'+esc(s)+'</option>'; }).join('')+'</select></label>'
      +'<label>Дата<input id="sb_d" type="date" value="'+isoOfRu(date)+'"></label>'
      +'<label>Комментарий<input id="sb_n"></label>'
      +'<div class="hint" id="sb_sum">наша расценка: '+money(qty*r.rate)+' ₽ — на неё продвинется заказ</div>'
      +'<div class="row" style="margin-top:var(--s-3)"><button id="sb_go" onclick="shipGo(\''+attr(k)+'\','+qty+')">Записать работу</button>'
      +'<button class="sec" onclick="ovClose()">Отмена</button><span class="msg" id="smsg"></span></div>');
  });
}
function shipCalc(qty,rate){
  var s=num(($('sb_s')||{}).value), e=$('sb_sum'); if(!e) return;
  var labor=Math.round(qty*rate*100)/100;
  e.textContent='наша расценка: '+money(labor)+' ₽ — на неё продвинется заказ · платим подрядчику: '+money(s)+' ₽ — ляжет долгом в Фин.гений'
    +(s?(' · разница '+money(labor-s)+' ₽'):'');
}
function shipGo(k,qty){
  var r=rowOf(k); if(!r) return;
  var c=(($('sb_c')||{}).value||'').trim();
  if(!c){ omsg('smsg','<span class="err">укажите подрядчика</span>'); return; }
  var b=$('sb_go'); if(b){ b.disabled=true; b.textContent='…'; }
  var eq=($('sb_e')||{}).value||r.eq;
  // модель не указываем у общей детали — система разложит по изделиям сама (тот же путь, что у нарядов)
  var model=(r.models&&r.models.length===1)?r.models[0]:'';
  api({vapi:'subconadd',data:JSON.stringify({batch:B,equip:eq,detail:r.detail,op:D.op,model:model,qty:qty,
      contractor:c,sum:num(($('sb_s')||{}).value),wallet:($('sb_w')||{}).value||'',statya:($('sb_st')||{}).value||'',
      date:ruOfIso(($('sb_d')||{}).value||''),note:($('sb_n')||{}).value||''})})
  .then(function(rr){
    if(b){ b.disabled=false; b.textContent='Записать работу'; }
    if(!rr||!rr.ok){ omsg('smsg','<span class="err">'+esc((rr&&rr.error)||'не записано')+'</span>'); return; }
    ovClose();
    if(rr.waitQC) alert('Записано. Операция — точка контроля ОТК: работа зачтётся в заказ после приёмки контролёром.');
    load();
  }).catch(function(e){ if(b){ b.disabled=false; b.textContent='Записать работу'; } omsg('smsg','<span class="err">сеть: '+esc(e.message)+'</span>'); });
}
function openCell(k,date){
  var r=rowOf(k), c=(r&&r.cells&&r.cells[date])||null; if(!c) return;
  var ids=c.ids||[];
  ovOpen('<b>📥 Привезли '+esc(date)+'</b> <span class="mvclose" onclick="ovClose()">✕</span>'
    +'<div class="hint">'+esc(r.detail)+' · '+esc(D.op)+' · <b>'+m0(c.qty)+' шт</b> · платим '+money(c.sub)+' ₽'
    +(c.contractor?(' · '+esc(c.contractor)):'')+(c.qc?'<br><span class="warn">⏳ ждёт приёмки ОТК — в заказ пока не зачтено</span>':'')+'</div>'
    +ids.map(function(id,i){ return '<div class="mvn"><span>запись '+(i+1)+'</span>'
      +'<button class="sm sec" style="margin-left:auto" onclick="cellDel(\''+attr(id)+'\')">🗑 удалить</button></div>'; }).join('')
    +'<div class="hint">Правится во вкладке «Подряд» в «Выработке» — там же сумма и долг.</div>'
    +'<div class="row" style="margin-top:var(--s-3)"><button class="sec" onclick="ovClose()">Закрыть</button></div>');
}
function cellDel(id){
  if(!confirm('Удалить запись?\n\nЗаказ откатится на эту работу, а строка расхода в Фин.гении удалится вместе с ней.')) return;
  api({vapi:'subcondel',id:id}).then(function(r){
    if(!r||!r.ok){ alert((r&&r.error)||'не удалено'); return; }
    ovClose(); load();
  });
}

/* ═══ мелочи ═══ */
function refs(cb){
  if(REFS){ cb(); return; }
  api({vapi:'subconrefs'}).then(function(r){
    if(!r||!r.ok){ alert((r&&r.error)||'не загрузились справочники'); return; }
    REFS=r; cb();
  });
}
function ovOpen(html){
  ovClose();
  var ov=document.createElement('div'); ov.className='mvov'; ov.id='ovbox';
  ov.onclick=function(e){ if(e.target===ov) ovClose(); };
  ov.innerHTML='<div class="mvbox">'+html+'</div>';
  document.body.appendChild(ov);
}
function ovClose(){ var e=$('ovbox'); if(e) e.remove(); }
function omsg(id,h){ var e=$(id); if(e) e.innerHTML=h||''; }
function askBox(title,val,cb){
  ovOpen('<b>'+esc(title)+'</b><label><input id="askv" value="'+attr(val||'')+'"></label>'
    +'<div class="row" style="margin-top:var(--s-3)"><button onclick="askOk()">ОК</button><button class="sec" onclick="ovClose()">Отмена</button></div>');
  window.__askcb=cb; setTimeout(function(){ var e=$('askv'); if(e){ e.focus(); e.select(); } },30);
}
function askOk(){ var v=($('askv')||{}).value||''; var cb=window.__askcb; ovClose(); if(cb) cb(v); }
function isoToday(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function isoOfRu(s){ var p=String(s||'').split('.'); return p.length===3?(p[2]+'-'+p[1]+'-'+p[0]):isoToday(); }
function ruOfIso(s){ var p=String(s||'').split('-'); return p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):todayRu(); }
function setOrient(v){
  var css=$('pagecss'); if(css) css.textContent='@page{ size:A4 '+(v==='portrait'?'portrait':'landscape')+'; margin:10mm; }';
  document.body.className='w-full '+(v==='portrait'?'port':'land');
  var a=$('or_portrait'), b=$('or_landscape');
  if(a) a.className=(v==='portrait'?'on':''); if(b) b.className=(v==='portrait'?'':'on');
  try{ localStorage.setItem('tw_trf_orient',v); }catch(e){}
}
function initOrient(){ var v=''; try{ v=localStorage.getItem('tw_trf_orient')||''; }catch(e){} setOrient(v||'landscape'); }
function setBlank(on){ BLANK=on?1:0; document.body.classList.toggle('blank',!!on); }
// печать из iframe оболочки утащила бы на бумагу весь интерфейс — открываем своей вкладкой
function doPrint(){
  if(window.top!==window.self){
    var u='transfer.html?batch='+encodeURIComponent(B)+'&op='+encodeURIComponent(D&&D.op||'')+(TGID?('&tgid='+encodeURIComponent(TGID)):'');
    var tk=twTok(); if(tk) u+='&tok='+encodeURIComponent(tk);
    window.open(u,'_blank'); return;
  }
  window.print();
}

/* ═══ заслонка загрузки ═══ */
var TWL=0, TWTMR=null, TWCLICK=0;
function twLoadOn(wait){
  TWL++; var b=$('twload'); if(b) b.style.display='block';
  if(wait){ var w=$('twwait'); if(w) w.style.display='flex';
    clearTimeout(TWTMR);
    TWTMR=setTimeout(function(){
      var h=$('twwt'); if(h) h.textContent='Ответа всё нет';
      var s=document.querySelector('#twwait .wh'); if(s) s.textContent='связь медленная — нажмите, чтобы закрыть';
      var ww=$('twwait'); if(ww) ww.onclick=function(){ TWL=0; twLoadOff(); };
    },30000);
  }
}
function twLoadOff(){
  TWL=Math.max(0,TWL-1); if(TWL) return;
  clearTimeout(TWTMR);
  var b=$('twload'); if(b) b.style.display='none';
  var w=$('twwait'); if(w){ w.style.display='none'; w.onclick=null; }
  var s=document.querySelector('#twwait .wh'); if(s) s.textContent='идёт обмен с сервером — не нажимайте';
}
document.addEventListener('click',function(e){
  var n=e.target;
  while(n&&n!==document.body){ if(n.tagName==='BUTTON'||n.tagName==='A'){ TWCLICK=Date.now(); return; } n=n.parentNode; }
},true);
(function(){
  var _api=api, _post=apiPost;
  var wrap=function(fn){ return function(p){
    var mine=(TWCLICK&&(Date.now()-TWCLICK)<20000); if(mine) TWCLICK=0;
    twLoadOn(mine);
    return fn(p).then(function(r){ twLoadOff(); return r; }, function(e){ twLoadOff(); throw e; });
  }; };
  api=wrap(_api); apiPost=wrap(_post);
})();

boot();
(function(){
  try{ var m=/[?&]twsec=([^&]+)/.exec(location.search); window.top.postMessage({tw:'hello',sec:m?decodeURIComponent(m[1]):''},'*'); }catch(e){}
  window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='refresh'){ try{ load(); }catch(err){} } });
})();
</script>
