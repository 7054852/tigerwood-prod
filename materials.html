<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигервуд — материалы</title>
<style>
  :root{ --bg:#f4f6fb; --card:#fff; --fg:#1b2333; --muted:#8a93a6; --line:#e6e9f2; --accent:#7c3aed; --green:#137333; --amber:#b7791f; --red:#c0392b; }
  *{box-sizing:border-box;} html,body{margin:0;background:var(--bg);}
  body{ font-family:-apple-system,Roboto,Segoe UI,Arial,sans-serif; color:var(--fg); padding:14px; max-width:1000px; margin:0 auto; font-size:14px; }
  .hi{ font-size:19px; font-weight:800; }
  .muted{ color:var(--muted); font-size:13px; }
  .bar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0; }
  input,select{ padding:8px 10px; border:1px solid var(--line); border-radius:9px; font-size:14px; background:#fff; }
  input.search{ flex:1; min-width:160px; }
  button{ padding:8px 13px; border:0; border-radius:9px; font-size:13px; font-weight:600; color:#fff; background:var(--accent); cursor:pointer; }
  button.gray{ background:#eef1f8; color:#334; } button.green{ background:var(--green); } button.sm{ padding:5px 9px; font-size:12px; }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ padding:5px 11px; border-radius:20px; font-size:12.5px; font-weight:600; background:#eef1f8; color:#556; border:1px solid var(--line); cursor:pointer; }
  .chip.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .box{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 12px; overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th{ color:var(--muted); font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  td input.p{ width:78px; text-align:right; } td input.u{ width:52px; }
  input.mchk,#chkAll{ width:18px; height:18px; }
  .nm{ cursor:pointer; color:var(--accent); font-weight:700; }
  .role{ font-size:11px; padding:2px 8px; border-radius:20px; background:#f0edfb; color:var(--accent); font-weight:700; }
  .up{ color:var(--red); } .down{ color:var(--green); }
  .msg{ font-size:13px; } .err{ color:var(--red); } .ok{ color:var(--green); }
  .center{ text-align:center; padding:36px 16px; }
  /* modal */
  .ov{ position:fixed; inset:0; background:rgba(20,25,50,.45); display:none; align-items:flex-start; justify-content:center; padding:24px 12px; overflow:auto; z-index:9; }
  .ov.on{ display:flex; }
  .modal{ background:#fff; border-radius:16px; max-width:720px; width:100%; padding:18px; }
  .modal h3{ margin:0 0 4px; font-size:17px; } .modal .x{ float:right; background:#eef1f8; color:#334; }
  .lbl{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:14px 0 6px; font-weight:700; }
  .frm{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .frm input,.frm select{ padding:6px 8px; font-size:13px; }
  .frm input.s{ width:88px; } .frm input.xs{ width:60px; }
  /* панель выбранных — всегда под рукой, без прокрутки наверх */
  #selBar{ position:fixed; left:0; right:0; bottom:0; z-index:8; margin:0;
    background:var(--card); border-top:1px solid var(--line); box-shadow:0 -6px 18px rgba(20,25,50,.12);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom)); justify-content:center; }
  body.hasSel{ padding-bottom:74px; }              /* чтобы панель не закрывала последние строки */
  @media(max-width:520px){ #selBar #selCnt{ width:100%; text-align:center } }
</style>
</head>
<body>
<style>html.emb>body>.hi{display:none}</style><script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('emb');</script>
<div class="hi">🧱 Материалы</div>
<div class="muted" id="cnt">загрузка…</div>
<div class="bar">
  <input class="search" id="q" placeholder="поиск…" oninput="draw()">
  <button class="gray" id="snabBtn" onclick="openSupplyDocs()">📥 Накладные из Снаба</button>
  <button class="gray sm" onclick="doImport()">⬇︎ Импорт из файла</button>
  <button class="gray sm" onclick="openSimilar()" title="найти позиции, которые различаются только сортом или написанием">🔀 Похожие позиции</button>
  <button class="gray sm" onclick="openStd()" title="единый вид названий: регистр, размеры, опечатки">🧹 Навести порядок</button>
  <button onclick="toggleNew()" id="newBtn">➕ Новый материал</button>
  <span class="msg" id="imsg"></span>
</div>
<div id="newBox" class="box" style="display:none;margin-bottom:10px;padding:10px">
  <div class="bar" style="flex-wrap:wrap">
    <input id="nName" placeholder="Название, напр. Фанера 18мм 1250х2500" style="min-width:260px;flex:1">
    <select id="nUnit" style="width:110px" onchange="nSheetToggle()"><option value="лист">лист</option><option value="шт">шт</option><option value="кг">кг</option><option value="м">м</option><option value="л">л</option><option value="м²">м²</option></select>
    <select id="nRole" style="width:170px"></select>
  </div>
  <div class="bar" style="flex-wrap:wrap">
    <span id="nSheetFields"><input id="nThick" placeholder="толщина, мм" style="width:130px">
    <input id="nSize" placeholder="размер листа 1525x1525" style="width:200px"></span>
    <button onclick="addMat()">Добавить</button>
    <button class="gray" onclick="toggleNew()">Отмена</button>
    <span class="msg" id="nmsg"></span>
  </div>
  <div class="muted">Для листовых материалов толщина и размер нужны, чтобы посчиталась расценка за раскрой (площадь × толщина ÷ делитель).</div>
</div>
<div class="chips" id="roles"></div>
<div id="selBar" class="bar" style="display:none;align-items:center">
  <b id="selCnt"></b>
  <button class="gray sm" onclick="selAll(false)">снять выбор</button>
  <button class="sm" style="background:#dc2626;color:#fff" onclick="delSelected()">🗑 Удалить выбранные</button>
  <span class="msg" id="selMsg"></span>
</div>
<div style="height:10px"></div>
<div class="box"><table><thead><tr><th style="width:26px"><input type="checkbox" id="chkAll" onclick="selAll(this.checked)" title="выбрать всё, что сейчас в списке"></th><th>Материал</th><th>Ед</th><th>Роль</th><th class="num" title="для листовых — считается расценка за раскрой">Толщина</th><th title="напр. 1525x1525">Размер листа</th><th class="num">Последняя цена</th><th class="num">Для расчёта</th><th>Комментарий</th><th></th></tr></thead><tbody id="tb"><tr><td colspan=9 class="center muted">Загрузка…</td></tr></tbody></table></div>
<datalist id="matlist"></datalist>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod';
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
try{ if(window.Telegram&&Telegram.WebApp){ var u0=Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user; if(u0) TGID=String(u0.id); } }catch(e){}
if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }
// tgid в каждом запросе: справочники материалов и расценок доступны только мастеру и выше
function api(p){ p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}); }
function apiPost(p){ p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID; var b=Object.keys(p).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:b}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function $(id){ return document.getElementById(id); }
function money(n){ n=Number(n)||0; return n.toFixed(2).replace('.',','); }
var ROWS=[], ROLES=[], FROLE='';

function load(){
  api({vapi:'matdata'}).then(function(r){
    ROWS=(r&&r.rows)||[]; ROLES=(r&&r.roles)||[];
    $('roles').innerHTML='<span class="chip'+(FROLE?'':' on')+'" onclick="setRole(\'\')">все</span>'+ROLES.map(function(x){
      return '<span class="chip'+(FROLE===x?' on':'')+'" onclick="setRole(\''+x+'\')">'+esc(x)+'</span>';
    }).join('');
    $('matlist').innerHTML=ROWS.map(function(m){return '<option value="'+esc(m.name)+'">';}).join('');
    draw();
    refreshSnabCount();
  }).catch(function(e){ $('tb').innerHTML='<tr><td colspan=10 class="center err">Ошибка: '+esc(e.message||e)+'</td></tr>'; });
}
function setRole(r){ FROLE=r; load(); }
function draw(){
  var q=$('q').value.trim().toLowerCase();
  var list=ROWS.filter(function(m){ if(FROLE&&m.role!==FROLE)return false; if(q&&m.name.toLowerCase().indexOf(q)<0)return false; return true; });
  $('cnt').textContent=list.length+' из '+ROWS.length+' материалов';
  $('tb').innerHTML=list.map(function(m){
    var idx=ROWS.indexOf(m);
    var roleSel='<select onchange="save('+idx+',\'role\',this.value)">'+ROLES.map(function(x){return '<option'+(x===m.role?' selected':'')+'>'+esc(x)+'</option>';}).join('')+'</select>';
    var dyn='';
    if(m.hasBuys&&m.prevPrice){ var d=m.lastPrice-m.prevPrice; if(Math.abs(d)>=0.005) dyn=' <span class="'+(d>0?'up':'down')+'">'+(d>0?'▲':'▼')+money(Math.abs(d))+'</span>'; }
    var price=m.hasBuys?('<b>'+money(m.lastPrice)+'</b>'+dyn):('<span class="muted">'+money(m.calcPrice)+'</span>');
    var forCost=(Number(m.priceForCost)||0)>0?('<b>'+Math.round(m.priceForCost)+'</b>'):'<span class="muted">—</span>';
    return '<tr>'
      +'<td><input type="checkbox" class="mchk" value="'+esc(m.name)+'"'+(SEL[m.name]?' checked':'')+' onclick="selOne(this)"></td>'
      +'<td><span class="nm" onclick="openCard(\''+esc(m.name).replace(/\x27/g,"\\x27")+'\')">'+esc(m.name)+'</span></td>'
      +'<td><input class="u" value="'+esc(m.unit)+'" onchange="save('+idx+',\'unit\',this.value)"></td>'
      +'<td>'+roleSel+'</td>'
      // толщина и размер нужны только листовым (из них считается расценка за раскрой);
      // у остальных пустые поля читались как «размер стоит везде»
      +(isSheet(m)
        ? '<td class="num"><input class="u" style="width:60px" value="'+(m.thick||'')+'" onchange="save('+idx+',\'thick\',this.value)"></td>'
          +'<td><input class="u" style="width:110px" value="'+esc(m.size||'')+'" placeholder="1525x1525" onchange="save('+idx+',\'size\',this.value)"></td>'
        : '<td class="num muted">—</td><td class="muted">—</td>')
      +'<td class="num">'+price+'</td>'
      +'<td class="num" title="средняя поставок + 10%, округл.">'+forCost+'</td>'
      +'<td class="muted">'+esc(m.note||'')+'</td>'
      +'<td><button class="gray sm" title="переименовать" onclick="renameMat(\''+esc(m.name).replace(/\x27/g,"\\x27")+'\')">✎</button> <button class="gray sm" title="удалить материал" onclick="delMat(\''+esc(m.name).replace(/\x27/g,"\\x27")+'\')">🗑</button> <span class="msg" id="m'+idx+'"></span></td>'
      +'</tr>';
  }).join('')||'<tr><td colspan=10 class="center muted">ничего не найдено</td></tr>';
  syncSel();
}
// ── выбор нескольких материалов ──
var SEL={};                                   // имя → true; переживает перерисовку и фильтры
function selOne(el){ if(el.checked) SEL[el.value]=true; else delete SEL[el.value]; syncSel(); }
function selAll(on){
  var boxes=document.querySelectorAll('.mchk');
  for(var i=0;i<boxes.length;i++){ boxes[i].checked=on; if(on) SEL[boxes[i].value]=true; else delete SEL[boxes[i].value]; }
  syncSel();
}
function selNames(){ return Object.keys(SEL); }
function syncSel(){
  var boxes=document.querySelectorAll('.mchk');
  for(var i=0;i<boxes.length;i++) boxes[i].checked=!!SEL[boxes[i].value];   // вернуть галочки после перерисовки
  var n=selNames().length;
  $('selBar').style.display=n?'flex':'none';
  document.body.className=n?'hasSel':'';
  $('selCnt').textContent='выбрано: '+n;
  var all=$('chkAll'); if(all) all.checked=boxes.length>0&&n>=boxes.length;
}
function delSelected(){
  var names=selNames(); if(!names.length) return;
  var m=$('selMsg'); m.className='msg'; m.textContent='Проверяю, где используются…';
  apiPost({vapi:'delmaterials', names:JSON.stringify(names), dry:1}).then(function(r){
    if(!r||!r.ok){ m.className='msg err'; m.textContent='Ошибка: '+((r&&r.error)||'?'); return; }
    var u=r.usage||{}, warn=[];
    names.forEach(function(n){ var x=u[n]||{}; if(x.bom) warn.push('• '+n+' — в составе изделий: '+x.bom); });
    var txt='Удалить материалов: '+names.length+'?\n\n'+names.slice(0,15).join('\n')+(names.length>15?'\n…и ещё '+(names.length-15):'')
      +'\n\nВместе с ними уйдут расценки за раскрой листа.';
    if(warn.length) txt+='\n\n⚠️ ЭТИ СТОЯТ В СОСТАВЕ ИЗДЕЛИЙ — себестоимость перестанет считаться:\n'+warn.join('\n');
    if(!confirm(txt)){ m.textContent=''; return; }
    m.textContent='Удаляю…';
    apiPost({vapi:'delmaterials', names:JSON.stringify(names)}).then(function(r2){
      if(r2&&r2.ok){
        m.className='msg ok';
        m.textContent='✓ удалено '+r2.deleted+(r2.rateRemoved?', расценок '+r2.rateRemoved:'')+((r2.missed&&r2.missed.length)?'; не найдено: '+r2.missed.join(', '):'');
        SEL={}; load();
      } else { m.className='msg err'; m.textContent='Ошибка: '+((r2&&r2.error)||'?'); }
    }).catch(function(e){ m.className='msg err'; m.textContent='Связь оборвалась: '+(e.message||e); });
  }).catch(function(e){ m.className='msg err'; m.textContent='Связь оборвалась: '+(e.message||e); });
}

// ── переименование ──
// имя материала — это ключ связей (составы, закупки, склад, расценки), поэтому только через сервер
function renameMat(oldName){
  var v=prompt('Новое название материала:\n\nСтарое имя останется как «называют поставщики» — распознавание накладных не сломается.', oldName);
  if(v===null) return; v=String(v).trim(); if(!v||v===oldName) return;
  apiPost({vapi:'renamematerials', pairs:JSON.stringify([{from:oldName,to:v}])}).then(function(r){
    if(r&&r.ok&&r.renamed) load();
    else alert('Не переименовано: '+(((r&&r.failed&&r.failed[0])||{}).error||(r&&r.error)||'?'));
  }).catch(function(e){ alert('Связь оборвалась: '+(e.message||e)); });
}

// ── единый стандарт названий ──
// «Что» + характеристика + размер: с заглавной, размеры латинской x без пробелов (1525x1525),
// единицы слитно с числом (18мм), только кириллица в русских словах, без двойных пробелов.
var TYPOS={'лакированая':'лакированная','ликированая':'лакированная','лакированый':'лакированный',
  'инструция':'инструкция','аммортизатор':'амортизатор','колпачек':'колпачок','целофан':'целлофан',
  'отвертка':'отвёртка','флаера':'флаеры','целофановый':'целлофановый'};
var LAT2CYR={'A':'А','B':'В','C':'С','E':'Е','H':'Н','K':'К','M':'М','O':'О','P':'Р','T':'Т','X':'Х','a':'а','c':'с','e':'е','o':'о','p':'р','x':'х','y':'у'};
function keepCase(src,rep){ return /^[А-ЯЁ]/.test(src) ? rep.charAt(0).toUpperCase()+rep.slice(1) : rep; }
function stdName(name){
  var n=String(name||'').replace(/[\r\n\t]+/g,' ').replace(/\s+/g,' ').trim();
  // латиница-двойник внутри русского слова: «Cтяжка» → «Стяжка» (слова с цифрами не трогаем — там коды)
  n=n.replace(/[A-Za-zА-Яа-яЁё]+/g,function(w){
    if(!/[А-Яа-яЁё]/.test(w)) return w;                     // чисто латинское слово — код, оставляем
    return w.replace(/[A-Za-z]/g,function(ch){ return LAT2CYR[ch]||ch; });
  });
  n=n.replace(/[А-Яа-яЁё]+/g,function(w){                   // опечатки
    var t=TYPOS[w.toLowerCase()]; return t?keepCase(w,t):w;
  });
  n=n.replace(/(\d)\s*[хx*×]\s*(\d)/g,'$1x$2');             // размер: 35*6 / 1525х1525 → 35x6 / 1525x1525
  n=n.replace(/(\d)\s+(мм|см|м|кг|г|л)(?![а-яё])/g,'$1$2');  // 18 мм → 18мм
  n=n.replace(/\s+,/g,',').replace(/,(?=[^\s\d])/g,', ');    // пробелы вокруг запятой (6,3 — не трогаем)
  n=n.replace(/(\S)\s*-\s+|\s+-\s*(?=\S)/g,function(m0){ return m0.replace(/\s*-\s*/,' — '); }); // «1035В - белый» → «— »
  n=n.replace(/(светло|темно|тёмно)\s+([а-яё])/gi,'$1-$2');  // светло голубой → светло-голубой
  n=n.replace(/\s\d+й(?=\s)/,'');                            // «цвет 1й фиолетовый» → «цвет фиолетовый»
  n=n.replace(/^Краска\s+цвет\s+/i,'Краска ');               // ⚠ \b здесь не работает — слово кириллицей
  n=n.replace(/(\d)[сc](?![А-Яа-яЁёA-Za-z])/g,'$1c');        // код краски: 5155с (кириллица) → 5155c, иначе неотличимые дубли
  n=n.replace(/\s+/g,' ').trim();
  if(n) n=n.charAt(0).toUpperCase()+n.slice(1);              // с заглавной
  return n;
}
function openStd(){
  $('ov').className='ov on';
  var fixes=[], manual=[];
  ROWS.forEach(function(m){
    var v=stdName(m.name);
    if(v&&v!==m.name) fixes.push({from:m.name,to:v,kind:'std'});
    // шаблон умеет то, чего не умеет стандартизация: собрать имя из полей «толщина» и «размер»
    var t=tplName({name:(v||m.name), thick:m.thick, size:m.size});
    if(t&&t!==(v||m.name)) fixes.push({from:m.name,to:t,kind:'tpl'});
    if(!String(m.unit||'').trim()) manual.push(m.name+' — не указана единица измерения');
    if(/широкая/i.test(m.name)) manual.push(m.name+' — «Широкая» это жаргон: размер уже есть в названии');
    if(/^Коробки\s/i.test(m.name)) manual.push(m.name+' — «Коробки» во множественном, у остальных «Коробка»');
    if(/[А-Яа-яЁё][A-Za-z]|[A-Za-z][А-Яа-яЁё]/.test(m.name)) manual.push(m.name+' — в одном слове кириллица и латиница: глазом не отличить, поиск не найдёт');
  });
  // конфликты: после правки имя займёт уже существующее
  var have={}; ROWS.forEach(function(m){ have[m.name.toLowerCase()]=1; });
  var byTpl={}; fixes.forEach(function(f){ if(f.kind==='tpl') byTpl[f.from]=1; });
  fixes=fixes.filter(function(f){ return !(f.kind==='std'&&byTpl[f.from]); });   // шаблон уже включает правку написания
  // правка одного регистра — не конфликт с самим собой
  var busy=function(f){ return have[f.to.toLowerCase()] && f.to.toLowerCase()!==f.from.toLowerCase(); };
  var conf=fixes.filter(busy);
  fixes=fixes.filter(function(f){ return !busy(f); });
  window.STDFIX=fixes;
  var rowsOf=function(kind){
    return fixes.map(function(f,i){ return f.kind!==kind ? '' :
      '<label style="display:block;padding:4px 0;border-bottom:1px solid rgba(128,128,128,.15)">'
      +'<input type="checkbox" class="stdchk" value="'+i+'" checked> '

    +'<div class="muted">Стандарт: <b>Что · характеристика · размер</b> — с заглавной буквы, размер латинской «x» без пробелов (1525x1525), единица слитно с числом (18мм), только кириллица в русских словах.</div>'

    +(nStd? '<div class="lbl" style="margin-top:10px">Написание: '+nStd+'</div><div class="box" style="padding:8px;max-height:280px;overflow:auto">'+rowsOf('std')+'</div>' : '')

        +'<div class="box" style="padding:8px;max-height:280px;overflow:auto">'+rowsOf('tpl')+'</div>' : '')
    +(fixes.length
      ? '<div style="margin-top:8px"><button class="gray sm" onclick="stdAll(true)">отметить все</button> <button class="gray sm" onclick="stdAll(false)">снять</button> '
        +'<button class="green" onclick="applyStd()">✓ Применить отмеченные</button> <span class="msg" id="std_msg"></span></div>'
      : '<div class="lbl" style="margin-top:10px">✓ Названия уже по стандарту</div>')
    +(conf.length? '<div class="lbl" style="margin-top:12px">Совпадёт с существующим — это дубли</div><div class="box" style="padding:8px">'
        +conf.map(function(f){ return '<div>• '+esc(f.from)+' → <b>'+esc(f.to)+'</b> <span class="muted">уже есть — объедините на экране «🔀 Похожие позиции»</span></div>'; }).join('')+'</div>' : '')
    +(manual.length? '<div class="lbl" style="margin-top:12px">Решить вручную: '+manual.length+'</div><div class="box" style="padding:8px">'
        +manual.map(function(x){ return '<div class="muted">• '+esc(x)+'</div>'; }).join('')+'</div>' : '');
}
function stdAll(on){ var b=document.querySelectorAll('.stdchk'); for(var i=0;i<b.length;i++) b[i].checked=on; }
function applyStd(){
  var b=document.querySelectorAll('.stdchk'), pairs=[];
  for(var i=0;i<b.length;i++) if(b[i].checked) pairs.push(window.STDFIX[Number(b[i].value)]);
  if(!pairs.length) return;
  if(!confirm('Переименовать материалов: '+pairs.length+'?\nСтарые названия сохранятся как «называют поставщики».')) return;
  var m=$('std_msg'); m.className='msg'; m.textContent='Переименовываю '+pairs.length+'… это займёт до минуты';
  // ⚠ только POST: список пар не влезает в длину GET-адреса — запрос молча обрывался
  apiPost({vapi:'renamematerials', pairs:JSON.stringify(pairs)}).then(function(r){
    if(r&&r.ok){
      m.className='msg ok'; m.textContent='✓ переименовано '+r.renamed+((r.failed&&r.failed.length)?', не вышло '+r.failed.length:'');

  }).catch(function(e){ m.className='msg err'; m.textContent='Связь оборвалась: '+(e.message||e)+'. Отметьте меньше позиций и повторите.'; });
}

// ── единое имя: «<Материал> <толщина>мм <Ш>x<Д>» ──
// ⚠ \b в JS не знает кириллицы — границы слов задаём явно
function tplName(m){
  var t=Number(String(m.thick||'').replace(',','.'))||0, sz=String(m.size||'').trim();
  if(!t||!sz) return '';                                  // без размеров шаблон не собрать
  var base=String(m.name||'')
    .replace(/(^|[\s(,])\d+(?:[.,]\d+)?\s*мм(?=$|[\s),.])/g,'$1')     // толщина
    .replace(/(^|[\s(,])\d{3,4}\s*[xх*]\s*\d{3,4}(?=$|[\s),.])/g,'$1') // размер
    .replace(/(^|[\s(,])\d(?:[.,]\d)?\s*[xх*]\s*\d(?:[.,]\d)?\s*м(?=$|[\s),.])/g,'$1')  // компактно: «2х3м»
    .replace(/(^|[\s(,])(лист|листов|листы)(?=$|[\s),.])/g,'$1')
    .replace(/(^|[\s(,])\d\s*\/\s*\d(?=$|[\s),.])/g,'$1')            // сорт 1/2
    .replace(/[,\s]+/g,' ').trim();
  if(!base) return '';
  return base+' '+String(t).replace('.',',')+'мм '+sz.replace(/\s*[xх*]\s*/,'x');
}
function isSheet(m){ return /лист/i.test(String(m.unit||'')); }
function save(i,field,val){
  var m=ROWS[i], f={name:m.name}; f[field]=val; var el=$('m'+i); if(el) el.textContent='…';
  api({vapi:'savematerial', data:JSON.stringify(f)}).then(function(r){
    if(r&&r.ok){ m[field]=val;
      if(el){el.innerHTML='<span class="ok">✓</span>'; setTimeout(function(){el.innerHTML='';},900);}
      if(field==='unit') draw();          // стал листовым (или перестал) — показать/убрать толщину и размер
    }
    else if(el) el.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>';
  });
}

function exists(name){

// ── «покупаем большой лист — кроим маленький» ──
// У производной позиции цена не своя: она вытекает из цены закупочной, поделённой на выход.
function renderLink(name){
  var box=$('linkBox'); if(!box) return;
  var m=null; for(var i=0;i<ROWS.length;i++) if(ROWS[i].name===name) m=ROWS[i];
  if(!m){ box.innerHTML='<div class="muted">—</div>'; return; }
  var qn=function(x){ return esc(String(x)).replace(/\x27/g,"\\x27"); };
  var kids=m.children||[];
  var h='';
  if(kids.length){
    h+='<div><b>Это закупочный формат.</b> Из него режут: '
      +kids.map(function(k){ return '<b>'+esc(k.name)+'</b> — '+k.yield+' шт из одного'; }).join(', ')+'</div>'
      +'<div class="muted" style="margin-top:4px">Приход и контроль цены — по этой позиции. На ЧПУ она не предлагается.</div>';
  } else {
    var pr=m.from? ('<div class="muted" style="margin-top:4px">Цена считается сама: цена «'+esc(m.from)+'» ÷ '+(m.yield||0)+'. Руками её не правьте.</div>') : '';
    h+='<div class="frm">'
      +'<span class="muted">Получается из</span>'
      +'<input list="matlist" id="lk_from" value="'+esc(m.from||'')+'" placeholder="закупочная позиция" style="min-width:230px">'
      +'<span class="muted">выход, шт</span><input class="xs" id="lk_yield" value="'+(m.yield||'')+'" placeholder="4">'
      +'<button class="green sm" onclick="saveLink(\''+qn(name)+'\')">Сохранить</button>'
      +'<span class="msg" id="lk_msg"></span></div>'+pr
      +'<div class="muted" style="margin-top:4px;font-size:12px">Заполняйте, если поставщик режет покупной лист на несколько наших (например 2800x2070 → 4 шт 1395x1030). Пусто — обычная позиция.</div>';
  }
  box.innerHTML=h;
}
function saveLink(name){
  var f={name:name, from:$('lk_from').value.trim(), yield:$('lk_yield').value.trim()||0};

  api({vapi:'matsimilar'}).then(function(r){

    window.SIMG=(r.groups||[]);
    if(!window.SIMG.length){ $('modal').innerHTML='<button class="x sm" onclick="closeOv()">✕</button><h3>Похожие позиции</h3><div class="muted" style="margin-top:8px">✓ дублей не нашлось — реестр чистый</div>'; return; }
    var blocks=window.SIMG.map(function(g,gi){
      var rows=g.items.map(function(it,ii){
        return '<label style="display:block;padding:3px 0"><input type="radio" name="sg'+gi+'" value="'+ii+'"'+(ii===0?' checked':'')+'> <b>'+esc(it.name)+'</b>'
          +' <span class="muted">'+esc(it.unit||'')+(it.price?' · '+money(it.price)+' р':'')+'</span></label>';
      }).join('');
      return '<div class="box" style="padding:10px;margin-bottom:8px">'+rows
        +'<div style="margin-top:6px"><button class="sm" onclick="doMerge('+gi+')">Объединить в выбранную</button>'

function doMerge(gi){
  var g=window.SIMG[gi], sel=document.querySelector('input[name="sg'+gi+'"]:checked');
  if(!g||!sel) return;
  var keep=g.items[Number(sel.value)].name;
  var from=g.items.map(function(i){return i.name;}).filter(function(n){return n!==keep;});
  if(!from.length) return;
  if(!confirm('Объединить в «'+keep+'»?\nИсчезнут: '+from.join(', ')+'\nИх закупки и составы переедут на главную позицию.')) return;
  var m=$('sm'+gi); m.className='msg'; m.textContent='Объединяю…';
  api({vapi:'mergematerials', from:JSON.stringify(from), to:keep}).then(function(r){
    if(r&&r.ok){ m.className='msg ok'; m.textContent='✓ объединено ('+r.moved+' ссылок)'; load(); setTimeout(openSimilar,700); }
    else { m.className='msg err'; m.textContent='Ошибка: '+((r&&r.error)||'?'); }
  });
}

  api({vapi:'delsupplier', name:name, supplier:supplier}).then(function(){ openCard(name); load(); });
}

// ── накладные из Снаба (уже загружены ботом) → распознать позиции → журнал ──
function openSupplyDocs(){
  $('ov').className='ov on'; $('modal').innerHTML='<button class="x sm" onclick="closeOv()">✕</button><h3>Накладные из Снаба</h3><div class="center muted">Загрузка…</div>';
  api({vapi:'supplydocs'}).then(function(r){
    if(!r||!r.ok){ $('modal').innerHTML='<button class="x sm" onclick="closeOv()">✕</button><div class="err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    window.SDOCS=r.docs||[];
    var rows=window.SDOCS.map(function(d,i){
      return '<tr><td>'+esc(d.type)+'</td><td>'+esc(d.contr)+'</td><td class="muted">'+esc(d.docNo)+'</td><td class="num">'+money(d.sum)+' '+esc(d.cur)+'</td><td>'+(d.done?'<span class="muted">разнесён</span>':'<button class="sm" onclick="pickDoc('+i+')">распознать</button>')+'</td></tr>';
    }).join('');
    $('modal').innerHTML='<button class="x sm" onclick="closeOv()">✕</button><h3>Накладные из Снаба</h3><div class="muted">загружены ботом @SnabTW_bot — повторно грузить не нужно</div><div class="box" style="margin-top:8px"><table><thead><tr><th>Тип</th><th>Поставщик</th><th>№</th><th class="num">Сумма</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan=5 class="muted">нет документов с файлом</td></tr>')+'</tbody></table></div>';
  }).catch(function(e){ $('modal').innerHTML='<button class="x sm" onclick="closeOv()">✕</button><div class="err">'+esc(e.message||e)+'</div>'; });
}
function docHeadFrom(d){ return { supplier:d.contr, docType:d.type, docNo:d.docNo, date:d.date, currency:d.cur }; }
function pickDoc(i){
  var d=window.SDOCS[i]; $('modal').innerHTML='<div class="center muted">Распознаю позиции документа…<br><span class="muted">'+esc(d.contr)+' · '+esc(d.docNo)+'</span></div>';
  api({vapi:'supplydocpos', fileId:d.fileId}).then(function(r){
    if(!r||!r.ok||!(r.positions&&r.positions.length)){
      var why=(r&&r.ok)?'в документе не найдено товарных позиций':((r&&r.error)||'ошибка распознавания');
      $('modal').innerHTML='<button class="x sm" onclick="closeOv()">✕</button><h3>Не распозналось</h3><div class="err" style="margin-top:6px">⚠️ '+esc(why)+'</div>'
        +'<div class="muted" style="margin-top:6px">'+esc(d.contr)+' · '+esc(d.type)+' '+esc(d.docNo)+'</div>'
        +'<div style="margin-top:12px"><button class="gray" onclick="pickDoc('+i+')">↻ Повторить</button> <button onclick="manualDoc('+i+')">✍️ Ввести вручную</button></div>';
      return;
    }
    r.header=Object.assign(docHeadFrom(d), {date:(r.header&&r.header.date)||d.date, supplier:(r.header&&r.header.supplier)||d.contr});
    renderDoc(r.header, r.positions);
  }).catch(function(e){ $('modal').innerHTML='<button class="x sm" onclick="closeOv()">✕</button><h3>Ошибка</h3><div class="err">'+esc(e.message||e)+'</div><div style="margin-top:12px"><button class="gray" onclick="pickDoc('+i+')">↻ Повторить</button> <button onclick="manualDoc('+i+')">✍️ Ввести вручную</button></div>'; });
}
function manualDoc(i){ var d=window.SDOCS[i]; renderDoc(docHeadFrom(d), [{name:'',qty:'',unit:'',sum:'',material:''},{name:'',qty:'',unit:'',sum:'',material:''}]); }
function docRead(){ // считать текущие правки в DOCP
  window.DOCP=(window.DOCP||[]).map(function(p,i){ return {
    name:$('dn'+i)?$('dn'+i).value:p.name, material:$('dm'+i)?$('dm'+i).value:(p.material||''),
    qty:$('dq'+i)?$('dq'+i).value:p.qty, unit:$('du'+i)?$('du'+i).value:p.unit,
    coef:$('dc'+i)?$('dc'+i).value:(p.coef||1), sum:$('ds'+i)?$('ds'+i).value:p.sum,
    matSrc:($('dm'+i)&&$('dm'+i).value!==(p.material||''))?'':(p.matSrc||'') }; });   // правил руками — метка распознавания снимается
}
function addRow(){ docRead(); window.DOCP.push({name:'',material:'',qty:'',unit:'',coef:1,sum:''}); renderDoc(window.DOCH, window.DOCP); }
function renderDoc(h, pos){
  window.DOCH=h; window.DOCP=pos;
  var rows=pos.map(function(p,i){
    return '<tr><td><input id="dn'+i+'" value="'+esc(p.name||'')+'" style="width:150px" placeholder="строка документа"></td>'
      +'<td><input list="matlist" id="dm'+i+'" value="'+esc(p.material||'')+'" style="width:150px" placeholder="наш материал">'
      + (p.material ? (p.matSrc==='alias'
          ? ' <span class="muted" style="font-size:11px" title="это название уже приходило — подставлено по прошлым приходам">✓ запомнено</span>'
          : ' <span class="muted" style="font-size:11px" title="угадано по названию — проверьте">≈ похоже</span>') : '')
      +'</td>'
      +'<td class="num"><input class="xs" id="dq'+i+'" value="'+(p.qty!=null?p.qty:'')+'"></td>'
      +'<td><input class="xs" id="du'+i+'" value="'+esc(p.unit||'')+'"></td>'
      +'<td class="num"><input class="xs" id="dc'+i+'" value="'+(p.coef||1)+'"></td>'
      +'<td class="num"><input class="s" id="ds'+i+'" value="'+(p.sum!=null?p.sum:'')+'"></td></tr>';
  }).join('');
  $('ov').className='ov on';
  $('modal').innerHTML='<button class="x sm" onclick="closeOv()">✕</button><h3>Позиции документа</h3>'
    +'<div class="muted">'+esc(h.supplier||'')+' · '+esc(h.docType||'')+' '+esc(h.docNo||'')+' · '+esc(h.date||'')+' · '+esc(h.currency||'BYN')+'</div>'
    +'<div class="muted" style="font-size:11px;margin-top:4px">не сопоставилось — впиши новое имя материала (создастся), лишние строки оставь без «нашего материала»</div>'
    +'<div class="box" style="margin-top:8px"><table><thead><tr><th>В документе</th><th>Наш материал</th><th class="num">Кол-во</th><th>Ед</th><th class="num">Коэф</th><th class="num">Сумма</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div style="margin-top:10px"><button class="gray sm" onclick="addRow()">＋ строка</button> <button class="green" onclick="commitDoc()">✓ Провести все в журнал</button> <span class="msg" id="d_msg"></span></div>';
}
function commitDoc(){
  docRead(); var h=window.DOCH||{}, pos=window.DOCP||[], m=$('d_msg'); m.className='msg'; m.textContent='Провожу…';
  var tasks=pos.filter(function(p){ return String(p.material||'').trim(); }).map(function(p){
    return api({vapi:'addpurchase', data:JSON.stringify({ material:String(p.material).trim(), supplier:h.supplier, docType:h.docType, docNo:h.docNo, date:h.date,
      qtyDoc:p.qty, unitDoc:p.unit, coef:p.coef||1, sum:p.sum, cur:h.currency||'BYN', rate:1, docName:p.name })});
  });
  if(!tasks.length){ m.className='msg err'; m.textContent='Нет сопоставленных позиций (укажи «наш материал»)'; return; }
  Promise.all(tasks).then(function(rs){ var ok=rs.filter(function(x){return x&&x.ok;}).length; m.className='msg ok'; m.textContent='✓ Проведено '+ok+' из '+tasks.length; load(); setTimeout(closeOv,1400); });
}
function refreshSnabCount(){
  api({vapi:'supplydocs'}).then(function(r){
    if(!r||!r.ok) return; window.SDOCS=r.docs||[];
    var nw=window.SDOCS.filter(function(d){return !d.done;}).length, btn=$('snabBtn'); if(!btn) return;
    btn.textContent='📥 Накладные из Снаба'+(nw?(' · '+nw+' новых'):'');
    if(nw){ btn.style.background='var(--accent)'; btn.style.color='#fff'; } else { btn.style.background='#eef1f8'; btn.style.color='#334'; }
  }).catch(function(){});
}
load();

// авто-обновление: оболочка шлёт «refresh» при возврате на раздел — перечитываем данные без перезагрузки страницы
(function(){
  try{ var m=/[?&]twsec=([^&]+)/.exec(location.search); window.top.postMessage({tw:'hello',sec:m?decodeURIComponent(m[1]):''},'*'); }catch(e){}
  window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='refresh'){ try{ load(); }catch(err){} } });
})();
</script>
