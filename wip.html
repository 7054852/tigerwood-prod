<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигервуд — склады</title>
<script src="tw-theme.js"></script>
<style>
  #tiles{ margin-bottom:var(--s-4); }
  #log{ margin-top:var(--s-4); }
  .note:has(#hint:empty):has(#foot:empty){ display:none; }   /* до загрузки подсказок нет — не показываем пустой блок */
  .tbwrap td{ white-space:nowrap; }
  #tbl th, #tbl td{ padding-left:var(--s-2); padding-right:var(--s-2); }
  input.q{ width:64px; text-align:right; font-variant-numeric:tabular-nums; }
  input.q.chg{ border-color:var(--amber); background:var(--amber-bg); font-weight:600; }
  .cell0{ color:var(--muted); }
  .neg{ color:var(--red); font-weight:600; }
  @media print{
    body{ font:var(--t-small); }
    .noprint,.tabs{ display:none !important; }
    th,td{ border-bottom:1px solid var(--line2); }
    td.wr{ height:32px; min-width:52px; border:1px solid var(--muted); }
  }
</style>
</head>
<body>
<div class="hi">🏬 Склады</div>
<div class="muted sub0">Незавершённые детали из закрытых заказов и упакованный товар, который ещё не увезли.</div>

<!-- каркас: вкладки → панель действий → уведомление → плитки → таблица в карточке -->
<div class="tabs noprint">
  <button id="tb_wip" class="on" onclick="setTab('wip')">Детали</button>
  <button id="tb_fg" onclick="setTab('fg')">Готовая продукция</button>
</div>

<div class="toolbar noprint">
  <span class="meta" id="chg"></span>
  <span class="msg" id="msg"></span>
  <div class="end">
    <button class="sec" onclick="load()">Обновить</button>
    <button class="sec" onclick="window.print()">🖨 Печать ведомости</button>
    <button class="sec" onclick="load()">отменить правки</button>
    <button class="sec" id="issue" onclick="issueMode()" style="display:none">🚚 Отгрузить со склада</button>
    <button id="save" onclick="saveCount()" disabled>💾 Провести пересчёт</button>
  </div>
</div>

<div class="note noprint"><div><div id="hint"></div><div id="foot"></div></div></div>

<div class="tiles" id="tiles"></div>

<div class="card">
  <div class="tbwrap"><table id="tbl"><thead id="thd"></thead><tbody id="tb"></tbody></table></div>
</div>

<div id="log"></div>

<script>
function qp(k){ var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod';
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
// ⚠ ЛИЧНОСТЬ — ТОКЕНОМ, А НЕ АДРЕСОМ: ?tgid= в ссылке ничего не доказывает (Telegram ID виден
// в списке сотрудников). Токен выдаётся после входа в сервис и лежит в localStorage этого браузера.
function twTok(){ try{ return twQp('tok')||localStorage.getItem('tw_tok')||''; }catch(e){ return twQp('tok')||''; } }
function twQp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
(function(){ var t=twQp('tok'); if(t){ try{ localStorage.setItem('tw_tok',t); }catch(e){} } })();
function twAuthWall(r){
  if(r&&r.needAuth){ document.body.innerHTML='<div style="padding:var(--s-6);font:var(--t-body);color:var(--fg)">'
    +'<div style="font:var(--t-title);margin-bottom:var(--s-3)">🔒 Нужен вход</div>'
    +'<div>'+String(r.error||'Откройте сервис из бота @TWOtchbot или войдите по личному коду.')+'</div></div>'; }
  return r;
}
function api(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; if(TGID) p.tgid=TGID;
  var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&');
  return fetch(BASE+'?'+q).then(function(r){return r.json();}).then(twAuthWall); }
function msg(h){ $('msg').innerHTML=h||''; }

var TAB='wip', DATA=null;
function setTab(t){
  TAB=t;
  ISSUE=false; $('issue').style.display=(t==='fg')?'':'none';
  $('issue').textContent='🚚 Отгрузить со склада'; $('save').style.display='';
  $('tb_wip').className=(t==='wip')?'on':''; $('tb_fg').className=(t==='fg')?'on':'';
  $('log').innerHTML=''; load();
}
function load(){
  msg('загрузка…'); DATA=null;
  api({vapi:(TAB==='wip')?'wipsheet':'fglist'}).then(function(r){
    if(!r||!r.ok){ msg('<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'); return; }
    DATA=r; msg(''); (TAB==='wip')?renderWip():renderFg();
  }).catch(function(e){ msg('<span class="err">'+esc(e.message)+'</span>'); });
}

// ─── ДЕТАЛИ: строка = деталь + вариант, колонки = стадии ───
function renderWip(){
  var st=DATA.stages||[], rows=DATA.rows||[], hints=DATA.hints||{};
  $('tiles').innerHTML='<div class="tile"><div class="t">позиций</div><div class="v">'+(DATA.stat.rows||0)+'</div></div>'
    +'<div class="tile"><div class="t">деталей всего</div><div class="v">'+(DATA.stat.qty||0)+'</div></div>';
  $('hint').textContent='Впишите фактическое количество — сохранится только изменённое.';
  $('foot').innerHTML='Цифра может <b>уменьшиться</b>: склад — это состояние, а не накопленная выработка. Пустая клетка = «не считали», а не ноль.';
  $('thd').innerHTML='<tr><th>Деталь</th><th>Вариант</th>'
    +st.map(function(s){ return '<th class="num" title="'+esc(hints[s]||'')+'">'+esc(s)+'</th>'; }).join('')+'<th class="num">всего</th></tr>';
  if(!rows.length){ $('tb').innerHTML='<tr><td colspan="'+(st.length+3)+'" class="muted">Склад пуст. Детали попадают сюда при закрытии заказа — недоделанное остаётся за цехом.</td></tr>'; recount(); return; }
  $('tb').innerHTML=rows.map(function(d,i){
    var tot=0;
    var cells=st.map(function(s){
      var c=d.cells[s]; if(c) tot+=c.qty;
      return '<td class="num wr"><input class="q'+(c?'':' cell0')+'" id="c_'+i+'_'+esc(s)+'" type="number" min="0" value="'+(c?c.qty:'')+'" data-was="'+(c?c.qty:'')+'" oninput="recount()"></td>';
    }).join('');
    return '<tr><td>'+esc(d.detail)+'</td><td class="muted">'+esc(d.model||'—')+'</td>'+cells+'<td class="num"><b>'+tot+'</b></td></tr>';
  }).join('');
  recount();
}

// ─── ГОТОВАЯ ПРОДУКЦИЯ: строка = артикул ───
function renderFg(){
  var rows=DATA.rows||[];
  var s=DATA.stat||{};
  $('tiles').innerHTML='<div class="tile"><div class="t">артикулов</div><div class="v">'+(s.rows||0)+'</div></div>'
    +'<div class="tile"><div class="t">лежит на складе</div><div class="v'+((s.qty||0)<0?' neg':'')+'">'+(s.qty||0)+'</div></div>'
    +'<div class="tile"><div class="t">в резерве</div><div class="v">'+(s.reserved||0)+'</div></div>';
  $('hint').textContent=ISSUE?'Впишите, сколько увозите со склада.':'Впишите фактический остаток — сохранится только изменённое.';
  $('foot').innerHTML='Пересчёт правит только <b>физический остаток</b>. Резерв под продажи не трогается. '
    +'Отрицательный остаток — след старых операций, его тоже правят здесь.';
  $('thd').innerHTML='<tr><th>Изделие</th><th>Артикул</th><th class="num">в наличии</th><th class="num">резерв</th>'
    +'<th class="num">'+(ISSUE?'везём':'факт')+'</th><th class="num">целевой</th><th>обновлено</th><th></th></tr>';
  if(!rows.length){ $('tb').innerHTML='<tr><td colspan="8" class="muted">Склад пуст.</td></tr>'; recount(); return; }
  $('tb').innerHTML=rows.map(function(x,i){
    return '<tr><td>'+esc(x.model||x.equip||'—')+'</td><td class="muted">'+esc(x.sku||'—')+'</td>'
      +'<td class="num'+(x.onHand<0?' neg':'')+'">'+x.onHand+'</td>'
      +'<td class="num muted">'+(x.reserved||'')+'</td>'
      +'<td class="num wr"><input class="q" id="f_'+i+'" type="number" value="'+(ISSUE?0:x.onHand)+'" data-was="'+x.onHand+'" oninput="recount()"'+(ISSUE?(' max="'+Math.max(0,x.onHand-(x.reserved||0))+'"'):'')+'></td>'
      +'<td class="num muted">'+(x.target||'')+'</td><td class="muted">'+esc(x.upd||'')+'</td>'
      +'<td class="noprint"><button class="sec sm" onclick="fgLog(\''+esc(x.sku)+'\')">журнал</button></td></tr>';
  }).join('');
  recount();
}

function collect(){
  var out=[];
  if(TAB==='wip'){
    var st=DATA.stages||[];
    (DATA.rows||[]).forEach(function(d,i){
      st.forEach(function(s){
        var el=$('c_'+i+'_'+s); if(!el) return;
        var was=el.getAttribute('data-was'), now=el.value;
        el.className='q'+((String(was)!==String(now))?' chg':'');
        if(String(was)===String(now)) return;
        out.push({detail:d.detail, model:d.model, stage:s, qty:(now===''?0:Number(now))});
      });
    });
  } else {
    (DATA.rows||[]).forEach(function(x,i){
      var el=$('f_'+i); if(!el) return;
      var was=el.getAttribute('data-was'), now=el.value;
      el.className='q'+((String(was)!==String(now))?' chg':'');
      if(String(was)===String(now)||now==='') return;
      out.push({sku:x.sku, equip:x.equip, model:x.model, qty:Number(now)});
    });
  }
  return out;
}
function recount(){
  if(ISSUE){
    var t=0; (DATA.rows||[]).forEach(function(x,i){ var el=$('f_'+i); if(el) t+=Math.max(0,Number(el.value)||0); });
    $('chg').innerHTML=t?('везём <b>'+t+'</b> · <button class="sm" onclick="issueGo()">🚚 Отгрузить</button>'):'';
    return;
  }
  var ch=collect();
  $('chg').textContent=ch.length?('изменено строк: '+ch.length):'';
  $('save').disabled=!ch.length;
}
function saveCount(){
  var ch=collect(); if(!ch.length) return;
  var what=(TAB==='wip')?'склада деталей':'склада готовой продукции';
  if(!confirm('Провести пересчёт '+what+' по '+ch.length+' позициям?\nЦифры могут как вырасти, так и уменьшиться.')) return;
  msg('сохраняю…'); $('save').disabled=true;
  api({vapi:(TAB==='wip')?'wipcount':'fgcount', items:JSON.stringify(ch)}).then(function(r){
    if(!r||!r.ok){ msg('<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'); $('save').disabled=false; return; }
    msg('<span class="ok">проведено: '+(r.changed||0)+' изменений</span>');
    load();
  });
}
// ─── ОТГРУЗКА СО СКЛАДА ───
// Не привязана к заказу: увозим то, что лежит, кому угодно. Поле «факт» превращается в «везём».
var ISSUE=false;
function issueMode(){
  ISSUE=!ISSUE;
  $('issue').textContent=ISSUE?'✕ выйти из отгрузки':'🚚 Отгрузить со склада';
  $('save').style.display=ISSUE?'none':'';
  renderFg();
  if(ISSUE) msg('<span class="warn">режим отгрузки: впишите, сколько увозите</span>'); else msg('');
}
function issueGo(){
  var items=[], t=0;
  (DATA.rows||[]).forEach(function(x,i){
    var el=$('f_'+i); if(!el) return;
    var q=Number(el.value)||0; if(q>0){ items.push({sku:x.sku,qty:q}); t+=q; }
  });
  if(!t){ alert('Не указано ни одной позиции.'); return; }
  var doc=prompt('Кому отгружаем / номер отгрузки:',''); if(doc===null) return;
  if(!confirm('Отгрузить со склада '+t+' изделий?')) return;
  msg('отгружаю…');
  api({vapi:'fgissue', items:JSON.stringify(items), doc:doc}).then(function(r){
    if(!r||!r.ok){ msg('<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'); return; }
    var w=(r.warn&&r.warn.length)?(' · '+r.warn.join('; ')):'';
    msg('<span class="ok">отгружено '+r.issued+w+'</span>');
    ISSUE=false; $('issue').textContent='🚚 Отгрузить со склада'; $('save').style.display='';
    load();
  });
}
function fgLog(sku){
  var box=$('log');
  box.innerHTML='<div class="muted">загрузка…</div>';
  api({vapi:'fglog', sku:sku}).then(function(r){
    if(!r||!r.ok){ box.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; return; }
    if(!r.rows.length){ box.innerHTML='<div class="box muted">По «'+esc(sku)+'» движений нет</div>'; return; }
    var rows=r.rows.map(function(x){
      return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.type)+'</td><td class="num">'+x.qty+'</td>'
        +'<td class="muted">'+esc(x.doc||'')+'</td><td class="muted">'+esc(x.note||'')+'</td></tr>';
    }).join('');
    box.innerHTML='<div class="box"><div class="row"><b>Журнал: '+esc(sku)+'</b>'
      +'<span class="muted">движений '+r.total+'</span>'
      +'<button class="sec sm" style="margin-left:auto" onclick="$(\'log\').innerHTML=\'\'">закрыть</button></div>'
      +'<div class="tbwrap"><table><thead><tr><th>Дата</th><th>Тип</th><th class="num">Кол-во</th><th>Документ</th><th>Комментарий</th></tr></thead>'
      +'<tbody>'+rows+'</tbody></table></div></div>';
  });
}
load();
</script>
</body>
</html>
