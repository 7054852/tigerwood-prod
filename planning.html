<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="tw-theme.js"></script>
<script src="tw-config.js"></script>
<title>Тигервуд — планирование</title>
<style>
  .muted{ font-size:13px; }
  .box{ margin-bottom:var(--s-3); }
  .box + .box{ margin-top:0; }
  /* показатели — плитки темы */
  .tiles{ margin-bottom:var(--s-4); }
  .tile .v.ok{ color:var(--green); }
  .tile .meta{ margin-top:var(--s-1); }
  /* ── чипы бойцов: .chip темы + то, что нужно доске ── */
  .zrow{ display:flex; flex-wrap:wrap; gap:var(--s-2); align-items:center; padding:var(--s-1) var(--s-3); }
  .sh{ width:18px; }
  .chip{ cursor:grab; user-select:none; -webkit-user-select:none; transition:transform .15s var(--ease), box-shadow .15s var(--ease), border-color .15s var(--ease); }
  .chip b{ font-weight:600; white-space:nowrap; }
  .chip .st{ color:var(--muted); font-size:11px; white-space:nowrap; }
  .chip .exp{ font-weight:600; color:var(--green); cursor:pointer; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .chip .exp.own{ color:var(--amber); }
  .chip .exp.fresh{ color:var(--muted); }   /* новичок: 50 ₽ — оценка, а не факт */
  .chip.sel{ transform:translateY(-2px); box-shadow:0 0 0 3px var(--accent-bg); border-color:var(--accent); }
  .chip .x{ color:var(--muted); cursor:pointer; font-weight:600; padding:0 2px; }
  /* ── зона-участок ── */
  .zone{ border:1px solid var(--line); border-radius:var(--r-card); background:var(--card); box-shadow:var(--shadow-card); margin-bottom:var(--s-3); overflow:hidden;
         transition:border-color .15s var(--ease), box-shadow .15s var(--ease); }
  .zone.target{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); cursor:pointer; }
  .zone.bn{ border-color:var(--red); box-shadow:0 0 0 3px var(--red-bg); }
  .zh{ display:flex; align-items:center; gap:var(--s-2); padding:var(--s-3) var(--s-3) var(--s-2); font-weight:600; flex-wrap:wrap; }
  .zh .zn{ font:var(--t-heading); }
  .zbar{ position:relative; height:16px; background:var(--grid); border-radius:var(--r-xs); display:flex; margin:var(--s-4) var(--s-3) 0; }
  /* ⚠ отрезки шкалы — .zseg, а не .seg: .seg в теме — сегментный переключатель (рамка, отступы) */
  .zbar .zseg{ height:100%; }
  .zbar .s-done{ background:var(--green); border-radius:var(--r-xs) 0 0 var(--r-xs); }
  .zbar .s-av{ background:var(--bar); position:relative; }
  .zbar .s-av > i{ display:block; height:100%; background:repeating-linear-gradient(45deg,var(--accent),var(--accent) 5px,var(--accent-hover) 5px,var(--accent-hover) 10px); }
  .zbar .s-bl{ background:var(--line2); border-radius:0 var(--r-xs) var(--r-xs) 0; }
  /* риска мощности прямо на шкале: видно «можем больше, чем есть работы» и наоборот */
  .capmark{ position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--fg); opacity:.5; }
  .capmark:after{ content:'мощность'; position:absolute; top:-16px; left:-20px; font-size:11px; line-height:12px; white-space:nowrap; }
  .zlegend, .legend{ display:flex; gap:var(--s-4); flex-wrap:wrap; font:var(--t-small); color:var(--muted); }
  .zlegend{ padding:var(--s-2) var(--s-3) 0; }
  .legend{ margin-top:var(--s-3); }
  .zlegend i, .legend i{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; box-shadow:inset 0 0 0 1px var(--line); }
  .zcap{ font:var(--t-small); padding:var(--s-2) var(--s-3); background:var(--card2); border-top:1px dashed var(--line); }
  .zfoot{ font:var(--t-small); padding:var(--s-2) var(--s-3) var(--s-3); }
  .warnbar{ margin:var(--s-2) var(--s-3) 0; padding:var(--s-2) var(--s-3); border-radius:var(--r-ctl); background:var(--amber-bg); color:var(--amber); font:500 13px/18px var(--font); }
  .drophint{ color:var(--muted); font:var(--t-small); }
  /* ── карточка бойца ── */
  .crew{ border:1px solid var(--line); border-radius:var(--r-card); background:var(--card); box-shadow:var(--shadow-card); margin-bottom:var(--s-3); overflow:hidden; }
  .crew.full{ border-color:var(--green); } .crew.low{ border-color:var(--amber); } .crew.empty{ border-style:dashed; border-color:var(--line2); }
  .ch{ display:flex; align-items:center; gap:var(--s-2); padding:var(--s-3) var(--s-3) var(--s-2); flex-wrap:wrap; }
  .ch .nm{ font:var(--t-heading); } .ch .stat{ font-size:11px; color:var(--muted); }
  .load{ height:8px; background:var(--grid); margin:0 var(--s-3); border-radius:var(--r-pill); overflow:hidden; }
  .load>i{ display:block; height:100%; background:var(--accent); border-radius:var(--r-pill); } .load>i.ov{ background:var(--red); }
  .lnums{ font:var(--t-small); padding:var(--s-1) var(--s-3) 0; font-variant-numeric:tabular-nums; }
  .tasks{ padding:var(--s-1) var(--s-3) var(--s-2); }
  .task{ display:flex; gap:var(--s-2); align-items:center; flex-wrap:wrap; padding:var(--s-1) 0; border-bottom:1px solid var(--line); font:var(--t-small); }
  .task:last-child{ border-bottom:0 }
  .task .tg, .pk .tg{ font:600 11px/16px var(--font); color:var(--fg2); background:var(--grey-bg); border-radius:var(--r-pill); padding:0 var(--s-2); }
  .task .tn{ flex:1; min-width:150px; } .task .tq{ font-weight:600; font-variant-numeric:tabular-nums; }
  .pick{ margin:0 var(--s-3) var(--s-3); border:1px dashed var(--line2); border-radius:var(--r-ctl); padding:var(--s-2); }
  .pk{ display:flex; gap:var(--s-2); align-items:center; padding:var(--s-1) 0; border-bottom:1px solid var(--line); font:var(--t-small); cursor:pointer; }
  .pk:last-child{ border-bottom:0 } .pk:hover{ background:var(--card2) }
  /* ── волны ── */
  .wave{ border:1px solid var(--line); border-radius:var(--r-card); background:var(--card); box-shadow:var(--shadow-card); margin-bottom:var(--s-3); padding:var(--s-4); }
  .flow{ display:flex; gap:var(--s-2); align-items:stretch; overflow-x:auto; padding:var(--s-2) 0 var(--s-1); }
  .fbox{ min-width:126px; border:1px solid var(--line); border-radius:var(--r-ctl); padding:var(--s-2) var(--s-3); flex:1; }
  .fbox.bn{ border-color:var(--red); background:var(--red-bg); }
  .fbox .fh{ font:600 13px/18px var(--font); margin-bottom:var(--s-1); }
  .fbox .fd{ font:var(--t-title); font-variant-numeric:tabular-nums; } .fbox .fu{ font-size:11px; font-weight:400; color:var(--muted); }
  .lbar{ height:6px; background:var(--grid); border-radius:var(--r-pill); overflow:hidden; margin:var(--s-2) 0 var(--s-1); }
  .lbar>i{ display:block; height:100%; }
  .arrow{ align-self:center; color:var(--muted); }
</style>
</head>
<body class="w-full">
<div id="twload"><i></i></div>
<div id="twwait"><div class="wb"><div class="sp"></div><div class="wt" id="twwt">Сохраняю…</div><div class="wh">идёт обмен с сервером — не нажимайте</div></div></div>
<div class="hi">📊 Планирование</div>
<div id="head"></div>
<div id="pane"><div class="center muted">Загрузка…</div></div>

<script>
var BASE=(window.TW_CFG&&TW_CFG.hub)||'https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';   // адрес задаёт tw-config.js; запасной — живой GAS
var APP='tw7prod';
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
try{ if(window.Telegram&&Telegram.WebApp){ var u0=Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user; if(u0) TGID=String(u0.id); } }catch(e){}
if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }
// ⚠ ЛИЧНОСТЬ — ТОКЕНОМ, А НЕ АДРЕСОМ: ?tgid= в ссылке ничего не доказывает (Telegram ID виден
// в списке сотрудников). Токен выдаётся после входа в сервис и лежит в localStorage этого браузера.
function twTok(){ try{ return twQp('tok')||localStorage.getItem('tw_tok')||''; }catch(e){ return twQp('tok')||''; } }
function twQp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
(function(){ var t=twQp('tok'); if(t){ try{ localStorage.setItem('tw_tok',t); }catch(e){} } })();
function twAuthWall(r){
  if(r&&r.needAuth){ document.body.innerHTML='<div style="padding:var(--s-6);font:var(--t-body);color:var(--fg)">'
    +'<div style="font:var(--t-title);margin-bottom:var(--s-3)">🔒 Нужен вход</div>'
    +'<div>'+String(r.error||'Откройте сервис из бота @TWOtchbot или войдите по личному коду.')+'</div></div>'; }
  return r;
}
function api(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}).then(twAuthWall); }
function apiPost(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID; var b=Object.keys(p).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:b}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function $(id){ return document.getElementById(id); }
function money(n){ n=Number(n)||0; return n.toFixed(2).replace('.',','); }
function m0(n){ return Math.round(Number(n)||0); }
function num(x){ return Number(String(x==null?'':x).replace(',','.'))||0; }
function isoOf(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function ruDate(s){ var p=String(s||'').split('-'); return p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):s; }
function mkDate(s){ var p=String(s).split('-'); return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); }
function dayName(s){ return ['вс','пн','вт','ср','чт','пт','сб'][mkDate(s).getDay()]; }
function shiftDate(s,delta){ var d=mkDate(s); d.setDate(d.getDate()+delta); return isoOf(d); }
var ZICON={'Механика':'🛠','Шлифовка':'🪵','Покрытие':'🎨','Сборка':'📦'};
var GORDER=['Механика','Шлифовка','Покрытие','Сборка','Прочее'];

// ОДНА дата и ОДИН заказ на весь раздел: раньше «табель» и «расстановка» жили
// на разных датах в одном экране, и это путало.
var VIEW=qp('view')||'day';
var DATE=(function(){ var d=new Date(); d.setDate(d.getDate()+1); return isoOf(d); })();
var OID=qp('batch')||'', R=null, SEL='', PICK='', SHIFTF='', PLAN=null;

function load(){
  $('pane').innerHTML='<div class="center muted">Загрузка…</div>';
  api({vapi:'planscreen', view:VIEW, date:ruDate(DATE), batch:OID}).then(function(r){
    if(!r||!r.ok){ $('pane').innerHTML='<div class="center err">'+esc((r&&r.error)||'нет прав')+'</div>'; return; }
    R=r;
    if(!OID&&r.orders&&r.orders.length){ OID=r.orders[0].id; load(); return; }
    renderHead(); render();
  }).catch(function(){ $('pane').innerHTML='<div class="center err">Связь оборвалась. <a href="javascript:void(0)" onclick="load()">Повторить</a></div>'; });
}
function setView(v){ VIEW=v; SEL=''; PICK=''; load(); }
function setDate(v){ DATE=v; SEL=''; PICK=''; load(); }
function renderHead(){
  var opts=(R.orders||[]).map(function(b){ return '<option value="'+esc(b.id)+'"'+(b.id===OID?' selected':'')+'>'+esc(b.num)+' · '+esc(b.name||'')+'</option>'; }).join('');
  var tabs=[['horizon','Горизонт'],['day','День'],['crew','Люди']].map(function(t){
    return '<button class="'+(VIEW===t[0]?'active':'')+'" onclick="setView(\''+t[0]+'\')">'+t[1]+'</button>'; }).join('');
  // каркас: вкладки первыми → панель действий (дата, заказ, справа действия вида)
  $('head').innerHTML='<div class="tabs">'+tabs+'</div>'
    +'<div class="toolbar">'
    +'<div class="pnav"><button onclick="setDate(shiftDate(DATE,-1))">‹</button>'
    +'<span class="lbl">'+ruDate(DATE)+' ('+dayName(DATE)+')</span>'
    +'<button onclick="setDate(shiftDate(DATE,1))">›</button></div>'
    +'<input type="date" value="'+DATE+'" onchange="setDate(this.value)">'
    +'<span class="meta">заказ:</span><select onchange="OID=this.value;PLAN=null;load()">'+opts+'</select>'
    +(VIEW==='crew'?'<div class="end"><button class="sec" onclick="sendAll()">📨 Разослать задания</button></div>':'')
    +'</div>';
}
function render(){
  if(VIEW==='horizon') return renderHorizon();
  if(VIEW==='crew') return renderCrew();
  renderDay();
}

/* ═══════════ ВИД «ДЕНЬ» ═══════════ */
function isNight(p){ return p.shift==='ночь'; }
function sumExp(l){ var s=0; l.forEach(function(p){ s+=Number(p.expect)||0; }); return Math.round(s*100)/100; }
function idxByName(n){ for(var i=0;i<(R.people||[]).length;i++) if(R.people[i].name===n) return i; return -1; }
function chipHtml(p,i,inZone){
  var own=(p.expectSrc==='своё'), fresh=(p.expectSrc==='новичок 50 ₽');
  return '<span class="chip'+(SEL===p.name?' sel':'')+'" draggable="true" ondragstart="dragChip(event,'+i+')" onclick="event.stopPropagation();tapChip('+i+')">'
    +'<b>'+esc(p.name)+'</b>'
    +(p.topGroup?'<span class="st">⭐'+esc(p.topGroup)+'</span>':'')
    +'<span class="exp'+(own?' own':(fresh?' fresh':''))+'" title="ожидаемая выработка за смену ('+esc(p.expectSrc||'')+') — нажмите, чтобы поправить" onclick="event.stopPropagation();editExpect('+i+')">⚡'+m0(p.expect)+'</span>'
    +(inZone?'<span class="x" title="вернуть на скамейку" onclick="event.stopPropagation();unassign('+i+')">✕</span>':'')+'</span>';
}
function renderDay(){
  var people=R.people||[];
  var bench=people.filter(function(p){ return !p.group; });
  var allD=people.filter(function(p){ return !isNight(p); }), allN=people.filter(isNight);
  var y=R.yesterday||{};
  var yline=(y.planRub>0||y.factRub>0)
    ? ('<div class="tile"><div class="t">Вчера ('+ruDate(y.date)+')</div><div class="v">'+m0(y.factRub)+' <small>₽</small></div>'
       +(y.planRub>0?('<div class="meta">из плана '+m0(y.planRub)+(y.pct!=null?(' · '+y.pct+'%'):'')+'</div>'):'')+'</div>')
    : '';
  var kpi='<div class="tiles">'
    +'<div class="tile"><div class="t">Бойцов в смене</div><div class="v">'+people.length+'</div><div class="meta">☀️'+allD.length+' · 🌙'+allN.length+(bench.length?(' · скамейка '+bench.length):'')+'</div></div>'
    +'<div class="tile"><div class="t">Ожидаем за день</div><div class="v ok">'+m0(sumExp(people))+' <small>₽</small></div></div>'
    +(R.bottleneck?('<div class="tile"><div class="t">Узкое место</div><div class="v" style="color:var(--red)">'+esc(R.bottleneck)+'</div><div class="meta">работы на '+(R.bottleneckDays||'?')+' дн</div></div>'):'')
    +yline+'</div>';
  var fbtn=function(v,l){ return '<button class="sec sm'+(SHIFTF===v?' on':'')+'" onclick="SHIFTF=(SHIFTF===\''+v+'\'?\'\':\''+v+'\');render()">'+l+'</button>'; };
  var showD=(SHIFTF!=='ночь'), showN=(SHIFTF!=='день');
  var brow=function(list,ic,lbl){ if(!list.length) return '';
    return '<div class="zrow"><span class="sh">'+ic+'</span>'+list.map(function(p){ return chipHtml(p,idxByName(p.name),false); }).join('')
      +'<span class="muted" style="font-size:11px;margin-left:auto">'+lbl+': '+list.length+' · ~'+m0(sumExp(list))+' ₽</span></div>'; };
  var benchInner=(showD?brow(bench.filter(function(p){return !isNight(p);}),'☀️','день'):'')
                +(showN?brow(bench.filter(isNight),'🌙','ночь'):'');
  var benchBox='<div class="sect">🪑 Скамейка</div>'
    +'<div class="box" style="padding:var(--s-3) 0 var(--s-2)"><div class="row" style="padding:0 var(--s-3) var(--s-1)">'
    +'<span class="drophint">нажмите бойца, потом участок (или перетащите)</span>'
    +'<span style="flex:1"></span>'+fbtn('день','☀️')+fbtn('ночь','🌙')+'</div>'
    +(benchInner||'<div class="zrow"><span class="muted">'+(bench.length?'скрыто фильтром':(people.length?'все расставлены 👍':'на эту дату никто не отмечен'))+'</span></div>')+'</div>';
  $('pane').innerHTML=kpi+benchBox+markBox()+(R.groups||[]).map(zoneHtml).join('')+capBox();
}
function zoneHtml(g){
  var people=R.people||[];
  var ppl=people.filter(function(p){ return p.group===g.group; });
  var showD=(SHIFTF!=='ночь'), showN=(SHIFTF!=='день');
  var pd=ppl.filter(function(p){ return !isNight(p); }), pn=ppl.filter(isNight);
  var contrib=Math.round((sumExp(pd)+sumExp(pn))*100)/100;
  var tot=g.totalRub||0, dn=g.doneRub||0, av=g.availRub||0, bl=g.blockedRub||0;
  var pD=tot>0?Math.round(dn/tot*100):0, pA=tot>0?Math.round(av/tot*100):0, pB=Math.max(0,100-pD-pA);
  var fill=av>0?Math.min(100,Math.round(contrib/av*100)):(contrib>0?100:0);
  var capPos=(tot>0&&g.capRub>0)?Math.min(99,Math.round((dn+g.capRub)/tot*100)):-1;
  var badges=(g.bottleneck?'<span class="pill bad">🎯 узкое место'+(g.daysAll?(' · '+g.daysAll+' дн'):'')+'</span>':'')
    +(g.starving?'<span class="pill bad" title="детали ещё не прошли предыдущий этап">⛔ встанет</span>':'')
    +(g.idle&&!g.bottleneck?'<span class="pill mute" title="работы меньше, чем людей">💤 простой</span>':'');
  var CS={'расстановка':'по расставленным людям','ожидаемая численность':'по заданной численности','средняя численность':'по средней численности за 14 дней'};
  var capLine=tot?('<div class="zcap">⚙ мощность <b>'+m0(g.capRub)+' ₽/день</b> <span class="muted">('
    +((g.capSrc==='нет данных')?'<span style="color:var(--amber)">неизвестна — задайте ниже</span>':(CS[g.capSrc]||esc(g.capSrc)))
    +(g.capShift?(', '+m0(g.capShift)+' ₽/смену на бойца'):'')+')</span>'
    +(g.daysAll!=null?(' · работы на <b>'+g.daysAll+' дн</b>'):'')
    +(g.daysAvail!=null?(' <span class="muted">(обеспечено заделом '+g.daysAvail+' дн)</span>'):'')+'</div>'):'';
  var warn='';
  if(contrib>0&&tot>0){
    if(av<=0) warn='<div class="warnbar">⚠ фронта работ нет — детали не прошли предыдущий этап. Люди простоят.</div>';
    else if(contrib>av*1.05) warn='<div class="warnbar">⚠ назначено ~'+m0(contrib)+' ₽, доступно только <b>'+m0(av)+' ₽</b> — остальное ждёт предыдущего участка.</div>';
  }
  var zrow=function(list,ic,sum){ if(!list.length) return '';
    return '<div class="zrow"><span class="sh">'+ic+'</span>'+list.map(function(p){ return chipHtml(p,idxByName(p.name),true); }).join('')
      +'<span class="muted" style="font-size:11px;margin-left:auto">~'+m0(sum)+' ₽</span></div>'; };
  var body=(showD?zrow(pd,'☀️',sumExp(pd)):'')+(showN?zrow(pn,'🌙',sumExp(pn)):'');
  if(!body) body='<div class="zrow"><span class="drophint">'+(SEL?'👇 нажмите сюда':'пусто')+'</span></div>';
  var foot;
  if(!tot) foot='<span class="muted">в заказе нет работ этого участка</span>';

        +'<button class="sec sm" onclick="fillShift('+i+')">⚡ Заполнить смену</button>'
        +'<button class="sec sm" onclick="togglePick(\''+esc(String(p.name).replace(/'/g,''))+'\')">'+(PICK===p.name?'закрыть':'＋ работа')+'</button></div>'
      +'<div class="load"><i class="'+(over?'ov':'')+'" style="width:'+pct+'%"></i></div>'
      +'<div class="lnums"><b>'+m0(plan)+'</b> из ~'+m0(exp)+' ₽'
        +(plan<exp*0.9?(' · <span style="color:var(--amber)">резерв '+m0(exp-plan)+' ₽</span>'):(over?' · <span class="err">перегруз</span>':' · смена заполнена'))+'</div>'
      +'<div class="tasks">'+(tasks||'<div class="muted" style="padding:var(--s-2) 0">работ не назначено — «⚡ Заполнить смену» или «＋ работа»</div>')+'</div>'
      +(PICK===p.name?pickerHtml(p,i):'')

function togglePick(n){ PICK=(PICK===n)?'':n; render(); }
// каталог = что физически можно делать сейчас (задел с предыдущих операций обеспечен)
function pickList(p){
  var cat=(R.catalog||[]).filter(function(c){ return !p.tasks.some(function(t){ return (t.op+' › '+t.detail)===c.key; }); });
  cat.sort(function(a,b){ var an=(a.group===p.topGroup)?0:1, bn=(b.group===p.topGroup)?0:1; return an-bn || b.availQty-a.availQty; });
  return cat;
}
function pickerHtml(p,i){
  var cat=pickList(p);
  return '<div class="pick"><div class="muted" style="margin-bottom:4px">Что можно делать сейчас (сначала родной участок бойца):</div>'
    +cat.slice(0,25).map(function(c,ci){
      return '<div class="pk" onclick="addTask('+i+','+ci+')"><span class="tg">'+esc(c.group)+'</span>'
        +'<span style="flex:1;min-width:140px">'+esc(c.op)+' <span class="muted">› '+esc(c.detail)+'</span></span>'
        +'<span class="muted">можно '+m0(c.availQty)+' шт · '+money(c.rate)+' ₽/шт</span></div>';
    }).join('')+(cat.length?'':'<div class="muted">нет доступных работ по этому заказу</div>')+'</div>';
}
// сколько дать: чтобы добить смену до ожидания, но не больше, чем реально есть работы
function autoQty(p,c){
  var exp=Number(p.expect)||0, plan=Number(p.planRub)||0, left=Math.max(0,exp-plan);
  var byMoney=(c.rate>0)?Math.floor(left/c.rate):0;
  var q=Math.min(byMoney||0, c.availQty||0);
  if(!(q>0)) q=Math.min(c.availQty||0,1);
  return q;
}
function addTask(i,ci){
  var p=R.people[i], c=pickList(p)[ci]; if(!c) return;
  var q=autoQty(p,c);
  p.tasks.push({op:c.op,detail:c.detail,qty:q,group:c.group,rate:c.rate,rub:Math.round(q*c.rate*100)/100,availQty:c.availQty});
  PICK=''; saveTasks(i);
}
function fillShift(i){
  var p=R.people[i], list=pickList(p), added=0;
  for(var k=0;k<list.length&&added<3;k++){
    var exp=Number(p.expect)||0, plan=Number(p.planRub)||0;
    if(plan>=exp*0.95) break;
    var q=autoQty(p,list[k]); if(!(q>0)) continue;
    p.tasks.push({op:list[k].op,detail:list[k].detail,qty:q,group:list[k].group,rate:list[k].rate,
                  rub:Math.round(q*list[k].rate*100)/100,availQty:list[k].availQty});
    p.planRub=Math.round((plan+q*list[k].rate)*100)/100;
    added++;
  }
  if(!added){ alert('Нечем догрузить: по этому заказу нет доступных работ.'); return; }
  saveTasks(i);
}
function editQty(i,ti){
  var t=R.people[i].tasks[ti];
  var v=prompt('Количество: '+t.op+(t.detail?(' › '+t.detail):'')+(t.availQty!=null?('\nДоступно сейчас: '+m0(t.availQty)+' шт'):''), m0(t.qty));
  if(v===null) return; var q=num(v); if(!(q>0)){ alert('Количество должно быть больше нуля'); return; }
  t.qty=q; t.rub=Math.round(q*(t.rate||0)*100)/100; saveTasks(i);
}
function delTask(i,ti){ R.people[i].tasks.splice(ti,1); saveTasks(i); }
function saveTasks(i){
  var p=R.people[i];
  var items=p.tasks.map(function(t){ return {op:t.op,detail:t.detail,qty:t.qty,group:t.group,rate:t.rate,eq:t.eq||'',model:t.model||''}; });

  save({vapi:'planset',date:ruDate(DATE),worker:p.name,patch:JSON.stringify({tasks:items})});
}

/* ═══════════ ВИД «ГОРИЗОНТ» ═══════════ */
function renderHorizon(){

      +(R.error2?('<br>'+esc(R.error2)):'')+'</div>'; return; }

      +(free?('<div style="margin-top:var(--s-2)">💡 «'+esc(free.group)+'» разгребёт своё за '+free.days+' дн — оттуда можно перебросить людей.</div>'):'')
      // главное следствие: успеваем ли к сроку. Раньше срок и узкое место жили на экране порознь.
      +((o.dlDays!=null&&bn.days!=null&&bn.days>o.dlDays)

           +Math.ceil(bn.days-o.dlDays)+' дн — нужны люди на «'+esc(bn.group)+'» или перенос срока.</div>')
        : ((o.dlDays!=null&&bn.days!=null)?('<div style="margin-top:var(--s-2)" class="ok">✓ К сроку укладываемся: узкому месту нужно '+bn.days+' дн, до срока '+o.dlDays+'.</div>'):''))
      +'</div></div>';
  }

  $('pane').innerHTML=advice+kpi+heatBox()+(R.waves||[]).map(waveCard).join('')
    +((R.unplanned&&R.unplanned.totalRub>0)?('<div class="box"><b>Вне волн</b> <span class="muted">— '+m0(R.unplanned.totalRub)+' ₽ ещё не распределены</span></div>'):'')
    +editorHtml();

/* ── КАРТА НЕДЕЛИ: участок × день ──
   Отвечает на вопрос, которого не было нигде: где будет провал и какой участок встанет.
   Цвет = утилизация (сколько участок реально сделает от своей мощности), красная рамка = фронта нет. */
// СКОЛЬКО ЛЮДЕЙ ВЫЙДЕТ ПО ТАБЕЛЮ и во что это выльется — раньше горизонт молчал о людях,
// хотя именно они определяют срок.
function crewLine(f){
  var d0=f&&f.days&&f.days[0]; if(!d0) return '';
  var cap=0; ['Механика','Шлифовка','Покрытие','Сборка'].forEach(function(g){ cap+=Number((d0.byGroup[g]||{}).cap)||0; });
  var un=Number(d0.unassigned)||0;
  return '<div class="tile"><div class="t">По табелю '+ruDate(d0.date)+'</div><div class="v">'+(d0.people||0)+' <small>чел</small></div>'
    +'<div class="meta">~'+m0(cap+un)+' ₽/день'
    +(un?(' · '+m0(un)+' ₽ без участка'):'')+'</div></div>';
}
var HEATMODE='fc';   // 'fc' — что успеем при нынешнем составе; 'req' — что НУЖНО, чтобы успеть к сроку
function setHeat(m){ HEATMODE=m; render(); }
function heatBox(){
  var req=(HEATMODE==='req');
  var all=req?R.required:R.forecast; if(!all||!all.days||!all.days.length) return req?heatBoxNoDl():'';
  // ГОРИЗОНТ СЧИТАЕТСЯ НА МЕСЯЦ, а рисуем две недели: 31 колонка — это 1400 px, на телефоне
  // бесполезно. Вердикт («закроется 24.09») берётся по ПОЛНОМУ горизонту, а не по нарисованному.
  var HEATCOLS=14;
  var f={ days: all.days.slice(0, HEATCOLS), gaps: all.gaps, finishDay: all.finishDay,
          finishDate: all.finishDate, starve: all.starve, horizon: all.horizon,
          daysToDl: all.daysToDl, totalLeft: all.totalLeft };
  var groups=['Механика','Шлифовка','Покрытие','Сборка'];
  var CW=46, CH=34, LW=88, TH=18, BH=26;
  var W=LW+CW*f.days.length, H=TH+CH*groups.length+BH;
  var cells='', labels='', heads='';
  f.days.forEach(function(d,di){
    var p=d.date.split('-'), x=LW+di*CW;
    var wd=['вс','пн','вт','ср','чт','пт','сб'][mkDate(d.date).getDay()];
    var wknd=(wd==='сб'||wd==='вс');
    heads+='<text x="'+(x+CW/2)+'" y="'+(TH-6)+'" text-anchor="middle" font-size="11" fill="'+(wknd?'var(--red)':'var(--muted)')+'">'+p[2]+'.'+p[1]+'</text>';
    labels+='<text x="'+(x+CW/2)+'" y="'+(H-9)+'" text-anchor="middle" font-size="11" fill="'+(wknd?'var(--red)':'var(--muted)')+'">'+wd+'</text>';
    if(d.dayOff) labels+='<rect x="'+x+'" y="'+TH+'" width="'+CW+'" height="'+(CH*groups.length)+'" fill="var(--grey-bg)" opacity=".75"/>';
    if(d.estimated) labels+='<rect x="'+x+'" y="'+TH+'" width="'+CW+'" height="'+(CH*groups.length)+'" fill="none" stroke="var(--line2)" stroke-dasharray="3 3"/>';
    groups.forEach(function(g,gi){
      var b=(d.byGroup||{})[g]||{}, y=TH+gi*CH;
      // цвета ячеек — только токены карты (ok / idle / over / stop); «полутон» — та же заливка прозрачнее
      var fill='var(--heat-idle)', fop='', txt='var(--muted)', note='', stroke='', num=0;
      if(req){
        // здесь цифра — не прогноз, а НОРМА: столько участок обязан выдать в этот день, чтобы заказ ушёл в срок
        num=b.req||0;
        if((b.left||0)<=0.01){ fop='.5'; note='всё сделано'; }
        else if(b.short){ fill='var(--heat-over)'; txt='var(--amber)'; stroke='var(--amber)'; note='нужный темп выше мощности — не хватает людей'; }
        else if(b.blocked){ txt='var(--fg2)'; note='задела нет — участок ждёт предыдущий этап, нагонять придётся позже'; }
        else { fill='var(--heat-ok)'; txt='var(--green)'; note='нынешним составом успеваем'; }
      } else {
        num=b.work||0;
        var load=(b.cap>0)?Math.round((b.work||0)/b.cap*100):null;
        if(b.starved){ fill='var(--heat-stop)'; txt='var(--red)'; stroke='var(--red)'; note='фронта нет'; }
        else if(load==null){ fop='.5'; note='мощность неизвестна'; }
        else if(load>=85){ fill='var(--heat-ok)'; txt='var(--green)'; note='загружен'; }
        else if(load>=40){ fill='var(--heat-ok)'; fop='.55'; txt='var(--green)'; note='загружен наполовину'; }
        else if((b.left||0)>0.01){ note='простой — работы мало'; }
        else { fop='.5'; note='всё сделано'; }
      }
      var val=(b.left||0)<=0.01 ? '✓' : (num>=1000?(Math.round(num/100)/10+'к'):m0(num));
      var tip=req
        ? (esc(g)+' · '+esc(d.date)+'\nнужно сделать '+m0(b.req)+' ₽, мощность участка '+m0(b.cap)+' ₽/день'
           +'\nзадел позволяет '+m0(b.avail)+' ₽, всего осталось '+m0(b.left)+' ₽\n'+note)
        : (esc(g)+' · '+esc(d.date)+'\nсделает '+m0(b.work)+' из '+m0(b.cap)+' ₽ мощности'
           +'\nдоступно работы '+m0(b.avail)+' ₽, всего осталось '+m0(b.left)+' ₽\n'+note);
      cells+='<g><rect x="'+x+'" y="'+y+'" width="'+(CW-2)+'" height="'+(CH-2)+'" rx="6" fill="'+fill+'"'+(fop?(' fill-opacity="'+fop+'"'):'')
        +(stroke?(' stroke="'+stroke+'" stroke-width="1.5"'):'')+'>'
        +'<title>'+tip+'</title></rect>'
        +'<text x="'+(x+(CW-2)/2)+'" y="'+(y+CH/2+3)+'" text-anchor="middle" font-size="11" font-weight="600" fill="'+txt+'" style="font-variant-numeric:tabular-nums">'+val+'</text></g>';
    });
  });
  groups.forEach(function(g,gi){
    heads+='<text x="0" y="'+(TH+gi*CH+CH/2+4)+'" font-size="11" font-weight="600" fill="var(--fg)">'+(ZICON[g]||'')+' '+esc(g)+'</text>';
  });
  var verdict, legend;
  if(req){
    var gaps=(f.gaps||[]).filter(function(g){ return g.short>0.01; });
    verdict = '<b>Чтобы сдать к '+ruDate(R.order&&R.order.plan||'')+'</b> — осталось '+f.daysToDl+' дн на '+m0(f.totalLeft)+' ₽ работы.';
    verdict += gaps.length
      ? ('<div style="margin-top:4px;color:var(--red)">⚠ Нынешним составом не выходит: '
         + gaps.map(function(g){ return '<b>'+esc(g.group)+'</b> нужно '+m0(g.req)+' ₽/день при мощности '+m0(g.cap)
             +' — не хватает '+m0(g.short)+' ₽/день'+(g.people?(' ≈ +'+g.people+' чел'):''); }).join('; ')+'.</div>')
      : '<div style="margin-top:4px" class="ok">✓ Нынешним составом норма выполнима — держите этот темп.</div>';
    legend='<span><i style="background:var(--heat-ok)"></i>успеваем составом</span>'
      +'<span><i style="background:var(--heat-over);outline:1px solid var(--amber)"></i>нужны люди</span>'
      +'<span><i style="background:var(--heat-idle)"></i>ждёт задел</span><span>✓ — всё сделано</span>';
  } else {
    if(f.finishDay) verdict='<b class="ok">Заказ закроется '+(f.finishDate?ruDate(f.finishDate):('на '+f.finishDay+'-й день'))+'</b>'
      +(f.finishDate?(' <span class="muted">— на '+f.finishDay+'-й рабочий день</span>'):'')+', если состав останется таким.';
    else { var last=all.days[all.days.length-1];
      verdict='<b>За '+f.horizon+' дней заказ не закроется</b> — останется '+m0(last.leftRub)+' ₽ работы.'; }
    if(f.starve) verdict+='<div style="margin-top:4px;color:var(--red)">⛔ «'+esc(f.starve.group)+'» встанет '+ruDate(f.starve.date)
      +': фронта работ не будет — предыдущий участок не успеет дать задел.</div>';
    legend='<span><i style="background:var(--heat-ok)"></i>загружен</span>'
      +'<span><i style="background:var(--heat-ok);opacity:.55"></i>наполовину</span><span><i style="background:var(--heat-idle)"></i>простой</span>'
      +'<span><i style="background:var(--heat-stop);outline:1px solid var(--red)"></i>встал: фронта нет</span><span>✓ — всё сделано</span>';
  }
  var est=(all.days.some(function(d){ return d.estimated; })
    ? '<div class="muted" style="margin-top:4px">Пунктир — табель на эти дни ещё не заполнен, численность взята по среднему.</div>' : '')
    + (all.days.some(function(d){ return d.dayOff; })
    ? '<div class="muted" style="margin-top:var(--s-1)">Серые столбцы — выходные по табелю: в эти дни никто не отмечен.</div>' : '')
    + (all.days.length>HEATCOLS
    ? ('<div class="muted" style="margin-top:var(--s-1)">Показаны первые '+HEATCOLS+' дней из '+all.days.length+'; срок закрытия посчитан по всему месяцу.</div>') : '');
  return '<div class="sect">📅 '+(req?'Норма на день':'Две недели вперёд')+'</div>'
    +'<div class="box"><div class="row" style="margin-bottom:var(--s-2)">'
    +'<span class="muted">'+(req?'сколько участок обязан выдать, чтобы сдать в срок':'что каждый участок реально сделает за день')+'</span>'
    +'<div class="seg" style="margin-left:auto"><button class="'+(req?'':'on')+'" onclick="setHeat(\'fc\')">что успеем</button>'
    +'<button class="'+(req?'on':'')+'" onclick="setHeat(\'req\')">что нужно</button></div></div>'
    +'<div class="tbwrap"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="max-width:none">'
    +heads+cells+labels+'</svg></div>'
    +'<div class="legend">'+legend+'</div>'
    +'<div style="margin-top:var(--s-2)">'+verdict+est+'</div></div>';
}
// режим «что нужно» без срока считать не из чего — говорим об этом прямо, а не показываем пустую сетку
function heatBoxNoDl(){
  return '<div class="sect">📅 Норма на день</div>'
    +'<div class="box"><div class="row" style="margin-bottom:var(--s-2)">'
    +'<div class="seg" style="margin-left:auto"><button onclick="setHeat(\'fc\')">что успеем</button>'
    +'<button class="on" onclick="setHeat(\'req\')">что нужно</button></div></div>'
    +'<div class="muted">У заказа не задан срок (или он уже прошёл) — не от чего считать норму. '
    +'Поставьте «Дата план» в карточке заказа.</div></div>';
}
function waveCard(w){
  var maxD=0; (w.groups||[]).forEach(function(g){ if(g.days>maxD) maxD=g.days; });
  var seq=GORDER.filter(function(n){ return (w.groups||[]).some(function(g){ return g.group===n; }); });
  var flow=seq.map(function(n,i){
    var g=w.groups.filter(function(x){ return x.group===n; })[0];
    var wpct=(maxD>0&&g.days)?Math.round(g.days/maxD*100):0;
    return (i?'<span class="arrow">→</span>':'')
      +'<div class="fbox'+(g.bottleneck?' bn':'')+'"><div class="fh">'+(ZICON[n]||'')+' '+esc(n)+'</div>'
      +'<div class="fd">'+(g.days!=null?g.days:'—')+'<span class="fu"> дн</span></div>'
      +'<div class="lbar"><i style="width:'+wpct+'%;background:'+(g.bottleneck?'var(--red)':'var(--accent)')+'"></i></div>'
      +'<div class="fu">'+m0(g.rub)+' ₽ · мощн '+m0(g.capRub)+' ₽/дн</div></div>';
  }).join('');
  return '<div class="wave"><div class="row"><b style="font:var(--t-heading)">'+esc(w.title)+'</b>'
    +'<span class="pill mute">'+m0(w.totalRub)+' ₽</span>'
    +(w.bottleneckGroup?('<span class="pill bad">✕ узкое: '+esc(w.bottleneckGroup)+(w.bottleneckDays?(' · '+w.bottleneckDays+' дн'):'')+'</span>'):'')
    +(w.endDay!=null?('<span class="pill '+(w.late?'bad':'ok')+'" title="волны идут встык: эта начинается там, где кончилась предыдущая">'+(w.late?'✕ ':'✓ ')+'дни '
        +(w.startDay||0)+'–'+w.endDay+(w.late?' · позже срока':'')+'</span>'):'')+'</div>'
    +'<div class="flow">'+flow+'</div>'
    +((w.shared&&w.shared.length)?('<div class="muted" style="margin-top:var(--s-2)">🧩 общие детали (делать сразу на всю волну): '
        +w.shared.slice(0,8).map(esc).join(', ')+(w.shared.length>8?(' <span title="'+esc(w.shared.slice(8).join(', '))+'">и ещё '+(w.shared.length-8)+'</span>'):'')+'</div>'):'')
    +'</div>';
}
/* редактор волн — вторичный инструмент, поэтому свёрнут */
function editorHtml(){
  if(!PLAN) PLAN=(R.waves||[]).map(function(w){ return {title:w.title, items:(w.items||[]).map(function(x){ return {eq:x.eq,model:x.model,qty:x.qty}; })}; });
  var prodOpts=function(cur){ return (R.products||[]).map(function(p){
    var v=p.eq+'||'+p.model;
    return '<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(p.eq)+' · '+esc(p.model)+' (ост. '+m0(p.leftRub)+' ₽)</option>'; }).join(''); };
  var body=PLAN.map(function(w,wi){
    var items=w.items.map(function(it,ii){
      return '<div class="row" style="padding:var(--s-1) 0"><select style="flex:1;min-width:170px" onchange="setWaveProd('+wi+','+ii+',this.value)">'
        +prodOpts(it.eq+'||'+it.model)+'</select>'
        +'<input style="width:78px" value="'+(it.qty||0)+'" inputmode="numeric" onchange="PLAN['+wi+'].items['+ii+'].qty=num(this.value)">'
        +'<button class="ic" onclick="PLAN['+wi+'].items.splice('+ii+',1);render()">✕</button></div>';
    }).join('');
    return '<div class="box" style="margin-bottom:8px"><div class="row">'
      +'<input style="flex:1;min-width:150px" value="'+esc(w.title)+'" onchange="PLAN['+wi+'].title=this.value">'
      +'<button class="ic" onclick="PLAN.splice('+wi+',1);render()">🗑</button></div>'
      +items+'<button class="sec" style="margin-top:4px" onclick="addWaveItem('+wi+')">＋ изделие</button></div>';
  }).join('');
  return '<div class="box"><details><summary style="cursor:pointer;font-weight:600">✏️ Волны запуска</summary>'
    +'<div class="muted" style="margin:var(--s-2) 0">Что делаем в первую очередь. Волна забирает работу из общего остатка заказа: что не влезло — достаётся следующей.</div>'
    +body+'<div class="row" style="margin-top:var(--s-2)"><button class="sec" onclick="PLAN.push({title:\'Волна \'+(PLAN.length+1),items:[]});render()">＋ волна</button>'
    +'<button onclick="savePlan()">💾 Сохранить и пересчитать</button>'
    +'<button class="gho" onclick="if(confirm(\'Убрать волны и вернуться к «всей работе»?\')){PLAN=[];savePlan();}">сбросить</button></div></details></div>';
}
function setWaveProd(wi,ii,v){ var p=String(v).split('||'); PLAN[wi].items[ii].eq=p[0]; PLAN[wi].items[ii].model=p[1]||''; }
function addWaveItem(wi){ var p=(R.products||[])[0]; if(!p){ alert('В заказе нет изделий'); return; }
  PLAN[wi].items.push({eq:p.eq,model:p.model,qty:0}); render(); }
function savePlan(){
  twSay('Пересчитываю план…');
  var payload=PLAN.map(function(w,i){ return {idx:i+1,title:w.title,items:w.items}; });
  apiPost({vapi:'saveorderplan',batch:OID,plan:JSON.stringify(payload)}).then(function(r){
    if(r&&r.ok){ PLAN=null; load(); } else alert((r&&r.error)||'не сохранилось');
  }).catch(function(){ alert('связь оборвалась'); });
}

/* ═══════════ ЗАПИСЬ ═══════════ */
// Одно окно записи: пока идёт сохранение, экран закрыт заслонкой — второй тап невозможен.
var BUSY=0;
function save(p, reload, done){
  if(BUSY) return; BUSY=1;
  api(p).then(function(r){
    BUSY=0;
    if(!r||!r.ok){ alert((r&&r.error)||'не сохранилось'); load(); return; }
    if(done) done(r);
    if(reload!==false) load();
  }).catch(function(){ BUSY=0; alert('связь оборвалась — обновляю'); load(); });
}

// ─────── индикаторы: полоска на любой запрос, заслонка — на действие человека ───────
var TWL=0, TWCLICK=0, TWTMR=0;
function twLoadOn(wait){
  TWL++;
  var b=$('twload'); if(b) b.style.display='block';
  if(wait){ var w=$('twwait'); if(w) w.style.display='flex';
    clearTimeout(TWTMR);
    TWTMR=setTimeout(function(){
      var h=$('twwt'); if(h) h.textContent='Ответа всё нет';
      var s=document.querySelector('#twwait .wh'); if(s) s.textContent='связь медленная — нажмите, чтобы закрыть';
      var ww=$('twwait'); if(ww) ww.onclick=function(){ TWL=0; twLoadOff(); };
    },30000);
  }
}
function twLoadOff(){
  TWL=Math.max(0,TWL-1); if(TWL) return;
  clearTimeout(TWTMR);
  var b=$('twload'); if(b) b.style.display='none';
  var w=$('twwait'); if(w){ w.style.display='none'; w.onclick=null; }
  var s=document.querySelector('#twwait .wh'); if(s) s.textContent='идёт обмен с сервером — не нажимайте';
}
function twSay(t){ var e=$('twwt'); if(e&&t) e.textContent=t; }
document.addEventListener('click',function(e){
  var n=e.target;
  while(n&&n!==document.body){ if(n.tagName==='BUTTON'||n.tagName==='A'){ TWCLICK=Date.now(); return; } n=n.parentNode; }
},true);
(function(){
  var _api=api, _post=apiPost;
  var wrap=function(fn){ return function(p){
    var mine=(TWCLICK&&(Date.now()-TWCLICK)<20000); if(mine) TWCLICK=0;
    twLoadOn(mine);
    return fn(p).then(function(r){ twLoadOff(); return r; }, function(e){ twLoadOff(); throw e; });
  }; };
  api=wrap(_api); apiPost=wrap(_post);
})();

load();
(function(){
  try{ var m=/[?&]twsec=([^&]+)/.exec(location.search); window.top.postMessage({tw:'hello',sec:m?decodeURIComponent(m[1]):''},'*'); }catch(e){}
  window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='refresh'){ try{ load(); }catch(err){} } });
})();
</script>
