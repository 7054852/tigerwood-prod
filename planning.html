<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигервуд — планирование</title>
<style>
  :root{ --bg:#f4f6fb; --card:#fff; --fg:#1b2333; --muted:#8a93a6; --line:#e6e9f2; --accent:#2b7de9; --green:#137333; --amber:#b7791f; --red:#c0392b; }
  *{box-sizing:border-box;} html,body{margin:0;background:var(--bg);}
  body{ font-family:-apple-system,Roboto,Segoe UI,Arial,sans-serif; color:var(--fg); padding:14px; max-width:1000px; margin:0 auto; font-size:14px; }
  .hi{ font-size:19px; font-weight:800; margin-bottom:10px; }
  .muted{ color:var(--muted); font-size:13px; } .err{ color:var(--red); } .ok{ color:var(--green); }
  .center{ text-align:center; padding:26px; }
  .box{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  select,input{ font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  button{ font:inherit; font-weight:600; border:0; border-radius:9px; padding:7px 12px; cursor:pointer; background:var(--accent); color:#fff;
          touch-action:manipulation; -webkit-tap-highlight-color:transparent; transition:transform .06s ease, filter .12s ease; }
  button:active{ transform:scale(.94); filter:brightness(.86); }
  button[disabled]{ opacity:.5; pointer-events:none; }
  button.sec{ background:#eef2fb; color:var(--accent); } button.gho{ background:transparent; color:var(--muted); padding:4px 7px; }
  .tabs{ display:flex; gap:6px; margin:10px 0 0; flex-wrap:wrap; }
  .tabs button{ background:#eef2fb; color:var(--accent); } .tabs button.active{ background:var(--accent); color:#fff; }
  .pill{ font-size:11.5px; font-weight:700; border-radius:20px; padding:2px 9px; display:inline-block; }
  .p-red{ background:#fdecea; color:var(--red); } .p-amb{ background:#fdf3ec; color:var(--amber); }
  .p-gr{ background:#e6f4ea; color:var(--green); } .p-mut{ background:#eef1f8; color:#66707f; }
  .kpi{ display:flex; gap:18px; flex-wrap:wrap; font-weight:700; }
  .kpi b{ font-size:17px; } .kpi .k{ color:var(--muted); font-weight:600; font-size:12px; display:block; }
  /* ── чипы бойцов ── */
  .zrow{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:4px 12px; }
  .sh{ font-size:14px; width:18px; }
  .chip{ display:inline-flex; align-items:center; gap:7px; background:var(--card); border:1.5px solid var(--line); border-radius:22px;
         padding:6px 12px; cursor:grab; user-select:none; font-size:13px; transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .chip b{ font-weight:700; white-space:nowrap; }
  .chip .st{ color:var(--muted); font-size:11.5px; white-space:nowrap; }
  .chip .exp{ font-weight:800; color:#2f7a34; cursor:pointer; white-space:nowrap; }
  .chip .exp.own{ color:var(--amber); }
  .chip.sel{ transform:translateY(-3px) scale(1.04); box-shadow:0 6px 18px rgba(43,125,233,.28); border-color:var(--accent); }
  .chip .x{ color:var(--muted); cursor:pointer; font-weight:800; padding:0 2px; }
  /* ── зона-участок ── */
  .zone{ border:2px solid var(--line); border-radius:14px; background:var(--card); margin-bottom:12px; overflow:hidden;
         transition:border-color .15s ease, box-shadow .15s ease; }
  .zone.target{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(43,125,233,.16); cursor:pointer; }
  .zone.bn{ border-color:var(--red); animation:zpulse 1.8s infinite; }
  @keyframes zpulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(192,57,43,.28);} 50%{ box-shadow:0 0 0 7px rgba(192,57,43,.05);} }
  .zh{ display:flex; align-items:center; gap:8px; padding:9px 12px 6px; font-weight:800; flex-wrap:wrap; }
  .zh .zn{ font-size:15px; }
  .zbar{ position:relative; height:16px; background:#eef1f8; border-radius:8px; display:flex; margin:8px 12px 0; }
  .zbar .seg{ height:100%; transition:width .35s ease; }
  .zbar .s-done{ background:var(--green); border-radius:8px 0 0 8px; }
  .zbar .s-av{ background:#8fc2f5; position:relative; }
  .zbar .s-av > i{ display:block; height:100%; background:repeating-linear-gradient(45deg,#1f6fd0,#1f6fd0 5px,#4a90e2 5px,#4a90e2 10px); transition:width .35s ease; }
  .zbar .s-bl{ background:#dfe4ee; border-radius:0 8px 8px 0; }
  /* риска мощности прямо на шкале: видно «можем больше, чем есть работы» и наоборот */
  .capmark{ position:absolute; top:-5px; bottom:-5px; width:2px; background:var(--fg); opacity:.5; }
  .capmark:after{ content:'мощность'; position:absolute; top:-13px; left:-20px; font-size:9px; opacity:.65; white-space:nowrap; }
  .zlegend{ display:flex; gap:12px; flex-wrap:wrap; padding:6px 12px 0; font-size:11.5px; color:var(--muted); }
  .zlegend i{ display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .zcap{ font-size:12px; padding:5px 12px; background:#fafbff; border-top:1px dashed var(--line); }
  .zfoot{ font-size:12.5px; padding:6px 12px 10px; }
  .warnbar{ margin:6px 12px 0; padding:6px 9px; border-radius:9px; background:#fdf3ec; color:#a35b12; font-size:12.5px; font-weight:600; }
  .drophint{ color:var(--muted); font-size:12px; }
  /* ── карточка бойца ── */
  .crew{ border:1.5px solid var(--line); border-radius:14px; background:var(--card); margin-bottom:10px; overflow:hidden; }
  .crew.full{ border-color:#9ccfa6; } .crew.low{ border-color:#f0c98a; } .crew.empty{ border-style:dashed; }
  .ch{ display:flex; align-items:center; gap:9px; padding:10px 12px 6px; flex-wrap:wrap; }
  .ch .nm{ font-weight:800; font-size:15px; } .ch .stat{ font-size:11.5px; color:var(--muted); }
  .load{ height:8px; background:#eef1f8; margin:0 12px; border-radius:6px; overflow:hidden; }
  .load>i{ display:block; height:100%; background:var(--accent); transition:width .3s ease; } .load>i.ov{ background:var(--red); }
  .lnums{ font-size:12.5px; padding:4px 12px 0; }
  .tasks{ padding:4px 12px 8px; }
  .task{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:5px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .task:last-child{ border-bottom:0 }
  .task .tg{ font-size:10.5px; font-weight:700; color:#5a6478; background:#eef1f8; border-radius:10px; padding:1px 7px; }
  .task .tn{ flex:1; min-width:150px; } .task .tq{ font-weight:800; }
  .pick{ margin:0 12px 10px; border:1px dashed var(--line); border-radius:10px; padding:8px; }
  .pk{ display:flex; gap:8px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line); font-size:12.5px; cursor:pointer; }
  .pk:last-child{ border-bottom:0 } .pk:hover{ background:#fafcff }
  /* ── волны ── */
  .wave{ border:1.5px solid var(--line); border-radius:14px; background:var(--card); margin-bottom:10px; padding:12px; }
  .flow{ display:flex; gap:8px; align-items:stretch; overflow-x:auto; padding:8px 0 2px; }
  .fbox{ min-width:126px; border:1.5px solid var(--line); border-radius:12px; padding:8px; flex:1; }
  .fbox.bn{ border-color:var(--red); background:#fff8f7; }
  .fbox .fh{ font-weight:800; font-size:12.5px; margin-bottom:4px; }
  .fbox .fd{ font-size:20px; font-weight:800; } .fbox .fu{ font-size:11px; color:var(--muted); }
  .lbar{ height:6px; background:#eef1f8; border-radius:6px; overflow:hidden; margin:6px 0 4px; }
  .lbar>i{ display:block; height:100%; }
  .arrow{ align-self:center; color:var(--muted); font-size:16px; }
  #twload{ position:fixed; left:0; top:0; height:3px; width:100%; z-index:60; display:none; overflow:hidden; }
  #twload>i{ display:block; height:100%; width:38%; background:var(--accent); animation:twslide 1.1s ease-in-out infinite; }
  @keyframes twslide{ 0%{ margin-left:-38% } 100%{ margin-left:100% } }
  #twwait{ position:fixed; inset:0; background:rgba(246,247,252,.78); z-index:70; display:none; align-items:center; justify-content:center; }
  #twwait .wb{ background:#fff; border-radius:16px; padding:18px 22px; text-align:center; min-width:190px; box-shadow:0 12px 34px rgba(20,25,50,.18); }
  #twwait .sp{ width:28px; height:28px; border:3px solid rgba(43,125,233,.22); border-top-color:var(--accent); border-radius:50%; margin:0 auto 10px; animation:twspin .8s linear infinite; }
  @keyframes twspin{ to{ transform:rotate(360deg) } }
  #twwait .wt{ font-weight:700; font-size:15px; } #twwait .wh{ font-size:12.5px; opacity:.6; margin-top:4px; }
</style>
</head>
<body>
<div id="twload"><i></i></div>
<div id="twwait"><div class="wb"><div class="sp"></div><div class="wt" id="twwt">Сохраняю…</div><div class="wh">идёт обмен с сервером — не нажимайте</div></div></div>
<style>html.emb>body>.hi{display:none}</style><script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('emb');</script>
<div class="hi">📊 Планирование</div>
<div id="head"></div>
<div id="pane"><div class="center muted">Загрузка…</div></div>

<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod';
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
try{ if(window.Telegram&&Telegram.WebApp){ var u0=Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user; if(u0) TGID=String(u0.id); } }catch(e){}
if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }
function api(p){ p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}); }
function apiPost(p){ p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID; var b=Object.keys(p).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:b}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function $(id){ return document.getElementById(id); }
function money(n){ n=Number(n)||0; return n.toFixed(2).replace('.',','); }
function m0(n){ return Math.round(Number(n)||0); }
function num(x){ return Number(String(x==null?'':x).replace(',','.'))||0; }
function isoOf(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function ruDate(s){ var p=String(s||'').split('-'); return p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):s; }
function mkDate(s){ var p=String(s).split('-'); return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); }
function dayName(s){ return ['вс','пн','вт','ср','чт','пт','сб'][mkDate(s).getDay()]; }
function shiftDate(s,delta){ var d=mkDate(s); d.setDate(d.getDate()+delta); return isoOf(d); }
var ZICON={'Механика':'🛠','Шлифовка':'🪵','Покрытие':'🎨','Сборка':'📦'};
var GORDER=['Механика','Шлифовка','Покрытие','Сборка','Прочее'];

// ОДНА дата и ОДИН заказ на весь раздел: раньше «табель» и «расстановка» жили
// на разных датах в одном экране, и это путало.
var VIEW=qp('view')||'day';
var DATE=(function(){ var d=new Date(); d.setDate(d.getDate()+1); return isoOf(d); })();
var OID=qp('batch')||'', R=null, SEL='', PICK='', SHIFTF='', PLAN=null;

function load(){
  $('pane').innerHTML='<div class="center muted">Загрузка…</div>';
  api({vapi:'planscreen', view:VIEW, date:ruDate(DATE), batch:OID}).then(function(r){
    if(!r||!r.ok){ $('pane').innerHTML='<div class="center err">'+esc((r&&r.error)||'нет прав')+'</div>'; return; }
    R=r;
    if(!OID&&r.orders&&r.orders.length){ OID=r.orders[0].id; load(); return; }
    renderHead(); render();
  }).catch(function(){ $('pane').innerHTML='<div class="center err">Связь оборвалась. <a href="javascript:void(0)" onclick="load()">Повторить</a></div>'; });
}
function setView(v){ VIEW=v; SEL=''; PICK=''; load(); }
function setDate(v){ DATE=v; SEL=''; PICK=''; load(); }
function renderHead(){
  var opts=(R.orders||[]).map(function(b){ return '<option value="'+esc(b.id)+'"'+(b.id===OID?' selected':'')+'>'+esc(b.num)+' · '+esc(b.name||'')+'</option>'; }).join('');
  var tabs=[['horizon','🗺 Горизонт'],['day','🎯 День'],['crew','👷 Люди']].map(function(t){
    return '<button class="'+(VIEW===t[0]?'active':'')+'" onclick="setView(\''+t[0]+'\')">'+t[1]+'</button>'; }).join('');
  $('head').innerHTML='<div class="box" style="padding:10px 14px"><div class="row">'
    +'<button class="gho" onclick="setDate(shiftDate(DATE,-1))">←</button>'
    +'<input type="date" value="'+DATE+'" onchange="setDate(this.value)">'
    +'<b>'+ruDate(DATE)+' ('+dayName(DATE)+')</b>'
    +'<button class="gho" onclick="setDate(shiftDate(DATE,1))">→</button>'
    +'<span class="muted">заказ:</span><select onchange="OID=this.value;PLAN=null;load()">'+opts+'</select>'
    +'</div><div class="tabs">'+tabs+'</div></div>';
}
function render(){
  if(VIEW==='horizon') return renderHorizon();
  if(VIEW==='crew') return renderCrew();
  renderDay();
}

/* ═══════════ ВИД «ДЕНЬ» ═══════════ */
function isNight(p){ return p.shift==='ночь'; }
function sumExp(l){ var s=0; l.forEach(function(p){ s+=Number(p.expect)||0; }); return Math.round(s*100)/100; }
function idxByName(n){ for(var i=0;i<(R.people||[]).length;i++) if(R.people[i].name===n) return i; return -1; }
function chipHtml(p,i,inZone){
  var own=(p.expectSrc==='своё');
  return '<span class="chip'+(SEL===p.name?' sel':'')+'" draggable="true" ondragstart="dragChip(event,'+i+')" onclick="event.stopPropagation();tapChip('+i+')">'
    +'<b>'+esc(p.name)+'</b>'
    +(p.topGroup?'<span class="st">⭐'+esc(p.topGroup)+'</span>':'')
    +'<span class="exp'+(own?' own':'')+'" title="ожидаемая выработка за смену ('+esc(p.expectSrc||'')+') — нажмите, чтобы поправить" onclick="event.stopPropagation();editExpect('+i+')">⚡'+m0(p.expect)+'</span>'
    +(inZone?'<span class="x" title="вернуть на скамейку" onclick="event.stopPropagation();unassign('+i+')">✕</span>':'')+'</span>';
}
function renderDay(){
  var people=R.people||[];
  var bench=people.filter(function(p){ return !p.group; });
  var allD=people.filter(function(p){ return !isNight(p); }), allN=people.filter(isNight);
  var y=R.yesterday||{};
  var yline=(y.planRub>0||y.factRub>0)
    ? ('<span><span class="k">Вчера ('+ruDate(y.date)+')</span><b>'+m0(y.factRub)+' ₽</b>'
       +(y.planRub>0?(' <span class="muted" style="font-size:12px">из плана '+m0(y.planRub)+(y.pct!=null?(' · '+y.pct+'%'):'')+'</span>'):'')+'</span>')
    : '';
  var kpi='<div class="box kpi">'
    +'<span><span class="k">Бойцов в смене</span><b>'+people.length+'</b> <span class="muted" style="font-size:12px">☀️'+allD.length+' · 🌙'+allN.length+(bench.length?(' · скамейка '+bench.length):'')+'</span></span>'
    +'<span><span class="k">Ожидаем за день</span><b class="ok">'+m0(sumExp(people))+' ₽</b></span>'
    +(R.bottleneck?('<span><span class="k">Узкое место</span><b style="color:var(--red)">'+esc(R.bottleneck)+'</b> <span class="muted" style="font-size:12px">работы на '+(R.bottleneckDays||'?')+' дн</span></span>'):'')
    +yline+'</div>';
  var fbtn=function(v,l){ return '<button class="sec" style="padding:4px 10px;font-size:12px'+(SHIFTF===v?';outline:2px solid var(--accent)':'')+'" onclick="SHIFTF=(SHIFTF===\''+v+'\'?\'\':\''+v+'\');render()">'+l+'</button>'; };
  var showD=(SHIFTF!=='ночь'), showN=(SHIFTF!=='день');
  var brow=function(list,ic,lbl){ if(!list.length) return '';
    return '<div class="zrow"><span class="sh">'+ic+'</span>'+list.map(function(p){ return chipHtml(p,idxByName(p.name),false); }).join('')
      +'<span class="muted" style="font-size:11.5px;margin-left:auto">'+lbl+': '+list.length+' · ~'+m0(sumExp(list))+' ₽</span></div>'; };
  var benchInner=(showD?brow(bench.filter(function(p){return !isNight(p);}),'☀️','день'):'')
                +(showN?brow(bench.filter(isNight),'🌙','ночь'):'');
  var benchBox='<div class="box" style="padding:10px 2px 8px"><div class="row" style="padding:0 12px 4px"><b>🪑 Скамейка</b>'
    +'<span class="drophint">— нажмите бойца, потом участок (или перетащите)</span>'
    +'<span style="flex:1"></span>'+fbtn('день','☀️')+fbtn('ночь','🌙')+'</div>'
    +(benchInner||'<div class="zrow"><span class="muted">'+(bench.length?'скрыто фильтром':(people.length?'все расставлены 👍':'на эту дату никто не отмечен'))+'</span></div>')+'</div>';
  $('pane').innerHTML=kpi+benchBox+markBox()+(R.groups||[]).map(zoneHtml).join('')+capBox();
}
function zoneHtml(g){
  var people=R.people||[];
  var ppl=people.filter(function(p){ return p.group===g.group; });
  var showD=(SHIFTF!=='ночь'), showN=(SHIFTF!=='день');
  var pd=ppl.filter(function(p){ return !isNight(p); }), pn=ppl.filter(isNight);
  var contrib=Math.round((sumExp(pd)+sumExp(pn))*100)/100;
  var tot=g.totalRub||0, dn=g.doneRub||0, av=g.availRub||0, bl=g.blockedRub||0;
  var pD=tot>0?Math.round(dn/tot*100):0, pA=tot>0?Math.round(av/tot*100):0, pB=Math.max(0,100-pD-pA);
  var fill=av>0?Math.min(100,Math.round(contrib/av*100)):(contrib>0?100:0);
  var capPos=(tot>0&&g.capRub>0)?Math.min(99,Math.round((dn+g.capRub)/tot*100)):-1;
  var badges=(g.bottleneck?'<span class="pill p-red">🎯 узкое место'+(g.daysAll?(' · '+g.daysAll+' дн'):'')+'</span>':'')
    +(g.starving?'<span class="pill p-red" title="детали ещё не прошли предыдущий этап">⛔ встанет</span>':'')
    +(g.idle&&!g.bottleneck?'<span class="pill p-mut" title="работы меньше, чем людей">💤 простой</span>':'');
  var CS={'расстановка':'по расставленным людям','ожидаемая численность':'по заданной численности','средняя численность':'по средней численности за 14 дней'};
  var capLine=tot?('<div class="zcap">⚙ мощность <b>'+m0(g.capRub)+' ₽/день</b> <span class="muted">('
    +((g.capSrc==='нет данных')?'<span style="color:var(--amber)">неизвестна — задайте ниже</span>':(CS[g.capSrc]||esc(g.capSrc)))
    +(g.capShift?(', '+m0(g.capShift)+' ₽/смену на бойца'):'')+')</span>'
    +(g.daysAll!=null?(' · работы на <b>'+g.daysAll+' дн</b>'):'')
    +(g.daysAvail!=null?(' <span class="muted">(обеспечено заделом '+g.daysAvail+' дн)</span>'):'')+'</div>'):'';
  var warn='';
  if(contrib>0&&tot>0){
    if(av<=0) warn='<div class="warnbar">⚠ фронта работ нет — детали не прошли предыдущий этап. Люди простоят.</div>';
    else if(contrib>av*1.05) warn='<div class="warnbar">⚠ назначено ~'+m0(contrib)+' ₽, доступно только <b>'+m0(av)+' ₽</b> — остальное ждёт предыдущего участка.</div>';
  }
  var zrow=function(list,ic,sum){ if(!list.length) return '';
    return '<div class="zrow"><span class="sh">'+ic+'</span>'+list.map(function(p){ return chipHtml(p,idxByName(p.name),true); }).join('')
      +'<span class="muted" style="font-size:11.5px;margin-left:auto">~'+m0(sum)+' ₽</span></div>'; };
  var body=(showD?zrow(pd,'☀️',sumExp(pd)):'')+(showN?zrow(pn,'🌙',sumExp(pn)):'');
  if(!body) body='<div class="zrow"><span class="drophint">'+(SEL?'👇 нажмите сюда':'пусто')+'</span></div>';
  var foot;

// каталог = что физически можно делать сейчас (задел с предыдущих операций обеспечен)
function pickList(p){
  var cat=(R.catalog||[]).filter(function(c){ return !p.tasks.some(function(t){ return (t.op+' › '+t.detail)===c.key; }); });
  cat.sort(function(a,b){ var an=(a.group===p.topGroup)?0:1, bn=(b.group===p.topGroup)?0:1; return an-bn || b.availQty-a.availQty; });
  return cat;
}
function pickerHtml(p,i){
  var cat=pickList(p);
  return '<div class="pick"><div class="muted" style="margin-bottom:4px">Что можно делать сейчас (сначала родной участок бойца):</div>'
    +cat.slice(0,25).map(function(c,ci){
      return '<div class="pk" onclick="addTask('+i+','+ci+')"><span class="tg">'+esc(c.group)+'</span>'
        +'<span style="flex:1;min-width:140px">'+esc(c.op)+' <span class="muted">› '+esc(c.detail)+'</span></span>'
        +'<span class="muted">можно '+m0(c.availQty)+' шт · '+money(c.rate)+' ₽/шт</span></div>';
    }).join('')+(cat.length?'':'<div class="muted">нет доступных работ по этому заказу</div>')+'</div>';
}
// сколько дать: чтобы добить смену до ожидания, но не больше, чем реально есть работы
function autoQty(p,c){
  var exp=Number(p.expect)||0, plan=Number(p.planRub)||0, left=Math.max(0,exp-plan);
  var byMoney=(c.rate>0)?Math.floor(left/c.rate):0;
  var q=Math.min(byMoney||0, c.availQty||0);
  if(!(q>0)) q=Math.min(c.availQty||0,1);
  return q;
}
function addTask(i,ci){
  var p=R.people[i], c=pickList(p)[ci]; if(!c) return;
  var q=autoQty(p,c);
  p.tasks.push({op:c.op,detail:c.detail,qty:q,group:c.group,rate:c.rate,rub:Math.round(q*c.rate*100)/100,availQty:c.availQty});
  PICK=''; saveTasks(i);
}
function fillShift(i){
  var p=R.people[i], list=pickList(p), added=0;
  for(var k=0;k<list.length&&added<3;k++){
    var exp=Number(p.expect)||0, plan=Number(p.planRub)||0;
    if(plan>=exp*0.95) break;
    var q=autoQty(p,list[k]); if(!(q>0)) continue;
    p.tasks.push({op:list[k].op,detail:list[k].detail,qty:q,group:list[k].group,rate:list[k].rate,
                  rub:Math.round(q*list[k].rate*100)/100,availQty:list[k].availQty});
    p.planRub=Math.round((plan+q*list[k].rate)*100)/100;
    added++;
  }
  if(!added){ alert('Нечем догрузить: по этому заказу нет доступных работ.'); return; }
  saveTasks(i);
}
function editQty(i,ti){
  var t=R.people[i].tasks[ti];
  var v=prompt('Количество: '+t.op+(t.detail?(' › '+t.detail):'')+(t.availQty!=null?('\nДоступно сейчас: '+m0(t.availQty)+' шт'):''), m0(t.qty));
  if(v===null) return; var q=num(v); if(!(q>0)){ alert('Количество должно быть больше нуля'); return; }
  t.qty=q; t.rub=Math.round(q*(t.rate||0)*100)/100; saveTasks(i);
}
function delTask(i,ti){ R.people[i].tasks.splice(ti,1); saveTasks(i); }
function saveTasks(i){

/* ── КАРТА НЕДЕЛИ: участок × день ──
   Отвечает на вопрос, которого не было нигде: где будет провал и какой участок встанет.
   Цвет = утилизация (сколько участок реально сделает от своей мощности), красная рамка = фронта нет. */
function heatBox(){
  var f=R.forecast; if(!f||!f.days||!f.days.length) return '';
  var groups=['Механика','Шлифовка','Покрытие','Сборка'];
  var CW=46, CH=34, LW=88, TH=18, BH=26;
  var W=LW+CW*f.days.length, H=TH+CH*groups.length+BH;
  var cells='', labels='', heads='';
  f.days.forEach(function(d,di){
    var p=d.date.split('-'), x=LW+di*CW;
    var wd=['вс','пн','вт','ср','чт','пт','сб'][mkDate(d.date).getDay()];
    var wknd=(wd==='сб'||wd==='вс');
    heads+='<text x="'+(x+CW/2)+'" y="'+(TH-6)+'" text-anchor="middle" font-size="10" fill="'+(wknd?'#c0392b':'#8a93a6')+'">'+p[2]+'.'+p[1]+'</text>';
    labels+='<text x="'+(x+CW/2)+'" y="'+(H-9)+'" text-anchor="middle" font-size="9.5" fill="'+(wknd?'#c0392b':'#8a93a6')+'">'+wd+'</text>';
    if(d.estimated) labels+='<rect x="'+x+'" y="'+TH+'" width="'+CW+'" height="'+(CH*groups.length)+'" fill="none" stroke="#c9d0e0" stroke-dasharray="3 3"/>';
    groups.forEach(function(g,gi){
      var b=(d.byGroup||{})[g]||{}, y=TH+gi*CH;
      var load=(b.cap>0)?Math.round((b.work||0)/b.cap*100):null;
      var fill='#f2f4f9', txt='#8a93a6', note='';
      if(b.starved){ fill='#fdecea'; txt='#c0392b'; note='фронта нет'; }
      else if(load==null){ fill='#f7f8fb'; note='мощность неизвестна'; }
      else if(load>=85){ fill='#cfe9d6'; txt='#12602c'; note='загружен'; }
      else if(load>=40){ fill='#e6f2e9'; txt='#2f7a34'; note='загружен наполовину'; }
      else if((b.left||0)>0.01){ fill='#eef1f8'; note='простой — работы мало'; }
      else { fill='#f7f8fb'; note='всё сделано'; }
      var val=(b.left||0)<=0.01 ? '✓' : (b.work>=1000?(Math.round(b.work/100)/10+'к'):m0(b.work));
      cells+='<g><rect x="'+x+'" y="'+y+'" width="'+(CW-2)+'" height="'+(CH-2)+'" rx="5" fill="'+fill+'"'
        +(b.starved?' stroke="#c0392b" stroke-width="1.5"':'')+'>'
        +'<title>'+esc(g)+' · '+esc(d.date)+'\nсделает '+m0(b.work)+' из '+m0(b.cap)+' ₽ мощности'
        +'\nдоступно работы '+m0(b.avail)+' ₽, всего осталось '+m0(b.left)+' ₽\n'+note+'</title></rect>'
        +'<text x="'+(x+(CW-2)/2)+'" y="'+(y+CH/2+3)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+txt+'">'+val+'</text></g>';
    });
  });
  groups.forEach(function(g,gi){
    heads+='<text x="0" y="'+(TH+gi*CH+CH/2+4)+'" font-size="11.5" font-weight="700" fill="#1b2333">'+(ZICON[g]||'')+' '+esc(g)+'</text>';
  });
  var verdict;
  if(f.finishDay) verdict='<b class="ok">Заказ закроется на '+f.finishDay+'-й день</b> — если мощности останутся такими.';
  else { var last=f.days[f.days.length-1];
    verdict='<b>За '+f.horizon+' дней заказ не закроется</b> — останется '+m0(last.leftRub)+' ₽ работы.'; }
  var starve=f.starve?('<div style="margin-top:4px;color:var(--red)">⛔ «'+esc(f.starve.group)+'» встанет '+ruDate(f.starve.date)
    +': фронта работ не будет — предыдущий участок не успеет дать задел.</div>'):'';
  var est=f.days.some(function(d){ return d.estimated; })
    ? '<div class="muted" style="margin-top:4px">Дни в пунктирной рамке — смены ещё не проставлены, численность взята по среднему. Проставьте смены во вкладке «🎯 День» — прогноз станет точным.</div>' : '';
  return '<div class="box"><div class="row" style="margin-bottom:6px"><b>📅 Неделя вперёд</b>'
    +'<span class="muted">— что каждый участок реально сделает за день</span></div>'
    +'<div style="overflow-x:auto"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="max-width:none">'
    +heads+cells+labels+'</svg></div>'
    +'<div class="zlegend" style="padding:6px 0 0"><span><i style="background:#cfe9d6"></i>загружен</span>'
    +'<span><i style="background:#e6f2e9"></i>наполовину</span><span><i style="background:#eef1f8"></i>простой</span>'
    +'<span><i style="background:#fdecea"></i>встал: фронта нет</span><span>✓ — всё сделано</span></div>'
    +'<div style="margin-top:6px">'+verdict+starve+est+'</div></div>';
}
function waveCard(w){
  var maxD=0; (w.groups||[]).forEach(function(g){ if(g.days>maxD) maxD=g.days; });
  var seq=GORDER.filter(function(n){ return (w.groups||[]).some(function(g){ return g.group===n; }); });
  var flow=seq.map(function(n,i){
    var g=w.groups.filter(function(x){ return x.group===n; })[0];
    var wpct=(maxD>0&&g.days)?Math.round(g.days/maxD*100):0;
    return (i?'<span class="arrow">→</span>':'')
      +'<div class="fbox'+(g.bottleneck?' bn':'')+'"><div class="fh">'+(ZICON[n]||'')+' '+esc(n)+'</div>'
      +'<div class="fd">'+(g.days!=null?g.days:'—')+'<span class="fu"> дн</span></div>'
      +'<div class="lbar"><i style="width:'+wpct+'%;background:'+(g.bottleneck?'var(--red)':'var(--accent)')+'"></i></div>'
      +'<div class="fu">'+m0(g.rub)+' ₽ · мощн '+m0(g.capRub)+' ₽/дн</div></div>';
  }).join('');
  return '<div class="wave"><div class="row"><b style="font-size:15px">'+esc(w.title)+'</b>'
    +'<span class="pill p-mut">'+m0(w.totalRub)+' ₽</span>'
    +(w.bottleneckGroup?('<span class="pill p-red">узкое: '+esc(w.bottleneckGroup)+(w.bottleneckDays?(' · '+w.bottleneckDays+' дн'):'')+'</span>'):'')
    +(w.endDay!=null?('<span class="pill '+(w.late?'p-red':'p-gr')+'" title="волны идут встык: эта начинается там, где кончилась предыдущая">дни '
        +(w.startDay||0)+'–'+w.endDay+(w.late?' · позже срока':'')+'</span>'):'')+'</div>'
    +'<div class="flow">'+flow+'</div>'
    +((w.shared&&w.shared.length)?('<div class="muted" style="margin-top:6px">🧩 общие детали (делать сразу на всю волну): '
        +w.shared.slice(0,8).map(esc).join(', ')+(w.shared.length>8?(' <span title="'+esc(w.shared.slice(8).join(', '))+'">и ещё '+(w.shared.length-8)+'</span>'):'')+'</div>'):'')
    +'</div>';
}
/* редактор волн — вторичный инструмент, поэтому свёрнут */
function editorHtml(){
  if(!PLAN) PLAN=(R.waves||[]).map(function(w){ return {title:w.title, items:(w.items||[]).map(function(x){ return {eq:x.eq,model:x.model,qty:x.qty}; })}; });
  var prodOpts=function(cur){ return (R.products||[]).map(function(p){
    var v=p.eq+'||'+p.model;
    return '<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(p.eq)+' · '+esc(p.model)+' (ост. '+m0(p.leftRub)+' ₽)</option>'; }).join(''); };
  var body=PLAN.map(function(w,wi){
    var items=w.items.map(function(it,ii){
      return '<div class="row" style="padding:3px 0"><select style="flex:1;min-width:170px" onchange="setWaveProd('+wi+','+ii+',this.value)">'
        +prodOpts(it.eq+'||'+it.model)+'</select>'
        +'<input style="width:78px" value="'+(it.qty||0)+'" inputmode="numeric" onchange="PLAN['+wi+'].items['+ii+'].qty=num(this.value)">'
        +'<button class="gho" onclick="PLAN['+wi+'].items.splice('+ii+',1);render()">✕</button></div>';
    }).join('');
    return '<div class="box" style="margin-bottom:8px"><div class="row">'
      +'<input style="flex:1;min-width:150px" value="'+esc(w.title)+'" onchange="PLAN['+wi+'].title=this.value">'
      +'<button class="gho" onclick="PLAN.splice('+wi+',1);render()">🗑</button></div>'
      +items+'<button class="sec" style="margin-top:4px" onclick="addWaveItem('+wi+')">＋ изделие</button></div>';
  }).join('');
  return '<div class="box"><details><summary style="cursor:pointer;font-weight:700">✏️ Волны запуска</summary>'
    +'<div class="muted" style="margin:6px 0">Что делаем в первую очередь. Волна забирает работу из общего остатка заказа: что не влезло — достаётся следующей.</div>'
    +body+'<div class="row" style="margin-top:6px"><button class="sec" onclick="PLAN.push({title:\'Волна \'+(PLAN.length+1),items:[]});render()">＋ волна</button>'
    +'<button onclick="savePlan()">💾 Сохранить и пересчитать</button>'
    +'<button class="gho" onclick="if(confirm(\'Убрать волны и вернуться к «всей работе»?\')){PLAN=[];savePlan();}">сбросить</button></div></details></div>';
}
function setWaveProd(wi,ii,v){ var p=String(v).split('||'); PLAN[wi].items[ii].eq=p[0]; PLAN[wi].items[ii].model=p[1]||''; }
function addWaveItem(wi){ var p=(R.products||[])[0]; if(!p){ alert('В заказе нет изделий'); return; }
  PLAN[wi].items.push({eq:p.eq,model:p.model,qty:0}); render(); }
function savePlan(){
  twSay('Пересчитываю план…');
  var payload=PLAN.map(function(w,i){ return {idx:i+1,title:w.title,items:w.items}; });
  apiPost({vapi:'saveorderplan',batch:OID,plan:JSON.stringify(payload)}).then(function(r){
    if(r&&r.ok){ PLAN=null; load(); } else alert((r&&r.error)||'не сохранилось');
  }).catch(function(){ alert('связь оборвалась'); });
}

/* ═══════════ ЗАПИСЬ ═══════════ */
// Одно окно записи: пока идёт сохранение, экран закрыт заслонкой — второй тап невозможен.
var BUSY=0;
function save(p, reload, done){
  if(BUSY) return; BUSY=1;
  api(p).then(function(r){
    BUSY=0;
    if(!r||!r.ok){ alert((r&&r.error)||'не сохранилось'); load(); return; }
    if(done) done(r);
    if(reload!==false) load();
  }).catch(function(){ BUSY=0; alert('связь оборвалась — обновляю'); load(); });
}

// ─────── индикаторы: полоска на любой запрос, заслонка — на действие человека ───────
var TWL=0, TWCLICK=0, TWTMR=0;
function twLoadOn(wait){
  TWL++;
  var b=$('twload'); if(b) b.style.display='block';
  if(wait){ var w=$('twwait'); if(w) w.style.display='flex';
    clearTimeout(TWTMR);
    TWTMR=setTimeout(function(){
      var h=$('twwt'); if(h) h.textContent='Ответа всё нет';
      var s=document.querySelector('#twwait .wh'); if(s) s.textContent='связь медленная — нажмите, чтобы закрыть';
      var ww=$('twwait'); if(ww) ww.onclick=function(){ TWL=0; twLoadOff(); };
    },30000);
  }
}
function twLoadOff(){
  TWL=Math.max(0,TWL-1); if(TWL) return;
  clearTimeout(TWTMR);
  var b=$('twload'); if(b) b.style.display='none';
  var w=$('twwait'); if(w){ w.style.display='none'; w.onclick=null; }
  var s=document.querySelector('#twwait .wh'); if(s) s.textContent='идёт обмен с сервером — не нажимайте';
}
function twSay(t){ var e=$('twwt'); if(e&&t) e.textContent=t; }
document.addEventListener('click',function(e){
  var n=e.target;
  while(n&&n!==document.body){ if(n.tagName==='BUTTON'||n.tagName==='A'){ TWCLICK=Date.now(); return; } n=n.parentNode; }
},true);
(function(){
  var _api=api, _post=apiPost;
  var wrap=function(fn){ return function(p){
    var mine=(TWCLICK&&(Date.now()-TWCLICK)<20000); if(mine) TWCLICK=0;
    twLoadOn(mine);
    return fn(p).then(function(r){ twLoadOff(); return r; }, function(e){ twLoadOff(); throw e; });
  }; };
  api=wrap(_api); apiPost=wrap(_post);
})();

load();
(function(){
  try{ var m=/[?&]twsec=([^&]+)/.exec(location.search); window.top.postMessage({tw:'hello',sec:m?decodeURIComponent(m[1]):''},'*'); }catch(e){}
  window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='refresh'){ try{ load(); }catch(err){} } });
})();
</script>
