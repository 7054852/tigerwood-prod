<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тигервуд — сервис</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="tw-theme.js"></script>
<style>
  /* оболочка: body без ширины и отступов темы — меню и раздел занимают весь экран */
  html,body{ height:100%; }
  body{ max-width:none; padding:0; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:var(--s-2); flex-wrap:wrap; }
  input,select,textarea{ width:100%; }
  .acc-row input, td input[type=checkbox], label input[type=checkbox]{ width:18px; }

  /* ─── каркас сервиса ─── */
  .shell{ display:flex; min-height:100vh; min-height:100dvh; }
  .side{ width:256px; flex:0 0 256px; background:var(--side); color:var(--side-fg); display:flex; flex-direction:column;
         position:sticky; top:0; height:100vh; height:100dvh; overflow-y:auto; border-right:1px solid var(--line); }
  .sbrand{ display:flex; align-items:center; gap:var(--s-3); padding:var(--s-5) var(--s-4) var(--s-4); }
  .logo{ width:36px; height:36px; border-radius:var(--r-ctl); background:var(--accent); color:var(--on-accent);
         display:flex; align-items:center; justify-content:center; font:600 16px/1 var(--font); letter-spacing:-.02em; flex:none; }
  .sbrand .who{ min-width:0; }
  .sbrand .who .n{ font:var(--t-strong); color:var(--side-fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sbrand .who .r{ font:var(--t-small); color:var(--side-mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .snav{ padding:0 var(--s-3) var(--s-4); flex:1; }
  .sgroup{ margin-top:var(--s-4); }
  .sgroup>.gt{ font:var(--t-label); text-transform:uppercase; letter-spacing:.06em; color:var(--side-mut); padding:var(--s-1) var(--s-3) var(--s-2); }
  .sitem{ display:flex; align-items:center; gap:var(--s-3); min-height:40px; padding:0 var(--s-2); border-radius:var(--r-ctl);
          color:var(--side-fg); text-decoration:none; cursor:pointer; font:500 14px/20px var(--font);
          transition:background-color .15s var(--ease), color .15s var(--ease); }
  .sitem .ic{ width:28px; height:28px; border-radius:var(--r-xs); display:flex; align-items:center; justify-content:center; flex:none;
              background:var(--dc-bg); color:var(--dc); transition:background-color .15s var(--ease), color .15s var(--ease); }
  .sitem .ic .twi{ width:16px; height:16px; }
  .sitem:hover{ background:var(--side-hover); }
  .sitem.active{ background:var(--side-active); box-shadow:var(--shadow-card), 0 0 0 1px var(--line); font-weight:600; }
  .sitem.active .ic{ background:var(--dc); color:#FFFFFF; }
  .sgroup>.gt .gdot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--dc); margin-right:var(--s-2); vertical-align:1px; }
  /* название раздела — всегда одной строкой: перенос делал пункты разной высоты и «прыгающим» меню.
     Ellipsis — страховка на случай очень длинного названия, полное видно во всплывающей подсказке. */
  .sitem .lb{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sitem .ex{ margin-left:var(--s-1); flex:none; color:var(--side-mut); display:flex; }
  /* переключатель темы внизу меню */
  /* закреплён внизу панели: меню длинное, переключатель не должен уезжать за экран */
  .sfoot{ position:sticky; bottom:0; background:var(--side); padding:var(--s-3) var(--s-4) calc(var(--s-4) + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  .sfoot .seg{ display:flex; }
  .seg button{ flex:1; min-height:30px; padding:0 var(--s-2); background:transparent; color:var(--side-mut); border:0; border-radius:var(--r-xs); font:500 13px/18px var(--font); gap:6px; }
  .seg button:hover{ background:transparent; color:var(--side-fg); }
  .seg button.on{ background:var(--card); color:var(--fg); box-shadow:var(--shadow-card); }
  .seg button .twi{ width:15px; height:15px; }
  .suntxt{ font:var(--t-small); color:var(--side-mut); margin-top:var(--s-2); text-align:center; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ display:none; align-items:center; gap:var(--s-2); min-height:52px; padding:0 var(--s-3); background:var(--card);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; padding-top:env(safe-area-inset-top); }
  .topbar .burger{ background:transparent; color:var(--fg); border:0; padding:0; width:40px; }
  .topbar .burger:hover{ background:var(--grey-bg); }
  .topbar .tt{ font:var(--t-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* шапка раздела — одна на все разделы: значок направления, направление, название */
  .vhead{ display:flex; align-items:center; gap:var(--s-3); height:68px; padding:0 var(--s-5); background:var(--bg); border-bottom:1px solid var(--line); }
  .vhead .dtile{ width:36px; height:36px; }
  .vhead .dtile .twi{ width:20px; height:20px; }
  .vhead .vg{ font:var(--t-label); text-transform:uppercase; letter-spacing:.06em; color:var(--dc); }
  .vhead .vt{ font:var(--t-title); letter-spacing:-.01em; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .view{ flex:1; min-height:0; position:relative; background:var(--bg); }
  .view iframe{ width:100%; height:calc(100vh - 68px); height:calc(100dvh - 68px); border:0; display:block; background:var(--bg); }
  .view .pad>.hi{ display:none; }   /* заголовок экрана уже в шапке оболочки */
  .view .pad{ padding:var(--s-5); max-width:1200px; margin:0 auto; }
  .backdrop{ display:none; }

  /* мобилка: меню превращается в выезжающую панель */
  @media(max-width:820px){
    .topbar{ display:flex; } .vhead{ display:none; }
    .topbar .dtile{ width:28px; height:28px; } .topbar .dtile .twi{ width:16px; height:16px; }
    .side{ position:fixed; left:0; top:0; z-index:40; transform:translateX(-100%); transition:transform .2s var(--ease); box-shadow:var(--shadow-pop); }
    body.drawer .side{ transform:translateX(0); }
    body.drawer .backdrop{ display:block; position:fixed; inset:0; background:var(--scrim); z-index:35; }
    .view iframe{ height:calc(100vh - 52px); height:calc(100dvh - 52px - env(safe-area-inset-top)); }
    .view .pad{ padding:var(--s-4); }
  }

  /* матрица доступа */
  .rchips{ margin:var(--s-2) 0 var(--s-1); }
  .acc-grp{ margin-bottom:var(--s-4); } .acc-grp:last-child{ margin-bottom:0; }
  .acc-gt{ font:var(--t-label); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:var(--s-1) 0; }
  .acc-row{ display:flex; align-items:center; gap:var(--s-3); min-height:40px; padding:0 var(--s-1); border-bottom:1px solid var(--line); cursor:pointer; }
  .acc-row:last-child{ border-bottom:0; }
  .plain{ max-width:560px; margin:0 auto; padding:var(--s-7) var(--s-4); }
  .plain .box{ padding:var(--s-6); }
  .plain .hi{ margin-bottom:var(--s-2); }
  .note{ display:block; padding:var(--s-4) 20px; font:var(--t-body); }
  .fl{ font:var(--t-small); color:var(--muted); margin-bottom:var(--s-1); display:block; }
  .formgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:var(--s-3); margin-top:var(--s-3); }
  .back{ background:none; border:0; color:var(--accent-text); cursor:pointer; padding:0; min-height:0; font-weight:600; }
</style>

<script>
// Поддержка старых Android (нет fetch/Promise) — минимальная замена на XMLHttpRequest
if(!window.Promise){window.Promise=function(f){var s=this;s._c=[];s._e=[];s._v=null;s._s=0;
 function res(v){s._s=1;s._v=v;for(var i=0;i<s._c.length;i++)s._c[i](v);}
 function rej(v){s._s=2;s._v=v;for(var i=0;i<s._e.length;i++)s._e[i](v);}
 try{f(res,rej);}catch(e){rej(e);}};
 window.Promise.prototype.then=function(cb,eb){var s=this;var p=new window.Promise(function(res,rej){
  function ok(v){try{res(cb?cb(v):v);}catch(e){rej(e);}}
  function no(v){if(eb){try{res(eb(v));}catch(e){rej(e);}}else rej(v);}
  if(s._s===1)ok(s._v);else if(s._s===2)no(s._v);else{s._c.push(ok);s._e.push(no);}});return p;};
 window.Promise.prototype['catch']=function(eb){return this.then(null,eb);};
 window.Promise.resolve=function(v){return new window.Promise(function(r){r(v);});};
 window.Promise.all=function(a){return new window.Promise(function(res,rej){var n=a.length,out=[],c=0;if(!n)return res(out);
  for(var i=0;i<n;i++)(function(i){a[i].then(function(v){out[i]=v;if(++c===n)res(out);},rej);})(i);});};
}
if(!window.fetch){window.fetch=function(url){return new window.Promise(function(res,rej){
 var x=new XMLHttpRequest();x.open('GET',url,true);
 x.onreadystatechange=function(){if(x.readyState===4){ if(x.status>=200&&x.status<400){
   res({ok:true,status:x.status,json:function(){return window.Promise.resolve(JSON.parse(x.responseText));},text:function(){return window.Promise.resolve(x.responseText);}});
 } else rej(new Error('HTTP '+x.status)); }};
 x.onerror=function(){rej(new Error('сеть недоступна'));};x.send();});};}
</script>

<script>
function CARD(e){ return '<div class="plain"><div class="box">'
      +'<div class="hi">Не удалось открыть приложение</div>'
      +'<div class="muted">Покажите это сообщение руководителю:</div>'
      +'<div class="note warn" style="margin:var(--s-3) 0;word-break:break-word"><span class="err">'
      +String(e.msg)+(e.file?(' — '+e.file+':'+e.line):'')+'</span></div>'
      +'<div class="muted">Часто помогает: закрыть приложение и открыть заново из бота.</div>'
      +'<button class="sec" style="margin-top:var(--s-3)" onclick="location.reload()">↻ Попробовать ещё раз</button>'
      +'</div></div>'; }
  // Страховка от «белого экрана»: показываем причину, а не пустоту.
// ⚠ Экран стираем ТОЛЬКО если сервис так и не отрисовался. Раньше любая ошибка уносила
// рабочий экран вместе с собой, а приходят они чаще всего из чужого telegram-web-app.js:
// в Telegram на Android он умеет ругаться на события, которых не знает старый клиент.
// Такая ошибка приходит как «Script error.» без файла и строки (CORS прячет детали) —
// судить по ней не о чем, и мешать работе она не должна.
(function(){
  var last=null, shown=false;
  function bare(){ var a=document.getElementById('app'); if(!a) return false;
    return String(a.textContent||'').replace(/\s+/g,'').length < 40; }
  function show(){
    if(shown||!last||!bare()) return; shown=true;
    try{ document.getElementById('app').innerHTML = CARD(last); }catch(e){}
  }
  window.onerror=function(msg,src,line){
    var file=String(src||'').split('/').pop().split('?')[0];
    var cross=(!file || String(msg).indexOf('Script error')>=0);
    last={ msg:String(msg), file:file, line:line||0, cross:cross };
    if(!cross) show();              // своя ошибка — причина видна, показываем сразу
    return false;
  };
  // чужая ошибка на старте: даём сервису шанс отрисоваться и только потом жалуемся
  setTimeout(show, 12000);
})();
</script>

<div id="app"><div class="center">Загрузка…</div></div>
<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod', TGID='', ME=null, ROLE='', app=document.getElementById('app');
var VER='20260924h';
var RUN=String(Date.now());   // одна метка на загрузку оболочки — сбивает кеш встроенных страниц   // бамп при изменении встраиваемых stat-страниц — сбивает кеш GitHub Pages в iframe
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
// ⚠ ЛИЧНОСТЬ — ТОКЕНОМ, А НЕ АДРЕСОМ: ?tgid= в ссылке ничего не доказывает (Telegram ID виден
// в списке сотрудников). Токен выдаётся после входа в сервис и лежит в localStorage этого браузера.
function twTok(){ try{ return twQp('tok')||localStorage.getItem('tw_tok')||''; }catch(e){ return twQp('tok')||''; } }
function twQp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
(function(){ var t=twQp('tok'); if(t){ try{ localStorage.setItem('tw_tok',t); }catch(e){} } })();
function twAuthWall(r){
  if(r&&r.needAuth){ document.body.innerHTML='<div class="plain"><div class="box"><div class="hi">Нужен вход</div>'
    +'<div class="muted">'+String(r.error||'Откройте сервис из бота @TWOtchbot или войдите по личному коду.')+'</div></div></div>'; }
  return r;
}
function api(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}).then(twAuthWall); }
// ⚠ localStorage в try/catch ВЕЗДЕ: в Telegram на Android при запрете данных сайта
// обращение к нему бросает, и страница умирает ещё до первой отрисовки — белый экран.
function twLS(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
var INITDATA='', DEVKEY=qp('dev')||'', CODE=qp('code')||twLS('tw_code');   // подпись Telegram / dev-ключ / личный код
try{ if(window.Telegram&&Telegram.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); INITDATA=Telegram.WebApp.initData||''; var u=Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user; if(u) TGID=String(u.id); } }catch(e){}
if(!TGID){ TGID=qp('tgid')||twLS('tw_tgid'); } if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }
// вход в сервис: strict — сервер пускает ТОЛЬКО по подписи Telegram, личному коду или dev-ключу (чужой ?tgid= доступа не даёт)
function meParams(){ var p={vapi:'me',tgid:TGID,strict:1}; if(INITDATA) p.initdata=INITDATA; if(DEVKEY) p.dev=DEVKEY; if(CODE) p.code=CODE; return p; }

// same-origin (github) и относительные ссылки получают tgid; GAS-панели — как есть (их поведение не меняем)
// tgid нужен и GAS-панелям: по нему сервер проверяет права (например, правку расценок за лист)
function withTid(url){ if(!url) return url;
  if(url.indexOf('7054852.github.io')>=0 || url.indexOf('script.google.com')>=0 || url.charAt(0)!=='h'){
    // к своим (GitHub Pages) страницам добавляем и ТОКЕН: только он доказывает личность,
    // tgid остаётся для совместимости и для GAS-панелей
    var u=url+(url.indexOf('?')>=0?'&':'?')+'tgid='+encodeURIComponent(TGID)+'&theme='+encodeURIComponent(window.twTheme?twTheme.get():'auto');
    // GAS-панели тоже только по токену: сервер отдаёт их лишь подтверждённому сотруднику
    var t=twTok(); if(t) u+='&tok='+encodeURIComponent(t);
    return u; }
  return url; }
function isDir(){ return ROLE==='директор'||ROLE==='админ'; }

// ─── доменная структура меню: id раздела → группа + порядок ───
var GROUPS=[
  { key:'sales',   title:'Продажи',               items:['deals','clients','invoices','contracts','docs','price'] },
  { key:'catalog', title:'Каталог и расценки',     items:['products','catalog','ops','cost'] },
  { key:'prod',    title:'Производство',           items:['boss','plan','prodplan','transfer','contractors','wipstore','vyrab','vcheck','otk','tabel','stats','myteam'] },
  { key:'supply',  title:'Снабжение и материалы',  items:['indocs','materials','snab'] },
  { key:'hr',      title:'Кадры',                 items:['hr'] },
  { key:'admin',   title:'Администрирование',      items:['dash','company','access','users'] }
];
// внешние (открываются новой вкладкой, не встраиваются): прайс — Google-таблица; снаб — отдельное приложение со своим входом
var EXTERNAL={ price:1, snab:1 };
// доп. разделы, которых нет в apiMe, но добавляем в сервис (только для админ/директор)
var EXTRAS={ snab:{ id:'snab', title:'🧾 Снаб — входящие счёта', url:'https://7054852.github.io/SnabTW/', roles:['админ','директор'] } };
// заголовки разделов начинаются с эмодзи + пробел → первый токен = иконка, остальное = подпись
function itemIcon(it){ var t=String(it.title||'').trim(); var sp=t.indexOf(' '); var head=sp>0?t.slice(0,sp):''; return (head && !/[a-zа-яё0-9]/i.test(head))?head:'•'; }
function itemLabel(it){ var t=String(it.title||'').trim(); var ic=itemIcon(it); return (ic!=='•'&&t.indexOf(ic)===0)?t.slice(ic.length).trim():t; }

// собрать доступные разделы: из apiMe (по роли) + EXTRAS; с реорг-метками
function buildItems(){
  var map={};
  (ME.sections||[]).forEach(function(s){ if(s.id==='prod') return; map[s.id]={ id:s.id, title:s.title, url:s.url }; });   // 'prod' — старый дубль, скрыт
  // EXTRAS по роли
  Object.keys(EXTRAS).forEach(function(k){ var e=EXTRAS[k]; if(e.roles.indexOf(ROLE)>=0) map[k]={ id:k, title:e.title, url:e.url }; });
  // реорг-метки директора/начальника
  // ⚠ plan НЕ переименовываем: раньше директор видел в меню «Управление производством», а в
  //   матрице доступа тот же раздел назывался «План и наличие» — его там попросту не находили.
  //   Теперь имя одно и живёт в sectionsCfg_ («🏭 Заказы производства»).
  if(map.boss) map.boss.title = isDir()? '💰 Мотивация начальника' : '💰 Мои деньги';
  return map;
}

function load(){
  app.innerHTML='<div class="center">Загрузка…</div>';
  api(meParams()).then(function(m){
    ME=m;
    if(!m||!m.ok){ app.innerHTML='<div class="center err">Ошибка доступа</div>'; return; }
    if(m.badCode){ try{localStorage.removeItem('tw_code');}catch(e){} CODE=''; return identify(m); }
    if(m.needTg||m.badAuth) return identify(m);   // нет подтверждённой личности → вход по коду или через бота
    if(!m.registered) return register();
    if(m.tgId){ TGID=String(m.tgId); try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }   // код опознал сотрудника → его tgId для встроенных панелей
    // ⚠ ТОКЕН — доказательство личности для встроенных панелей: без него прямая ссылка
    // vyrab.html?tgid=<чужой> открывала бы чужой экран мимо входа в сервис.
    if(m.token){ try{ localStorage.setItem('tw_tok', m.token); }catch(e){} }
    if(CODE){ try{localStorage.setItem('tw_code',CODE);}catch(e){} }
    if(m.blocked){
      app.innerHTML = m.pending
        ? '<div class="plain"><div class="box"><div class="hi">Заявка отправлена</div><p class="muted">Вы зарегистрировались как <b>'+esc(m.name||'')+'</b>. Доступ откроется, когда руководитель подтвердит вас в списке сотрудников.</p></div></div>'
        : '<div class="plain"><div class="box"><div class="hi">Доступ приостановлен</div><p class="muted">Ваша учётная запись в архиве. Обратитесь к администратору или мастеру.</p></div></div>';
      return; }
    ROLE=m.role||'';
    shell();
  }).catch(function(e){ app.innerHTML='<div class="center err">Ошибка загрузки</div>'; });
}

// ─── вход / регистрация (перенос из портала) ───
function identify(m){
  var err=(m&&m.badCode)?'<div class="err" style="margin:2px 0 10px">Неверный код — попробуйте ещё раз.</div>':'';
  app.innerHTML='<div class="plain"><div class="box"><div class="logo" style="margin-bottom:var(--s-4)">T</div><div class="hi">Вход в Тигервуд</div>'
    +err

// Разделы держим ЖИВЫМИ: iframe создаётся один раз и дальше просто показывается/прячется.
// Раньше каждое переключение делало box.innerHTML=<iframe> → полная перезагрузка страницы (секунды на GAS-панелях).
var FRAMES={};
function nativeBox(){
  var box=document.getElementById('view'), n=document.getElementById('nativeview');
  if(!n){ n=document.createElement('div'); n.id='nativeview'; box.appendChild(n); }
  return n;
}
function hideAllViews(){
  Object.keys(FRAMES).forEach(function(k){ try{ FRAMES[k].style.display='none'; }catch(e){} });
  var n=document.getElementById('nativeview'); if(n) n.style.display='none';
}
function showView(id){
  hideAllViews();
  if(id==='users'||id==='myteam'||id==='access'||id==='company'){
    var n=nativeBox(); n.style.display='';
    if(id==='access') accessView(n); else if(id==='company') companyView(n); else usersView(n);
    return;
  }
  var url=withTid(ITEMS[id].url);
  url += (url.indexOf('?')>=0?'&':'?')+'embed=1';
  // версия только для наших stat-страниц (не для GAS). RUN добавляем, чтобы перезагрузка сервиса
  // ВСЕГДА тянула свежую страницу: бамп VER легко забыть, и человек часами видит старый экран из кеша
  if(url.indexOf('7054852.github.io')>=0) url += '&v='+VER+'&r='+RUN;
  url += '&twsec='+encodeURIComponent(id);   // раздел знает своё имя → рукопожатие для авто-обновления
  var focus=null;
  if(FOCUS && FOCUS.id===id){ focus=FOCUS.params; Object.keys(focus).forEach(function(k){ url += '&'+k+'='+encodeURIComponent(focus[k]); }); FOCUS=null; }
  var f=FRAMES[id], vbox=document.getElementById('view');
  if(f && f.parentNode!==vbox) vbox.appendChild(f);   // страховка: iframe выпал из DOM (перерисовали контейнер) — вернуть, иначе раздел не откроется
  if(!f){
    f=document.createElement('iframe'); f.setAttribute('loading','eager'); f.src=url;
    vbox.appendChild(f); FRAMES[id]=f;
  } else if(focus){
    f.src=url;   // переход с фокусом (например, из статистики к расценкам) — грузим заново с параметрами
  } else {
    pingRefresh(id);   // раздел уже жил скрытым → показываем сразу, а данные он перечитает сам (свежесть без белого экрана)
  }
  f.style.display='block';
}
// ── авто-обновление разделов: страницы шлют {tw:'hello',sec} при загрузке (даже из вложенных GAS-iframe),
// шелл запоминает их окна и шлёт {tw:'refresh'} при каждом возврате на раздел / возврате на вкладку браузера ──
var SECSRC={};
window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='hello'&&d.sec) SECSRC[d.sec]=e.source;
  // раздел может попросить перейти в другой раздел («документы теперь тут»)
  if(d&&d.tw==='go'&&d.id) location.hash='#/'+String(d.id).replace(/[^a-z0-9_-]/gi,''); });
// Каждый refresh = полная перезагрузка данных раздела, а вызов Apps Script стоит 3-9 с.
// Свернул/развернул Telegram — и цех снова ждёт. Обновляем не чаще раза в минуту на раздел.
var LASTREF={}, REFRESH_MS=60000;
function pingRefresh(id, force){
  var t=Date.now();
  if(!force && LASTREF[id] && (t-LASTREF[id])<REFRESH_MS) return;   // недавно уже обновляли — данные ещё свежие
  LASTREF[id]=t;
  var w=SECSRC[id]||(FRAMES[id]&&FRAMES[id].contentWindow);
  if(w){ try{ w.postMessage({tw:'refresh'},'*'); }catch(e){} }
}

  api({vapi:'companysavesettings',tgid:TGID,settings:JSON.stringify(s)}).then(function(r){
    if(m) m.innerHTML=(r&&r.ok)?'<span class="ok">✅ сохранено</span>':'<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>';
  }).catch(function(){ if(m) m.innerHTML='<span class="err">сеть недоступна</span>'; });
}
function renameWorker(tgId,curName){
  var nn=prompt('Имя сотрудника — как записать (Фамилия Имя):', curName||'');
  if(nn===null) return; nn=nn.trim(); if(nn.length<3){ alert('Введите Фамилию и Имя'); return; }
  if(nn===curName) return;
  api({vapi:'renameworker',tgid:TGID,target:tgId,name:curName,newname:nn}).then(function(r){
    if(r&&r.ok) reloadUsers(); else alert((r&&r.error)||'ошибка');
  }).catch(function(){ alert('сеть недоступна'); });
}
function setCode(tgId,cur){
  var v=prompt('Код входа сотрудника (свой — 6–24 знака).\nОставьте пусто — сгенерируется новый код:', cur||'');
  if(v===null) return;
  api({vapi:'setworkercode',tgid:TGID,target:tgId,code:v.trim()}).then(function(r){
    if(r&&r.ok){ reloadUsers(); } else alert((r&&r.error)||'ошибка');
  }).catch(function(){ alert('сеть недоступна'); });
}
function archiveWorker(tgId,name){
  if(!confirm('Убрать «'+name+'» в архив?\nДоступ пропадёт, но выработка и ЗП сохранятся.')) return;
  api({vapi:'archiveworker',tgid:TGID,target:tgId,name:name}).then(function(r){ if(r&&r.ok) reloadUsers(); else alert((r&&r.error)||'ошибка'); }).catch(function(){ alert('сеть недоступна'); });
}
function restoreWorker(tgId,name){
  api({vapi:'restoreworker',tgid:TGID,target:tgId,name:name}).then(function(r){ if(r&&r.ok) reloadUsers(); else alert((r&&r.error)||'ошибка'); }).catch(function(){ alert('сеть недоступна'); });
}
function deleteWorker(tgId,name){
  if(!confirm('Удалить «'+name+'» полностью? Это необратимо.')) return;
  api({vapi:'delworker',tgid:TGID,target:tgId,name:name}).then(function(r){
    if(r&&r.ok){ reloadUsers(); return; }
    if(r&&r.hasOutput){ if(confirm((r.error||'у работника есть выработка')+'.\n\nУбрать в архив вместо удаления?')) archiveWorker(tgId,name); return; }
    alert((r&&r.error)||'ошибка');
  }).catch(function(){ alert('сеть недоступна'); });
}
// ─── «Доступ к разделам»: матрица роль → страницы (админ/директор) ───
var ACCESS=null, ACCROLE='';
function accessView(box){
  box.innerHTML='<div class="pad"><div class="hi">Доступ к разделам</div><div class="center">Загрузка…</div></div>';
  api({vapi:'accessmatrix',tgid:TGID}).then(function(r){
    if(!r||!r.ok){ box.innerHTML='<div class="pad err">'+esc((r&&r.error)||'нет прав')+'</div>'; return; }
    ACCESS=r; if(!ACCROLE||r.roles.indexOf(ACCROLE)<0) ACCROLE=r.roles[0]; renderAccess(box);
  }).catch(function(){ box.innerHTML='<div class="pad err">сеть недоступна</div>'; });
}
function renderAccess(box){
  var r=ACCESS;
  var chips=r.roles.map(function(role){ return '<button class="chip'+(role===ACCROLE?' on':'')+'" onclick="pickAccRole(\''+role+'\')">'+esc(r.roleTitles[role]||role)+'</button>'; }).join('');
  var tmap={}; r.sections.forEach(function(s){ tmap[s.id]=s.title; });
  var have={}; (r.access[ACCROLE]||[]).forEach(function(id){ have[id]=1; });
  var groups=GROUPS.map(function(g){
    var its=g.items.filter(function(id){ return tmap[id]; });
    if(!its.length) return '';
    var rows=its.map(function(id){
      return '<label class="acc-row"><input type="checkbox" '+(have[id]?'checked':'')+' onchange="toggleAcc(\''+id+'\',this.checked)"> <span>'+esc(tmap[id])+'</span></label>';
    }).join('');
    return '<div class="acc-grp"><div class="acc-gt">'+esc(g.title)+'</div>'+rows+'</div>';
  }).join('');
  var isMeta = (ACCROLE==='админ'||ACCROLE==='директор');
  box.innerHTML='<div class="pad"><div class="hi">Доступ к разделам</div>'
    +'<p class="muted">Выберите роль → отметьте разделы, которые ей видны. Сохраняется сразу.'+(isMeta?' У админа и директора «Сотрудники» и «Доступ» доступны всегда.':'')+'</p>'
    +'<div class="chips rchips">'+chips+'</div>'
    +'<div style="margin:var(--s-3) 0"><button class="sec sm" onclick="resetAcc()">↩ по умолчанию для роли</button> <span class="msg" id="accMsg"></span></div>'
    +'<div class="box">'+(groups||'<span class="muted">нет разделов</span>')+'</div></div>';
}
function pickAccRole(role){ ACCROLE=role; renderAccess(nativeBox()); }
function toggleAcc(id,on){
  var list=(ACCESS.access[ACCROLE]||[]).slice(), i=list.indexOf(id);
  if(on&&i<0) list.push(id); if(!on&&i>=0) list.splice(i,1);
  ACCESS.access[ACCROLE]=list; saveAcc(list);
}
function resetAcc(){ var d=(ACCESS.defaults[ACCROLE]||[]).slice(); ACCESS.access[ACCROLE]=d; saveAcc(d); renderAccess(nativeBox()); }
function saveAcc(list){
  var m=document.getElementById('accMsg'); if(m) m.textContent='…';
  api({vapi:'setrolesections',tgid:TGID,role:ACCROLE,sections:list.join(',')}).then(function(r){
    if(r&&r.ok){ ACCESS.access=r.access; ACCESS.defaults=r.defaults; if(m) m.innerHTML='<span class="ok">сохранено ✓</span>';
      if(ACCROLE===ROLE) refreshMe();   // меняю доступ своей роли → меню слева обновляется сразу
    }
    else if(m) m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>';
  }).catch(function(){ if(m) m.innerHTML='<span class="err">сеть</span>'; });
}
load();
</script>
