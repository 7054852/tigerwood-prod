<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выработка — Тигервуд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{ --bg:#fff; --fg:#222; --muted:#888; --line:#e3e3e3; --accent:#2b7de9; --green:#137333; --red:#c00; }
  *{box-sizing:border-box;}
  body{ font-family:-apple-system,Roboto,Arial,sans-serif; margin:0; padding:16px; color:var(--fg); }
  h2{ font-size:18px; margin:0 0 4px; }
  label{ display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  select,input{ width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; font-size:16px; }
  select.vsel{ width:auto; flex:1; min-width:120px; padding:5px 8px; font-size:13px; }
  select.vsel.need{ border-color:#b7791f; background:#fdf7ec; }
  button{ width:100%; padding:12px; margin-top:14px; border:0; border-radius:9px; font-size:16px; font-weight:600; color:#fff; background:var(--accent); cursor:pointer; }
  button.gray{ background:#eef; color:#334; } button.sm{ width:auto; padding:7px 12px; font-size:13px; margin:0; }
  .sum{ font-size:20px; font-weight:700; color:var(--green); margin-top:12px; text-align:center; }
  .msg{ font-size:14px; margin-top:10px; text-align:center; } .err{ color:var(--red); } .ok{ color:var(--green); }
  .card{ border:1px solid var(--line); border-radius:11px; padding:10px 12px; margin-bottom:8px; }
  .row{ display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
  .muted{ color:var(--muted); font-size:12px; }
  .tabs{ display:flex; gap:8px; margin-bottom:10px; }
  .tabs button{ width:auto; margin:0; padding:8px 14px; background:#eef; color:#334; }
  .tabs button.active{ background:var(--accent); color:#fff; }
</style>
</head>
<body>
<div class="tabs">
  <button id="tab-w" class="active" onclick="showTab('w')">✍️ Выработка</button>
  <button id="tab-m" onclick="showTab('m')">👏 Проверка</button>
  <button id="tab-j" onclick="showTab('j')">📋 Журнал</button>
</div>
<div id="pane-w">
  <div id="mysum"></div>
  <h2>Новый наряд</h2>
  <div class="muted" id="who"></div>
  <div id="wsel"></div>
  <label>За какую смену — дата начала</label>
  <div class="row" style="gap:6px"><input id="wdate" type="date" style="flex:1" onchange="updateWhen()"><button class="sm gray" type="button" onclick="setDate(0)">Сегодня</button><button class="sm gray" type="button" onclick="setDate(-1)">Вчера</button></div>
  <div class="muted" style="font-size:12px;margin-top:3px">🌙 Ночная смена с 23 на 24 — ставьте <b>23</b> (день, когда смена началась).</div>
  <label>Партия</label><select id="batch" onchange="onBatchChange()"></select>
  <label>Оборудование</label><select id="equip" onchange="fillDetails()"></select>
  <label>Деталь</label><select id="detail" onchange="fillOps()"></select>
  <label>Операция</label><select id="op" onchange="calc()"></select>
  <label>Количество</label><input id="qty" type="number" min="0" inputmode="numeric" oninput="calc()" placeholder="сколько сделано">
  <div class="sum" id="sum">—</div>
  <button class="gray" onclick="addToCart()">＋ Добавить в наряд</button>
  <label style="margin-top:14px">Смена</label>
  <div class="tabs" style="margin-bottom:0">
    <button id="shift-day" class="active" onclick="setShift('день')">☀️ День</button>
    <button id="shift-night" onclick="setShift('ночь')">🌙 Ночь</button>
  </div>
  <div id="whenline" style="margin-top:8px;font-weight:600"></div>
  <div id="cart" style="margin-top:12px"></div>
  <button onclick="sendReport()" id="sendbtn" style="display:none">📨 Отправить наряд мастеру</button>
  <div class="msg" id="wmsg"></div>
</div>
<div id="pane-m" style="display:none">
  <h2>На проверке</h2>
  <div class="muted">Подтвердите, измените кол-во или отклоните — рабочий получит уведомление.</div>
  <div id="mlist" style="margin-top:10px">Загрузка…</div>
</div>
<div id="pane-j" style="display:none">
  <h2>Журнал выработки</h2>
  <div class="row" style="margin-top:8px">
    <input id="jfrom" type="date" style="width:auto;flex:1">
    <input id="jto" type="date" style="width:auto;flex:1">
    <button class="sm" onclick="loadJournal()">Показать</button>
  </div>
  <div id="jpay" style="margin-top:12px"></div>
  <div id="jlist" style="margin-top:10px"></div>
</div>
<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod', DATA={equipments:[],batches:[],workers:[],comp:{},worker:''}, TGID='';
var COMP={}, EQUIPS=[];   // состав операций ВЫБРАННОЙ партии
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function opt(v,t){ return '<option value="'+esc(v)+'">'+esc(t||v)+'</option>'; }
function api(p){ p.app=APP; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}); }
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
try{ if(window.Telegram&&Telegram.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); var u=Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user; if(u) TGID=String(u.id); } }catch(e){}
if(!TGID){ TGID=qp('tgid')||localStorage.getItem('tw_tgid')||''; } if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }
// РЕЖИМ: 'master' — панель проверки (?tab=check): все наряды + правки + коэффициент + ввод за любого сотрудника;
//        'my' — личный кабинет: только свои наряды, свои на проверке, свой журнал.
var MODE = (qp('tab')==='check'||qp('tab')==='m') ? 'master' : 'my';
function isMaster(){ return MODE==='master'; }
// текущий работник для формы: в личном режиме — я; в режиме мастера — выбранный в списке (или я)
function curWorker(){
  if(!isMaster() && DATA.worker) return DATA.worker;
  var sel=document.getElementById('worker'); if(sel&&sel.value) return sel.value;
  return DATA.worker||'';
}
function applyMode(){
  var lw=document.getElementById('tab-w'), lm=document.getElementById('tab-m'), lj=document.getElementById('tab-j');
  if(isMaster()){ lw.textContent='✍️ Ввести за сотрудника'; lm.textContent='👏 Проверка'; lj.textContent='📋 Журнал (все)'; }
  else { lw.textContent='✍️ Моя выработка'; lm.textContent='⏳ Мои на проверке'; lj.textContent='📋 Мой журнал'; }
}
function showTab(t){
  ['w','m','j'].forEach(function(x){
    document.getElementById('pane-'+x).style.display = x===t?'':'none';
    document.getElementById('tab-'+x).className = x===t?'active':'';
  });
  if(t==='m') loadPending();
  if(t==='j') loadJournal();
}
function load(){
  api({vapi:'data',tgid:TGID}).then(function(d){
    DATA=d||DATA;
    document.getElementById('batch').innerHTML=(DATA.batches||[]).map(function(b){return opt(b.id,b.num+' · '+b.name);}).join('')||opt('','нет активных партий');
    onBatchChange();
    loadMySummary();
    if(isMaster()){
      // мастер вводит наряд за себя ИЛИ за любого сотрудника
      document.getElementById('who').textContent='';
      var opts=(DATA.workers||[]).map(function(w){return '<option value="'+esc(w.name)+'"'+(w.name===DATA.worker?' selected':'')+'>'+esc(w.name)+'</option>';}).join('');
      document.getElementById('wsel').innerHTML='<label>Сотрудник (за кого наряд)</label><select id="worker">'+(opts||opt('','нет сотрудников'))+'</select>';
    }
    else if(DATA.worker){ document.getElementById('who').textContent='Рабочий: '+DATA.worker; document.getElementById('wsel').innerHTML=''; }
    else if(TGID){ document.getElementById('wsel').innerHTML='<label>Вы впервые. Представьтесь — <b>Фамилия Имя</b>:</label><input id="reg-fio" placeholder="Иванов Иван"><button onclick="doRegister()">Зарегистрироваться</button><div class="msg" id="reg-msg"></div>'; }
    else { document.getElementById('wsel').innerHTML='<label>Кто вы</label><select id="worker">'+(DATA.workers||[]).map(function(w){return opt(w.name);}).join('')+'</select>'; }
  }).catch(function(e){ document.getElementById('wmsg').innerHTML='<span class="err">Ошибка загрузки</span>'; });
}
function onBatchChange(){
  var bid=document.getElementById('batch').value;
  if(!bid){ COMP={}; EQUIPS=[]; refillEquip(); return; }
  document.getElementById('equip').innerHTML=opt('','загрузка…');
  api({vapi:'ordercomp',batch:bid}).then(function(r){
    COMP=(r&&r.byEquip)||{}; EQUIPS=(r&&r.equipments)||[];
    refillEquip();
  }).catch(function(){ COMP={}; EQUIPS=[]; refillEquip(); });
}
function refillEquip(){
  document.getElementById('equip').innerHTML=EQUIPS.map(function(e){return opt(e);}).join('')||opt('','в этой партии нет операций');
  fillDetails();
}
function curProd(){ return (COMP||{})[document.getElementById('equip').value]||{details:{},order:[]}; }
function fillDetails(){ var p=curProd(); document.getElementById('detail').innerHTML=(p.order||[]).map(function(n){return opt(n);}).join('')||opt('','нет деталей'); fillOps(); }
function fillOps(){ var p=curProd(), name=document.getElementById('detail').value; var ops=(p.details||{})[name]||[]; document.getElementById('op').innerHTML=ops.map(function(o){return opt(o.op,o.op+' — '+o.rate);}).join(''); calc(); }
function curRate(){ var p=curProd(), name=document.getElementById('detail').value, op=document.getElementById('op').value; var o=((p.details||{})[name]||[]).filter(function(y){return y.op===op;})[0]; return o?o.rate:0; }
function calc(){ var q=Number(document.getElementById('qty').value)||0, r=curRate(); document.getElementById('sum').textContent = q>0 ? ('ЗП: '+(Math.round(q*r*100)/100)+' руб. ('+q+' × '+r+')') : '—'; }
var CART=[], SHIFT='день';
var BONUS={premPct:10,premThr:100,nightPct:15};   // как в Config
function setShift(sh){ SHIFT=sh;
  document.getElementById('shift-day').className=(sh==='день')?'active':'';
  document.getElementById('shift-night').className=(sh==='ночь')?'active':'';
  updateWhen(); renderCart(); }
function setDate(off){ var d=new Date(); d.setDate(d.getDate()+off);
  var s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  var el=document.getElementById('wdate'); if(el) el.value=s; updateWhen(); }
// наглядно: за какую дату и смену будет отчёт
function updateWhen(){ var el=document.getElementById('whenline'); if(!el) return;
  var wd=(document.getElementById('wdate')||{}).value||'';
  var human=wd?wd.split('-').reverse().slice(0,2).join('.'):'—';
  el.innerHTML='📅 Отчёт за <b>'+human+'</b> · '+(SHIFT==='ночь'?'🌙 ночь':'☀️ день'); }
function bonusCalc(base){
  var night=(SHIFT==='ночь'), ni=night?Math.round(base*BONUS.nightPct)/100:0;
  var prem=base>BONUS.premThr?Math.round(base*BONUS.premPct)/100:0;
  return {base:Math.round(base*100)/100, night:ni, prem:prem, total:Math.round((base+ni+prem)*100)/100, nightOn:night, premOn:base>BONUS.premThr};
}
// разбивка по базе/премии/ночной (та же формула, что на сервере). base — сдельная база (с учётом коэффициентов)
function computeBreakdown(base, night){
  base=Math.round(base*100)/100;
  var prem=base>BONUS.premThr?Math.round(base*BONUS.premPct)/100:0;
  var ni=night?Math.round(base*BONUS.nightPct)/100:0;
  return {base:base, premium:prem, night:ni, total:Math.round((base+prem+ni)*100)/100};
}
// единый блок «База / Премия / Ночная / Итого» — БЕЗ процентов, только рубли. Виден рабочему, мастеру, директору.
function bonusBlockHtml(bd){
  var base=bd.base||0, prem=bd.premium||0, ni=bd.night||0, total=(bd.total!=null)?bd.total:(base+prem+ni);
  var rows='<div class="row"><span class="muted">База (сдельно)</span><span>'+base+' р.</span></div>';
  if(prem>0) rows+='<div class="row"><span class="muted">Премия за наряд</span><span class="ok">+'+prem+' р.</span></div>';
  if(ni>0) rows+='<div class="row"><span class="muted">Ночная смена</span><span class="ok">+'+ni+' р.</span></div>';
  rows+='<div class="row" style="margin-top:5px;border-top:1px solid #dbe8de;padding-top:6px"><b>Итого к оплате</b><b class="ok" style="font-size:16px">'+(Math.round(total*100)/100)+' р.</b></div>';
  return '<div style="background:#f4faf6;border:1px solid #dbe8de;border-radius:10px;padding:9px 11px;margin:8px 0">'+rows+'</div>';
}
function wmsg(h){ var m=document.getElementById('wmsg'); if(m) m.innerHTML=h||''; }
function addToCart(){
  var worker=curWorker();
  if(!worker){ wmsg('<span class="err">Не выбран рабочий</span>'); return; }
  var equip=document.getElementById('equip').value, detail=document.getElementById('detail').value, op=document.getElementById('op').value, qty=Number(document.getElementById('qty').value)||0, rate=curRate();
  if(!op){ wmsg('<span class="err">Выберите операцию</span>'); return; }
  if(!(qty>0)){ wmsg('<span class="err">Укажите количество</span>'); return; }
  CART.push({equip:equip,detail:detail,op:op,qty:qty,rate:rate,sum:Math.round(qty*rate*100)/100});
  document.getElementById('qty').value=''; calc(); wmsg(''); renderCart();
}
function rmCart(i){ CART.splice(i,1); renderCart(); }
function renderCart(){
  var c=document.getElementById('cart'), sb=document.getElementById('sendbtn');
  if(!CART.length){ c.innerHTML=''; sb.style.display='none'; return; }
  var tot=CART.reduce(function(s,x){return s+x.sum;},0), bd=computeBreakdown(tot, SHIFT==='ночь');
  c.innerHTML='<div class="card"><div class="row"><b>В наряде: '+CART.length+' оп.</b><span class="muted">'+esc(SHIFT==='ночь'?'🌙 ночь':'☀️ день')+'</span></div>'
    +CART.map(function(x,i){ return '<div class="row" style="border-top:1px solid #eee;padding-top:5px"><span>'+esc(x.detail)+' · '+esc(x.op)+' · '+x.qty+' шт → '+x.sum+' р.</span><button class="sm gray" onclick="rmCart('+i+')">✕</button></div>'; }).join('')
    +bonusBlockHtml(bd)
    +'</div>';
  sb.style.display='';
}
function sendReport(){
  var worker=curWorker();
  if(!worker){ wmsg('<span class="err">Не выбран рабочий</span>'); return; }
  if(!CART.length){ wmsg('<span class="err">Наряд пуст</span>'); return; }
  var batch=document.getElementById('batch').value, wd=document.getElementById('wdate').value, dateRu=wd?wd.split('-').reverse().join('.'):'';
  var items=CART.map(function(x){ return {equip:x.equip,detail:x.detail,op:x.op,qty:x.qty}; });
  wmsg('Отправляю наряд…');
  api({vapi:'submitreport',worker:worker,tgid:TGID,batch:batch,date:dateRu,shift:SHIFT,items:JSON.stringify(items)}).then(function(r){
    if(r&&r.ok){ var b=r.breakdown||{}; var extra=(b.premApplied||b.nightApplied)?(' (заработок '+b.base+' + надбавки '+(Math.round(((b.premium||0)+(b.night||0))*100)/100)+')'):'';
      wmsg('<span class="ok">✅ Наряд отправлен: '+r.count+' оп. на <b>'+r.sum+' руб.</b>'+extra+' (на проверке)</span>'); CART=[]; renderCart(); loadMySummary(); }
    else wmsg('<span class="err">⚠️ '+esc((r&&r.error)||'ошибка')+'</span>');
  }).catch(function(){ wmsg('<span class="err">Ошибка отправки</span>'); });
}
function loadMySummary(){
  var worker=DATA.worker||'', box=document.getElementById('mysum'); if(!box) return;
  if(!worker){ box.innerHTML=''; return; }
  var n=new Date(), m=String(n.getMonth()+1).padStart(2,'0');
  var fromRu='01.'+m+'.'+n.getFullYear(), toRu=String(n.getDate()).padStart(2,'0')+'.'+m+'.'+n.getFullYear();
  api({vapi:'journal',from:fromRu,to:toRu,worker:worker}).then(function(r){
    var items=(r&&r.items)||[], pr=(r&&r.payroll)||[], zp=pr.length?pr[0].sum:0;
    var recent=items.slice(0,5).map(function(it){ return '<div class="row"><span class="muted">'+esc(it.date)+' · '+esc(it.op)+' · '+it.qty+'шт</span><span class="'+(it.status==='подтверждено'?'ok':(it.status==='отклонено'?'err':'muted'))+'">'+it.sum+'р · '+esc(it.status)+'</span></div>'; }).join('');
    box.innerHTML='<div class="card"><div class="row"><b>💰 Ваша ЗП за месяц (подтв.)</b><b class="ok">'+zp+' руб.</b></div>'
      +(recent?'<div class="muted" style="margin-top:6px">Последние отчёты:</div>'+recent:'<div class="muted" style="margin-top:6px">пока нет отчётов</div>')+'</div>';
  }).catch(function(){});
}
function loadPending(){
  var el=document.getElementById('mlist'); el.textContent='Загрузка…';
  var master=isMaster();
  var p={vapi:'pending'}; if(!master) p.worker=DATA.worker||'';   // личный режим — только свои
  api(p).then(function(r){
    var reps=(r&&r.reports)||[];
    if(!reps.length){ el.innerHTML='<div class="muted">'+(master?'Нет нарядов на проверке.':'У вас нет нарядов на проверке — всё обработано.')+'</div>'; return; }
    el.innerHTML=reps.map(function(rp){
      var rid=rp.report;
      var lines=rp.lines.map(function(l){
        var koef=l.koef||1, kbadge=(koef!==1)?' <span class="muted" style="font-size:12px">×'+koef+'</span>':'';
        var acts='';
        if(master){
          acts=' <button class="sm gray" onclick="editOut(\''+esc(l.id)+'\','+l.qty+')" title="изменить кол-во">✏️</button>'
            +'<button class="sm gray" onclick="setKoef(\''+esc(l.id)+'\','+koef+')" title="коэффициент к сумме">×k</button>'
            +'<button class="sm gray" onclick="appr(\''+esc(l.id)+'\',0)" title="убрать эту строку из наряда">✖</button>';
        }
        var vsel='';
        if(master && l.variants && l.variants.length>1){   // деталь есть в нескольких изделиях (напр. цвет на покраске) — мастер уточняет
          var opts='<option value="">↔ распределить по заказу</option>'+l.variants.map(function(m){ return '<option value="'+esc(m)+'"'+(m===l.model?' selected':'')+'>'+esc(m)+'</option>'; }).join('');
          var need=!l.model;
          vsel='<div class="row" style="margin-top:3px"><span class="muted" style="font-size:12px">изделие/цвет:</span>'
            +'<select class="vsel'+(need?' need':'')+'" onchange="setOutModel(\''+esc(l.id)+'\',this.value,this)">'+opts+'</select></div>';
        }
        return '<div style="border-top:1px solid #eee;padding-top:5px">'
          +'<div class="row"><span>'+esc(l.detail)+' · '+esc(l.op)+' · '+l.qty+' шт'+kbadge+'</span>'
          +'<span>'+l.sum+' р.'+acts+'</span></div>'
          +vsel+'</div>';
      }).join('');
      var night=(rp.shift==='ночь');
      var koefs=rp.lines.map(function(l){return l.koef||1;});
      var uniK=(koefs.length&&koefs.every(function(k){return k===koefs[0];}))?koefs[0]:null;
      var koefLbl='коэффициент'+(uniK!=null?(uniK!==1?' ×'+uniK:''):' (разный)');
      var ctrls = master
        ? '<div class="tabs" style="margin:6px 0 0;flex-wrap:wrap">'
          +(rp.single?'':'<button class="sm '+(night?'':'active')+'" onclick="setRepShift(\''+esc(rid)+'\',\'день\')">☀️ День</button><button class="sm '+(night?'active':'')+'" onclick="setRepShift(\''+esc(rid)+'\',\'ночь\')">🌙 Ночь</button>')
          +'<button class="sm gray" onclick="setRepKoef(\''+esc(rid)+'\','+(uniK!=null?uniK:1)+')">'+koefLbl+'</button></div>'
        : (night?'<div class="muted" style="font-size:12px">🌙 ночная смена</div>':'');
      var footer = master
        ? '<div class="row" style="margin-top:10px"><button class="sm" onclick="apprRep(\''+esc(rid)+'\',1)">✅ Одобрить'+(rp.single?'':' наряд')+'</button>'
          +'<button class="sm gray" onclick="apprRep(\''+esc(rid)+'\',0)">✖ Отклонить</button><span id="rm-'+esc(rid)+'" class="msg"></span></div>'
        : '<div class="muted" style="margin-top:8px;font-size:12px">⏳ ждёт подтверждения мастера</div>';
      return '<div class="card"><div class="row"><b>'+esc(rp.worker)+'</b><span class="muted">'+esc(rp.date)+' · '+esc(rp.batch)+'</span></div>'
        +'<div class="muted">'+(rp.single?'одиночная запись':'наряд')+': '+rp.lines.length+' оп.</div>'
        +ctrls+lines+bonusBlockHtml(rp.breakdown||{})+footer+'</div>';
    }).join('');
  });
}
// мастер ставит коэффициент на строку → сумма пересчитывается вверх/вниз
function setKoef(id,cur){
  var k=prompt('Коэффициент к сумме этой операции:\n1 = без изменений, 1.2 = +20%, 0.8 = −20%', cur||1);
  if(k===null) return; k=Number(String(k).replace(',','.')); if(isNaN(k)||k<0){ alert('Введите число ≥ 0'); return; }
  api({vapi:'setoutputkoef',id:id,koef:k,master:DATA.worker||'мастер'}).then(function(r){
    if(r&&r.ok){ loadPending(); loadJournal&&(document.getElementById('pane-j').style.display!=='none')&&loadJournal(); }
    else alert((r&&r.error)||'ошибка');
  });
}
function setRepShift(rid,sh){
  api({vapi:'setreportshift',report:rid,shift:sh,master:DATA.worker||'мастер'}).then(function(r){ if(r&&r.ok) loadPending(); });
}
// коэффициент на весь наряд (при проверке/одобрении)
function setRepKoef(rid,cur){
  var k=prompt('Коэффициент на весь наряд:\n1 = без изменений, 1.2 = +20%, 0.8 = −20%', cur||1);
  if(k===null) return; k=Number(String(k).replace(',','.')); if(isNaN(k)||k<0){ alert('Введите число ≥ 0'); return; }
  api({vapi:'setreportkoef',report:rid,koef:k,master:DATA.worker||'мастер'}).then(function(r){ if(r&&r.ok) loadPending(); else alert((r&&r.error)||'ошибка'); });
}
function apprRep(rid,ok){
  var m=document.getElementById('rm-'+rid); if(m) m.textContent='…';
  var single=rid.charAt(0)==='_';
  var p=single?{vapi:'approve',id:rid.slice(1),master:DATA.worker||'мастер',ok:ok?1:0}:{vapi:'approvereport',report:rid,master:DATA.worker||'мастер',ok:ok?1:0};
  api(p).then(function(r){ if(r&&r.ok){ loadPending(); } else if(m) m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; });
}
// мастер указывает изделие/цвет для строки выработки (привязка к варианту); пусто = распределить по заказу
function setOutModel(id,model,sel){
  if(sel) sel.classList.remove('need');
  api({vapi:'setoutputmodel',id:id,model:model}).then(function(r){ if(!(r&&r.ok)&&sel){ sel.classList.add('need'); } });
}
// правка строки внутри наряда (кол-во сохраняется, статус не меняется)
function editOut(id,cur){
  var q=prompt('Изменить количество (было '+cur+'):', cur);
  if(q===null) return; q=Number(q); if(!(q>0)){ alert('Кол-во должно быть > 0'); return; }
  api({vapi:'updoutput',id:id,qty:q}).then(function(r){ if(r&&r.ok){ loadPending(); } else alert((r&&r.error)||'ошибка'); });
}
// убрать/отклонить одну строку
function appr(id,ok){
  api({vapi:'approve',id:id,master:DATA.worker||'мастер',ok:ok?1:0}).then(function(r){ if(r&&r.ok){ loadPending(); } else alert('ошибка'); });
}
function editJournal(id,curQty,curDate){
  var q=prompt('Количество (было '+curQty+'):', curQty);
  if(q===null) return; q=Number(q); if(!(q>0)){ alert('Кол-во должно быть > 0'); return; }
  var d=prompt('Дата отчёта (дд.мм.гггг):', curDate||'');
  if(d===null) return;
  var m=document.getElementById('jm-'+id); if(m) m.textContent='…';
  api({vapi:'updoutput',id:id,qty:q,date:(d||'').trim()}).then(function(r){
    if(r&&r.ok){ loadJournal(); } else if(m){ m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; }
  });
}
function delJournal(id){
  if(!confirm('Удалить эту запись выработки? Пересчитается выполнение заказа.')) return;
  var m=document.getElementById('jm-'+id); if(m) m.textContent='…';
  api({vapi:'deloutput',id:id}).then(function(r){
    if(r&&r.ok){ var c=document.getElementById('j-'+id); if(c) c.style.opacity=.3; loadJournal(); }
    else if(m){ m.innerHTML='<span class="err">'+esc((r&&r.error)||'ошибка')+'</span>'; }
  });
}
// коэффициент/смена из журнала (мастер) — перезагружают журнал
function setKoefJ(id,cur){
  var k=prompt('Коэффициент к сумме этой операции:\n1 = без изменений, 1.2 = +20%, 0.8 = −20%', cur||1);
  if(k===null) return; k=Number(String(k).replace(',','.')); if(isNaN(k)||k<0){ alert('Введите число ≥ 0'); return; }
  api({vapi:'setoutputkoef',id:id,koef:k,master:DATA.worker||'мастер'}).then(function(r){ if(r&&r.ok){ loadJournal(); } else alert((r&&r.error)||'ошибка'); });
}
function setRepShiftJ(rid,sh){
  api({vapi:'setreportshift',report:rid,shift:sh,master:DATA.worker||'мастер'}).then(function(r){ if(r&&r.ok) loadJournal(); });
}
function loadJournal(){
  var lst=document.getElementById('jlist'), pay=document.getElementById('jpay');
  lst.textContent='Загрузка…'; pay.innerHTML='';
  var from=document.getElementById('jfrom').value, to=document.getElementById('jto').value;
  var fromRu=from?from.split('-').reverse().join('.'):'', toRu=to?to.split('-').reverse().join('.'):'';
  var master=isMaster();
  var jp={vapi:'journal',from:fromRu,to:toRu}; if(!master) jp.worker=DATA.worker||'';   // личный режим — только свой журнал
  api(jp).then(function(r){
    var items=(r&&r.items)||[], pr=(r&&r.payroll)||[];
    if(pr.length){
      var tot=pr.reduce(function(s,p){return s+p.sum;},0);
      pay.innerHTML='<div class="card"><div class="row"><b>💰 ЗП за период (подтв.)</b><b class="ok">'+(Math.round(tot*100)/100)+' руб.</b></div>'
        +pr.map(function(p){return '<div class="row"><span>'+esc(p.worker)+'</span><span>'+p.sum+' руб.</span></div>';}).join('')+'</div>';
    }
    items=items.filter(function(it){ return it.status==='подтверждено'; });   // журнал сданной работы — ТОЛЬКО принятые
    if(!items.length){ lst.innerHTML='<div class="muted">Нет принятых нарядов за период.</div>'; return; }
    // группировка по нарядам
    var groups=[], gidx={};
    items.forEach(function(it){
      var key=it.report||('_'+it.id);
      if(gidx[key]==null){ gidx[key]=groups.length; groups.push({single:!it.report,worker:it.worker,date:it.date,submitted:it.submitted||'',shift:it.shift||'день',batch:it.batch,sum:0,lines:[]}); }
      var g=groups[gidx[key]]; g.sum+=it.sum; g.lines.push(it);
    });
    lst.innerHTML=groups.map(function(g){
      var rep=g.lines[0]&&g.lines[0].report||'', night=(g.lines[0]&&g.lines[0].shift==='ночь');
      var lines=g.lines.map(function(it){
        var koef=it.koef||1, kbadge=(koef!==1)?' <span class="muted" style="font-size:12px">×'+koef+'</span>':'';
        var acts = master
          ? ' <button class="sm gray" onclick="editJournal(\''+esc(it.id)+'\','+it.qty+',\''+esc(it.date)+'\')">✏️</button>'
            +'<button class="sm gray" onclick="setKoefJ(\''+esc(it.id)+'\','+koef+')" title="коэффициент к сумме">×k</button>'
            +'<button class="sm gray" onclick="delJournal(\''+esc(it.id)+'\')">🗑</button><span id="jm-'+esc(it.id)+'" class="msg"></span>'
          : '';
        return '<div class="row" id="j-'+esc(it.id)+'" style="border-top:1px solid #eee;padding-top:5px"><span>'+esc(it.detail)+' · '+esc(it.op)+' · '+it.qty+' шт'+kbadge+'</span>'
          +'<span class="ok">'+it.sum+' р '+acts+'</span></div>';
      }).join('');
      var shiftCtl = (master && !g.single && rep)
        ? '<div class="tabs" style="margin:6px 0 0"><button class="sm '+(night?'':'active')+'" onclick="setRepShiftJ(\''+esc(rep)+'\',\'день\')">☀️ День</button><button class="sm '+(night?'active':'')+'" onclick="setRepShiftJ(\''+esc(rep)+'\',\'ночь\')">🌙 Ночь</button></div>'
        : (night?'<div class="muted" style="font-size:12px">🌙 ночная</div>':'');
      var effBase=g.lines.reduce(function(s,it){return s+(it.base||0)*(it.koef||1);},0);
      var gbd=computeBreakdown(effBase, night);
      return '<div class="card"><div class="row"><b>'+esc(g.worker)+'</b><span class="muted">за '+esc(g.date)+' · '+(night?'🌙 ночь':'☀️ день')+'</span></div>'
        +'<div class="muted" style="font-size:12px">'+(g.submitted?'подан '+esc(g.submitted)+' · ':'')+esc(g.batch)+(g.single?'':' · наряд')+' · '+g.lines.length+' оп.</div>'
        +shiftCtl+lines+bonusBlockHtml(gbd)+'</div>';
    }).join('');
  }).catch(function(){ lst.innerHTML='<span class="err">Ошибка загрузки</span>'; });
}
function doRegister(){
  var fio=(document.getElementById('reg-fio')||{}).value||'';
  var m=document.getElementById('reg-msg');
  if(fio.trim().length<3){ if(m){m.innerHTML='<span class="err">Введите Фамилию и Имя</span>';} return; }
  if(m){ m.textContent='Регистрирую…'; }
  api({vapi:'register',tgid:TGID,fio:fio}).then(function(r){ if(r&&r.ok){ load(); } else if(m){ m.innerHTML='<span class="err">'+((r&&r.error)||'ошибка')+'</span>'; } });
}
(function(){ var n=new Date(), m=String(n.getMonth()+1).padStart(2,'0'), today=n.getFullYear()+'-'+m+'-'+String(n.getDate()).padStart(2,'0');
  document.getElementById('jfrom').value=n.getFullYear()+'-'+m+'-01';
  document.getElementById('jto').value=today;
  document.getElementById('wdate').value=today; updateWhen(); })();
applyMode();
load();
if(isMaster()) showTab('m');   // панель проверки открывается на вкладке «Проверка»
if(qp('tab')==='j') showTab('j');
</script>
