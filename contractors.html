<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="tw-theme.js"></script>
<script src="tw-config.js"></script>
<title>Тигервуд — подрядчики</title>
<style>
  .cols{ display:flex; gap:var(--s-3); align-items:flex-start; }
  .left{ flex:0 0 320px; max-width:320px; }
  .right{ flex:1 1 auto; min-width:0; overflow:hidden; }
  @media (max-width:860px){ .cols{ display:block; } .left{ max-width:none; margin-bottom:var(--s-3); } }
  /* ноутбук / окно Telegram (02.10.2026): список подрядчиков — лентой сверху, карточка на всю ширину, без пояснений-абзацев */
  @media (max-width:1280px), (max-height:760px){
    .cols{ display:block; }
    .left{ max-width:none; display:flex; gap:var(--s-2); overflow-x:auto; padding-bottom:var(--s-1); margin-bottom:var(--s-2); }
    .left .cl{ flex:0 0 auto; max-width:300px; margin-bottom:0; padding:var(--s-1) var(--s-2); }
    .left .cl .ln.more{ display:none; }
    .left .cl.new{ display:flex; align-items:center; }
    .sums{ gap:var(--s-1); margin-bottom:var(--s-2); }
    .sum{ padding:1px 7px; }
    .hint.long{ display:none; }
    .toolbar .end{ display:none; }   /* «＋ подрядчик» и «⟳» — в ленте подрядчиков, без лишней строки */
    .left .cl.refresh{ display:flex; align-items:center; }
    .sect{ margin-top:var(--s-2); }
    .tw table.w .dt{ display:none; }   /* дата последней передачи — видна в истории */
    .tw table.w{ min-width:100%; }
    td.act .lbl{ display:none; }   /* кнопки строки — значками, подпись во всплывающей подсказке */
    td.act{ white-space:nowrap; }
    .tw table.w td .sep{ display:block; height:0; overflow:hidden; }   /* ₽/шт и сумма — в две строки */
    .tw table.w td.wrap{ white-space:normal; min-width:150px; }
  }

  .sums{ display:flex; flex-wrap:wrap; gap:var(--s-2); margin-bottom:var(--s-3); }
  .sum{ border:1px solid var(--line); border-radius:var(--r-ctl); padding:3px 9px; background:var(--card2); }
  .sum .v{ font:var(--t-body-strong); font-variant-numeric:tabular-nums; }
  .sum .n{ font:var(--t-tiny); color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .sum.debt .v{ color:var(--red); } .sum.ok .v{ color:var(--green); }

  .cl{ border:1px solid var(--line); border-radius:var(--r-ctl); background:var(--card); padding:var(--s-2) var(--s-3);
       margin-bottom:var(--s-2); cursor:pointer; transition:border-color .12s var(--ease); }
  .cl:hover{ border-color:var(--accent); }
  .cl.on{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-bg); }
  .cl .nm{ font:var(--t-body-strong); }
  .cl .ln{ font:var(--t-small); color:var(--muted); margin-top:2px; }
  .cl .dg{ color:var(--red); font-weight:600; }
  .cl .none{ color:var(--muted); }
  .cl.new{ border-style:dashed; text-align:center; color:var(--muted); }
  .cl.refresh{ display:none; }

  table.w{ min-width:max-content; }
  table.w th,table.w td{ white-space:nowrap; }
  table.w td.n,table.w th.n{ text-align:right; font-variant-numeric:tabular-nums; }
  .sect{ margin-top:var(--s-3); }
  .fields{ display:flex; flex-wrap:wrap; gap:var(--s-2); }
  .fields label{ display:block; font:var(--t-label); color:var(--muted); flex:1 1 200px; }
  .fields input{ width:100%; }
  .hint{ font:var(--t-small); color:var(--muted); margin:var(--s-1) 0; }

  /* окно .mvov/.mvbox — подложка и окно темы (.dlg-bg/.dlg) */
  .mvbox label{ display:block; font:var(--t-label); color:var(--muted); margin-top:var(--s-2); }
  .mvbox input{ width:100%; }
  .mvn{ display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; border-top:1px solid var(--line); padding:var(--s-2) 0; font:var(--t-small); }
  .mvbox label.chkrow{ display:grid; grid-template-columns:auto 1fr auto; gap:var(--s-2); align-items:center; border-top:1px solid var(--line); padding:var(--s-2) 0; margin:0; font:var(--t-small); color:var(--text); cursor:pointer; }
  .mvbox label.chkrow input{ margin:0; width:16px; height:16px; }
  .mvbox label.chkrow .op{ font:var(--t-body-strong); }
  .mvbox label.chkrow .nums{ color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .mvbox label.chkrow.cur{ cursor:default; }


  @media (max-width:1280px), (max-height:760px){ .left .cl .more{ display:none; } }
  @media print{ .noprint{ display:none !important; } .left{ display:none; } }
</style>
</head>
<body>
<div id="twload"><i></i></div>
<div class="hi noprint">🤝 Подрядчики</div>
<div class="toolbar noprint">
  <span class="msg" id="msg"></span>
  <div class="end">
    <button class="sec" onclick="openAdd()">＋ подрядчик</button>
    <button class="sec" onclick="load()">⟳</button>
  </div>
</div>
<div id="pane"><div class="center muted">Загрузка…</div></div>

<script>
var BASE=(window.TW_CFG&&TW_CFG.hub)||'https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';   // адрес задаёт tw-config.js; запасной — живой GAS
var APP='tw7prod';
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
try{ if(window.Telegram&&Telegram.WebApp){ var u0=Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user; if(u0) TGID=String(u0.id); } }catch(e){}
if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }
function twQp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
function twTok(){ try{ return twQp('tok')||localStorage.getItem('tw_tok')||''; }catch(e){ return twQp('tok')||''; } }
(function(){ var t=twQp('tok'); if(t){ try{ localStorage.setItem('tw_tok',t); }catch(e){} } })();
function twAuthWall(r){
  if(r&&r.needAuth){ document.body.innerHTML='<div style="padding:var(--s-6);font:var(--t-body);color:var(--fg)">'
    +'<div style="font:var(--t-title);margin-bottom:var(--s-3)">🔒 Нужен вход</div>'
    +'<div>'+String(r.error||'Откройте сервис из бота @TWOtchbot или войдите по личному коду.')+'</div></div>'; }
  return r;
}
function api(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}).then(twAuthWall); }
function apiPost(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID; var b=Object.keys(p).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:b}).then(function(r){return r.json();}).then(twAuthWall); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function attr(s){ return esc(s).replace(/'/g,'&#39;'); }
function $(id){ return document.getElementById(id); }
function money(n){ n=Number(n)||0; return n.toFixed(2).replace('.',','); }
function m0(n){ return Math.round(Number(n)||0); }
function plural(n,a,b,c){ n=Math.abs(n)%100; var n1=n%10; if(n>10&&n<20) return n+' '+c; if(n1>1&&n1<5) return n+' '+b; if(n1===1) return n+' '+a; return n+' '+c; }
function msg(h){ var e=$('msg'); if(e) e.innerHTML=h||''; }

var D=null, SEL=qp('name')||'';

function load(){
  $('pane').innerHTML='<div class="center muted">Считаю работы подрядчиков…</div>';
  api({vapi:'contractors',name:SEL}).then(function(r){
    if(!r||!r.ok){ $('pane').innerHTML='<div class="err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    D=r; render();
  }).catch(function(e){ $('pane').innerHTML='<div class="err">сеть: '+esc(e.message)+'</div>'; });
}
function pick(n){ SEL=n; load(); }

function render(){
  var T=D.totals||{};
  var sums='<div class="sums">'
    +sum('подрядчиков', m0(T.contractors)+'','')
    +sum('работ выполнено', plural(m0(T.rows),'запись','записи','записей'),'')
    +sum('заплатим им', money(T.sub)+' ₽','')
    +sum('долг сейчас', money(T.debt)+' ₽',T.debt>0?'debt':'ok')
    +'</div>';

  var left=(D.list||[]).map(function(x){ return cardLine(x); }).join('')
    +(D.unlisted||[]).map(function(x){ return cardLine(x); }).join('')
    +'<div class="cl new noprint" onclick="openAdd()">＋ добавить подрядчика</div>'
    +'<div class="cl new noprint refresh" onclick="load()" title="обновить">⟳</div>';

  $('pane').innerHTML=sums
    +'<div class="cols"><div class="left noprint">'+left+'</div><div class="right">'+(D.card?cardHtml(D.card):
      '<div class="box"><div class="muted">Выберите подрядчика — покажу контакты, цены и историю работ.</div></div>')+'</div></div>';
}
function sum(n,v,cls){ return '<div class="sum '+(cls||'')+'"><div class="n">'+esc(n)+'</div><div class="v">'+v+'</div></div>'; }
function cardLine(x){
  var on=(x.name===SEL);
  return '<div class="cl'+(on?' on':'')+'" onclick="pick(\''+attr(x.name)+'\')">'
    +'<div class="nm">'+esc(x.name)+(x.unlisted?' <span class="pill warn">не в списке</span>':'')+'</div>'
    +'<div class="ln more">'+(x.rows?(plural(x.rows,'работа','работы','работ')+' · '+m0(x.qty)+' шт · платим '+money(x.sub)+' ₽'):'работ пока не было')+'</div>'
    +'<div class="ln">'+(x.debt>0?('<span class="dg">долг '+money(x.debt)+' ₽</span>'):'<span class="none">долга нет</span>')
      +'<span class="more">'+(x.phone?(' · '+esc(x.phone)):'')+(x.manager?(' · ведёт '+esc(x.manager)):'')+'</span></div></div>';
}
function cardHtml(c){
  var s=c.supplier||{}, sm=c.summary||{};
  var head='<div class="box"><div class="row"><b style="font:var(--t-heading)">'+esc(s.name)+'</b>'
    +'<span class="muted">'+(s.unp?('УНП '+esc(s.unp)):'без УНП')+(s.type?(' · '+esc(s.type)):'')+'</span>'
    +'<span class="row noprint" style="margin-left:auto"><button onclick="goLedger()">📋 Ведомость передачи</button>'
    +'<button class="sec" onclick="openGive()">📤 Передать детали</button><span class="msg" id="fmsg"></span></span></div>'
    +'<div class="sums" style="margin-top:var(--s-2)">'
      +sum('работ', plural(m0(sm.rows),'запись','записи','записей'),'')
      +sum('сделано', m0(sm.qty)+' шт','')
      +sum('наша расценка', money(sm.labor)+' ₽','')
      +sum('заплатим', money(sm.sub)+' ₽','')
      +sum('оплачено', money(sm.paid)+' ₽','')
      +sum('долг', money(sm.debt)+' ₽',(sm.debt>0?'debt':'ok')+'" title="Долг = привезённое по цене подрядчика минус оплаты ему в Фин.гении')
      +sum('разница', money(sm.margin)+' ₽',sm.margin>=0?'ok':'debt')
    +'</div>'
    +'<div class="hint long">Долг = всё, что подрядчик привёз (по его цене), минус оплаченные ему счета и акты в Фин.гении. Счета выставляет сам подрядчик; в Фин.гений ничего само не уходит.</div>'
    +'</div>';

  var fields='<div class="box"><div class="sect"><b>Контакты и ответственный</b></div>'
    +'<div class="fields">'
    +fld('c_person','Контактное лицо',s.person)+fld('c_phone','Телефон',s.phone)
    +fld('c_manager','Наш ответственный',s.manager)+fld('c_addr','Адрес',s.addr)
    +fld('c_unp','УНП',s.unp)+fld('c_note','Заметка',s.note)
    +'</div>'
    +'<div class="row" style="margin-top:var(--s-2)"><button onclick="saveCard(\''+attr(s.name)+'\')">Сохранить</button>'
    +'<button class="sec" onclick="unflag(\''+attr(s.name)+'\')" title="убрать из списка подрядчиков — контрагент останется в Фин.гении">убрать из подрядчиков</button>'
    +'<span class="msg" id="cmsg"></span></div></div>';

  var ops=(c.ops||[]).length
    ? '<div class="box"><div class="sect"><b>Что делает и по какой цене</b></div>'
      +'<div class="tbl-wrap tw"><table class="tbl sm w"><thead><tr><th>Операция</th><th class="n">Сделано</th><th class="n">Наша расценка</th>'
      +'<th class="n">Цена подрядчика</th><th class="n">Заплатим</th><th>Последняя работа</th></tr></thead><tbody>'
      +c.ops.map(function(o){ return '<tr><td>'+esc(o.op)+'</td><td class="n">'+m0(o.qty)+' шт</td>'
        +'<td class="n">'+money(o.ourPrice)+' ₽/шт</td><td class="n"><b>'+money(o.price)+' ₽/шт</b></td>'
        +'<td class="n">'+money(o.sub)+' ₽</td><td class="muted">'+esc(o.last)+'</td></tr>'; }).join('')
      +'</tbody></table></div>'+detHtml(c)+'</div>'
    : '<div class="box muted">Работ по этому подрядчику ещё не записано.'+detHtml(c)+'</div>';
  var det='';

  var fl=c.flow||{rows:[],journal:[]};
  var outRows=(fl.rows||[]).filter(function(x){ return x.out>0; });
  var ft=fl.totals||{};
  var flow='<div class="box"><div class="sect"><b>Сейчас у подрядчика</b> <span class="muted">'+(fl.outQty?(m0(fl.outQty)+' шт по '+plural(fl.outRows,'позиции','позициям','позициям')+' · по нашим расценкам '+money(ft.outRub)+' ₽'):'ничего')+'</span></div>'
    +'<div class="sums" style="margin-top:var(--s-2)">'
      +sum('передали работы', money(ft.givenRub)+' ₽','')
      +sum('привёз (наша расценка)', money(ft.shipLabor)+' ₽','')
      +sum('заплатим за привезённое', money(ft.shipSub)+' ₽','')
      +sum(ft.diff>=0?'сэкономили':'переплатили', money(Math.abs(ft.diff||0))+' ₽',ft.diff>=0?'ok':'debt')
    +'</div>'
    +(outRows.length
      ? '<div class="tbl-wrap tw"><table class="tbl sm w"><thead><tr><th>Заказ</th><th>Деталь · операция</th><th class="n">Отдано</th><th class="n">Привёз</th><th class="n">На руках</th><th class="n">Наша расценка</th><th class="n">Цена подрядчика</th><th class="dt">Отдано</th><th class="noprint"></th></tr></thead><tbody>'
        +outRows.map(function(x,i){ return '<tr><td>'+esc(x.batch)+'</td><td class="wrap">'+esc(x.detail)+' · '+esc(x.op)+'</td>'
          +'<td class="n">'+m0(x.given)+'</td><td class="n">'+m0(x.ship)+'</td><td class="n"><b>'+m0(x.out)+'</b></td>'
          +'<td class="n">'+money(x.rate)+' ₽/шт<span class="sep"> · </span>'+money(x.outRub)+' ₽</td>'+cpriceCell(x)+'<td class="muted dt">'+esc(x.lastGive)+'</td>'
          +'<td class="noprint act"><button class="sm" onclick="openShip('+i+')" title="Принять привезённое">📥<span class="lbl keep"> Принять</span></button> <button class="sm sec" onclick="openGive('+i+')" title="Передать ещё">📤<span class="lbl"> Ещё</span></button>'
          +' <button class="sm sec" onclick="openPriceRow('+i+')" title="Изменить цену подрядчика">₽<span class="lbl"> цена</span></button></td></tr>'; }).join('')
        +'</tbody></table></div>'
      : '<div class="hint">Отдать детали можно кнопкой «📤 Передать детали» или из ведомости передачи.</div>')
    +'</div>';
  var jr=(fl.journal||[]);
  var journal=jr.length
    ? '<div class="box"><div class="sect"><b>История: отдали · привезли · оплатили</b></div>'
      +'<div class="tbl-wrap tw"><table class="tbl sm w"><thead><tr><th>Дата</th><th>Что</th><th>Заказ</th><th>Деталь · операция</th><th class="n">Шт</th><th class="n">Наша расценка</th><th class="n">Подрядчику</th><th>Примечание</th><th class="noprint"></th></tr></thead><tbody>'
      +jr.map(function(j,i){ var cls=j.kind==='оплата'?'ok':(j.kind==='отдали'?'muted':'');
        return '<tr><td>'+esc(j.date)+'</td><td class="'+cls+'">'+esc(j.kind)+(j.waitQC?' <span class="pill warn">ждёт ОТК</span>':'')+'</td><td>'+esc(j.batch)+'</td>'
          +'<td>'+esc(j.detail)+(j.op?(' · '+esc(j.op)):'')+'</td><td class="n">'+(j.qty?m0(j.qty):'')+'</td>'
          +'<td class="n">'+(j.labor?(money(j.labor)+' ₽'):'')+'</td><td class="n">'+(j.sum?(money(j.sum)+' ₽'):'')+'</td><td class="muted">'+esc(j.note||'')+'</td>'
          +'<td class="noprint">'+(j.kind==='привезли'?('<button class="sm sec" onclick="editShip('+i+')" title="поправить: сколько принято и по какой цене">✎</button> <button class="sm sec" onclick="delShip('+i+')">🗑</button>'):(j.kind==='отдали'?'<button class="sm sec" onclick="delGive('+i+')" title="удалить запись о передаче">🗑</button>':''))+'</td></tr>'; }).join('')
      +'</tbody></table></div></div>' : '';

  return head+flow+fields+ops+det+journal;
}
// ── переход в ведомость передачи (внутри сервиса — с фокусом на раздел, снаружи — новой вкладкой)
function goLedger(){
  if(window.parent!==window && parent.goFocus){ if(parent.goFocus('transfer',{})!==false) return; }
  var u='transfer.html?tgid='+encodeURIComponent(TGID||'')+'&tok='+encodeURIComponent(twTok()||'');
  window.open(u,'_blank');
}
// ── принять детали от подрядчика: та же запись подряда, что и в ведомости (apiSubconAdd)
function flowRow(i){ var fl=(D.card&&D.card.flow)||{rows:[]}; return (fl.rows||[]).filter(function(x){ return x.out>0; })[i]||null; }
var SBM=0;   // сумму правили руками — больше не пересчитывать от количества
function nk(s){ return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim(); }
// цена подрядчика для приёмки: договорная («деталь|операция») → «как в прошлый раз» по той же операции (торцы и финиш — разные цены)
function lastPrice(x){ var pr=(D.card&&D.card.prices)||{}; return pr[nk(x.detail)+'|'+nk(x.op)]||null; }
function priceHint(lp){ if(!lp) return '<div class="hint">цену подрядчика за эту деталь и операцию ещё не вводили — задайте договорную («₽ цена») или после первой приёмки запомнится</div>';
  return lp.src==='contract'?'<div class="hint">договорная цена <b>'+money(lp.price)+' ₽/шт</b> (с '+esc(lp.date)+(lp.by?(', '+esc(lp.by)):'')+') — подставил, можно поправить</div>'
    :'<div class="hint">в прошлый раз платили <b>'+money(lp.price)+' ₽/шт</b> ('+esc(lp.date)+') — подставил, можно поправить</div>'; }
function cpriceCell(x){ var lp=lastPrice(x); if(!lp) return '<td class="n muted">—</td>';
  return '<td class="n"'+(lp.src==='contract'?'':' title="договорной цены нет — как в прошлый раз"')+'><b>'+money(lp.price)+' ₽/шт</b><span class="sep"> · </span>'+money(x.out*lp.price)+' ₽'
    +(lp.src==='contract'?'':' <span class="pill muted">прошлая</span>')+'<div class="muted">за отданное '+money(x.given*lp.price)+' ₽</div></td>'; }
function openShip(i){
  var x=flowRow(i); if(!x) return;
  var nm=D.card.supplier.name, lp=lastPrice(x); SBM=0;
  ovOpen('<b>📥 Привёз '+esc(nm)+'</b> <span class="mvclose" onclick="ovClose()">✕</span>'
    +'<div class="hint">'+esc(x.batch)+' · '+esc(x.detail)+' · '+esc(x.op)+' · на руках '+m0(x.out)+' шт</div>'

  var b=($('gv_b')||{}).value, o=($('gv_o')||{}).value, d=($('gv_d')||{}).value, q=num(($('gv_q')||{}).value);
  if(!b||!o||!d){ omsg('gmsg','<span class="err">выберите заказ, операцию и деталь</span>'); return; }
  if(!(q>0)){ omsg('gmsg','<span class="err">укажите количество</span>'); return; }
  var btn=$('gv_go'); if(btn){ btn.disabled=true; btn.textContent='…'; }
  apiPost({vapi:'transfergive',batch:b,op:o,detail:d,data:JSON.stringify({act:'add',qty:q,contractor:D.card.supplier.name,date:ruOfIso(($('gv_dt')||{}).value||''),note:($('gv_n')||{}).value||'',alsoOps:chainOps()})})
  .then(function(r){
    if(btn){ btn.disabled=false; btn.textContent='Записать передачу'; }
    if(!r||!r.ok){ omsg('gmsg','<span class="err">'+esc((r&&r.error)||'не записано')+'</span>'); return; }
    ovClose(); load();
  }).catch(function(e){ if(btn){ btn.disabled=false; btn.textContent='Записать передачу'; } omsg('gmsg','<span class="err">сеть: '+esc(e.message)+'</span>'); });
}
function num(x){ return Number(String(x==null?'':x).replace(',','.'))||0; }
function pad2(v){ return (v<10?'0':'')+v; }
function isoToday(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function ruOfIso(s){ var p=String(s||'').split('-'); return p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):''; }
function omsg(id,h){ var e=$(id); if(e) e.innerHTML=h||''; }
function fld(id,name,v){ return '<label>'+esc(name)+'<input id="'+id+'" value="'+attr(v||'')+'"></label>'; }
function saveCard(name){
  var d={ person:($('c_person')||{}).value||'', phone:($('c_phone')||{}).value||'',
          manager:($('c_manager')||{}).value||'', addr:($('c_addr')||{}).value||'',
          unp:($('c_unp')||{}).value||'', note:($('c_note')||{}).value||'', sub:true };
  apiPost({vapi:'contractorsave',name:name,data:JSON.stringify(d)}).then(function(r){
    if(!r||!r.ok){ var e=$('cmsg'); if(e) e.innerHTML='<span class="err">'+esc((r&&r.error)||'не сохранено')+'</span>'; return; }
    var e=$('cmsg'); if(e) e.innerHTML='<span class="ok">сохранено</span>';
    setTimeout(function(){ var x=$('cmsg'); if(x) x.innerHTML=''; },1500);
  });
}
function unflag(name){
  if(!confirm('Убрать «'+name+'» из списка подрядчиков?\n\nКонтрагент и вся история работ останутся — он просто перестанет предлагаться в ведомости.')) return;
  api({vapi:'supplierflag',name:name,on:0}).then(function(r){
    if(!r||!r.ok){ alert((r&&r.error)||'не вышло'); return; }
    SEL=''; load();
  });
}
function openAdd(){
  api({vapi:'supplierlist'}).then(function(r){
    if(!r||!r.ok){ alert((r&&r.error)||'не загрузился список'); return; }
    window.__sup=(r.suppliers||[]);
    ovOpen('<b>＋ Подрядчик</b> <span class="mvclose" onclick="ovClose()">✕</span>'
      +'<div class="hint">Отмечаем тех, кому отдаём работу. Сейчас отмечено '
      +window.__sup.filter(function(x){return x.sub;}).length+' из '+(r.total||window.__sup.length)+' контрагентов.</div>'
      +'<label>Найти среди контрагентов<input id="supq" oninput="supDraw()" placeholder="начните вводить название"></label>'
      +'<div id="suplist"></div>'
      +'<label>Или завести нового<input id="supnew" placeholder="ООО «Название»"></label>'
      +'<div class="row" style="margin-top:var(--s-2)"><button onclick="supAdd()">Завести и отметить</button>'
      +'<button class="sec" onclick="ovClose()">Закрыть</button><span class="msg" id="supmsg"></span></div>');
    supDraw();
  });
}
function supDraw(){
  var q=(($('supq')||{}).value||'').toLowerCase().trim(), all=window.__sup||[];
  var list=q?all.filter(function(x){ return x.name.toLowerCase().indexOf(q)>=0; }):all.filter(function(x){ return x.sub; });
  var e=$('suplist'); if(!e) return;
  e.innerHTML=list.slice(0,40).map(function(x){
    return '<div class="mvn"><span>'+(x.sub?'✓ ':'')+esc(x.name)+'</span>'
      +'<button class="sm sec" style="margin-left:auto" onclick="supFlag(\''+attr(x.name)+'\','+(x.sub?0:1)+')">'
      +(x.sub?'убрать':'отметить')+'</button></div>';
  }).join('')||'<div class="mvn muted">'+(q?'никого не нашлось':'подрядчики пока не отмечены — найдите в поиске')+'</div>';
}
function supFlag(name,on){
  api({vapi:'supplierflag',name:name,on:on?1:0}).then(function(r){
    if(!r||!r.ok){ var e=$('supmsg'); if(e) e.innerHTML='<span class="err">'+esc((r&&r.error)||'не вышло')+'</span>'; return; }
    (window.__sup||[]).forEach(function(x){ if(x.name===name) x.sub=!!on; });
    supDraw();
  });
}
function supAdd(){
  var nm=(($('supnew')||{}).value||'').trim();
  if(nm.length<3){ var e=$('supmsg'); if(e) e.innerHTML='<span class="err">введите название</span>'; return; }
  api({vapi:'supplieradd',data:JSON.stringify({name:nm,type:'юр'})}).then(function(r){
    if(!r||!r.ok){ var e=$('supmsg'); if(e) e.innerHTML='<span class="err">'+esc((r&&r.error)||'не завели')+'</span>'; return; }
    return api({vapi:'supplierflag',name:nm,on:1}).then(function(){ ovClose(); SEL=nm; load(); });
  });
}
function ovOpen(html){
  ovClose();
  var ov=document.createElement('div'); ov.className='mvov dlg-bg'; ov.id='ovbox';
  ov.onclick=function(e){ if(e.target===ov) ovClose(); };
  ov.innerHTML='<div class="mvbox dlg">'+html+'</div>';
  document.body.appendChild(ov);
}
function ovClose(){ var e=$('ovbox'); if(e) e.remove(); }

/* ═══ заслонка загрузки ═══ */
var TWL=0;
function twLoadOn(){ TWL++; var b=$('twload'); if(b) b.style.display='block'; }
function twLoadOff(){ TWL=Math.max(0,TWL-1); if(TWL) return; var b=$('twload'); if(b) b.style.display='none'; }
(function(){
  var _api=api, _post=apiPost;
  var wrap=function(fn){ return function(p){ twLoadOn(); return fn(p).then(function(r){ twLoadOff(); return r; }, function(e){ twLoadOff(); throw e; }); }; };
  api=wrap(_api); apiPost=wrap(_post);
})();

load();
(function(){
  try{ var m=/[?&]twsec=([^&]+)/.exec(location.search); window.top.postMessage({tw:'hello',sec:m?decodeURIComponent(m[1]):''},'*'); }catch(e){}
  window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='refresh'){ try{ load(); }catch(err){} } });
})();
</script>
