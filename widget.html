<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>window.__TWTHEME__='day';</script>
<script src="tw-theme.js"></script>
<script src="tw-config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигервуд — Прохаб</title>
<style>
  /* виджет в карточке лида amoCRM (06.10.2026): только статус сделки Прохаба и кнопка «Оформить в Прохабе».
     Клиент, договор, позиции, доставка, оплата и документы оформляются в Прохабе — главный источник данных */
  body{ padding:var(--s-3); }
  .hd{ font:var(--t-heading); }
  .sec{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:var(--s-3); margin-top:var(--s-3); }
  .kv{ display:flex; justify-content:space-between; gap:var(--s-2); margin-top:var(--s-1); font:var(--t-small); }
  .kv span:first-child{ color:var(--muted); }
  .btn{ display:block; width:100%; text-align:center; margin-top:var(--s-3); }
  .hide{ display:none; }
</style>
</head>
<body>
<div class="hd">Тигервуд · Прохаб</div>
<div class="sec" id="box"><div class="sm">Загрузка…</div></div>
<a class="btn pri" id="go" href="#" target="_blank" rel="noopener">Оформить в Прохабе →</a>
<div class="sm" style="margin-top:var(--s-2)" id="note">Клиент, договор, позиции, доставка и ссылка на оплату оформляются в Прохабе. Номер заказа появится в названии сделки.</div>

<script>
var BASE=(window.TW_CFG&&TW_CFG.hub)||'';
var APP_URL='https://7054852.github.io/tigerwood-prod/app.html';
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function money(n){ n=Number(n)||0; return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function api(p){ p.app='tw7prod'; p.wk=qp('wk'); var q=Object.keys(p).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(p[k]); }).join('&'); return fetch(BASE+'?'+q).then(function(r){ return r.json(); }); }
var LEAD=qp('lead'), box=document.getElementById('box'), go=document.getElementById('go');
function kv(k,v){ return v?'<div class="kv"><span>'+esc(k)+'</span><span>'+v+'</span></div>':''; }
go.href=APP_URL+'?lead='+encodeURIComponent(LEAD);
if(!LEAD){ box.innerHTML='<div class="err">Не передан номер сделки amoCRM.</div>'; go.className='hide'; }
else api({vapi:'deal', deal:LEAD}).then(function(r){
  var d=r&&r.ok&&r.deal;
  if(!d || !d.id){ box.innerHTML='<div class="sm">В Прохабе по этой сделке ещё ничего не оформлено.</div>'; return; }
  go.textContent='Открыть в Прохабе →';
  var c=(d.contracts||[]).filter(function(x){ return x.status!=='аннулирован'; }).pop(), p=d.pay||null;
  box.innerHTML=kv('Сделка', esc(d.num||d.inquiryNum||'заявка'))+kv('Стадия', esc(d.stageRu||''))+kv('Клиент', esc(d.client||'—'))
    +kv('Договор', c?esc((c.type||'Договор')+' № '+(c.number||'черновик')+' · '+(c.status||'')):'ещё нет')
    +(p&&p.total?kv('Оплачено', money(p.paid)+' из '+money(p.total)+' руб.'):'')+kv('Сумма', d.sum?money(d.sum)+' руб.':'');
}).catch(function(){ box.innerHTML='<div class="err">Прохаб не ответил — обновите карточку.</div>'; });
</script>
</body>
</html>
