<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="tw-theme.js"></script>
<title>Тигервуд — табель и заработок</title>
<style>
  .hi{ margin-bottom:var(--s-3); }
  .box{ margin-bottom:var(--s-3); }
  /* месяц */
  .mgrid td,.mgrid th{ padding:var(--s-1); font-size:11px; text-align:center; white-space:nowrap; }
  .mgrid td.nm{ text-align:left; font-weight:600; white-space:nowrap; }
  .mgrid td{ cursor:pointer; transition:background-color .12s var(--ease); -webkit-tap-highlight-color:transparent; }
  .mgrid tr:hover td{ background:var(--accent-bg); }
  .mgrid tr:hover td.cell-d{ background:var(--heat-over); } .mgrid tr:hover td.cell-n{ background:var(--bar); }
  .mgrid col.hl{ background:var(--accent-bg); }
  .mgrid th.hl{ background:var(--accent); color:var(--on-accent); border-radius:var(--r-xs); }
  .mgrid td.nm.hl{ color:var(--accent-text); }
  .mgrid td.nm, .mgrid th{ cursor:default; }
  /* ⚠ имя работника прибито слева: на телефоне видно 9 дней из 30, и при прокрутке вправо
     строка теряла хозяина — было не понять, чей это график */
  .mgrid td.nm, .mgrid th:first-child{ position:sticky; left:0; z-index:2; background:var(--card); box-shadow:2px 0 0 var(--line); }
  /* ⚠ у скролл-контейнера НЕ должно быть боковых отступов: прилипшая колонка встаёт по краю
     padding-box, а прокручиваемая таблица видна в самом padding — числа подглядывали слева от ФИО */
  .card.mgrid{ padding-left:0; padding-right:0; }
  .mgrid td.nm{ padding-left:var(--s-3); } .mgrid th:first-child{ padding-left:var(--s-3); }
  .mgrid td:active{ filter:brightness(.9); }
  /* выходные: колонка приглушена, число красным — чтобы суббота с воскресеньем читались без счёта по пальцам */
  .mgrid td.we{ background:var(--grey-bg); } .mgrid th.we{ background:var(--grey-bg); color:var(--red); border-radius:var(--r-xs); }
  .mgrid tr:hover td.we{ background:var(--line); }
  /* праздник — тот же приём, но розовая подложка: чтобы 7 января отличалось от обычной субботы */
  .mgrid th.hol{ background:var(--red-bg); color:var(--red); font-weight:600; }
  .mgrid td.hol{ background:var(--red-bg); } .mgrid tr:hover td.hol{ background:var(--heat-stop); }
  /* ⚠ смена важнее выходного: правило .mgrid td.we специфичнее голого .cell-d, и без .mgrid td
     здесь ☀️/🌙 в субботу теряли свой цвет и клетка выглядела пустой */
  /* метка факта поверх значка смены: день/ночь остаётся видно, факт читается сразу */
  .mgrid td .fk{ font-size:11px; vertical-align:super; }
  .mgrid td .fk.ok{ color:var(--green); } .mgrid td .fk.no{ color:var(--red); }
  /* факт, выведенный из наряда: тот же зелёный, но полупрозрачный — видно, что это вывод,
     а не отметка руководителя. ⚠ — наряд есть, а отмечено «не вышел»: противоречие, разобраться. */
  .mgrid td .fk.auto{ color:var(--green); opacity:.6; } .mgrid td .fk.warn{ color:var(--amber); opacity:.9; }
  .cell-work, .mgrid td.cell-work{ background:var(--green-bg); }
  /* на телефоне клетка — под палец: 20 px в режиме отметки означало бы попадание в соседний день */
  @media (max-width:640px){
    .mgrid td[data-d]{ min-width:30px; height:32px; font-size:13px; }
    /* режим «ставлю график / отмечаю выход» — во всю ширину и 40 px под палец */
    .toolbar .end{ width:100%; }
    .seg.mmode{ display:flex; width:100%; }
    .seg.mmode button{ flex:1; min-height:var(--h-ctl); padding:0 var(--s-2); }
  }
  .cell-d, .mgrid td.cell-d{ background:var(--amber-bg); } .cell-n, .mgrid td.cell-n{ background:var(--blue-bg); }
  .cell-out{ outline:2px solid var(--green); outline-offset:-2px; } .cell-no{ outline:2px solid var(--red); outline-offset:-2px; text-decoration:line-through; }
  /* сводка месяца — плитки темы */
  .tiles{ margin-bottom:var(--s-4); }
  /* ── ведомость заработка: ровная сетка «рабочий × дни месяца» ── */
  .paywrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-card); background:var(--card); }
  table.pay{ border-collapse:separate; border-spacing:0; table-layout:fixed; font-size:13px;
             font-variant-numeric:tabular-nums; }
  table.pay col.c-nm{ width:190px; } table.pay col.c-tot{ width:92px; }
  table.pay col.c-d{ width:44px; } table.pay col.c-sm{ width:52px; }
  table.pay th,table.pay td{ border-bottom:1px solid var(--line); border-right:1px solid var(--line);
    padding:0 var(--s-2); height:34px; text-align:right; overflow:hidden; }
  table.pay thead th{ position:sticky; top:0; z-index:4; background:var(--bg2); color:var(--muted);
    font-size:11px; font-weight:600; height:32px; }
  table.pay .nmc{ text-align:left; position:sticky; left:0; z-index:5; background:var(--card);
    font-weight:600; white-space:nowrap; text-overflow:ellipsis; }
  table.pay thead .nmc{ background:var(--bg2); z-index:6; }
  table.pay .totc{ position:sticky; left:190px; z-index:5; background:var(--green-bg); font-weight:600; color:var(--green);
    box-shadow:2px 0 0 var(--line); }
  table.pay thead .totc{ background:var(--green-bg); color:var(--green); z-index:6; }
  /* ⚠ этот медиаблок обязан идти ПОСЛЕ правил выше: специфичность одинаковая, побеждает последний.
     На телефоне 190px под имя — больше половины экрана, на дни не остаётся места. Ужимаем колонку
     и шрифт, но фамилию с именем по-прежнему показываем целиком (проверено: самое длинное влезает).
     Сдвиг липкой «Итого» обязан совпадать с шириной колонки, иначе она наедет на имя. */
  @media (max-width:640px){
    table.pay .sub .avgd, table.pay .sub .pt{ display:none; }
    table.pay .sub .pc + .pc{ margin-left:var(--s-2); }
    table.pay col.c-nm{ width:150px; }
    table.pay .nmc{ font-size:11px; padding-right:var(--s-1); }
    table.pay .totc{ left:150px; }
  }
  table.pay tbody tr:hover td{ background:var(--card2); }
  table.pay tbody tr:hover .nmc{ background:var(--card2); } table.pay tbody tr:hover .totc{ background:var(--green-bg); }
  /* выходные: клетки — утопленный фон; в шапке (она сама на утопленном фоне) — на ступень темнее */
  table.pay td.wknd{ background:var(--grey-bg); } table.pay th.wknd{ background:var(--line); }
  table.pay .tdy{ box-shadow:inset 0 0 0 2px var(--amber); }
  table.pay thead th.tdy{ background:var(--amber-bg); color:var(--amber); }
  table.pay .zero{ color:var(--line2); }
  table.pay tfoot td{ position:sticky; bottom:0; background:var(--bg2); font-weight:600; z-index:4;
    border-top:2px solid var(--line2); }
  table.pay tfoot .nmc{ background:var(--bg2); z-index:6; }
  table.pay tfoot .totc{ background:var(--green-bg); z-index:6; }
  table.pay .nn{ font-size:11px; opacity:.75; }
  table.pay .sub{ display:block; font-weight:400; font-size:11px; color:var(--muted); line-height:1.1; margin-top:calc(-1 * var(--s-1)); }
  .pnd{ display:inline-block; margin-left:var(--s-1); font-size:11px; font-weight:600; color:var(--amber);
    background:var(--amber-bg); border-radius:var(--r-pill); padding:0 var(--s-1); vertical-align:1px; }
</style>
</head>

<div class="hi">📅 Табель и заработок</div>
<div id="app"><div class="center muted">Загрузка…</div></div>
<script>
// Поддержка старых Android (нет fetch/Promise) — минимальная замена на XMLHttpRequest
if(!window.Promise){window.Promise=function(f){var s=this;s._c=[];s._e=[];s._v=null;s._s=0;
 function res(v){s._s=1;s._v=v;for(var i=0;i<s._c.length;i++)s._c[i](v);}
 function rej(v){s._s=2;s._v=v;for(var i=0;i<s._e.length;i++)s._e[i](v);}
 try{f(res,rej);}catch(e){rej(e);}};
 window.Promise.prototype.then=function(cb,eb){var s=this;var p=new window.Promise(function(res,rej){
  function ok(v){try{res(cb?cb(v):v);}catch(e){rej(e);}}
  function no(v){if(eb){try{res(eb(v));}catch(e){rej(e);}}else rej(v);}
  if(s._s===1)ok(s._v);else if(s._s===2)no(s._v);else{s._c.push(ok);s._e.push(no);}});return p;};
 window.Promise.prototype['catch']=function(eb){return this.then(null,eb);};
 window.Promise.resolve=function(v){return new window.Promise(function(r){r(v);});};
 window.Promise.all=function(a){return new window.Promise(function(res,rej){var n=a.length,out=[],c=0;if(!n)return res(out);
  for(var i=0;i<n;i++)(function(i){a[i].then(function(v){out[i]=v;if(++c===n)res(out);},rej);})(i);});};
}
if(!window.fetch){window.fetch=function(url){return new window.Promise(function(res,rej){
 var x=new XMLHttpRequest();x.open('GET',url,true);
 x.onreadystatechange=function(){if(x.readyState===4){ if(x.status>=200&&x.status<400){
   res({ok:true,status:x.status,json:function(){return window.Promise.resolve(JSON.parse(x.responseText));},text:function(){return window.Promise.resolve(x.responseText);}});
 } else rej(new Error('HTTP '+x.status)); }};
 x.onerror=function(){rej(new Error('сеть недоступна'));};x.send();});};}
</script>
<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod';
// ⚠ ЛИЧНОСТЬ — ТОКЕНОМ, А НЕ АДРЕСОМ: ?tgid= в ссылке ничего не доказывает (Telegram ID виден
// в списке сотрудников). Токен выдаётся после входа в сервис и лежит в localStorage этого браузера.
function twTok(){ try{ return twQp('tok')||localStorage.getItem('tw_tok')||''; }catch(e){ return twQp('tok')||''; } }
function twQp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
(function(){ var t=twQp('tok'); if(t){ try{ localStorage.setItem('tw_tok',t); }catch(e){} } })();
function twAuthWall(r){
  if(r&&r.needAuth){ document.body.innerHTML='<div style="padding:var(--s-6);font:var(--t-body);color:var(--fg)">'
    +'<div style="font:var(--t-title);margin-bottom:var(--s-3)">🔒 Нужен вход</div>'
    +'<div>'+String(r.error||'Откройте сервис из бота @TWOtchbot или войдите по личному коду.')+'</div></div>'; }
  return r;
}
function api(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}).then(twAuthWall); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function $(id){ return document.getElementById(id); }
function money(n){ n=Number(n)||0; return n.toFixed(2).replace('.',','); }
function h1(n){ n=Number(n)||0; return n.toFixed(1).replace('.',','); }   // часы с одним знаком
function pad2(v){ v=String(v); return v.length<2?('0'+v):v; }             // вместо padStart (нет в старых Android)
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }
function isoToday(d){ d=d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function ruDate(iso){ var p=String(iso||'').split('-'); return p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):iso; }
function dayName(iso){ try{ return ['вс','пн','вт','ср','чт','пт','сб'][new Date(iso+'T12:00:00').getDay()]; }catch(e){ return ''; } }

var app=$('app'), TAB='m';

function goPlan(){
  try{ window.top.postMessage({tw:'go',id:'prodplan'},'*'); }catch(e){}
  if(window.top===window) location.href='planning.html'+(location.search||'');
}
function shell(){
  // Расстановка и выдача работ переехали в раздел «📊 Планирование» — здесь остаётся УЧЁТ:
  // кто вышел, месяц, ведомость заработка. Две половины планирования больше не живут в разных
  // разделах на разных датах.
  app.innerHTML='<div class="tabs">'
    +'<button id="tb-m" onclick="showTab(\'m\')">Табель</button>'
    +'<button id="tb-z" onclick="showTab(\'z\')">Заработок</button></div>'
    +'<div id="pane"></div>';
  showTab(TAB);
}
// подсказка про планирование рисуется в каждой вкладке ПОД панелью действий (порядок каркаса: вкладки → панель → уведомления)
var PLANNOTE='<div class="note info"><div>Расстановка по участкам и задания бойцам — в разделе '
  +'<a href="javascript:void(0)" onclick="goPlan()"><b>📊 Планирование</b></a>.</div></div>';
var MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function showTab(t){ TAB=t; ['m','z'].forEach(function(x){ var b=$('tb-'+x); if(b) b.className=(x===t?'active':''); });
  if(t==='z') loadPay(); else loadMonth(); }

/* ── ТАБЕЛЬ (месяц) ──
   Отклик мгновенный: клетка меняется СРАЗУ (оптимистично), запись уходит в фоне;
   при ошибке — предупреждение и перезагрузка с сервера. */
var SAVING=0;
function svShow(h){ var e=$('sv'); if(e){ if(h==null) e.textContent='💾 сохраняю…'; else e.innerHTML=h; } }
function svDone(){ var e=$('sv'); if(e) e.textContent=''; }
var CONVERGE=null, SAVEQ=Promise.resolve();
function bgSave(p){
  SAVING++; svShow();
  // записи уходят СТРОГО ПО ОЧЕРЕДИ кликов (иначе параллельные запросы могут обогнать друг друга)
  SAVEQ=SAVEQ.then(function(){ return api(p); }).then(function(r){
    SAVING--; if(SAVING<=0){ SAVING=0; svDone(); scheduleConverge(); }
    if(!r||!r.ok){ alert((r&&r.error)||'не сохранилось — обновляю'); loadMonth(); }
  }).catch(function(){ SAVING--; if(SAVING<0)SAVING=0; alert('Нет связи — обновляю'); loadMonth(); });
}
// после того как все записи ушли — один тихий сверочный запрос (экран сходится с сервером)
function scheduleConverge(){
  if(CONVERGE) clearTimeout(CONVERGE);
  CONVERGE=setTimeout(function(){ CONVERGE=null; if(SAVING!==0) return;
    if(TAB==='m') loadMonth(true); },1200);
}
// явное снятие смены (кнопка ✕ — то же, что повторный клик по активной смене)
/* ── ЗАРАБОТОК: ведомость «рабочий × день месяца» ── */
var ZYM=isoToday().slice(0,7), PAY=null;
function shiftZ(d){ var p=ZYM.split('-'); var dt=new Date(Number(p[0]),Number(p[1])-1+d,1); ZYM=dt.getFullYear()+'-'+pad2(dt.getMonth()+1); loadPay(); }
function loadPay(){
  $('pane').innerHTML='<div class="center muted">Считаю заработок…</div>';
  var ym0=ZYM;
  api({vapi:'payrolldaily',ym:ZYM,tgid:TGID}).then(function(r){
    if(TAB!=='z'||ym0!==ZYM) return;
    if(!r||!r.ok){ $('pane').innerHTML='<div class="box err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    PAY=r; renderPay();
  }).catch(function(e){ if(TAB==='z') $('pane').innerHTML='<div class="box err">Ошибка: '+esc(e.message||e)+'</div>'; });
}
var ZONLY=true;   // показывать только дни с выработкой (обзорнее), иначе весь месяц
function togZOnly(){ ZONLY=!ZONLY; renderPay(); }
function renderPay(){
  var r=PAY, dim=r.daysInMonth, ym=r.ym.split('-');
  var mLabel=MN[Number(ym[1])-1]+' '+ym[0];
  var todayD=(r.today.slice(0,7)===r.ym)?Number(r.today.slice(8)):0;
  // какие дни показываем
  var allDays=[], useDays=[];
  for(var d=1;d<=dim;d++){ allDays.push(d); if(r.dayTotals[d]) useDays.push(d); }
  var cols=(ZONLY&&useDays.length)?useDays:allDays;
  var hidden=allDays.length-cols.length;
  var wkd=function(d){ var g=new Date(Number(ym[0]),Number(ym[1])-1,d).getDay(); return g===0||g===6; };
  var dow=['вс','пн','вт','ср','чт','пт','сб'];
  var rub=function(v){ return v?String(Math.round(v)):''; };   // в клетках — целые рубли (сетка читается)
  // сводка сверху
  var avgPer=r.workers.length?Math.round(r.grand/r.workers.length):0;
  var bestD=0,bestV=0; cols.forEach(function(d){ if((r.dayTotals[d]||0)>bestV){ bestV=r.dayTotals[d]; bestD=d; } });
  var top='<div class="toolbar"><div class="pnav">'
    +'<button onclick="shiftZ(-1)" title="предыдущий месяц">‹</button>'
    +'<span class="lbl">'+esc(mLabel)+'</span>'
    +'<button onclick="shiftZ(1)" title="следующий месяц">›</button></div>'
    +'<div class="end"><button class="sec" onclick="togZOnly()">'+(ZONLY?'📅 показать весь месяц':'⚡ только дни с работой')+'</button></div>'
    +'</div>'+PLANNOTE;
  var tile=function(t,v,st,tip){ return '<div class="tile"><div class="t">'+t+'</div><div class="v"'+(st?(' style="color:'+st+'"'):'')+(tip?(' title="'+tip+'"'):'')+'>'+v+'</div></div>'; };
  var tiles='<div class="tiles">'
      +tile('Зарплата за месяц (подтверждено)', money(r.grand)+' <small>₽</small>', 'var(--green)')
      +tile('Рабочих', r.workers.length)
      +tile('В среднем на человека', money(avgPer)+' <small>₽</small>')
      +(bestD?tile('Лучший день', money(bestV)+' <small>₽ · '+bestD+'.'+ym[1]+'</small>'):'')
      +(r.sheetTotal>0?tile('🪚 Раскрой листов', money(r.sheetTotal)+' <small>₽</small>', 'var(--amber)', 'оплата за раскрой листов на ЧПУ: платим за лист, а детали с него уходят в свои заказы'):'')
      +(r.freeTotal>0?tile('Из них вне заказа', money(r.freeTotal)+' <small>₽</small>', 'var(--accent-text)'):'')
      +(r.hoursTotal>0?tile('Часов всего', h1(r.hoursTotal)+' <small>ч</small>', '', 'приход и уход из табеля: часы = уход − приход, обед не вычитается'):'')
      +(r.hoursTotal>0?tile('В среднем ₽/час', money(Math.round(r.grand/r.hoursTotal*100)/100)+' <small>₽</small>'):'')
      +(r.pendingTotal>0?tile('Ждёт подтверждения', money(r.pendingTotal)+' <small>₽</small>', 'var(--amber)'):'')
    +'</div>';
  if(!r.workers.length){ $('pane').innerHTML=top+tiles+'<div class="empty">За этот месяц подтверждённой выработки нет.</div>'; return; }
  // ⚠ Инициал вместо второго слова терял ФАМИЛИЮ у половины людей: в «Работниках» имя записано
  // и как «Фамилия Имя», и как «Имя Фамилия», поэтому «Олег Ш.» и «Сергей Ш.» — два разных
  // человека, и в ведомости их не различить. Показываем два слова целиком, отчество убираем.
  var shortName=function(n){ var p=String(n).trim().split(/\s+/); return p.slice(0,2).join(' '); };
  // colgroup — ровные колонки одинаковой ширины
  var cg='<colgroup><col class="c-nm"><col class="c-tot"><col class="c-sm"><col class="c-sm"><col class="c-sm">'
    +cols.map(function(){ return '<col class="c-d">'; }).join('')+'</colgroup>';
  var th='<thead><tr><th class="nmc">Рабочий</th><th class="totc">Итого ₽</th><th class="c-sm">дн</th>'
    +'<th class="c-sm" title="часы по табелю: уход − приход">ч</th><th class="c-sm" title="заработок за час">₽/ч</th>'
    +cols.map(function(d){ return '<th class="'+(d===todayD?'tdy':(wkd(d)?'wknd':''))+'" title="'+d+' '+esc(mLabel)+', '+dow[new Date(Number(ym[0]),Number(ym[1])-1,d).getDay()]+'">'+d+'</th>'; }).join('')
    +'</tr></thead>';
  var body='<tbody>'+r.workers.map(function(w){
    var tds=cols.map(function(d){
      var v=w.byDay[d], cls=(d===todayD?'tdy':(wkd(d)?'wknd':'')), hd=(w.hoursByDay||{})[d], tm=(w.timeIn||{})[d];
      var ttl=(v||hd)?(esc(w.name)+', '+d+' '+esc(mLabel)+(v?(': '+money(v)+' ₽'):'')+(hd?('\n'+(tm?tm+' · ':'')+h1(hd)+' ч'):'')):'';
      return '<td class="'+cls+(v?'':' zero')+'"'+(ttl?(' title="'+ttl+'"'):'')+'>'
        +(v?(rub(v)+(w.night[d]?'<span class="nn">🌙</span>':'')):'·')+'</td>';
    }).join('');
    var tip=w.name+' · всего '+money(w.total)+' ₽ за '+w.days+' дн'
      +(w.sheetRub>0?('\nиз них раскрой листов: '+money(w.sheetRub)+' ₽'):'')
      +(w.freeRub>0?('\nвне заказа: '+money(w.freeRub)+' ₽'):'')
      +(w.bonusRub>0?('\nпремии: '+money(w.bonusRub)+' ₽'):'')
      +(w.timeRub>0?('\nповременно: '+money(w.timeRub)+' ₽'):'')
      +(w.hours>0?('\nчасов по табелю: '+h1(w.hours)+' ч'+(w.rubPerHour>0?(' · '+money(w.rubPerHour)+' ₽/час'):'')):'');
    return '<tr><td class="nmc" title="'+esc(tip)+'">'+esc(shortName(w.name))
        +(w.pending>0?'<span class="pnd" title="на проверке у мастера">+'+money(w.pending)+'</span>':'')
        // ⚠ раскрой листов — это НЕ «вне заказа»: работа по заказу есть, просто оплата идёт за лист,
        // а не за детали (детали с листа уходят в разные заказы). Раньше он в подписи не показывался
        // вовсе, и треть зарплаты раскройщика выглядела как деньги ниоткуда.
        +'<span class="sub"><span class="avgd">ср '+money(w.avgDay)+' ₽/день</span>'
          // словами не помещается (замер: нужно 269px, есть 216) и обрезается ровно на цифрах —
          // оставляем значки, расшифровка полностью в подсказке на имени
          +(w.sheetRub>0?('<span class="pt"> · </span><span class="pc">🪚 '+money(w.sheetRub)+'</span>'):'')
          +(w.freeRub>0?('<span class="pt"> · </span><span class="pc">🧰 '+money(w.freeRub)+'</span>'):'')+'</span></td>'
      +'<td class="totc">'+money(w.total)+'</td><td>'+w.days+'</td>'
      +'<td'+(w.hours>0?'':' class="zero"')+'>'+(w.hours>0?h1(w.hours):'·')+'</td>'
      +'<td'+(w.rubPerHour>0?'':' class="zero"')+'>'+(w.rubPerHour>0?money(w.rubPerHour):'·')+'</td>'+tds+'</tr>';
  }).join('')+'</tbody>';
  var ft='<tfoot><tr><td class="nmc">ВСЕГО</td><td class="totc">'+money(r.grand)+'</td><td>'+r.workers.length+' чел</td>'
    +'<td>'+(r.hoursTotal>0?h1(r.hoursTotal):'·')+'</td><td>'+(r.hoursTotal>0?money(Math.round(r.grand/r.hoursTotal*100)/100):'·')+'</td>'
    +cols.map(function(d){ var t=r.dayTotals[d];
      return '<td class="'+(d===todayD?'tdy':(wkd(d)?'wknd':''))+(t?'':' zero')+'">'+(t?rub(t):'·')+'</td>'; }).join('')
    +'</tr></tfoot>';
  var note='<div class="note"><div>В клетках — заработок за день, целыми рублями (точная сумма — при наведении). '
    +'🌙 — была ночная смена. Колонка «Итого ₽» и строка «ВСЕГО» — с копейками. '
    +'Колонки «ч» и «₽/ч» — часы по табелю (приход и уход, обед не вычитается) и заработок за час.'
    +(hidden>0&&ZONLY?(' Скрыто дней без выработки: '+hidden+'.'):'')+'</div></div>';
  $('pane').innerHTML=top+note+tiles+'<div class="paywrap" id="paywrap"><table class="pay">'+cg+th+body+ft+'</table></div>';
  setTimeout(function(){   // прокрутить к сегодняшнему дню; если его нет — к последним дням с работой
    var wrap=$('paywrap'); if(!wrap) return;
    var cell=wrap.querySelector('thead th.tdy');
    wrap.scrollLeft = cell ? Math.max(0,cell.offsetLeft-wrap.clientWidth+140) : wrap.scrollWidth;
  },80);
}

/* ── МЕСЯЦ: график расставляется кликами по клеткам (пусто → ☀️ день → 🌙 ночь → пусто) ── */
var YM=isoToday().slice(0,7);
var M=null;   // {ym, days, mon, map{worker|day→entry}, workers}
function shiftMonth(d){ var p=YM.split('-'); var dt=new Date(Number(p[0]),Number(p[1])-1+d,1); YM=dt.getFullYear()+'-'+pad2(dt.getMonth()+1); loadMonth(); }
function loadMonth(silent){
  if(!silent) $('pane').innerHTML='<div class="center muted">Загрузка…</div>';
  var ym0=YM;
  api({vapi:'tabelmonth',ym:YM,tgid:TGID}).catch(function(e){ return {ok:false,error:'сеть недоступна — обновите экран'}; }).then(function(r){
    if(TAB!=='m'||ym0!==YM) return;                    // пользователь уже на другой вкладке/месяце — экран не трогаем
    if(silent && SAVING>0) return;                     // идёт запись — свежие клики не затираем сверкой
    if(!r||!r.ok){ if(!silent) $('pane').innerHTML='<div class="box err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    var p=YM.split('-'), days=new Date(Number(p[0]),Number(p[1]),0).getDate();
    var map={}; r.entries.forEach(function(e){ map[e.worker+'|'+Number(e.date.slice(8))]=e; });
    // производственный календарь приходит с сервера: праздники РБ + переносы из «Настроек»
    var off={}, work={}; (r.off||[]).forEach(function(d){ off[d]=1; }); (r.work||[]).forEach(function(d){ work[d]=1; });
    // дни, за которые работник подал наряд: подал работу — значит был в цеху, даже если отметку забыли
    var wk={}; (r.worked||[]).forEach(function(k){ wk[k]=1; });
    M={ym:YM, days:days, mon:p[1], map:map, workers:r.workers, off:off, work:work, hol:(r.holidayNames||{}), wk:wk};
    renderMonth();
  });
}
function renderMonth(){
  if(!M) return;
  var y=Number(M.ym.split('-')[0]), mo=Number(M.ym.split('-')[1]);
  var DOW=['вс','пн','вт','ср','чт','пт','сб'], we={}, hol={};
  for(var wd=1;wd<=M.days;wd++){
    var dw=new Date(y,mo-1,wd).getDay();
    // сервер уже учёл переносы: рабочая суббота придёт в work, праздник — в off
    we[wd]=M.off?!!M.off[wd]:(dw===0||dw===6);
    hol[wd]=!!(M.hol&&M.hol[wd]);
  }
  var thead='<tr><th></th>';
  for(var d=1;d<=M.days;d++){
    var dwn=DOW[new Date(y,mo-1,d).getDay()];
    var tip=dwn+(hol[d]?(' · '+M.hol[d]):(M.work&&M.work[d]?' · рабочий по переносу':''));
    thead+='<th class="'+(hol[d]?'we hol':(we[d]?'we':''))+'" title="'+tip+'">'+d+'</th>';
  }
  thead+='</tr>';
  var body=M.workers.map(function(w,wi){
    var tds=''; var cnt=0, was=0;
    for(var d=1;d<=M.days;d++){
      var e=M.map[w+'|'+d];
      var sh=e?e.shift:'', st=e?e.status:'';
      // наряд за этот день = человек был в цеху. Отметку руководителя это не заменяет и в табель
      // не пишется — только показывается зелёным, чтобы забытая отметка не читалась как невыход.
      var did=!!(M.wk&&M.wk[w+'|'+d]);
      var cls='', txt='', tip='';
      if(sh){ cnt++;
        var out=(st==='вышел'), no=(st==='не вышел');
        cls=(sh==='ночь'?'cell-n':'cell-d')+(out||(did&&!no)?' cell-out':(no?' cell-no':''));
        // значок смены остаётся (день это был или ночь — важно для надбавки), факт добавляется меткой
        txt=(sh==='ночь'?'🌙':'☀️')
           +(out?'<b class="fk ok">✓</b>'
             :(no?('<b class="fk no">✕</b>'+(did?'<b class="fk warn">!</b>':''))
               :(did?'<b class="fk auto">✓</b>':'')));
        if(out||did) was++;
        tip=' '+esc(sh)+(st&&st!=='план'?' · '+esc(st):'')
           +(did?(no?' · ⚠ но за этот день подан наряд':(out?'':' · был на работе (есть наряд)')):'');
      } else if(did){                       // наряд есть, а смены в графике нет — тоже был на работе
        cnt++; was++;
        cls='cell-work cell-out';
        txt='<b class="fk auto">✓</b>';
        tip=' · был на работе (есть наряд), смена в графике не отмечена';
      }
      tds+='<td class="'+(cls+((we[d]||hol[d])?((cls?' ':'')+(hol[d]?'we hol':'we')):''))+'" data-w="'+wi+'" data-d="'+d+'" title="'+esc(w)+' '+d+'.'+M.mon+tip+'">'+txt+'</td>';
    }
    return '<tr><td class="nm">'+esc(w)+' <span class="muted">('+cnt+(was?' · был '+was:'')+')</span></td>'+tds+'</tr>';
  }).join('');
  var modeSeg='<div class="seg mmode">'
    +'<button class="'+(MMODE==='plan'?'on':'')+'" onclick="setMMode(\'plan\')">✏️ Ставлю график</button>'
    +'<button class="'+(MMODE==='fact'?'on':'')+'" onclick="setMMode(\'fact\')">✅ Отмечаю выход</button></div>';
  var legend='<div class="note"><div>'
    +(MMODE==='fact'
      ? 'Клик по клетке: <b>по графику → ✓ вышел → ✕ не вышел</b>. Смену в этом режиме не меняем — только факт.'
      : 'Клик по клетке: ☀️ день → 🌙 ночь → пусто · зелёная рамка — вышел, красная — не вышел · серые колонки — выходные, розовые — праздники')
    +'<div style="margin-top:var(--s-1)">Бледная <b class="fk auto" style="font-size:13px">✓</b> — отметки нет, но за этот день подан наряд: значит был на работе. Зелёная клетка без солнышка — наряд есть, а смена в графике не проставлена. <b class="fk warn" style="font-size:13px">!</b> — отмечен «не вышел», но наряд есть.</div>'
    +'</div></div>';
  $('pane').innerHTML='<div class="toolbar"><div class="pnav"><button onclick="shiftMonth(-1)">‹</button><span class="lbl">'+esc(MN[mo-1]+' '+y)+'</span><button onclick="shiftMonth(1)">›</button></div>'
    +'<span id="sv" class="meta"></span><div class="end">'+modeSeg+'</div></div>'
    +PLANNOTE+legend
    +'<div class="card mgrid" style="overflow-x:auto"><table id="mtbl"><colgroup>'+Array(M.days+2).join('<col>')+'</colgroup>'+thead+body+'</table></div>';
  var tbl=$('mtbl');
  if(tbl){
    tbl.addEventListener('click', monthCellClick);
    // перекрестье: видно, чья строка и какой день под курсором
    tbl.addEventListener('mouseover', function(ev){
      var td=ev.target.closest?ev.target.closest('td'):null;
      if(!td||!td.hasAttribute('data-d')) return;
      var i=td.cellIndex;
      tbl.querySelectorAll('colgroup col').forEach(function(c,j){ c.className=(j===i)?'hl':''; });
      tbl.querySelectorAll('th').forEach(function(t){ t.classList.toggle('hl', t.cellIndex===i); });
      tbl.querySelectorAll('td.nm').forEach(function(t){ t.classList.toggle('hl', t.parentNode===td.parentNode); });
    });
    tbl.addEventListener('mouseout', function(ev){
      if(ev.relatedTarget && tbl.contains(ev.relatedTarget)) return;
      tbl.querySelectorAll('colgroup col').forEach(function(c){ c.className=''; });
      tbl.querySelectorAll('th.hl,td.nm.hl').forEach(function(t){ t.classList.remove('hl'); });
    });
  }
}
// ДВА РЕЖИМА ОДНОЙ СЕТКИ: график ставят заранее, факт отмечают по ходу дня. Разделены явными
// кнопками, а не скрытым жестом (долгое нажатие на телефоне никто не найдёт и не объяснит сменщику).
var MMODE='plan';
function setMMode(m){ MMODE=m; renderMonth(); }
function monthCellClick(ev){
  var td=ev.target.closest?ev.target.closest('td'):null;
  if(!td||!td.hasAttribute('data-w')) return;
  var wi=Number(td.getAttribute('data-w')), d=Number(td.getAttribute('data-d'));
  var w=M.workers[wi]; if(!w) return;
  var key=w+'|'+d, e=M.map[key];
  var sh=e?e.shift:'', st=e?e.status:'';
  if(MMODE==='fact'){
    // отмечать выход можно только там, где смена стоит: факт без смены сервер не примет
    if(!sh){ svShow('<span class="muted">'+esc(w)+', '+d+'.'+M.mon+': смены нет — сначала поставьте график</span>'); return; }
    var nf=(st==='вышел')?'не вышел':((st==='не вышел')?'план':'вышел');
    M.map[key]={date:YM+'-'+pad2(d), worker:w, shift:sh, status:nf};
    renderMonth();
    bgSave({vapi:'tabelfact',date:YM+'-'+pad2(d),worker:w,status:nf,tgid:TGID});
    return;
  }
  var next=(sh==='')?'день':(sh==='день'?'ночь':'');
  // по смене уже отмечен ФАКТ выхода: снятие удалило бы строку вместе с фактом — не пускаем
  if(next==='' && st && st!=='план'){
    alert(w+' '+d+'.'+M.mon+': выход уже отмечен («'+st+'»). Чтобы снять смену, переключитесь в «✅ Отмечаю выход», верните клетку в «план» и снимите смену.');
    return;
  }
  if(next==='') delete M.map[key];
  else M.map[key]={date:YM+'-'+pad2(d), worker:w, shift:next, status:(e&&e.status)||'план'};
  renderMonth();                                       // мгновенно на экране
  bgSave({vapi:'tabelset',date:YM+'-'+pad2(d),worker:w,shift:next,tgid:TGID});
}
shell();

// авто-обновление: оболочка шлёт «refresh» при возврате на раздел — перечитываем данные без перезагрузки страницы
(function(){
  try{ var m=/[?&]twsec=([^&]+)/.exec(location.search); window.top.postMessage({tw:'hello',sec:m?decodeURIComponent(m[1]):''},'*'); }catch(e){}
  window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='refresh'){ try{ if(TAB==='z')loadPay(); else loadMonth(); }catch(err){} } });
})();

// ─────── ПОКАЗЫВАЕМ, ЧТО ИДЁТ РАБОТА ───────
// Каждый вызов Apps Script — это 3-6 секунд. Без видимого признака человек считает, что
// кнопка не сработала, и жмёт снова: так рождались дубли нарядов и «то одобряет, то нет».
// Полоска сверху — на любой запрос; заслонка «не нажимайте» — только на действие,
// которое человек начал сам (нажал кнопку), чтобы фоновое обновление не мешало работать.
var TWL=0, TWCLICK=0;
var TWTMR=0;
function twLoadOn(wait){
  TWL++;
  var b=document.getElementById('twload'); if(b) b.style.display='block';
  if(wait){
    var w=document.getElementById('twwait'); if(w) w.style.display='flex';
    // ПРЕДОХРАНИТЕЛЬ: если ответ не пришёл (сеть в цеху пропала), заслонка не должна
    // запереть экран навсегда — через 30 с она превращается в понятное сообщение и снимается пальцем.
    clearTimeout(TWTMR);
    TWTMR=setTimeout(function(){
      var h=document.getElementById('twwt'); if(h) h.textContent='Ответа всё нет';
      var s=document.querySelector('#twwait .wh'); if(s) s.textContent='связь медленная — нажмите, чтобы закрыть и попробовать снова';
      var ww=document.getElementById('twwait'); if(ww) ww.onclick=function(){ TWL=0; twLoadOff(); };
    },30000);
  }
}
function twLoadOff(){
  TWL=Math.max(0,TWL-1); if(TWL) return;
  clearTimeout(TWTMR);
  var b=document.getElementById('twload'); if(b) b.style.display='none';
  var w=document.getElementById('twwait');
  if(w){ w.style.display='none'; w.onclick=null; }
  var s=document.querySelector('#twwait .wh'); if(s) s.textContent='идёт обмен с сервером — не нажимайте';
}
function twSay(t){ var e=document.getElementById('twwt'); if(e&&t) e.textContent=t; }
// нажатие человека «взводит» заслонку для ближайшего запроса (20 с — на случай prompt по дороге)
document.addEventListener('click',function(e){
  var n=e.target;
  while(n&&n!==document.body){ if(n.tagName==='BUTTON'||n.tagName==='A'){ TWCLICK=Date.now(); return; } n=n.parentNode; }
},true);
(function(){
  var _api=(typeof api==='function')?api:null, _post=(typeof apiPost==='function')?apiPost:null;
  var wrap=function(fn){ return function(p){
    var mine=(TWCLICK && (Date.now()-TWCLICK)<20000); if(mine) TWCLICK=0;
    twLoadOn(mine);
    return fn(p).then(function(r){ twLoadOff(); return r; }, function(e){ twLoadOff(); throw e; });
  }; };
  if(_api) api=wrap(_api);
  if(_post) apiPost=wrap(_post);
})();
</script>
