<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигервуд — табель и смены</title>
<style>
  :root{ --bg:#f4f6fb; --card:#fff; --fg:#1b2333; --muted:#8a93a6; --line:#e6e9f2; --accent:#2b7de9; --green:#137333; --amber:#b7791f; --red:#c0392b; }
  *{box-sizing:border-box;} html,body{margin:0;background:var(--bg);}
  body{ font-family:-apple-system,Roboto,Segoe UI,Arial,sans-serif; color:var(--fg); padding:14px; max-width:960px; margin:0 auto; font-size:14px; }
  .hi{ font-size:19px; font-weight:800; margin-bottom:10px; }
  .muted{ color:var(--muted); font-size:13px; }
  .center{ text-align:center; padding:24px; } .err{ color:var(--red); } .ok{ color:var(--green); }
  .box{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; overflow-x:auto; }
  .row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  select,input{ font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  button{ font:inherit; font-weight:600; border:0; border-radius:9px; padding:7px 12px; cursor:pointer; background:var(--accent); color:#fff; }
  button.sec{ background:#eef2fb; color:var(--accent); } button.gho{ background:transparent; color:var(--muted); padding:4px 7px; }
  .tabs{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .tabs button{ background:#eef2fb; color:var(--accent); } .tabs button.active{ background:var(--accent); color:#fff; }
  .pill{ font-size:11.5px; font-weight:700; border-radius:20px; padding:2px 9px; display:inline-block; }
  .num{ font-variant-numeric:tabular-nums; }
  table{ border-collapse:collapse; width:100%; font-size:13px; }
  th,td{ padding:5px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  th.num,td.num{ text-align:right; }
  /* строка сотрудника в табеле */
  .wrow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding:7px 0; }
  .wname{ font-weight:700; flex:1; min-width:150px; }
  .sbtn{ border-radius:20px; padding:4px 11px; font-size:12.5px; background:#eef1f8; color:#556; }
  .sbtn.on-day{ background:#fff3d6; color:#8a6d00; } .sbtn.on-night{ background:#e3e8ff; color:#3446a0; }
  .fbtn{ border-radius:20px; padding:4px 10px; font-size:12px; background:#eef1f8; color:#556; }
  .fbtn.on-out{ background:#e6f4ea; color:var(--green); } .fbtn.on-no{ background:#fdecea; color:var(--red); }
  .gsel{ font-size:12.5px; padding:4px 6px; max-width:130px; }
  .opsin{ font-size:12.5px; padding:4px 6px; width:150px; }
  /* месяц */
  .mgrid td,.mgrid th{ padding:3px 4px; font-size:11.5px; text-align:center; white-space:nowrap; }
  .mgrid td.nm{ text-align:left; font-weight:600; white-space:nowrap; }
  .cell-d{ background:#fff3d6; } .cell-n{ background:#e3e8ff; }
  .cell-out{ outline:2px solid #7fc78f; outline-offset:-2px; } .cell-no{ outline:2px solid #e88; outline-offset:-2px; text-decoration:line-through; }
  /* план на день */
  .kpi{ display:flex; gap:18px; flex-wrap:wrap; font-weight:700; }
  .kpi b{ font-size:17px; } .kpi .k{ color:var(--muted); font-weight:600; font-size:12px; display:block; }
  .gbar{ height:6px; background:#eef1f8; border-radius:6px; overflow:hidden; }
  .gbar>i{ display:block; height:100%; background:var(--accent); }
  /* ── доска расстановки ── */
  .bench{ display:flex; flex-wrap:wrap; gap:8px; min-height:44px; align-items:center; }
  .chip{ display:inline-flex; align-items:center; gap:7px; background:var(--card); border:1.5px solid var(--line); border-radius:22px;
         padding:6px 12px; cursor:grab; user-select:none; font-size:13px;
         transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .chip b{ font-weight:700; white-space:nowrap; }
  .chip .st{ color:var(--muted); font-size:11.5px; white-space:nowrap; }
  .chip .exp{ font-weight:800; color:#2f7a34; cursor:pointer; white-space:nowrap; }
  .chip .exp.own{ color:#b7791f; }
  .chip.sel{ transform:translateY(-3px) scale(1.04); box-shadow:0 6px 18px rgba(43,125,233,.28); border-color:var(--accent); }
  .chip.drag{ opacity:.45; }
  .chip .x{ color:var(--muted); cursor:pointer; font-weight:800; padding:0 2px; } .chip .x:hover{ color:var(--red); }
  .chip .opsb{ font-size:11px; color:var(--accent); cursor:pointer; white-space:nowrap; }
  .zone{ border:2px solid var(--line); border-radius:14px; background:var(--card); margin-bottom:12px; overflow:hidden;
         transition:border-color .15s ease, box-shadow .15s ease; }
  .zone.target{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(43,125,233,.16); cursor:pointer; }
  .zone.bn{ border-color:var(--red); animation:zpulse 1.8s infinite; }
  @keyframes zpulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(192,57,43,.28);} 50%{ box-shadow:0 0 0 7px rgba(192,57,43,.05);} }
  .zh{ display:flex; align-items:center; gap:8px; padding:9px 12px 6px; font-weight:800; flex-wrap:wrap; }
  .zh .zn{ font-size:15px; }
  /* полоса участка: [сделано][можно сейчас][ждёт предыдущих]; внутри «можно» — вклад завтра */
  .zbar{ height:16px; background:#eef1f8; border-radius:8px; overflow:hidden; display:flex; margin:2px 12px 0; }
  .zbar .seg{ height:100%; transition:width .35s ease; }
  .zbar .s-done{ background:#137333; }
  .zbar .s-av{ background:#8fc2f5; position:relative; }
  .zbar .s-av > i{ display:block; height:100%; background:repeating-linear-gradient(45deg,#1f6fd0,#1f6fd0 5px,#4a90e2 5px,#4a90e2 10px); transition:width .35s ease; }
  .zbar .s-bl{ background:#dfe4ee; }
  .zlegend{ display:flex; gap:12px; flex-wrap:wrap; padding:4px 12px 0; font-size:11.5px; color:var(--muted); }
  .zlegend i{ display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .warnbar{ margin:6px 12px 0; padding:6px 9px; border-radius:9px; background:#fdf3ec; color:#a35b12; font-size:12.5px; font-weight:600; }
  /* ── ведомость заработка: ровная сетка «рабочий × дни месяца» ── */
  .paywrap{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--card); }
  table.pay{ border-collapse:separate; border-spacing:0; table-layout:fixed; font-size:12.5px;
             font-variant-numeric:tabular-nums; }
  table.pay col.c-nm{ width:158px; } table.pay col.c-tot{ width:92px; }
  table.pay col.c-d{ width:44px; } table.pay col.c-sm{ width:52px; }
  table.pay th,table.pay td{ border-bottom:1px solid var(--line); border-right:1px solid var(--line);
    padding:0 7px; height:34px; text-align:right; overflow:hidden; }
  table.pay thead th{ position:sticky; top:0; z-index:4; background:#f2f5fb; color:#5a6478;
    font-size:11px; font-weight:700; height:30px; }
  table.pay .nmc{ text-align:left; position:sticky; left:0; z-index:5; background:var(--card);
    font-weight:700; white-space:nowrap; text-overflow:ellipsis; }
  table.pay thead .nmc{ background:#f2f5fb; z-index:6; }
  table.pay .totc{ position:sticky; left:158px; z-index:5; background:#f6faf7; font-weight:800; color:#137333;
    box-shadow:3px 0 6px rgba(20,30,60,.08); }
  table.pay thead .totc{ background:#eaf4ec; color:#137333; z-index:6; }
  table.pay tbody tr:hover td{ background:#fafcff; }
  table.pay tbody tr:hover .nmc{ background:#fafcff; } table.pay tbody tr:hover .totc{ background:#eef7f0; }
  table.pay td.wknd{ background:#fbfbfd; } table.pay th.wknd{ background:#e9edf6; }
  table.pay .tdy{ box-shadow:inset 0 0 0 2px #f0c14b; }
  table.pay thead th.tdy{ background:#fdf3d4; color:#8a6d00; }
  table.pay .zero{ color:#d3d8e3; }
  table.pay tfoot td{ position:sticky; bottom:0; background:#eef2f9; font-weight:800; z-index:4;
    border-top:2px solid #d5dced; }
  table.pay tfoot .nmc{ background:#eef2f9; z-index:6; }
  table.pay tfoot .totc{ background:#e3efe6; z-index:6; }
  table.pay .nn{ font-size:9px; opacity:.75; margin-left:1px; }
  table.pay .sub{ display:block; font-weight:400; font-size:10px; color:var(--muted); line-height:1.1; margin-top:-3px; }
  .pnd{ display:inline-block; margin-left:4px; font-size:9.5px; font-weight:700; color:#8a6d00;
    background:#fff3d6; border-radius:10px; padding:0 5px; vertical-align:1px; }
  /* ── экран «Бойцы»: сотрудник-контейнер с работами ── */
  .crew{ border:1.5px solid var(--line); border-radius:14px; background:var(--card); margin-bottom:10px; overflow:hidden; }
  .crew.full{ border-color:#9ccfa6; } .crew.low{ border-color:#f0c98a; } .crew.empty{ border-style:dashed; }
  .ch{ display:flex; align-items:center; gap:9px; padding:10px 12px 6px; flex-wrap:wrap; }
  .ch .nm{ font-weight:800; font-size:15px; }
  .ch .stat{ font-size:11.5px; color:var(--muted); }
  .load{ height:12px; background:#eef1f8; border-radius:7px; overflow:hidden; margin:0 12px; display:flex; }
  .load > i{ display:block; height:100%; background:var(--accent); transition:width .3s ease; }
  .load > i.ov{ background:var(--red); }
  .lnums{ padding:4px 12px 0; font-size:12px; color:var(--muted); }
  .lnums b{ color:var(--fg); }
  .tasks{ padding:6px 12px 4px; }
  .task{ display:flex; align-items:center; gap:8px; padding:5px 0; border-top:1px solid var(--line); font-size:13px; flex-wrap:wrap; }
  .task:first-child{ border-top:0; }
  .task .tn{ flex:1; min-width:150px; }
  .task .tq{ font-weight:700; font-variant-numeric:tabular-nums; }
  .task .tw{ color:#a35b12; font-size:11.5px; font-weight:700; }
  .task .tg{ font-size:10.5px; color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:1px 7px; }
  .cwarn{ margin:0 12px 8px; font-size:12px; color:#a35b12; }
  .cwarn div{ padding:1px 0; }
  .picker{ margin:6px 12px 10px; border:1px dashed var(--line); border-radius:10px; padding:8px 10px; max-height:290px; overflow-y:auto; }
  .pk{ display:flex; align-items:center; gap:8px; padding:5px 0; border-top:1px solid var(--line); font-size:12.5px; cursor:pointer; }
  .pk:first-child{ border-top:0; } .pk:hover{ background:#f7f9fd; }
  .pk .pn{ flex:1; min-width:140px; } .pk .pa{ font-weight:700; color:#137333; white-space:nowrap; }
  .pk.no .pa{ color:var(--muted); }
  .zbody{ padding:8px 12px; min-height:42px; }
  .zrow{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:3px 0; }
  .zrow + .zrow{ border-top:1px dashed var(--line); margin-top:3px; }
  .zrow .sh{ font-size:12px; color:var(--muted); font-weight:700; min-width:30px; }
  .zfoot{ padding:0 12px 10px; font-size:12.5px; color:var(--muted); }
  .zfoot b{ color:var(--fg); }
  .opspanel{ margin:0 12px 10px; border:1px dashed var(--line); border-radius:10px; padding:8px 10px; font-size:12.5px; }
  .opspanel label{ display:flex; gap:6px; align-items:center; padding:3px 0; cursor:pointer; }
  .drophint{ color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<style>html.emb>body>.hi{display:none}</style><script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('emb');</script>
<div class="hi">📅 Табель и смены</div>
<div id="app"><div class="center muted">Загрузка…</div></div>
<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod';
function api(p){ p.app=APP; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function $(id){ return document.getElementById(id); }
function money(n){ n=Number(n)||0; return n.toFixed(2).replace('.',','); }
function h1(n){ n=Number(n)||0; return n.toFixed(1).replace('.',','); }   // часы с одним знаком
function pad2(v){ v=String(v); return v.length<2?('0'+v):v; }             // вместо padStart (нет в старых Android)
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }
function isoToday(d){ d=d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function ruDate(iso){ var p=String(iso||'').split('-'); return p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):iso; }
function dayName(iso){ try{ return ['вс','пн','вт','ср','чт','пт','сб'][new Date(iso+'T12:00:00').getDay()]; }catch(e){ return ''; } }

var app=$('app'), TAB='t', DATE=isoToday(), D=null, BATCHES=[], OID='', PLANDATE=(function(){var t=new Date(); t.setDate(t.getDate()+1); return isoToday(t);})();

function shell(){
  app.innerHTML='<div class="tabs">'
    +'<button id="tb-t" onclick="showTab(\'t\')">📅 Табель</button>'
    +'<button id="tb-c" onclick="showTab(\'c\')">👷 Бойцы</button>'
    +'<button id="tb-p" onclick="showTab(\'p\')">🎯 По участкам</button>'
    +'<button id="tb-m" onclick="showTab(\'m\')">🗓 Месяц</button>'
    +'<button id="tb-z" onclick="showTab(\'z\')">💰 Заработок</button></div>'
    +'<div id="pane"></div>';
  showTab(TAB);
}
function showTab(t){ TAB=t; ['t','c','p','m','z'].forEach(function(x){ var b=$('tb-'+x); if(b) b.className=(x===t?'active':''); });
  if(t==='t') loadDay(); else if(t==='c') loadCrew(); else if(t==='p') loadPlan(); else if(t==='z') loadPay(); else loadMonth(); }

/* ── ТАБЕЛЬ НА ДАТУ ──
   Отклик мгновенный: кнопка меняется СРАЗУ (оптимистично), запись уходит в фоне;
   при ошибке — предупреждение и перезагрузка с сервера. Даты кэшируются (навигация без ожидания). */
var DAYCACHE={}, SAVING=0;
function shiftDate(dd){ var d=new Date(DATE+'T12:00:00'); d.setDate(d.getDate()+dd); DATE=isoToday(d); loadDay(); }
function loadDay(force){
  var c=DAYCACHE[DATE], silent=(force==='silent');
  if(c&&!force){ D=c; renderDayView(); }              // из кэша — мгновенно; свежее подтянется следом
  else if(!silent) $('pane').innerHTML='<div class="center muted">Загрузка…</div>';
  api({vapi:'tabelday',date:DATE,tgid:TGID}).then(function(r){
    if(!r||!r.ok){ if(!c&&TAB==='t') $('pane').innerHTML='<div class="box err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    if(SAVING>0) return;                               // идёт фоновая запись — не затирать оптимистичное состояние
    DAYCACHE[r.date]=r;                                // данные в кэш в любом случае
    if(TAB!=='t'||r.date!==DATE) return;               // пользователь уже на другой вкладке/дате — экран не трогаем
    D=r; renderDayView();
  });
}
function recalcSum(){
  var s={day:0,night:0,out:0,no:0};
  D.workers.forEach(function(w){ if(w.shift==='день')s.day++; if(w.shift==='ночь')s.night++;
    if(w.status==='вышел')s.out++; if(w.status==='не вышел')s.no++; });
  D.summary=s;
}
function renderDayView(){
  var r=D, isPast=DATE<=isoToday();
  var head='<div class="box"><div class="row">'
    +'<button class="gho" onclick="shiftDate(-1)">←</button>'
    +'<input type="date" value="'+DATE+'" onchange="DATE=this.value;loadDay();">'
    +'<button class="gho" onclick="shiftDate(1)">→</button>'
    +'<b>'+ruDate(DATE)+' ('+dayName(DATE)+')</b>'
    +'<span class="pill" style="background:#fff3d6;color:#8a6d00">☀️ '+r.summary.day+'</span>'
    +'<span class="pill" style="background:#e3e8ff;color:#3446a0">🌙 '+r.summary.night+'</span>'
    +(r.summary.out?'<span class="pill" style="background:#e6f4ea;color:#137333">вышло '+r.summary.out+'</span>':'')
    +(r.summary.no?'<span class="pill" style="background:#fdecea;color:#c0392b">не вышло '+r.summary.no+'</span>':'')
    +'<span class="muted" id="sv" style="font-size:12px"></span>'
    +'</div><div class="muted" style="margin-top:4px">Нажмите ☀️/🌙 чтобы отметить смену; ещё раз — снять. '+(isPast?'Отметьте факт: ✓ вышел / ✗ не вышел.':'')+'</div></div>';
  var gopts=function(cur){ return '<option value="">— участок —</option>'+D.groups.map(function(g){ return '<option'+(g===cur?' selected':'')+'>'+esc(g)+'</option>'; }).join(''); };
  var rows=r.workers.map(function(w,i){
    var fact = (w.shift && isPast)
      ? ' <button class="fbtn'+(w.status==='вышел'?' on-out':'')+'" onclick="setFact('+i+',\'вышел\')">✓ вышел</button>'
        +'<button class="fbtn'+(w.status==='не вышел'?' on-no':'')+'" onclick="setFact('+i+',\'не вышел\')">✗ не вышел</button>'
      : '';
    var assign = w.shift
      ? ' <select class="gsel" onchange="setAssign('+i+',this.value,null)">'+gopts(w.group)+'</select>'
        +'<input class="opsin" placeholder="операции (не обяз.)" value="'+esc(w.ops)+'" onchange="setAssign('+i+',null,this.value)">'
      : '';
    return '<div class="wrow"><span class="wname">'+esc(w.name)+(w.role!=='рабочий'?' <span class="muted" style="font-size:11px">'+esc(w.role)+'</span>':'')+'</span>'
      +'<button class="sbtn'+(w.shift==='день'?' on-day':'')+'" onclick="setShift('+i+',\'день\')">☀️ день</button>'
      +'<button class="sbtn'+(w.shift==='ночь'?' on-night':'')+'" onclick="setShift('+i+',\'ночь\')">🌙 ночь</button>'
      +(w.shift?'<button class="gho" style="color:var(--red);font-weight:700" onclick="clearShift('+i+')" title="снять смену">✕ снять</button>':'')
      +fact+assign+'</div>';
  }).join('');
  $('pane').innerHTML=head+'<div class="box">'+ (rows||'<div class="muted">нет активных сотрудников</div>') +'</div>';
}
function svShow(){ var e=$('sv'); if(e) e.textContent='💾 сохраняю…'; }
function svDone(){ var e=$('sv'); if(e) e.textContent=''; }
var CONVERGE=null, SAVEQ=Promise.resolve();
function bgSave(p){
  PLANCACHE={};                                        // состав смены изменился → план дня пересчитается
  SAVING++; svShow();
  // записи уходят СТРОГО ПО ОЧЕРЕДИ кликов (иначе параллельные запросы могут обогнать друг друга)
  SAVEQ=SAVEQ.then(function(){ return api(p); }).then(function(r){
    SAVING--; if(SAVING<=0){ SAVING=0; svDone(); scheduleConverge(); }
    if(!r||!r.ok){ alert((r&&r.error)||'не сохранилось — обновляю'); loadDay(true); }
  }).catch(function(){ SAVING--; if(SAVING<0)SAVING=0; alert('Нет связи — обновляю'); loadDay(true); });
}
// после того как все записи ушли — один тихий сверочный запрос (экран сходится с сервером)
function scheduleConverge(){
  if(CONVERGE) clearTimeout(CONVERGE);
  CONVERGE=setTimeout(function(){ CONVERGE=null; if(SAVING===0&&TAB==='t') loadDay('silent'); },1200);
}
function setShift(i,sh){
  var w=D.workers[i]; var next=(w.shift===sh)?'':sh;   // повторный клик — снять смену
  w.shift=next; if(!next){ w.status=''; w.group=''; w.ops=''; } else if(!w.status||w.status==='') w.status='план';
  recalcSum(); renderDayView();                         // мгновенно на экране
  bgSave({vapi:'tabelset',date:DATE,worker:w.name,shift:next,tgid:TGID});
}
// явное снятие смены (кнопка ✕ — то же, что повторный клик по активной смене)
function clearShift(i){
  var w=D.workers[i];
  w.shift=''; w.status=''; w.group=''; w.ops='';
  recalcSum(); renderDayView();
  bgSave({vapi:'tabelset',date:DATE,worker:w.name,shift:'',tgid:TGID});
}
function setFact(i,st){

// «сколько успеет»: остаток смены × норма, но не больше доступного.
// Если времени в смене не осталось — возвращаем 0 (фронт спросит кол-во вручную, а не заполнит перегрузом).
function autoQty(p,c){
  var free=Math.max(0,p.shiftHours-p.planHours);
  var cap=Math.max(0,Math.min(c.availQty!=null?c.availQty:c.leftQty,c.leftQty));
  if(cap<=0) cap=Math.max(0,c.leftQty||0);           // фронта нет — предложим остаток работы (мастер решит)
  if(c.norm>0){
    if(free<=0.01) return 0;                          // смена уже заполнена
    var byTime=Math.floor(free*c.norm);
    if(byTime<=0) return 0;
    return Math.max(1,Math.min(byTime,Math.round(cap)));
  }
  return Math.max(1,Math.round(cap));                 // нормы нет — часы посчитать нечем, ставим доступное
}

  var opts=BATCHES.map(function(b){ return '<option value="'+esc(b.id)+'"'+(b.id===OID?' selected':'')+'>'+esc(b.num)+' · '+esc(b.name||'')+'</option>'; }).join('');
  var head='<div class="box"><div class="row">'
    +'<input type="date" value="'+PLANDATE+'" onchange="PLANDATE=this.value;PICK=\'\';loadCrew();"><b>'+ruDate(PLANDATE)+' ('+dayName(PLANDATE)+')</b>'
    +'<span class="muted">заказ:</span><select onchange="OID=this.value;PICK=\'\';loadCrew();">'+opts+'</select></div></div>';
  var kpi='<div class="box kpi">'
    +'<span><span class="k">Бойцов</span><b>'+r.people.length+'</b></span>'
    +'<span><span class="k">Загрузка</span><b>'+h1(r.totalHours)+' / '+h1(r.capHours)+' ч</b></span>'
    +'<span><span class="k">План выработки</span><b style="color:#137333">'+money(r.totalRub)+' ₽</b></span>'
    +'</div>';
  var cards=r.people.map(function(p,i){
    var pct=p.shiftHours>0?Math.min(100,Math.round(p.planHours/p.shiftHours*100)):0;
    var over=p.planHours>p.shiftHours+0.01;
    var cls=p.empty?'empty':(p.planRub>=r.minRub&&p.freeHours<=0.5?'full':(p.planRub>0?'low':'empty'));
    var tasks=p.tasks.map(function(t,ti){
      var w=t.over?'<span class="tw">⚠ есть только '+Math.round(t.availQty)+'</span>':'';
      return '<div class="task"><span class="tg">'+esc(t.group||'—')+'</span>'
        +'<span class="tn">'+esc(t.op)+(t.detail?' <span class="muted">› '+esc(t.detail)+'</span>':'')+'</span>'
        +'<span class="tq">'+Math.round(t.qty)+' шт</span>'
        +'<span class="muted">'+h1(t.hours)+' ч · '+money(t.rub)+' ₽</span>'+w
        +'<button class="gho" onclick="editQty('+i+','+ti+')" title="изменить количество">✏️</button>'
        +'<button class="gho" onclick="delTask('+i+','+ti+')" title="убрать работу">🗑</button></div>';
    }).join('');
    var warns=p.warns.length?('<div class="cwarn">'+p.warns.map(function(w){ return '<div>⚠ '+esc(w)+'</div>'; }).join('')+'</div>'):'';
    var picker=(PICK===p.name)?pickerHtml(p,i):'';
    return '<div class="crew '+cls+'">'
      +'<div class="ch"><span>'+(p.shift==='ночь'?'🌙':'☀️')+'</span><span class="nm">'+esc(p.name)+'</span>'
        +(p.topGroup?'<span class="stat">⭐ '+esc(p.topGroup)+'</span>':'')
        +'<span class="stat">⚡ обычно '+Math.round(p.expect)+' ₽/д</span>'
        +'<span style="flex:1"></span>'
        +'<button class="sec" style="padding:4px 10px;font-size:12px" onclick="togglePick(\''+esc(p.name)+'\')">'+(PICK===p.name?'закрыть':'+ работа')+'</button></div>'
      +'<div class="load"><i class="'+(over?'ov':'')+'" style="width:'+pct+'%"></i></div>'
      +'<div class="lnums"><b>'+h1(p.planHours)+'</b> из '+p.shiftHours+' ч · <b>'+money(p.planRub)+' ₽</b>'
        +(p.freeHours>0.05?(' · резерв '+h1(p.freeHours)+' ч'):(over?' · <span style="color:var(--red)">перегруз</span>':' · смена заполнена'))+'</div>'
      +'<div class="tasks">'+(tasks||'<div class="muted" style="padding:6px 0">работ не назначено — нажмите «+ работа»</div>')+'</div>'
      +warns+picker+'</div>';
  }).join('');
  var empty=r.people.length?'':'<div class="box muted">На эту дату никто не отмечен в табеле — начните с вкладки «Табель».</div>';
  $('pane').innerHTML=head+kpi+cards+empty;
}
function pickerHtml(p,i){
  var cat=CREW.catalog||[], q=(PICKF||'').toLowerCase();
  var have={}; p.tasks.forEach(function(t){ have[t.op+' › '+t.detail]=1; });
  var list=cat.filter(function(c){ return !have[c.key] && (!q || c.key.toLowerCase().indexOf(q)>=0 || c.group.toLowerCase().indexOf(q)>=0); });
  // сначала работы «родного» участка бойца
  list.sort(function(a,b){ var ap=(a.group===p.topGroup)?0:1, bp=(b.group===p.topGroup)?0:1; return ap-bp || b.availQty-a.availQty; });
  var rows=list.slice(0,40).map(function(c){
    var no=(c.availQty<=0);
    return '<div class="pk'+(no?' no':'')+'" onclick="addTask('+i+',\''+esc(c.key).replace(/'/g,"\\'")+'\')">'
      +'<span class="tg">'+esc(c.group)+'</span>'
      +'<span class="pn">'+esc(c.op)+' <span class="muted">› '+esc(c.detail)+'</span></span>'
      +'<span class="pa">'+(no?'ждёт предыдущих':('можно '+Math.round(c.availQty)+' шт'))+'</span></div>';
  }).join('');
  return '<div class="picker" onclick="event.stopPropagation()">'
    +'<input placeholder="поиск работы…" value="'+esc(PICKF)+'" oninput="PICKF=this.value;renderCrew()" style="width:100%;margin-bottom:6px">'
    +(rows||'<div class="muted">ничего не найдено</div>')+'</div>';
}
function togglePick(name){ PICK=(PICK===name)?'':name; PICKF=''; renderCrew(); }
function addTask(i,key){
  var p=CREW.people[i], c=(CREW.catalog||[]).filter(function(x){ return x.key===key; })[0];
  if(!c) return;
  var q=autoQty(p,c);
  if(q<=0){   // смена уже заполнена — не создаём перегруз молча, спрашиваем
    var v=prompt('Смена уже заполнена ('+h1(p.planHours)+' из '+p.shiftHours+' ч).\n'
      +'Сколько поставить «'+c.op+(c.detail?' › '+c.detail:'')+'»?'+(c.availQty!=null?('\nДоступно сейчас: '+Math.round(c.availQty)+' шт'):'')
      +'\n\nПустое поле — не добавлять.', '');
    if(v===null||String(v).trim()==='') { PICK=''; renderCrew(); return; }
    q=Number(String(v).replace(',','.'))||0;
    if(q<=0){ PICK=''; renderCrew(); return; }
  }
  p.tasks.push({ op:c.op, detail:c.detail, qty:q, group:c.group, rate:c.rate, norm:c.norm,
                 availQty:c.availQty, leftQty:c.leftQty, rub:Math.round(q*c.rate*100)/100,
                 hours:c.norm>0?Math.round(q/c.norm*100)/100:0, over:q>c.availQty });
  recalcCrew(p); PICK=''; renderCrew(); saveTasks(p);
}
function editQty(i,ti){
  var p=CREW.people[i], t=p.tasks[ti];
  var v=prompt('Количество для «'+t.op+(t.detail?' › '+t.detail:'')+'»'+(t.availQty!=null?('\nДоступно сейчас: '+Math.round(t.availQty)+' шт'):''), Math.round(t.qty));
  if(v===null) return; var q=Number(String(v).replace(',','.'))||0;
  if(q<=0){ delTask(i,ti); return; }
  t.qty=q; t.rub=Math.round(q*(t.rate||0)*100)/100; t.hours=(t.norm>0)?Math.round(q/t.norm*100)/100:0; t.over=(t.availQty!=null&&q>t.availQty);
  recalcCrew(p); renderCrew(); saveTasks(p);
}
function delTask(i,ti){ var p=CREW.people[i]; p.tasks.splice(ti,1); recalcCrew(p); renderCrew(); saveTasks(p); }
function recalcCrew(p){
  var rub=0,h=0; p.tasks.forEach(function(t){ rub+=t.rub||0; h+=t.hours||0; });
  p.planRub=Math.round(rub*100)/100; p.planHours=Math.round(h*100)/100;
  p.freeHours=Math.round((p.shiftHours-p.planHours)*100)/100; p.empty=!p.tasks.length;
  p.warns=[];
  if(p.planHours>p.shiftHours+0.01) p.warns.push('перегруз: работ на '+h1(p.planHours)+' ч при смене '+p.shiftHours+' ч — уменьшите количество или снимите работу');
  p.tasks.forEach(function(t){ if(t.over) p.warns.push('«'+t.op+(t.detail?' › '+t.detail:'')+'»: столько работы нет — доступно '+Math.round(t.availQty)+' шт'); });
  if(p.planRub>0&&p.planRub<CREW.minRub) p.warns.push('план ниже минимума '+CREW.minRub+' ₽ — догрузите работой');
  if(p.freeHours>0.5&&p.tasks.length) p.warns.push('резерв '+h1(p.freeHours)+' ч (~'+Math.round(p.freeHours*CREW.hourRate)+' ₽) — можно догрузить');
  var tr=0,th=0; CREW.people.forEach(function(x){ tr+=x.planRub||0; th+=x.planHours||0; });
  CREW.totalRub=Math.round(tr*100)/100; CREW.totalHours=Math.round(th*100)/100;
}
function saveTasks(p){
  CREWCACHE={}; PLANCACHE={};
  var payload=p.tasks.map(function(t){ return {op:t.op,detail:t.detail,qty:t.qty}; });
  SAVING++;
  SAVEQ=SAVEQ.then(function(){ return api({vapi:'crewtasks',date:PLANDATE,worker:p.name,tasks:JSON.stringify(payload),tgid:TGID}); }).then(function(r){
    SAVING--; if(SAVING<0) SAVING=0;
    if(!r||!r.ok){ alert((r&&r.error)||'не сохранилось — обновляю'); loadCrew(); }
  }).catch(function(){ SAVING--; if(SAVING<0)SAVING=0; alert('Нет связи — обновляю'); loadCrew(); });
}

/* ── ЗАРАБОТОК: ведомость «рабочий × день месяца» ── */
var ZYM=isoToday().slice(0,7), PAY=null;
function shiftZ(d){ var p=ZYM.split('-'); var dt=new Date(Number(p[0]),Number(p[1])-1+d,1); ZYM=dt.getFullYear()+'-'+pad2(dt.getMonth()+1); loadPay(); }
function loadPay(){
  $('pane').innerHTML='<div class="center muted">Считаю заработок…</div>';
  var ym0=ZYM;
  api({vapi:'payrolldaily',ym:ZYM,tgid:TGID}).then(function(r){
    if(TAB!=='z'||ym0!==ZYM) return;
    if(!r||!r.ok){ $('pane').innerHTML='<div class="box err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    PAY=r; renderPay();
  }).catch(function(e){ if(TAB==='z') $('pane').innerHTML='<div class="box err">Ошибка: '+esc(e.message||e)+'</div>'; });
}
var ZONLY=true;   // показывать только дни с выработкой (обзорнее), иначе весь месяц
function togZOnly(){ ZONLY=!ZONLY; renderPay(); }
function renderPay(){
  var r=PAY, dim=r.daysInMonth, ym=r.ym.split('-');
  var MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var mLabel=MN[Number(ym[1])-1]+' '+ym[0];
  var todayD=(r.today.slice(0,7)===r.ym)?Number(r.today.slice(8)):0;
  // какие дни показываем
  var allDays=[], useDays=[];
  for(var d=1;d<=dim;d++){ allDays.push(d); if(r.dayTotals[d]) useDays.push(d); }
  var cols=(ZONLY&&useDays.length)?useDays:allDays;
  var hidden=allDays.length-cols.length;
  var wkd=function(d){ var g=new Date(Number(ym[0]),Number(ym[1])-1,d).getDay(); return g===0||g===6; };
  var dow=['вс','пн','вт','ср','чт','пт','сб'];
  var rub=function(v){ return v?String(Math.round(v)):''; };   // в клетках — целые рубли (сетка читается)
  // сводка сверху
  var avgPer=r.workers.length?Math.round(r.grand/r.workers.length):0;
  var bestD=0,bestV=0; cols.forEach(function(d){ if((r.dayTotals[d]||0)>bestV){ bestV=r.dayTotals[d]; bestD=d; } });
  var head='<div class="box"><div class="row">'
    +'<button class="gho" onclick="shiftZ(-1)" title="предыдущий месяц">←</button>'
    +'<b style="font-size:16px;min-width:130px;text-align:center">'+esc(mLabel)+'</b>'
    +'<button class="gho" onclick="shiftZ(1)" title="следующий месяц">→</button>'
    +'<span style="flex:1"></span>'
    +'<button class="sec" style="padding:5px 11px;font-size:12px" onclick="togZOnly()">'+(ZONLY?'📅 показать весь месяц':'⚡ только дни с работой')+'</button>'
    +'</div>'
    +'<div class="kpi" style="margin-top:10px">'
      +'<span><span class="k">Зарплата за месяц (подтверждено)</span><b style="color:#137333">'+money(r.grand)+' ₽</b></span>'
      +'<span><span class="k">Рабочих</span><b>'+r.workers.length+'</b></span>'
      +'<span><span class="k">В среднем на человека</span><b>'+money(avgPer)+' ₽</b></span>'
      +(bestD?'<span><span class="k">Лучший день</span><b>'+bestD+'.'+ym[1]+' — '+money(bestV)+' ₽</b></span>':'')
      +(r.freeTotal>0?'<span><span class="k">Из них вне заказа</span><b style="color:#2b5fd9">'+money(r.freeTotal)+' ₽</b></span>':'')
      +(r.pendingTotal>0?'<span><span class="k">Ждёт подтверждения</span><b style="color:#8a6d00">'+money(r.pendingTotal)+' ₽</b></span>':'')
    +'</div></div>';
  if(!r.workers.length){ $('pane').innerHTML=head+'<div class="box muted">За этот месяц подтверждённой выработки нет.</div>'; return; }
  var shortName=function(n){ var p=String(n).trim().split(/\s+/); return p.length>1?(p[0]+' '+p[1].charAt(0)+'.'):p[0]; };
  // colgroup — ровные колонки одинаковой ширины
  var cg='<colgroup><col class="c-nm"><col class="c-tot"><col class="c-sm">'
    +cols.map(function(){ return '<col class="c-d">'; }).join('')+'</colgroup>';
  var th='<thead><tr><th class="nmc">Рабочий</th><th class="totc">Итого ₽</th><th class="c-sm">дн</th>'
    +cols.map(function(d){ return '<th class="'+(d===todayD?'tdy':(wkd(d)?'wknd':''))+'" title="'+d+' '+esc(mLabel)+', '+dow[new Date(Number(ym[0]),Number(ym[1])-1,d).getDay()]+'">'+d+'</th>'; }).join('')
    +'</tr></thead>';
  var body='<tbody>'+r.workers.map(function(w){
    var tds=cols.map(function(d){
      var v=w.byDay[d], cls=(d===todayD?'tdy':(wkd(d)?'wknd':''));
      return '<td class="'+cls+(v?'':' zero')+'"'+(v?(' title="'+esc(w.name)+', '+d+' '+esc(mLabel)+': '+money(v)+' ₽"'):'')+'>'
        +(v?(rub(v)+(w.night[d]?'<span class="nn">🌙</span>':'')):'·')+'</td>';
    }).join('');
    return '<tr><td class="nmc" title="'+esc(w.name)+'">'+esc(shortName(w.name))
        +(w.pending>0?'<span class="pnd" title="на проверке у мастера">+'+money(w.pending)+'</span>':'')
        +'<span class="sub">ср '+money(w.avgDay)+' ₽/день'+(w.freeRub>0?(' · 🧰 вне заказа '+money(w.freeRub)):'')+'</span></td>'
      +'<td class="totc">'+money(w.total)+'</td><td>'+w.days+'</td>'+tds+'</tr>';
  }).join('')+'</tbody>';
  var ft='<tfoot><tr><td class="nmc">ВСЕГО</td><td class="totc">'+money(r.grand)+'</td><td>'+r.workers.length+' чел</td>'
    +cols.map(function(d){ var t=r.dayTotals[d];
      return '<td class="'+(d===todayD?'tdy':(wkd(d)?'wknd':''))+(t?'':' zero')+'">'+(t?rub(t):'·')+'</td>'; }).join('')
    +'</tr></tfoot>';
  var note='<div class="muted" style="margin:8px 2px 0;font-size:12px">В клетках — заработок за день, целыми рублями (точная сумма — при наведении). '
    +'🌙 — была ночная смена. Колонка «Итого ₽» и строка «ВСЕГО» — с копейками.'
    +(hidden>0&&ZONLY?(' Скрыто дней без выработки: '+hidden+'.'):'')+'</div>';
  $('pane').innerHTML=head+'<div class="paywrap" id="paywrap"><table class="pay">'+cg+th+body+ft+'</table></div>'+note;
  setTimeout(function(){   // прокрутить к сегодняшнему дню; если его нет — к последним дням с работой
    var wrap=$('paywrap'); if(!wrap) return;
    var cell=wrap.querySelector('thead th.tdy');
    wrap.scrollLeft = cell ? Math.max(0,cell.offsetLeft-wrap.clientWidth+140) : wrap.scrollWidth;
  },80);
}

/* ── МЕСЯЦ ── */
var YM=isoToday().slice(0,7);
function shiftMonth(d){ var p=YM.split('-'); var dt=new Date(Number(p[0]),Number(p[1])-1+d,1); YM=dt.getFullYear()+'-'+pad2(dt.getMonth()+1); loadMonth(); }
function loadMonth(){
  $('pane').innerHTML='<div class="center muted">Загрузка…</div>';
  var ym0=YM;
  api({vapi:'tabelmonth',ym:YM,tgid:TGID}).then(function(r){
    if(TAB!=='m'||ym0!==YM) return;                    // пользователь уже на другой вкладке/месяце — экран не трогаем
    if(!r||!r.ok){ $('pane').innerHTML='<div class="box err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    var p=YM.split('-'), days=new Date(Number(p[0]),Number(p[1]),0).getDate();
    var map={}; r.entries.forEach(function(e){ map[e.worker+'|'+Number(e.date.slice(8))]=e; });
    var wk=r.workers.filter(function(w){ return r.entries.some(function(e){return e.worker===w;}) || true; });
    var thead='<tr><th></th>'; for(var d=1;d<=days;d++) thead+='<th>'+d+'</th>'; thead+='</tr>';
    var body=r.workers.map(function(w){
      var tds=''; var cnt=0;
      for(var d=1;d<=days;d++){ var e=map[w+'|'+d];
        if(!e||!e.shift){ tds+='<td></td>'; continue; }
        cnt++;
        var cls=(e.shift==='ночь'?'cell-n':'cell-d')+(e.status==='вышел'?' cell-out':(e.status==='не вышел'?' cell-no':''));
        tds+='<td class="'+cls+'" title="'+esc(w)+' '+d+'.'+p[1]+' '+esc(e.shift)+(e.status&&e.status!=='план'?' · '+esc(e.status):'')+'">'+(e.shift==='ночь'?'н':'д')+'</td>';
      }
      return '<tr><td class="nm">'+esc(w)+' <span class="muted">('+cnt+')</span></td>'+tds+'</tr>';
    }).join('');
    $('pane').innerHTML='<div class="box"><div class="row"><button class="gho" onclick="shiftMonth(-1)">←</button><b>'+YM+'</b><button class="gho" onclick="shiftMonth(1)">→</button>'
      +'<span class="muted">д=день, н=ночь; зелёная рамка — вышел, красная — не вышел</span></div></div>'
      +'<div class="box mgrid" style="overflow-x:auto"><table>'+thead+body+'</table></div>';
  });
}
shell();

// авто-обновление: оболочка шлёт «refresh» при возврате на раздел — перечитываем данные без перезагрузки страницы
(function(){
  try{ var m=/[?&]twsec=([^&]+)/.exec(location.search); window.top.postMessage({tw:'hello',sec:m?decodeURIComponent(m[1]):''},'*'); }catch(e){}
  window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='refresh'){ try{ DAYCACHE={};PLANCACHE={};CREWCACHE={};if(TAB==="z")loadPay();else if(TAB==="t")loadDay(true);else if(TAB==="c")loadCrew();else if(TAB==="p")loadPlan();else loadMonth(); }catch(err){} } });
})();
</script>
