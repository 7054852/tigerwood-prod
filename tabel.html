<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигервуд — табель и смены</title>
<style>
  :root{ --bg:#f4f6fb; --card:#fff; --fg:#1b2333; --muted:#8a93a6; --line:#e6e9f2; --accent:#2b7de9; --green:#137333; --amber:#b7791f; --red:#c0392b; }
  *{box-sizing:border-box;} html,body{margin:0;background:var(--bg);}
  body{ font-family:-apple-system,Roboto,Segoe UI,Arial,sans-serif; color:var(--fg); padding:14px; max-width:960px; margin:0 auto; font-size:14px; }
  .hi{ font-size:19px; font-weight:800; margin-bottom:10px; }
  .muted{ color:var(--muted); font-size:13px; }
  .center{ text-align:center; padding:24px; } .err{ color:var(--red); } .ok{ color:var(--green); }
  .box{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; overflow-x:auto; }
  .row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  select,input{ font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  button{ font:inherit; font-weight:600; border:0; border-radius:9px; padding:7px 12px; cursor:pointer; background:var(--accent); color:#fff; }
  button.sec{ background:#eef2fb; color:var(--accent); } button.gho{ background:transparent; color:var(--muted); padding:4px 7px; }
  .tabs{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .tabs button{ background:#eef2fb; color:var(--accent); } .tabs button.active{ background:var(--accent); color:#fff; }
  .pill{ font-size:11.5px; font-weight:700; border-radius:20px; padding:2px 9px; display:inline-block; }
  .num{ font-variant-numeric:tabular-nums; }
  table{ border-collapse:collapse; width:100%; font-size:13px; }
  th,td{ padding:5px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  th.num,td.num{ text-align:right; }
  /* строка сотрудника в табеле */
  .wrow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding:7px 0; }
  .wname{ font-weight:700; flex:1; min-width:150px; }
  .sbtn{ border-radius:20px; padding:4px 11px; font-size:12.5px; background:#eef1f8; color:#556; }
  .sbtn.on-day{ background:#fff3d6; color:#8a6d00; } .sbtn.on-night{ background:#e3e8ff; color:#3446a0; }
  .fbtn{ border-radius:20px; padding:4px 10px; font-size:12px; background:#eef1f8; color:#556; }
  .fbtn.on-out{ background:#e6f4ea; color:var(--green); } .fbtn.on-no{ background:#fdecea; color:var(--red); }
  .gsel{ font-size:12.5px; padding:4px 6px; max-width:130px; }
  .opsin{ font-size:12.5px; padding:4px 6px; width:150px; }
  /* месяц */
  .mgrid td,.mgrid th{ padding:3px 4px; font-size:11.5px; text-align:center; white-space:nowrap; }
  .mgrid td.nm{ text-align:left; font-weight:600; white-space:nowrap; }
  .cell-d{ background:#fff3d6; } .cell-n{ background:#e3e8ff; }
  .cell-out{ outline:2px solid #7fc78f; outline-offset:-2px; } .cell-no{ outline:2px solid #e88; outline-offset:-2px; text-decoration:line-through; }
  /* план на день */
  .kpi{ display:flex; gap:18px; flex-wrap:wrap; font-weight:700; }
  .kpi b{ font-size:17px; } .kpi .k{ color:var(--muted); font-weight:600; font-size:12px; display:block; }
  .gbar{ height:6px; background:#eef1f8; border-radius:6px; overflow:hidden; }
  .gbar>i{ display:block; height:100%; background:var(--accent); }
  /* ── доска расстановки ── */
  .bench{ display:flex; flex-wrap:wrap; gap:8px; min-height:44px; align-items:center; }
  .chip{ display:inline-flex; align-items:center; gap:7px; background:var(--card); border:1.5px solid var(--line); border-radius:22px;
         padding:6px 12px; cursor:grab; user-select:none; font-size:13px;
         transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .chip b{ font-weight:700; white-space:nowrap; }
  .chip .st{ color:var(--muted); font-size:11.5px; white-space:nowrap; }
  .chip .exp{ font-weight:800; color:#2f7a34; cursor:pointer; white-space:nowrap; }
  .chip .exp.own{ color:#b7791f; }
  .chip.sel{ transform:translateY(-3px) scale(1.04); box-shadow:0 6px 18px rgba(43,125,233,.28); border-color:var(--accent); }
  .chip.drag{ opacity:.45; }
  .chip .x{ color:var(--muted); cursor:pointer; font-weight:800; padding:0 2px; } .chip .x:hover{ color:var(--red); }
  .chip .opsb{ font-size:11px; color:var(--accent); cursor:pointer; white-space:nowrap; }
  .zone{ border:2px solid var(--line); border-radius:14px; background:var(--card); margin-bottom:12px; overflow:hidden;
         transition:border-color .15s ease, box-shadow .15s ease; }
  .zone.target{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(43,125,233,.16); cursor:pointer; }
  .zone.bn{ border-color:var(--red); animation:zpulse 1.8s infinite; }
  @keyframes zpulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(192,57,43,.28);} 50%{ box-shadow:0 0 0 7px rgba(192,57,43,.05);} }
  .zh{ display:flex; align-items:center; gap:8px; padding:9px 12px 6px; font-weight:800; flex-wrap:wrap; }
  .zh .zn{ font-size:15px; }
  .zbar{ height:14px; background:#eef1f8; border-radius:8px; overflow:hidden; display:flex; margin:2px 12px 0; }
  .zbar .ghost{ background:repeating-linear-gradient(45deg,#5f9be6,#5f9be6 6px,#9cc4f2 6px,#9cc4f2 12px); transition:width .35s ease; height:100%; }
  .zbody{ padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; min-height:42px; align-items:center; }
  .zfoot{ padding:0 12px 10px; font-size:12.5px; color:var(--muted); }
  .zfoot b{ color:var(--fg); }
  .opspanel{ margin:0 12px 10px; border:1px dashed var(--line); border-radius:10px; padding:8px 10px; font-size:12.5px; }
  .opspanel label{ display:flex; gap:6px; align-items:center; padding:3px 0; cursor:pointer; }
  .drophint{ color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<style>html.emb>body>.hi{display:none}</style><script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('emb');</script>
<div class="hi">📅 Табель и смены</div>
<div id="app"><div class="center muted">Загрузка…</div></div>
<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod';
function api(p){ p.app=APP; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function $(id){ return document.getElementById(id); }
function money(n){ n=Number(n)||0; return n.toFixed(2).replace('.',','); }
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }
function isoToday(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function ruDate(iso){ var p=String(iso||'').split('-'); return p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):iso; }
function dayName(iso){ try{ return ['вс','пн','вт','ср','чт','пт','сб'][new Date(iso+'T12:00:00').getDay()]; }catch(e){ return ''; } }

var app=$('app'), TAB='t', DATE=isoToday(), D=null, BATCHES=[], OID='', PLANDATE=(function(){var t=new Date(); t.setDate(t.getDate()+1); return isoToday(t);})();

function shell(){
  app.innerHTML='<div class="tabs">'
    +'<button id="tb-t" onclick="showTab(\'t\')">📅 Табель</button>'
    +'<button id="tb-p" onclick="showTab(\'p\')">🎯 План на день</button>'
    +'<button id="tb-m" onclick="showTab(\'m\')">🗓 Месяц</button></div>'
    +'<div id="pane"></div>';
  showTab(TAB);
}
function showTab(t){ TAB=t; ['t','p','m'].forEach(function(x){ var b=$('tb-'+x); if(b) b.className=(x===t?'active':''); });
  if(t==='t') loadDay(); else if(t==='p') loadPlan(); else loadMonth(); }

/* ── ТАБЕЛЬ НА ДАТУ ──
   Отклик мгновенный: кнопка меняется СРАЗУ (оптимистично), запись уходит в фоне;
   при ошибке — предупреждение и перезагрузка с сервера. Даты кэшируются (навигация без ожидания). */
var DAYCACHE={}, SAVING=0;
function shiftDate(dd){ var d=new Date(DATE+'T12:00:00'); d.setDate(d.getDate()+dd); DATE=isoToday(d); loadDay(); }
function loadDay(force){
  var c=DAYCACHE[DATE], silent=(force==='silent');
  if(c&&!force){ D=c; renderDayView(); }              // из кэша — мгновенно; свежее подтянется следом
  else if(!silent) $('pane').innerHTML='<div class="center muted">Загрузка…</div>';
  api({vapi:'tabelday',date:DATE,tgid:TGID}).then(function(r){
    if(!r||!r.ok){ if(!c&&TAB==='t') $('pane').innerHTML='<div class="box err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    if(SAVING>0) return;                               // идёт фоновая запись — не затирать оптимистичное состояние
    DAYCACHE[r.date]=r;                                // данные в кэш в любом случае
    if(TAB!=='t'||r.date!==DATE) return;               // пользователь уже на другой вкладке/дате — экран не трогаем
    D=r; renderDayView();
  });
}
function recalcSum(){
  var s={day:0,night:0,out:0,no:0};
  D.workers.forEach(function(w){ if(w.shift==='день')s.day++; if(w.shift==='ночь')s.night++;
    if(w.status==='вышел')s.out++; if(w.status==='не вышел')s.no++; });
  D.summary=s;
}
function renderDayView(){
  var r=D, isPast=DATE<=isoToday();
  var head='<div class="box"><div class="row">'
    +'<button class="gho" onclick="shiftDate(-1)">←</button>'
    +'<input type="date" value="'+DATE+'" onchange="DATE=this.value;loadDay();">'
    +'<button class="gho" onclick="shiftDate(1)">→</button>'
    +'<b>'+ruDate(DATE)+' ('+dayName(DATE)+')</b>'
    +'<span class="pill" style="background:#fff3d6;color:#8a6d00">☀️ '+r.summary.day+'</span>'
    +'<span class="pill" style="background:#e3e8ff;color:#3446a0">🌙 '+r.summary.night+'</span>'
    +(r.summary.out?'<span class="pill" style="background:#e6f4ea;color:#137333">вышло '+r.summary.out+'</span>':'')
    +(r.summary.no?'<span class="pill" style="background:#fdecea;color:#c0392b">не вышло '+r.summary.no+'</span>':'')
    +'<span class="muted" id="sv" style="font-size:12px"></span>'
    +'</div><div class="muted" style="margin-top:4px">Нажмите ☀️/🌙 чтобы отметить смену; ещё раз — снять. '+(isPast?'Отметьте факт: ✓ вышел / ✗ не вышел.':'')+'</div></div>';
  var gopts=function(cur){ return '<option value="">— участок —</option>'+D.groups.map(function(g){ return '<option'+(g===cur?' selected':'')+'>'+esc(g)+'</option>'; }).join(''); };
  var rows=r.workers.map(function(w,i){
    var fact = (w.shift && isPast)
      ? ' <button class="fbtn'+(w.status==='вышел'?' on-out':'')+'" onclick="setFact('+i+',\'вышел\')">✓ вышел</button>'
        +'<button class="fbtn'+(w.status==='не вышел'?' on-no':'')+'" onclick="setFact('+i+',\'не вышел\')">✗ не вышел</button>'
      : '';
    var assign = w.shift
      ? ' <select class="gsel" onchange="setAssign('+i+',this.value,null)">'+gopts(w.group)+'</select>'
        +'<input class="opsin" placeholder="операции (не обяз.)" value="'+esc(w.ops)+'" onchange="setAssign('+i+',null,this.value)">'
      : '';
    return '<div class="wrow"><span class="wname">'+esc(w.name)+(w.role!=='рабочий'?' <span class="muted" style="font-size:11px">'+esc(w.role)+'</span>':'')+'</span>'
      +'<button class="sbtn'+(w.shift==='день'?' on-day':'')+'" onclick="setShift('+i+',\'день\')">☀️ день</button>'
      +'<button class="sbtn'+(w.shift==='ночь'?' on-night':'')+'" onclick="setShift('+i+',\'ночь\')">🌙 ночь</button>'
      +(w.shift?'<button class="gho" style="color:var(--red);font-weight:700" onclick="clearShift('+i+')" title="снять смену">✕ снять</button>':'')
      +fact+assign+'</div>';
  }).join('');
  $('pane').innerHTML=head+'<div class="box">'+ (rows||'<div class="muted">нет активных сотрудников</div>') +'</div>';
}
function svShow(){ var e=$('sv'); if(e) e.textContent='💾 сохраняю…'; }
function svDone(){ var e=$('sv'); if(e) e.textContent=''; }
var CONVERGE=null, SAVEQ=Promise.resolve();
function bgSave(p){
  PLANCACHE={};                                        // состав смены изменился → план дня пересчитается
  SAVING++; svShow();
  // записи уходят СТРОГО ПО ОЧЕРЕДИ кликов (иначе параллельные запросы могут обогнать друг друга)
  SAVEQ=SAVEQ.then(function(){ return api(p); }).then(function(r){
    SAVING--; if(SAVING<=0){ SAVING=0; svDone(); scheduleConverge(); }
    if(!r||!r.ok){ alert((r&&r.error)||'не сохранилось — обновляю'); loadDay(true); }
  }).catch(function(){ SAVING--; if(SAVING<0)SAVING=0; alert('Нет связи — обновляю'); loadDay(true); });
}
// после того как все записи ушли — один тихий сверочный запрос (экран сходится с сервером)
function scheduleConverge(){
  if(CONVERGE) clearTimeout(CONVERGE);
  CONVERGE=setTimeout(function(){ CONVERGE=null; if(SAVING===0&&TAB==='t') loadDay('silent'); },1200);
}
function setShift(i,sh){
  var w=D.workers[i]; var next=(w.shift===sh)?'':sh;   // повторный клик — снять смену
  w.shift=next; if(!next){ w.status=''; w.group=''; w.ops=''; } else if(!w.status||w.status==='') w.status='план';
  recalcSum(); renderDayView();                         // мгновенно на экране
  bgSave({vapi:'tabelset',date:DATE,worker:w.name,shift:next,tgid:TGID});
}
// явное снятие смены (кнопка ✕ — то же, что повторный клик по активной смене)
function clearShift(i){
  var w=D.workers[i];
  w.shift=''; w.status=''; w.group=''; w.ops='';
  recalcSum(); renderDayView();
  bgSave({vapi:'tabelset',date:DATE,worker:w.name,shift:'',tgid:TGID});
}
function setFact(i,st){
  var w=D.workers[i]; var next=(w.status===st)?'план':st;   // повторный клик — сброс к «план»
  w.status=next; recalcSum(); renderDayView();
  bgSave({vapi:'tabelfact',date:DATE,worker:w.name,status:next,tgid:TGID});
}
function setAssign(i,group,ops){
  var w=D.workers[i];
  if(group!=null) w.group=group; if(ops!=null) w.ops=ops;   // локально сразу; без перерисовки — фокус не теряем
  var p={vapi:'tabelassign',date:DATE,worker:w.name,tgid:TGID};
  if(group!=null) p.group=group; if(ops!=null) p.ops=ops;
  bgSave(p);
}

/* ── ПЛАН НА ДЕНЬ ── */
var PLANCACHE={};
function loadPlan(){
  var ck=PLANDATE+'|'+OID, c=PLANCACHE[ck];
  if(c){ renderPlanView(c); }                          // из кэша мгновенно; свежее подтянется
  else $('pane').innerHTML='<div class="center muted">Загрузка…</div>';
  var next=BATCHES.length?Promise.resolve():api({vapi:'batches'}).then(function(r){ BATCHES=((r&&r.batches)||[]).filter(function(b){ return b.status==='новая'||b.status==='в работе'; }); if(!OID&&BATCHES.length) OID=BATCHES[0].id; });
  next.then(function(){ var d=PLANDATE,o=OID; return api({vapi:'dayplan',date:d,batch:o,tgid:TGID}).then(function(r){ if(d!==PLANDATE||o!==OID) return null; return r; }); }).then(function(r){
    if(r===null) return;                               // уже переключили дату/заказ
    if(!r||!r.ok){ if(!c&&TAB==='p') $('pane').innerHTML='<div class="box err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    PLANCACHE[PLANDATE+'|'+OID]=r;                     // в кэш в любом случае
    if(TAB!=='p') return;                              // пользователь уже на другой вкладке — экран не трогаем
    renderPlanView(r);
  });
}
/* ── ДОСКА РАССТАНОВКИ: бойцы-чипы → зоны-участки; сдвиг результата считается мгновенно ── */
var BOARD=null, SELCHIP='', OPSOPEN='';
var ZICON={'Механика':'🛠','Шлифовка':'🪵','Покрытие':'🎨','Сборка':'📦'};
function renderPlanView(r){ BOARD=r; renderBoard(); }
function idxByName(n){ if(!BOARD) return -1; for(var i=0;i<BOARD.people.length;i++) if(BOARD.people[i].name===n) return i; return -1; }
function opsList(p){ return (p.ops||'').split(',').map(function(s){return s.trim();}).filter(Boolean); }
function opsLabel(p){ var l=opsList(p); if(!l.length) return 'операции ▾'; return esc(l[0])+(l.length>1?' +'+(l.length-1):'')+' ▾'; }
function chipHtml(p,inZone){
  var i=BOARD.people.indexOf(p);
  var sel=(SELCHIP===p.name)?' sel':'';
  var star=p.topGroup?'<span class="st">⭐'+esc(p.topGroup)+'</span>':'';
  var exp='<span class="exp'+(p.expectSrc==='своё'?' own':'')+'" onclick="event.stopPropagation();editExpect('+i+')" title="ожидаемая выработка ₽/день ('+esc(p.expectSrc)+'). Нажмите — поменять">⚡'+Math.round(p.expect)+'</span>';
  var opsb=inZone?'<span class="opsb" onclick="event.stopPropagation();toggleOps(\''+esc(p.name)+'\')">'+opsLabel(p)+'</span>':'';
  var x=inZone?'<span class="x" onclick="event.stopPropagation();unassign('+i+')" title="вернуть на скамейку">✕</span>':'';
  return '<span class="chip'+sel+'" draggable="true" ondragstart="dragChip(event,'+i+')" ondragend="this.classList.remove(\'drag\')" onclick="event.stopPropagation();tapChip('+i+')">'
    +(p.shift==='ночь'?'🌙':'☀️')+' <b>'+esc(p.name)+'</b>'+exp+star+opsb+x+'</span>';
}
function opsPanelHtml(p,g){
  var cur=opsList(p), i=BOARD.people.indexOf(p);
  var items=(g.ops||[]).map(function(t){
    var ch=cur.indexOf(t.op)>=0;
    return '<label><input type="checkbox" '+(ch?'checked':'')+' onchange="opToggle('+i+',\''+esc(t.op)+'\',this.checked)"> '+esc(t.op)
      +' <span class="muted">· осталось '+Math.round(t.qty)+' шт · '+money(t.rub)+' ₽</span></label>';
  }).join('');
  return '<div class="opspanel" onclick="event.stopPropagation()"><b>'+esc(p.name)+' — какие операции:</b>'+(items||'<div class="muted">в волне нет операций этого участка</div>')+'</div>';
}
var SHIFTF='';   // фильтр показа: '' = обе смены, 'день' / 'ночь'
function setShiftF(v){ SHIFTF=(SHIFTF===v)?'':v; renderBoard(); }
function isNight(p){ return p.shift==='ночь'; }
function sumExp(list){ var s=0; list.forEach(function(p){ s+=p.expect||0; }); return Math.round(s*100)/100; }
function renderBoard(){
  var r=BOARD;
  var opts=BATCHES.map(function(b){ return '<option value="'+esc(b.id)+'"'+(b.id===OID?' selected':'')+'>'+esc(b.num)+' · '+esc(b.name||'')+'</option>'; }).join('');
  var allD=r.people.filter(function(p){ return !isNight(p); }), allN=r.people.filter(isNight);
  var totD=sumExp(allD), totN=sumExp(allN), total=Math.round((totD+totN)*100)/100;
  var bench=r.people.filter(function(p){ return !p.group; });
  var benchD=bench.filter(function(p){ return !isNight(p); }), benchN=bench.filter(isNight);
  var fbtn=function(v,lbl){ return '<button class="sec" style="padding:4px 10px;font-size:12px'+(SHIFTF===v?';outline:2px solid var(--accent)':'')+'" onclick="setShiftF(\''+v+'\')">'+lbl+'</button>'; };
  var head='<div class="box"><div class="row">'
    +'<input type="date" value="'+PLANDATE+'" onchange="PLANDATE=this.value;SELCHIP=\'\';OPSOPEN=\'\';loadPlan();"><b>'+ruDate(PLANDATE)+' ('+dayName(PLANDATE)+')</b>'
    +'<span class="muted">заказ:</span><select onchange="OID=this.value;SELCHIP=\'\';OPSOPEN=\'\';loadPlan();">'+opts+'</select>'
    +'<span style="flex:1"></span>'+fbtn('день','☀️ день')+fbtn('ночь','🌙 ночь')+'</div></div>';
  var kpi='<div class="box kpi">'
    +'<span><span class="k">Бойцов в смене</span><b>'+r.people.length+'</b> <span class="muted" style="font-size:12px">☀️'+allD.length+' · 🌙'+allN.length+(bench.length?' · скамейка '+bench.length:'')+'</span></span>'
    +'<span><span class="k">☀️ День</span><b style="color:#8a6d00">'+money(totD)+' ₽</b></span>'
    +'<span><span class="k">🌙 Ночь</span><b style="color:#3446a0">'+money(totN)+' ₽</b></span>'
    +'<span><span class="k">Всего за сутки</span><b style="color:#137333">'+money(total)+' ₽</b></span>'
    +'<span><span class="k">План на день'+(r.overridden?' (скорректирован)':'')+'</span>'
      +'<b><input id="tgt" value="'+money(r.targetRub).replace(',','.')+'" style="width:100px;font-weight:800;font-size:16px" inputmode="decimal"> ₽</b> '
      +'<button class="sec" onclick="saveTarget()">💾</button>'
      +(r.overridden?' <button class="gho" onclick="resetTarget()" title="вернуть авторасчёт">↺ авто</button>':'')+'</span>'
    +'</div>';
  var benchRow=function(list,icon,lbl){
    if(!list.length) return '';
    return '<div style="margin-top:8px"><span class="muted" style="font-size:12px;font-weight:700">'+icon+' '+lbl+' ('+list.length+')</span>'
      +'<div class="bench" style="margin-top:5px">'+list.map(function(p){ return chipHtml(p,false); }).join('')+'</div></div>';
  };
  var showD=(SHIFTF!=='ночь'), showN=(SHIFTF!=='день');
  var benchInner=(showD?benchRow(benchD,'☀️','день'):'')+(showN?benchRow(benchN,'🌙','ночь'):'');
  var benchBox='<div class="box"><b>🪑 Скамейка</b> <span class="drophint">— нажмите бойца, потом участок (или перетащите)</span>'
    +(benchInner||'<div class="muted" style="margin-top:8px">'+(bench.length?'скрыто фильтром смены':'все расставлены 👍')+'</div>')+'</div>';
  var zones=r.groups.map(function(g){
    var ppl=r.people.filter(function(p){ return p.group===g.group; });
    var pd=ppl.filter(function(p){ return !isNight(p); }), pn=ppl.filter(isNight);
    var cD=sumExp(pd), cN=sumExp(pn), contrib=Math.round((cD+cN)*100)/100;
    var pct=g.needRub>0?Math.min(100,Math.round(contrib/g.needRub*100)):0;
    var days=(contrib>0&&g.needRub>0)?Math.ceil(g.needRub/contrib):0;
    var foot;
    if(!g.needRub) foot='<span class="muted">в этой волне нет работ участка</span>';
    else if(!contrib) foot='осталось <b>'+money(g.needRub)+' ₽</b> ('+g.needH+' ч) — никто не назначен';
    else foot='завтра <b>~'+money(contrib)+' ₽</b>'+((cD>0&&cN>0)?' <span class="muted">(☀️ '+money(cD)+' + 🌙 '+money(cN)+')</span>':'')
      +' · закроем <b>'+pct+'%</b> остатка ('+money(g.needRub)+' ₽) · таким составом ~<b>'+days+'</b> дн';
    var zoneRow=function(list,icon){
      if(!list.length) return '';
      return '<span class="muted" style="font-size:12px;align-self:center">'+icon+'</span>'+list.map(function(p){ return chipHtml(p,true); }).join('');
    };
    var body=(showD?zoneRow(pd,'☀️'):'')+(showN?zoneRow(pn,'🌙'):'');
    var hiddenCnt=(showD?0:pd.length)+(showN?0:pn.length);
    if(!body) body='<span class="drophint">'+(SELCHIP?'👇 нажмите сюда':(hiddenCnt?'+'+hiddenCnt+' скрыто фильтром':'пусто'))+'</span>';
    else if(hiddenCnt) body+='<span class="muted" style="font-size:11px;align-self:center">+'+hiddenCnt+' скрыто</span>';
    var op=ppl.filter(function(p){ return p.name===OPSOPEN; })[0];
    return '<div class="zone'+(g.bottleneck?' bn':'')+(SELCHIP?' target':'')+'"'
      +' ondragover="event.preventDefault();this.classList.add(\'target\')" ondragleave="this.classList.remove(\'target\')"'
      +' ondrop="dropChip(event,\''+esc(g.group)+'\')" onclick="zoneTap(\''+esc(g.group)+'\')">'
      +'<div class="zh"><span>'+(ZICON[g.group]||'')+'</span><span class="zn">'+esc(g.group)+'</span>'
      +(g.bottleneck?'<span class="pill" style="background:#fdecea;color:#c0392b">узкое место — сюда в первую очередь</span>':'')
      +'<span style="flex:1"></span><span class="muted" style="font-weight:600;font-size:12px">'
        +(pd.length?'☀️'+pd.length:'')+(pd.length&&pn.length?' · ':'')+(pn.length?'🌙'+pn.length:'')+(!ppl.length?'0 чел':'')+'</span></div>'
      +(g.needRub?'<div class="zbar"><span class="ghost" style="width:'+pct+'%"></span></div>':'')
      +'<div class="zbody">'+body+'</div>'
      +(op?opsPanelHtml(op,g):'')
      +'<div class="zfoot">'+foot+'</div></div>';
  }).join('');
  var wave=r.waveTitle?'<div class="muted" style="margin:0 2px 8px">Работа из волны «'+esc(r.waveTitle)+'»; ⚡ — ожидаемый вклад бойца в ₽/день</div>'
    :'<div class="muted" style="margin:0 2px 8px">Выберите заказ с планом волн — появится остаток по участкам.</div>';
  var empty=r.people.length?'':'<div class="box muted">На эту дату никто не отмечен в табеле — начните с вкладки «Табель».</div>';
  $('pane').innerHTML=head+kpi+benchBox+wave+zones+empty;
}
/* взаимодействия доски */
function tapChip(i){ var p=BOARD.people[i]; SELCHIP=(SELCHIP===p.name)?'':p.name; OPSOPEN=''; renderBoard(); }
function dragChip(ev,i){ SELCHIP=BOARD.people[i].name; ev.target.classList.add('drag'); try{ ev.dataTransfer.setData('text/plain',String(i)); }catch(e){} }
function dropChip(ev,g){ ev.preventDefault(); var i=-1; try{ i=parseInt(ev.dataTransfer.getData('text/plain'),10); }catch(e){}
  if(isNaN(i)||i<0) i=idxByName(SELCHIP); SELCHIP=''; if(i>=0) assignTo(i,g); }
function zoneTap(g){ if(!SELCHIP) return; var i=idxByName(SELCHIP); SELCHIP=''; if(i>=0) assignTo(i,g); }
function assignTo(i,g){
  var p=BOARD.people[i]; if(p.group===g){ renderBoard(); return; }
  p.group=g; p.ops=''; OPSOPEN='';
  renderBoard();   // мгновенно: ghost-полоса, %, дни, итог
  bgSaveP({vapi:'tabelassign',date:PLANDATE,worker:p.name,group:g,ops:'',tgid:TGID});
}
function unassign(i){
  var p=BOARD.people[i]; p.group=''; p.ops=''; if(OPSOPEN===p.name) OPSOPEN='';
  renderBoard();
  bgSaveP({vapi:'tabelassign',date:PLANDATE,worker:p.name,group:'',ops:'',tgid:TGID});
}
function editExpect(i){
  var p=BOARD.people[i];
  var v=prompt('Ожидаемая выработка: '+p.name+', ₽ на этот день.\nПусто = вернуть к его средней ('+(p.avgDay>0?p.avgDay:'нет истории')+' ₽/д):', Math.round(p.expect));
  if(v===null) return;
  var n=Number(String(v).replace(',','.').trim())||0;
  if(n>0){ p.expect=n; p.expectSrc='своё'; }
  else { p.expect=p.avgDay>0?p.avgDay:Math.round(p.hours*BOARD.hourRate*100)/100; p.expectSrc=p.avgDay>0?'история':'база'; }
  renderBoard();
  bgSaveP({vapi:'tabelassign',date:PLANDATE,worker:p.name,expect:(n>0?n:''),tgid:TGID});
}
function toggleOps(name){ OPSOPEN=(OPSOPEN===name)?'':name; SELCHIP=''; renderBoard(); }
function opToggle(i,op,on){
  var p=BOARD.people[i], l=opsList(p), ix=l.indexOf(op);
  if(on&&ix<0) l.push(op); if(!on&&ix>=0) l.splice(ix,1);
  p.ops=l.join(', ');
  renderBoard();
  bgSaveP({vapi:'tabelassign',date:PLANDATE,worker:p.name,ops:p.ops,tgid:TGID});
}
/* фоновая запись доски (очередь) + тихая сверка с сервером */
var PCONV=null;
function bgSaveP(p){
  SAVING++;
  SAVEQ=SAVEQ.then(function(){ return api(p); }).then(function(r){
    SAVING--; if(SAVING<0) SAVING=0;
    if(!r||!r.ok){ alert((r&&r.error)||'не сохранилось — обновляю'); PLANCACHE={}; loadPlan(); return; }
    if(SAVING===0) schedulePConv();
  }).catch(function(){ SAVING--; if(SAVING<0) SAVING=0; alert('Нет связи — обновляю'); PLANCACHE={}; loadPlan(); });
}
function schedulePConv(){ if(PCONV) clearTimeout(PCONV); PCONV=setTimeout(function(){ PCONV=null; if(SAVING===0&&TAB==='p') refreshPlanSilent(); },1500); }
function refreshPlanSilent(){
  var d=PLANDATE,o=OID;
  api({vapi:'dayplan',date:d,batch:o,tgid:TGID}).then(function(r){
    if(!r||!r.ok) return; if(d!==PLANDATE||o!==OID) return;
    PLANCACHE[d+'|'+o]=r;
    if(TAB!=='p'||SAVING>0) return;
    BOARD=r; renderBoard();
  });
}
function saveTarget(){
  var v=($('tgt').value||'').trim(), b=event&&event.target; if(b) b.textContent='…';
  delete PLANCACHE[PLANDATE+'|'+OID];                    // план изменился — кэш вида устарел
  api({vapi:'daytarget',date:PLANDATE,rub:v,tgid:TGID}).then(function(r){ if(!r||!r.ok){ alert((r&&r.error)||'ошибка'); return; } loadPlan(); });
}
function resetTarget(){ delete PLANCACHE[PLANDATE+'|'+OID]; api({vapi:'daytarget',date:PLANDATE,rub:'',tgid:TGID}).then(function(){ loadPlan(); }); }

/* ── МЕСЯЦ ── */
var YM=isoToday().slice(0,7);
function shiftMonth(d){ var p=YM.split('-'); var dt=new Date(Number(p[0]),Number(p[1])-1+d,1); YM=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); loadMonth(); }
function loadMonth(){
  $('pane').innerHTML='<div class="center muted">Загрузка…</div>';
  var ym0=YM;
  api({vapi:'tabelmonth',ym:YM,tgid:TGID}).then(function(r){
    if(TAB!=='m'||ym0!==YM) return;                    // пользователь уже на другой вкладке/месяце — экран не трогаем
    if(!r||!r.ok){ $('pane').innerHTML='<div class="box err">'+esc((r&&r.error)||'ошибка')+'</div>'; return; }
    var p=YM.split('-'), days=new Date(Number(p[0]),Number(p[1]),0).getDate();
    var map={}; r.entries.forEach(function(e){ map[e.worker+'|'+Number(e.date.slice(8))]=e; });
    var wk=r.workers.filter(function(w){ return r.entries.some(function(e){return e.worker===w;}) || true; });
    var thead='<tr><th></th>'; for(var d=1;d<=days;d++) thead+='<th>'+d+'</th>'; thead+='</tr>';
    var body=r.workers.map(function(w){
      var tds=''; var cnt=0;
      for(var d=1;d<=days;d++){ var e=map[w+'|'+d];
        if(!e||!e.shift){ tds+='<td></td>'; continue; }
        cnt++;
        var cls=(e.shift==='ночь'?'cell-n':'cell-d')+(e.status==='вышел'?' cell-out':(e.status==='не вышел'?' cell-no':''));
        tds+='<td class="'+cls+'" title="'+esc(w)+' '+d+'.'+p[1]+' '+esc(e.shift)+(e.status&&e.status!=='план'?' · '+esc(e.status):'')+'">'+(e.shift==='ночь'?'н':'д')+'</td>';
      }
      return '<tr><td class="nm">'+esc(w)+' <span class="muted">('+cnt+')</span></td>'+tds+'</tr>';
    }).join('');
    $('pane').innerHTML='<div class="box"><div class="row"><button class="gho" onclick="shiftMonth(-1)">←</button><b>'+YM+'</b><button class="gho" onclick="shiftMonth(1)">→</button>'
      +'<span class="muted">д=день, н=ночь; зелёная рамка — вышел, красная — не вышел</span></div></div>'
      +'<div class="box mgrid" style="overflow-x:auto"><table>'+thead+body+'</table></div>';
  });
}
shell();

// авто-обновление: оболочка шлёт «refresh» при возврате на раздел — перечитываем данные без перезагрузки страницы
(function(){
  try{ var m=/[?&]twsec=([^&]+)/.exec(location.search); window.top.postMessage({tw:'hello',sec:m?decodeURIComponent(m[1]):''},'*'); }catch(e){}
  window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='refresh'){ try{ DAYCACHE={};PLANCACHE={};if(TAB==="t")loadDay(true);else if(TAB==="p")loadPlan();else loadMonth(); }catch(err){} } });
})();
</script>
