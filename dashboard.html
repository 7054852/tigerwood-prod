<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="tw-theme.js"></script>
<title>Тигервуд — директорский дашборд</title>
<style>
  /* период */
  .period{ display:flex; align-items:center; gap:var(--s-3); margin:0 0 var(--s-4); }
  .period button{ width:var(--h-ctl); padding:0; font-size:16px; }
  .period .lbl{ font:var(--t-heading); min-width:150px; text-align:center; }

  /* пульс — плитки темы; стрелка тренда и «в риске» красят цифру поверх цвета темы */
  .tile .v.down, .tile .v small.down{ color:var(--red); }
  .tile .v small.up{ color:var(--green); }

  /* графики */
  .chart svg{ display:block; width:100%; height:auto; overflow:visible; }
  .xlabels{ display:flex; justify-content:space-between; font:400 11px/16px var(--font); color:var(--muted); font-variant-numeric:tabular-nums; margin-top:var(--s-1); }

  /* заказы: риск — точкой перед номером (полосы слева у карточек запрещены) */
  .ocard{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); margin-bottom:var(--s-3); box-shadow:var(--shadow-card); }
  .ohead{ display:flex; align-items:center; gap:var(--s-2); padding:var(--s-3) var(--s-4); cursor:pointer; flex-wrap:wrap; border-radius:var(--r-card); }
  .ohead:hover{ background:var(--card2); }
  .onum{ font-weight:600; font-variant-numeric:tabular-nums; } .oname{ font-weight:500; flex:1; min-width:90px; }
  .car{ color:var(--muted); font-size:13px; width:12px; transition:transform .15s var(--ease); }
  .ocard.open .car{ transform:rotate(90deg); }
  .obody{ display:none; padding:0 var(--s-4) var(--s-4); } .ocard.open .obody{ display:block; }
  .ohead .bar{ display:block; flex:1; min-width:60px; max-width:150px; }
  .kv{ display:flex; gap:var(--s-2); flex-wrap:wrap; margin:var(--s-2) 0; }
  .kv .k{ font:var(--t-small); background:var(--grey-bg); border-radius:var(--r-pill); padding:var(--s-1) var(--s-3); color:var(--fg2); }
  .kv .k b{ color:var(--fg); font-variant-numeric:tabular-nums; }
  .subh{ font:var(--t-label); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:var(--s-4) 0 var(--s-2); }

  /* горизонтальные бары ЗП */
  .hb{ display:flex; align-items:center; gap:var(--s-3); font:var(--t-small); padding:var(--s-1) 0; }
  /* ⚠ имя не режем многоточием: «Вячеслав Калиновский» и «Матыяшкойть Виктория» превращались
     в «Вячеслав Калин…», а по фамилии людей и различают. Колонка тянется под самое длинное,
     полоса ужимается — цифра справа важнее её длины. */
  .hb .nm{ min-width:150px; white-space:nowrap; }
  @media (max-width:640px){ .hb .nm{ min-width:110px; } .hb{ gap:var(--s-2); } }
  .hb .tr{ flex:1; height:8px; background:var(--grid); border-radius:var(--r-pill); overflow:hidden; min-width:50px; }
  .hb .tr>i{ display:block; height:100%; background:var(--accent); border-radius:var(--r-pill); }
  .hb .vl{ font-variant-numeric:tabular-nums; min-width:88px; text-align:right; color:var(--fg2); }
</style>
</head>
<body class="w-narrow">
<div id="twload"><i></i></div>
<div id="twwait"><div class="wb"><div class="sp"></div><div class="wt" id="twwt">Отправляю…</div><div class="wh">идёт обмен с сервером — не нажимайте</div></div></div>
<div class="hi">📊 Директорский дашборд</div>
<div class="sub">Ежедневная выработка по заказам и общая, прогноз, ЗП — с графиками.</div>
<div id="app"><div class="center">Загрузка…</div></div>
<script>
var BASE='https://script.google.com/macros/s/AKfycbxbCSBcKbG-az-3-_JPJpMLtlQHenJJftHwXM_N-7PvBMfHWVD6xqxDD36nrmtBIz8W/exec';
var APP='tw7prod';
function qp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
var TGID=qp('tgid')||(function(){try{return localStorage.getItem('tw_tgid')||'';}catch(e){return '';}})();
try{ if(window.Telegram&&Telegram.WebApp){ var u=Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user; if(u) TGID=String(u.id); } }catch(e){}
if(TGID){ try{localStorage.setItem('tw_tgid',TGID);}catch(e){} }
// tgid идёт в каждый запрос: дашборд показывает ЗП по рабочим, права проверяет сервер
// ⚠ ЛИЧНОСТЬ — ТОКЕНОМ, А НЕ АДРЕСОМ: ?tgid= в ссылке ничего не доказывает (Telegram ID виден
// в списке сотрудников). Токен выдаётся после входа в сервис и лежит в localStorage этого браузера.
function twTok(){ try{ return twQp('tok')||localStorage.getItem('tw_tok')||''; }catch(e){ return twQp('tok')||''; } }
function twQp(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
(function(){ var t=twQp('tok'); if(t){ try{ localStorage.setItem('tw_tok',t); }catch(e){} } })();
function twAuthWall(r){
  if(r&&r.needAuth){ document.body.innerHTML='<div style="padding:var(--s-6);font:var(--t-body);color:var(--fg)">'
    +'<div style="font:var(--t-title);margin-bottom:var(--s-3)">🔒 Нужен вход</div>'
    +'<div>'+String(r.error||'Откройте сервис из бота @TWOtchbot или войдите по личному коду.')+'</div></div>'; }
  return r;
}
function api(p){ var _t=twTok(); if(_t) p.tok=_t; p.app=APP; if(TGID&&!p.tgid) p.tgid=TGID; var q=Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]==null?'':p[k]);}).join('&'); return fetch(BASE+'?'+q).then(function(r){return r.json();}).then(twAuthWall); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function money(n){ return (Number(n)||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function m0(n){ return Math.round(Number(n)||0).toLocaleString('ru-RU'); }
var MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function ddmm(iso){ var p=String(iso).split('-'); return p.length===3? (p[2]+'.'+p[1]) : iso; }

var now=new Date(), CY=now.getFullYear(), CM=now.getMonth();  // выбранный месяц
var DATA=null, OPEN={};

function pad2(n){ return (n<10?'0':'')+n; }
function load(){
  var from=pad2(1)+'.'+pad2(CM+1)+'.'+CY;
  var last=new Date(CY,CM+1,0).getDate();
  var to=pad2(last)+'.'+pad2(CM+1)+'.'+CY;
  $('app').innerHTML='<div class="center">Загрузка…</div>';
  api({vapi:'directordash',from:from,to:to}).then(function(d){
    if(!d||!d.ok){ $('app').innerHTML='<div class="center">Ошибка данных</div>'; return; }
    DATA=d; render();
  }).catch(function(){ $('app').innerHTML='<div class="center">Сеть недоступна</div>'; });
}
function stepMonth(dir){
  var isFuture=(CY>now.getFullYear())||(CY===now.getFullYear()&&CM>=now.getMonth());
  if(dir>0 && isFuture) return;
  CM+=dir; if(CM<0){CM=11;CY--;} if(CM>11){CM=0;CY++;} load();
}

// ── вертикальный бар-чарт (один ряд, «сегодня» выделен) ──
// ширина рисунка = ширине блока: цифры и подписи в SVG остаются своего размера, а не растягиваются
function chartW(){ var a=$('app'), w=a?a.clientWidth:0; return Math.max(280, (w||640)-48); }
function barChart(data, todayIso, unit){
  var n=data.length; if(!n) return '<div class="empty">за период выработки нет</div>';
  var W=chartW(), H=140, pad=14, padT=26, gap=(W-pad*2)/n;
  var bw=Math.min(15, gap*0.68);
  var max=Math.max.apply(null, data.map(function(d){return d.sum;}).concat([1]));
  var y=function(v){ return padT + (H-padT-pad)*(1 - v/max); };
  var baseY=H-pad;
  // подписываем одно значение: «сегодня», а если сегодня пусто — последний день с выработкой
  var li=-1, k;
  for(k=0;k<n;k++){ if(data[k].d===todayIso && data[k].sum>0) li=k; }
  if(li<0){ for(k=n-1;k>=0;k--){ if(data[k].sum>0){ li=k; break; } } }
  var grid='';
  for(k=0;k<3;k++){ var gy=y(max*(3-k)/3).toFixed(1); grid+='<line x1="'+pad+'" y1="'+gy+'" x2="'+(W-pad)+'" y2="'+gy+'" stroke="var(--grid)" stroke-width="1"/>'; }
  var vlab='';
  var bars=data.map(function(d,i){
    var xx=pad + i*gap + (gap-bw)/2;
    var h=baseY - y(d.sum); if(d.sum>0 && h<2.5) h=2.5;
    var hi=(d.d===todayIso);
    if(i===li){
      var tx=xx+bw/2, anc='middle';
      if(i>=n-2){ tx=xx+bw; anc='end'; } else if(i<=1){ tx=xx; anc='start'; }
      vlab='<text x="'+tx.toFixed(1)+'" y="'+(baseY-h-6).toFixed(1)+'" text-anchor="'+anc+'" font-size="11" font-weight="600" fill="var(--fg)" style="font-variant-numeric:tabular-nums">'+m0(d.sum)+' '+(unit||'₽')+'</text>';
    }
    return '<rect x="'+xx.toFixed(1)+'" y="'+(baseY-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+(hi?'var(--barhi)':'var(--bar)')+'"><title>'+ddmm(d.d)+': '+money(d.sum)+' '+(unit||'₽')+'</title></rect>';
  }).join('');
  var base='<line x1="'+pad+'" y1="'+baseY+'" x2="'+(W-pad)+'" y2="'+baseY+'" stroke="var(--line)" stroke-width="1"/>';
  var lab='<div class="xlabels"><span>'+ddmm(data[0].d)+'</span>'+(n>2?'<span>'+ddmm(data[Math.floor(n/2)].d)+'</span>':'')+'<span>'+ddmm(data[n-1].d)+'</span></div>';
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="выработка по дням">'+grid+base+bars+vlab+'</svg></div>'+lab
    +'<div class="muted" style="font:var(--t-small);margin-top:var(--s-1)">макс '+money(max)+' '+(unit||'₽')+'/день</div>';
}
// ── burndown: линия остатка ₽ к дням, с заливкой и точкой-концом ──
function burndown(data){
  var n=data.length; if(n<2) return '';
  var W=chartW(), H=96, pad=12, gap=(W-pad*2)/(n-1);
  var max=Math.max.apply(null, data.map(function(d){return d.left;}).concat([1]));
  var x=function(i){ return pad+i*gap; }, y=function(v){ return pad+(H-pad*2)*(1-v/max); };
  var pts=data.map(function(d,i){ return x(i).toFixed(1)+','+y(d.left).toFixed(1); });
  var grid='<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="var(--line)" stroke-width="1"/>';
  var line='<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  var area='<polygon points="'+x(0).toFixed(1)+','+(H-pad)+' '+pts.join(' ')+' '+x(n-1).toFixed(1)+','+(H-pad)+'" fill="var(--accent)" opacity="0.1"/>';
  var last=data[n-1], cy=y(last.left);
  var end='<circle cx="'+x(n-1).toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2"><title>осталось '+money(last.left)+' ₽</title></circle>';
  var endLab='<text x="'+(x(n-1)-8).toFixed(1)+'" y="'+(cy<22?cy+16:cy-8).toFixed(1)+'" text-anchor="end" font-size="11" font-weight="600" fill="var(--fg)" style="font-variant-numeric:tabular-nums">'+m0(last.left)+' ₽</text>';
  return '<div class="subh">Остаток труда (burndown)</div><div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="остаток труда по дням">'+grid+area+line+end+endLab+'</svg></div>';
}
function riskPill(b){
  var r=b.risk;
  if(r==='late') return '<span class="pill bad">🔴 не успеваем'+(b.slack!=null?' на '+Math.abs(b.slack)+' дн':'')+'</span>';
  if(r==='tight') return '<span class="pill warn">🟡 впритык</span>';
  if(r==='ok') return '<span class="pill ok">🟢 в срок'+(b.forecast?' ('+b.forecast+')':'')+'</span>';
  if(r==='done') return '<span class="pill ok">✔ готов</span>';
  if(r==='nodeadline') return '<span class="pill mute">срок не задан</span>';
  if(r==='noops') return '<span class="pill mute">нет операций</span>';
  return '<span class="pill mute">⏳ нет темпа</span>';
}
function riskColor(r){ return r==='late'?'bad':(r==='tight'?'warn':(r==='ok'||r==='done'?'ok':'')); }   // класс точки .dot

function render(){
  var d=DATA, p=d.pulse||{}, app=$('app');
  var trendSym=p.trend==='up'?'↑':(p.trend==='down'?'↓':'→'), trendCls=p.trend==='up'?'up':(p.trend==='down'?'down':'flat');
  // период
  var futureNext=(CY>now.getFullYear())||(CY===now.getFullYear()&&CM>=now.getMonth());
  var html='<div class="period"><button class="sec" onclick="stepMonth(-1)">‹</button>'
    +'<span class="lbl">'+MONTHS[CM]+' '+CY+'</span>'
    +'<button class="sec" onclick="stepMonth(1)"'+(futureNext?' disabled':'')+'>›</button></div>';
  // пульс
  html+='<div class="tiles">'
    +'<div class="tile"><div class="t">Сегодня</div><div class="v">'+money(p.today)+' <small>₽ труда</small></div></div>'
    +'<div class="tile"><div class="t">Средн./день</div><div class="v">'+money(p.avgDay)+' <small class="'+trendCls+'">'+trendSym+'</small></div></div>'
    +'<div class="tile"><div class="t">Заказов в риске</div><div class="v '+(p.atRisk>0?'down':'')+'">'+(p.atRisk||0)+'</div></div>'
    +'<div class="tile"><div class="t">Осталось труда</div><div class="v">'+m0(p.totalLeft)+' <small>₽'+(p.capacityDays?' · ~'+p.capacityDays+' дн':'')+'</small></div></div>'
    +'</div>';
  // общий график
  html+='<div class="sect">Выработка по дням <span class="n">общая, ₽ труда · «сегодня» ярче</span></div>'
    +'<div class="card">'+barChart(d.globalDays||[], d.today, '₽')+'</div>';
  // заказы
  var bs=(d.batches||[]).filter(function(b){ return b.status!=='отгружено'; });
  html+='<div class="sect">Заказы <span class="n">по приоритету · клик — детали и графики</span></div>'
    +(bs.length? bs.map(orderCard).join('') : '<div class="card empty">активных заказов нет</div>');
  // ЗП
  html+='<div class="sect">ЗП по рабочим <span class="n">'+esc(d.period.from)+'–'+esc(d.period.to)+'</span></div>'
    +'<div class="card">'+hbars(d.zpByWorker||[], 'ЗП начислено')+'</div>';
  // итоги
  var t=d.totals||{};
  html+='<div class="sect">Итого за период</div><div class="tiles">'
    +'<div class="tile"><div class="t">ЗП начислено</div><div class="v">'+money(t.zp)+' <small>₽</small></div></div>'
    +'<div class="tile"><div class="t">Сделано труда</div><div class="v">'+m0(t.doneRub)+' <small>₽</small></div></div>'
    +'<div class="tile"><div class="t">Осталось труда</div><div class="v">'+m0(t.leftRub)+' <small>₽</small></div></div>'
    +'</div>';
  app.innerHTML=html;
  Object.keys(OPEN).forEach(function(id){ if(OPEN[id]){ var c=$('oc_'+id); if(c) c.classList.add('open'); } });
}
function orderCard(b){
  var pct=Math.min(100,b.pctLabor||0);
  return '<div class="ocard" id="oc_'+esc(b.id)+'">'
    +'<div class="ohead" onclick="tog(\''+esc(b.id)+'\')">'
      +'<span class="car">▸</span><span class="dot '+riskColor(b.risk)+'"></span><span class="onum">'+esc(b.num)+'</span><span class="oname">'+esc(b.name)+'</span>'
      +'<span class="bar"><i style="width:'+pct+'%'+(pct>=100?';background:var(--green)':'')+'"></i></span>'
      +'<span class="money" style="font-weight:600">'+(b.pctLabor||0)+'%</span>'
      +riskPill(b)
    +'</div>'
    +'<div class="obody">'
      +'<div class="kv">'
        +'<span class="k">Осталось <b>'+m0(b.leftRub)+' ₽</b></span>'
        +'<span class="k">Темп <b>'+money(b.velocity)+' ₽/д</b></span>'
        +(b.deadline?'<span class="k">Срок <b>'+esc(b.deadline)+'</b></span>':'')
        +(b.forecast?'<span class="k">Прогноз <b>'+esc(b.forecast)+'</b></span>':'')
      +'</div>'
      +'<div class="subh">Выработка по дням</div>'+barChart(b.byDay||[], DATA.today, '₽')
      +burndown(b.burndown||[])
      +'<div class="subh">ЗП по рабочим на заказе'+(b.zpTotal?' · итого '+money(b.zpTotal)+' ₽':'')+'</div>'
      +hbars(b.zp||[], '')
    +'</div></div>';
}
function hbars(data, empty){
  if(!data||!data.length) return '<div class="empty">'+(empty||'нет данных')+' — нет</div>';
  var max=Math.max.apply(null, data.map(function(x){return x.sum;}).concat([1]));
  return data.map(function(x){
    return '<div class="hb"><span class="nm">'+esc(x.worker||'—')+'</span>'
      +'<span class="tr"><i style="width:'+Math.max(2,Math.round(x.sum/max*100))+'%"></i></span>'
      +'<span class="vl">'+money(x.sum)+' ₽</span></div>';
  }).join('');
}
function tog(id){ var c=$('oc_'+id); if(c){ var o=c.classList.toggle('open'); OPEN[id]=o; } }
load();

// авто-обновление: оболочка шлёт «refresh» при возврате на раздел — перечитываем данные без перезагрузки страницы
(function(){
  try{ var m=/[?&]twsec=([^&]+)/.exec(location.search); window.top.postMessage({tw:'hello',sec:m?decodeURIComponent(m[1]):''},'*'); }catch(e){}
  window.addEventListener('message',function(e){ var d=e&&e.data; if(d&&d.tw==='refresh'){ try{ load(); }catch(err){} } });
})();

// ─────── ПОКАЗЫВАЕМ, ЧТО ИДЁТ РАБОТА ───────
// Каждый вызов Apps Script — это 3-6 секунд. Без видимого признака человек считает, что
// кнопка не сработала, и жмёт снова: так рождались дубли нарядов и «то одобряет, то нет».
// Полоска сверху — на любой запрос; заслонка «не нажимайте» — только на действие,
// которое человек начал сам (нажал кнопку), чтобы фоновое обновление не мешало работать.
var TWL=0, TWCLICK=0;
var TWTMR=0;
function twLoadOn(wait){
  TWL++;
  var b=document.getElementById('twload'); if(b) b.style.display='block';
  if(wait){
    var w=document.getElementById('twwait'); if(w) w.style.display='flex';
    // ПРЕДОХРАНИТЕЛЬ: если ответ не пришёл (сеть в цеху пропала), заслонка не должна
    // запереть экран навсегда — через 30 с она превращается в понятное сообщение и снимается пальцем.
    clearTimeout(TWTMR);
    TWTMR=setTimeout(function(){
      var h=document.getElementById('twwt'); if(h) h.textContent='Ответа всё нет';
      var s=document.querySelector('#twwait .wh'); if(s) s.textContent='связь медленная — нажмите, чтобы закрыть и попробовать снова';
      var ww=document.getElementById('twwait'); if(ww) ww.onclick=function(){ TWL=0; twLoadOff(); };
    },30000);
  }
}
function twLoadOff(){
  TWL=Math.max(0,TWL-1); if(TWL) return;
  clearTimeout(TWTMR);
  var b=document.getElementById('twload'); if(b) b.style.display='none';
  var w=document.getElementById('twwait');
  if(w){ w.style.display='none'; w.onclick=null; }
  var s=document.querySelector('#twwait .wh'); if(s) s.textContent='идёт обмен с сервером — не нажимайте';
}
function twSay(t){ var e=document.getElementById('twwt'); if(e&&t) e.textContent=t; }
// нажатие человека «взводит» заслонку для ближайшего запроса (20 с — на случай prompt по дороге)
document.addEventListener('click',function(e){
  var n=e.target;
  while(n&&n!==document.body){ if(n.tagName==='BUTTON'||n.tagName==='A'){ TWCLICK=Date.now(); return; } n=n.parentNode; }
},true);
(function(){
  var _api=(typeof api==='function')?api:null, _post=(typeof apiPost==='function')?apiPost:null;
  var wrap=function(fn){ return function(p){
    var mine=(TWCLICK && (Date.now()-TWCLICK)<20000); if(mine) TWCLICK=0;
    twLoadOn(mine);
    return fn(p).then(function(r){ twLoadOff(); return r; }, function(e){ twLoadOff(); throw e; });
  }; };
  if(_api) api=wrap(_api);
  if(_post) apiPost=wrap(_post);
})();
</script>
